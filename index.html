  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:14px; line-height:1.5;
    transition:background .15s, color .15s;
  }
  body[data-theme="light"]{
    --bg:#f6f4ef;
    --surface:#ffffff;
    --surface-raised:#efece3;
    --border:#dcd6c8;
    --text:#1d2026;
    --text-dim:#565f6f;
    --text-faint:#6d7684;
    --gold:#a9821f;
    --gold-bright:#8a6a15;
    --red:#c1453c;
    --amber:#a6631b;
  }
  body[data-theme="light"] .modal-backdrop{ background:rgba(20,18,10,0.35); }
  ::selection{ background:var(--gold); color:#12141a; }
  a{ color:var(--gold-bright); }

  /* Layout */
  .app{ display:flex; min-height:100vh; }
  .sidebar{
    width:210px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 0;
  }
  .brand{
    padding:0 20px 18px 20px; border-bottom:1px solid var(--border); margin-bottom:10px;
  }
  .brand .mark{ font-family:var(--serif); font-size:22px; letter-spacing:0.5px; color:var(--gold-bright); }
  .brand .sub{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1.5px; margin-top:2px; }
  .profile-switcher{
    display:flex; gap:6px; padding:12px 14px; border-bottom:1px solid var(--border); align-items:center;
  }
  .profile-switcher select{ flex:1; font-size:12px; padding:6px 8px; min-width:0; }
  .profile-switcher button{
    all:unset; cursor:pointer; color:var(--text-dim); font-size:15px; padding:4px 8px; border-radius:4px;
    background:var(--surface-raised); border:1px solid var(--border); line-height:1;
  }
  .profile-switcher button:hover{ color:var(--gold-bright); border-color:var(--gold); }
  .cloud-status{ padding:10px 14px; border-bottom:1px solid var(--border); }
  .cloud-status button{
    all:unset; cursor:pointer; display:block; width:100%; box-sizing:border-box;
    padding:6px 8px; border-radius:4px; font-size:12px; color:var(--text-dim);
    background:var(--surface-raised); border:1px solid var(--border);
  }
  .cloud-status button:hover{ color:var(--gold-bright); border-color:var(--gold); }
  nav.tabs{ display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  nav.tabs button{
    all:unset; cursor:pointer; padding:10px 12px; border-radius:var(--radius); color:var(--text-dim);
    font-size:13.5px; display:flex; align-items:center; gap:10px; transition:background .12s, color .12s;
  }
  nav.tabs button .num{ font-family:var(--mono); font-size:11px; color:var(--text-faint); width:16px; }
  nav.tabs button:hover{ background:var(--surface-raised); color:var(--text); }

<script type="module">
  // Firebase is loaded as ES modules (no npm/build step needed) and exposes a small
  // window.LedgerCloud API that the main app script (below, a plain non-module script tag) calls into.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup,
    onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDD8qLHIX2BS56nRDwdJ7Daod_OcrCV3FY",
    authDomain: "ledger-6508e.firebaseapp.com",
    projectId: "ledger-6508e",
    storageBucket: "ledger-6508e.firebasestorage.app",
    messagingSenderId: "867974434456",
    appId: "1:867974434456:web:fa3151ebe3e9f719584aed"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  const provider = new GoogleAuthProvider();

  // Lets edits queue locally (e.g. on a plane) and sync once back online. Safe to ignore
  // if it fails (e.g. multiple tabs open, or an unsupported browser) — sync still works,
  // just without the offline queue.
  enableIndexedDbPersistence(db).catch(()=>{});

  // Firestore rejects `undefined` fields, and won't accept a class instance directly —
  // round-tripping through JSON guarantees a plain, clean object either way.
  function clean(obj){ return JSON.parse(JSON.stringify(obj)); }

  window.LedgerCloud = {
    // signInWithPopup (not signInWithRedirect): our authDomain (ledger-6508e.firebaseapp.com)
    // is a different domain than the app itself (jiva-99.github.io), and the redirect flow
    // needs cross-domain storage access that Safari (and now Chrome/Firefox too) blocks by
    // default — it silently fails instead of erroring. Popup avoids that handshake entirely,
    // which is Firebase's own documented fix for this exact situation.
    async signIn(){
      try{
        await signInWithPopup(auth, provider);
      }catch(e){
        console.error('Sign-in popup failed', e);
        if(window.onLedgerSignInError) window.onLedgerSignInError(e);
      }
    },
    signOutUser(){ return signOut(auth); },
    async pullMeta(uid){
      const snap = await getDoc(doc(db, 'users', uid, 'meta', 'profiles'));
      return snap.exists() ? snap.data() : null;
    },
    async pushMeta(uid, metaObj){
      await setDoc(doc(db, 'users', uid, 'meta', 'profiles'), clean(metaObj));
    },
    async pullProfile(uid, profileId){
      const snap = await getDoc(doc(db, 'users', uid, 'profiles', profileId));
      return snap.exists() ? snap.data() : null;
    },
    async pushProfile(uid, profileId, dataObj){
      await setDoc(doc(db, 'users', uid, 'profiles', profileId), clean(dataObj));
    }
  };

  onAuthStateChanged(auth, (user)=>{
    if(window.onLedgerAuthChange){
      window.onLedgerAuthChange(user ? { uid:user.uid, email:user.email, name:user.displayName } : null);
    }
  });
</script>

<script>
/* =========================================================
   STATE
========================================================= */
const LEGACY_STORAGE_KEY = 'ledgerApp_v1';
const PROFILES_KEY = 'ledgerApp_profiles_v1';
const DATA_PREFIX = 'ledgerApp_data_v1_';
const RESTORE_PREFIX = 'ledgerApp_restore_v1_';

/* ---- Restore points --------------------------------------------------------
   Cloud sync is last-write-wins with no history: one bad write on one device and
   the good copy is gone. These are local, per profile, and deliberately dumb —
   a handful of whole-state copies with a timestamp and a reason.

   Captured when the app opens, at most once an hour while it's in use, and always
   immediately before cloud data overwrites what's on this device, which is the
   moment things actually get lost. Stored separately from state, so they're never
   pushed to Firestore and can't be destroyed by the same bad sync. */
const RESTORE_MAX = 6;
const RESTORE_MIN_GAP_MS = 60*60*1000;
const RESTORE_MAX_BYTES = 2_000_000;

function loadRestorePoints(profileId){
  try{
    const raw = localStorage.getItem(RESTORE_PREFIX + profileId);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}

function captureRestorePoint(reason, force){
  try{
    const id = profiles.activeId;
    const points = loadRestorePoints(id);
    const last = points[points.length-1];
    if(!force && last && (Date.now() - new Date(last.at).getTime()) < RESTORE_MIN_GAP_MS) return false;

    const payload = JSON.stringify(state);
    if(payload.length > RESTORE_MAX_BYTES) return false;   // too big to keep six of

    // Skip a duplicate: no point stacking six identical copies of an untouched file.
    if(last && last.data === payload && !force) return false;

    points.push({
      at: new Date().toISOString(),
      reason: reason || 'Automatic',
      counts: {
        transactions: (state.transactions||[]).length,
        accounts: (state.accounts||[]).length,
        bills: (state.bills||[]).length
      },
      data: payload
    });
    while(points.length > RESTORE_MAX) points.shift();
    localStorage.setItem(RESTORE_PREFIX + id, JSON.stringify(points));
    return true;
  }catch(e){ console.error('Could not save a restore point', e); return false; }
}

/* Restoring is itself undoable — the state being replaced is captured first. */
function restoreFromPoint(index){
  const id = profiles.activeId;
  const points = loadRestorePoints(id);
  const p = points[index];
  if(!p) return false;
  captureRestorePoint('Before restoring', true);
  try{
    state = mergeWithDefaults(JSON.parse(p.data));
    saveState();
    render();
    return true;
  }catch(e){ console.error(e); toast('That restore point could not be read.'); return false; }
}
const THEME_KEY = 'ledgerApp_theme_v1';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TYPES = ['Income','Expenses','Savings'];
const NET_WORTH_GROUPS = ['Pocket Money','Emergency Fund','Investment','Retirement Savings','Family Saving Account','Co-saving Account','Insurance Account','Other'];
const TODAY = new Date();

function defaultState(){
  return {
    settings: {
      startingYear: TODAY.getFullYear(),
      shiftLateIncome: false,
      shiftDay: 20,
      savingsRateType: 'active', // 'active' (Savings/Income) or 'passive' ((Income-Expenses)/Income)
      weeklyThreshold: 300,
      weeklyExcludedCategories: ["Housing - Rent/Mortgage"],
      autoSaveEnabled: false,
      excludedFromSummary: ["Income|||Opening Balance"],
      // A second, stricter exclusion. ☆ Special keeps a category out of graphs and
      // breakdowns but still moves the running balance — which is right for an
      // opening balance, and wrong for entries that shouldn't count at all.
      excludedFromBalance: [],
      // Categories you'd keep paying if income stopped. Keys are "Expenses|||<category>".
      essentialCategories: [],
      // Savings categories that actually feed the investment sleeves. Without this
      // the projection would treat a holiday fund as portfolio contributions.
      investingCategories: [],
      investing: {
        coreTarget: 85,      // % of the invested portfolio that should sit in the core
        driftBand: 5,        // percentage points of drift tolerated before it's flagged
        staleDays: 30,       // a price older than this is called out
        scope: 'whole',      // 'whole' | 'core' | 'satellite'
        contribution: 0,     // the amount you're about to invest, used for the suggestion
        // Projection
        retireYear: 2060,
        returnCap: 12,       // ceiling on an assumed real return, in % — see below
        inflation: 2.5,      // subtracted from nominal returns to keep everything in today's money
        baselineReturn: 5,   // the "everything earns the market" comparison line
        withdrawalRate: 4,   // % of the final balance drawn each year in retirement
        monthlyContribution: null  // null = use the six-month actual savings average
      },
      liquidity: {
        speeds: {},              // accountId -> 'today' | 'week' | 'month' | 'locked'
        spendBasis: 'actuals',   // 'actuals' (rolling window of complete months) or 'budget'
        spendWindow: 6,          // how many complete months the actuals average covers
        runwayTier: 'week',      // which cash tier the runway limit is judged against
        snapshots: [],           // [{month:'2026-09', ...}] one per month, for the trend view
        thbSpendShare: 80,       // % of eventual retirement spending expected to be in THB
        limits: { runwayMonths: 6, fixedPct: 50, concPct: 60, bufferToday: 20000 }
      }
    },
    categories: {
      Income: ["Opening Balance","Salary & Wages - Base pay","Salary & Wages - Overtime/Bonus","Salary & Wages - Allowances",
        "Self-Employment - Business income","Government - Tax refund & Benefits","Investing - Interest & Dividends",
        "Investing - Capital gains","Other - Gifts received","Other - Withdraw from savings","Superannuation"],
      Expenses: ["Housing - Rent/Mortgage","Housing - Utilities (Electricity, gas, water, internet)",
        "Food & Dining - Groceries","Food & Dining - Eating out","Transport",
        "Health - Medical & Dental, Health Insurance","Bills & Subscriptions",
        "Entertainment & Leisure (Hang out, Hobby)","Home & Furniture",
        "Personal - Clothing, Personal care, Education","Other Money - Bank fees, Interest, Taxes, Gifts"],
      Savings: ["Pocket Money","Emergency Fund (1M, 3M, 6M)","Investment (Short-term) - Medium Risk Funds",
        "Investment (Mid-term) - Low Risk Funds","Investment (Long-term) - SSF, RMF",
        "Retirement Savings - Superannuation","Family Saving Account","Co-saving Account","Insurance Account"]
    },
    planning: {},      // planning[year][type][category] = [12 numbers]
    transactions: [],  // {id,date,type,category,amount,details}
    accounts: [],      // {id,name,group,currency,openingBalance,openingDate,target,subCategories,history}
    fxRates: { THB: null, USD: null, fetchedAt: null }, // auto-fetched, AUD as base
    portfolioTarget: { amount: null, currency: 'AUD' }, // one target for the WHOLE net worth, independent of per-account targets
    bills: [],         // {id,name,amount,frequency,lastPaidDate,notes,paidMonths:[]}
    ui: { dashYear: TODAY.getFullYear(), dashMonth: TODAY.getMonth(), dashViewMode: 'month', planYear: TODAY.getFullYear(), activeTab:'dashboard',
      trendSeries: { Budget:true, Income:true, Expenses:true, Savings:true },
      lineSeries: { Income:true, Expenses:true, Savings:true } }
  };
}

/* =========================================================
   PROFILES (separate, unlinked books)
========================================================= */
function loadProfiles(){
  try{
    const raw = localStorage.getItem(PROFILES_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.list) && parsed.list.length && parsed.activeId){
        return parsed;
      }
    }
  }catch(e){ console.error('Failed to read profiles', e); }

  // First run, or corrupted profile index — migrate any legacy single-profile data
  let legacy = null;
  try{
    const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
    if(raw) legacy = JSON.parse(raw);
  }catch(e){ /* ignore */ }

  const id = uid();
  const profilesObj = { activeId: id, list: [{ id, name: legacy ? 'My Budget' : 'Default' }] };
  localStorage.setItem(DATA_PREFIX + id, JSON.stringify(legacy || defaultState()));
  localStorage.setItem(PROFILES_KEY, JSON.stringify(profilesObj));
  return profilesObj;
}

function saveProfiles(){
  try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); }
  catch(e){ console.error('Failed to save profiles', e); }
  scheduleCloudPush();
}

function createProfile(name){
  name = (name||'').trim();
  if(!name){ toast('Give the profile a name.'); return; }
  const id = uid();
  profiles.list.push({ id, name });
  profiles.activeId = id;
  saveProfiles();
  const fresh = defaultState();
  localStorage.setItem(DATA_PREFIX + id, JSON.stringify(fresh));
  state = fresh;
  renderProfileSwitcher();
  render();
  toast(`Profile "${name}" created.`);
}

async function switchProfile(id){
  if(id === profiles.activeId) return;
  const meta = profiles.list.find(p=>p.id===id);
  if(!meta) return;
  profiles.activeId = id;
  saveProfiles();
  if(cloudUser){
    try{
      const cloudData = await window.LedgerCloud.pullProfile(cloudUser.uid, id);
      state = cloudData ? mergeWithDefaults(cloudData) : loadState(id);
    }catch(e){ console.error('Cloud pull on switch failed', e); state = loadState(id); }
  } else {
    state = loadState(id);
  }
  autoSaveHandle = null;
  if(state.settings) state.settings.autoSaveEnabled = false;
  renderProfileSwitcher();
  render();
  refreshFxRates(false);
}

function renameProfile(id, newName){
  newName = (newName||'').trim();
  if(!newName) return;
  const meta = profiles.list.find(p=>p.id===id);
  if(!meta) return;
  meta.name = newName;
  saveProfiles();
  renderProfileSwitcher();
}

function deleteProfile(id){
  if(profiles.list.length <= 1){ toast('At least one profile must remain.'); return; }
  profiles.list = profiles.list.filter(p=>p.id!==id);
  localStorage.removeItem(DATA_PREFIX + id);
  if(profiles.activeId === id){
    profiles.activeId = profiles.list[0].id;
    state = loadState(profiles.activeId);
  }
  saveProfiles();
  renderProfileSwitcher();
  render();
}

function renderProfileSwitcher(){
  const sel = document.getElementById('profileSelect');
  if(!sel) return;
  sel.innerHTML = profiles.list.map(p=>
    `<option value="${p.id}" ${p.id===profiles.activeId?'selected':''}>${p.name}</option>`
  ).join('');
}

let profiles = loadProfiles();
let state = loadState(profiles.activeId);

function mergeWithDefaults(parsed){
  const base = defaultState();
  const merged = {
    ...base, ...parsed,
    settings: {...base.settings, ...(parsed.settings||{})},
    categories: {...base.categories, ...(parsed.categories||{})},
    ui: {...base.ui, ...(parsed.ui||{})}
  };
  // One-time migration for profiles created before "Opening Balance" existed
  if(!merged.categories.Income.includes('Opening Balance')){
    merged.categories.Income = ['Opening Balance', ...merged.categories.Income];
  }
  merged.settings.excludedFromSummary = merged.settings.excludedFromSummary || [];
  if(!merged.settings.excludedFromSummary.includes('Income|||Opening Balance')){
    merged.settings.excludedFromSummary.push('Income|||Opening Balance');
  }
  // One-time migration: accounts used to store a live-mutated "balance" with a separate
  // history log. Convert to openingBalance+openingDate so balances can be reconstructed
  // as of any past date (needed for the accumulation-over-time chart).
  (merged.accounts||[]).forEach(acc=>{
    if(acc.openingDate === undefined){
      const hist = acc.history||[];
      const histSum = hist.reduce((s,h)=> s+(Number(h.delta)||0), 0);
      acc.openingBalance = (Number(acc.balance)||0) - histSum;
      acc.openingDate = hist.length ? hist.reduce((min,h)=> h.date<min?h.date:min, hist[0].date) : isoDate(TODAY);
    }
    if(acc.target === undefined) acc.target = null;
    if(!acc.currency) acc.currency = 'AUD';
    if(!Array.isArray(acc.subCategories)) acc.subCategories = [];
    acc.subCategories.forEach(sub=>{
      if(sub.openingDate===undefined) sub.openingDate = isoDate(TODAY);
      if(sub.openingBalance===undefined) sub.openingBalance = 0;
      if(sub.target===undefined) sub.target = null;
      if(!sub.currency) sub.currency = acc.currency || 'AUD';
      if(!Array.isArray(sub.history)) sub.history = [];
    });
  });
  // Liquidity settings arrived after some profiles were already saved — backfill them
  // without disturbing anything the user has already set.
  merged.settings.essentialCategories = merged.settings.essentialCategories || [];
  merged.settings.excludedFromBalance = merged.settings.excludedFromBalance || [];
  merged.settings.investingCategories = merged.settings.investingCategories || [];
  // Returns used to be fetched as a trailing nominal figure with an optional real
  // override. Both now collapse into one nominal number the user types.
  (merged.accounts||[]).forEach(a=>{
    const fix = u=>{
      if(u.nominalReturn === undefined || u.nominalReturn === null){
        if(u.trailingReturn !== undefined && u.trailingReturn !== null) u.nominalReturn = Number(u.trailingReturn);
        else if(u.assumedReturn !== undefined && u.assumedReturn !== null)
          u.nominalReturn = Number(u.assumedReturn) + (Number((merged.settings.investing||{}).inflation)||0);
      }
      delete u.trailingReturn; delete u.trailingYears; delete u.assumedReturn;
    };
    fix(a);
    (a.subCategories||[]).forEach(fix);
  });

  // Drop planning years that are out of range or left over from a typo — but only
  // when they hold no budget figures and no transaction actually falls in them, so
  // a real year of work is never thrown away.
  const txYears = new Set((merged.transactions||[]).map(tx=> new Date(tx.date).getFullYear()));
  Object.keys(merged.planning||{}).forEach(key=>{
    const yr = Number(key);
    const hasBudget = Object.values(merged.planning[key]||{}).some(byType=>
      Object.values(byType||{}).some(arr=> (arr||[]).some(v=> Number(v) > 0)));
    if(hasBudget || txYears.has(yr)) return;
    if(!isSaneYear(yr)) delete merged.planning[key];
  });
  merged.settings.investing = { coreTarget:85, driftBand:5, staleDays:30, scope:'whole', contribution:0,
                                retireYear:2060, returnCap:12, inflation:2.5,
                                baselineReturn:5, withdrawalRate:4, monthlyContribution:null,
                                ...(merged.settings.investing || {}) };
  // Sleeves used to be set per holding; they now live on the account and are
  // inherited. Lift any existing per-holding sleeve up to its parent, then clear
  // it, so profiles saved under the old shape carry over untouched. Weights stay
  // where they are — those are still per holding, just edited elsewhere now.
  (merged.accounts||[]).forEach(a=>{
    if(!a.sleeve && a.subCategories && a.subCategories.length){
      const found = a.subCategories.find(sub=> sub.sleeve==='core' || sub.sleeve==='satellite');
      if(found) a.sleeve = found.sleeve;
    }
    (a.subCategories||[]).forEach(sub=> { delete sub.sleeve; });
  });
  const liqBase = { speeds:{}, spendBasis:'actuals', spendWindow:6, runwayTier:'week',
                    thbSpendShare:80, snapshots:[],
                    limits:{ runwayMonths:6, fixedPct:50, concPct:60, bufferToday:20000 } };
  const liq = merged.settings.liquidity || {};
  merged.settings.liquidity = {
    ...liqBase, ...liq,
    speeds: liq.speeds || {},
    snapshots: Array.isArray(liq.snapshots) ? liq.snapshots : [],
    limits: { ...liqBase.limits, ...(liq.limits||{}) }
  };
  merged.fxRates = merged.fxRates || { THB: null, USD: null, fetchedAt: null };
  merged.portfolioTarget = merged.portfolioTarget || { amount: null, currency: 'AUD' };
  (merged.bills||[]).forEach(b=>{ if(!b.currency) b.currency = 'AUD'; });
  // Transactions had no currency field before multi-currency support — every existing
  // entry was always meant as AUD, so that's exactly what gets set here, not a guess.
  (merged.transactions||[]).forEach(t=>{ if(!t.currency) t.currency = 'AUD'; });
  return merged;
}

function loadState(profileId){
  try{
    const raw = localStorage.getItem(DATA_PREFIX + profileId);
    if(!raw) return defaultState();
    return mergeWithDefaults(JSON.parse(raw));
  }catch(e){ console.error('Failed to load saved data, starting fresh.', e); return defaultState(); }
}

function saveState(){
  try{ localStorage.setItem(DATA_PREFIX + profiles.activeId, JSON.stringify(state)); }
  catch(e){ toast('Could not save — storage may be full.'); console.error(e); }
  scheduleAutoSave();
  scheduleCloudPush();
}

/* =========================================================
   CLOUD SYNC (Firebase) — sync-on-open / sync-on-change, not
   live collaborative editing. If the same profile is edited on
   two devices before either syncs, the later push wins.
========================================================= */
let cloudUser = null; // {uid,email,name} or null when signed out
let cloudAuthChecked = false; // true once Firebase confirms sign-in state at least once (avoids a "flash" of the Sign In button right after a redirect completes)
let cloudSignInPending = false; // true the instant the button is tapped, until the redirect navigates away
let cloudSyncTimer = null;
let cloudStatus = 'signed-out'; // 'signed-out' | 'pulling' | 'syncing' | 'synced' | 'error'

function renderCloudStatus(){
  const el = document.getElementById('cloudStatusArea');
  if(!el) return;
  if(!cloudAuthChecked){
    el.innerHTML = `<button disabled style="opacity:0.5; cursor:default;">☁ Checking sign-in…</button>`;
    return;
  }
  if(!cloudUser){
    if(cloudSignInPending){
      el.innerHTML = `<button disabled style="opacity:0.5; cursor:default;">Opening sign-in…</button>`;
      return;
    }
    el.innerHTML = `<button id="cloudSignInBtn">☁ Sign in with Google</button>`;
    const btn = document.getElementById('cloudSignInBtn');
    if(btn) btn.onclick = ()=>{
      cloudSignInPending = true;
      renderCloudStatus();
      window.LedgerCloud.signIn();
    };
    return;
  }
  const statusText = {
    pulling: 'Loading from cloud…',
    syncing: 'Syncing…',
    synced: 'Synced',
    error: 'Sync failed — retrying'
  }[cloudStatus] || '';
  const statusColor = cloudStatus==='error' ? 'var(--red)' : (cloudStatus==='synced' ? 'var(--green)' : 'var(--text-faint)');
  el.innerHTML = `
    <div class="muted" style="font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${cloudUser.email||''}"><span style="color:var(--green);">✓</span> ${cloudUser.name || cloudUser.email || 'Signed in'}</div>
    <div style="font-size:10.5px; margin:2px 0 6px 0; color:${statusColor};">${statusText}</div>
    <button id="cloudSignOutBtn">Sign out</button>
  `;
  const out = document.getElementById('cloudSignOutBtn');
  if(out) out.onclick = ()=> window.LedgerCloud.signOutUser();
}

/* Called by the Firebase module script whenever sign-in state changes */
/* Called by the Firebase module script if the sign-in popup fails or is blocked/cancelled */
window.onLedgerSignInError = function(err){
  cloudSignInPending = false;
  renderCloudStatus();
  const code = err && err.code;
  if(code === 'auth/popup-blocked'){
    toast('Your browser blocked the sign-in popup — check your popup blocker settings and try again.');
  } else if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request'){
    // User closed it themselves — no need to nag with a toast.
  } else {
    toast('Sign-in failed: ' + (err && (err.message || code) || 'unknown error'));
  }
};

window.onLedgerAuthChange = async function(user){
  cloudUser = user;
  cloudAuthChecked = true;
  cloudSignInPending = false;
  if(user){
    cloudStatus = 'pulling';
    renderCloudStatus();
    try{
      await pullFromCloudOrSeed();
      cloudStatus = 'synced';
    }catch(e){
      console.error('Cloud pull failed', e);
      cloudStatus = 'error';
    }
    renderProfileSwitcher();
    render();
  } else {
    cloudStatus = 'signed-out';
  }
  renderCloudStatus();
};

/* On sign-in: if the cloud already has data, it becomes the source of truth (pulled down,
   overwriting the local cache). If the cloud is empty — first time signing in — whatever's
   local right now gets pushed up to seed it, so nothing already entered is lost. */
async function pullFromCloudOrSeed(){
  if(!cloudUser) return;
  const cloudMeta = await window.LedgerCloud.pullMeta(cloudUser.uid);
  if(cloudMeta && Array.isArray(cloudMeta.list) && cloudMeta.list.length){
    profiles = cloudMeta;
    try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); }catch(e){}
    const cloudProfileData = await window.LedgerCloud.pullProfile(cloudUser.uid, profiles.activeId);
    // The cloud copy is about to replace what's on this device. If the two have
    // diverged, this is the exact moment local work disappears — so keep a copy.
    captureRestorePoint('Before cloud sync replaced local data', true);
    state = cloudProfileData ? mergeWithDefaults(cloudProfileData) : loadState(profiles.activeId);
    try{ localStorage.setItem(DATA_PREFIX + profiles.activeId, JSON.stringify(state)); }catch(e){}
  } else {
    await window.LedgerCloud.pushMeta(cloudUser.uid, profiles);
    for(const p of profiles.list){
      await window.LedgerCloud.pushProfile(cloudUser.uid, p.id, loadState(p.id));
    }
  }
}

function scheduleCloudPush(){
  if(!cloudUser) return;
  clearTimeout(cloudSyncTimer);
  cloudStatus = 'syncing';
  renderCloudStatus();
  cloudSyncTimer = setTimeout(async ()=>{
    try{
      await window.LedgerCloud.pushProfile(cloudUser.uid, profiles.activeId, state);
      await window.LedgerCloud.pushMeta(cloudUser.uid, profiles);
      cloudStatus = 'synced';
    }catch(e){
      console.error('Cloud push failed', e);
      cloudStatus = 'error';
    }
    renderCloudStatus();
  }, 1500);
}

/* =========================================================
   AUTO-SAVE TO EXCEL
   Default: prompts once via the File System Access API, starting
   in the Downloads folder. Once granted, every autosave silently
   overwrites that same file — no repeat prompts, no duplicate files.
   Browsers without that API (Firefox/Safari) fall back to a normal
   download each time, which the OS puts in the Downloads folder,
   but which will accumulate as separate numbered files.
========================================================= */
let autoSaveHandle = null;       // FileSystemFileHandle, in-memory only (not persisted across reloads)
let autoSaveTimer = null;
const AUTO_SAVE_SUPPORTED = typeof window.showSaveFilePicker === 'function';

function buildWorkbook(){
  const wb = XLSX.utils.book_new();

  // Transactions
  const txRows = [['Date','Type','Category','Details','Amount','Currency','Amount (AUD)','Balance (AUD)']];
  transactionsWithBalance().slice().reverse().forEach(t=> txRows.push([t.date, t.type, t.category, t.details||'', Number(t.amount), t.currency||'AUD', Math.round(txAmountAUD(t)*100)/100, Math.round(Number(t.balance)*100)/100]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(txRows), 'Transactions');

  // Planning (every year that has been set up)
  const planRows = [];
  Object.keys(state.planning).sort().forEach(yr=>{
    planRows.push([`Planning ${yr}`]);
    TYPES.forEach(type=>{
      planRows.push([type, ...MONTHS, 'Total']);
      state.categories[type].forEach(cat=>{
        const arr = (state.planning[yr][type] && state.planning[yr][type][cat]) || new Array(12).fill(0);
        const total = arr.reduce((a,b)=>a+(Number(b)||0),0);
        planRows.push([cat, ...arr.map(v=>Number(v)||0), total]);
      });
      planRows.push([]);
    });
    planRows.push([]);
  });
  if(planRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(planRows), 'Planning');

  // Net Worth accounts
  const accRows = [['Name','Group','Currency','Balance','≈ AUD','Target']];
  state.accounts.forEach(a=>{
    const hasSubs = a.subCategories && a.subCategories.length>0;
    accRows.push([a.name, a.group, hasSubs?'mixed':a.currency, hasSubs?'':computeAccountBalance(a), Math.round(accountBalanceAUD(a)), a.target||'']);
    (a.subCategories||[]).forEach(sub=>{
      const subCur = sub.currency||a.currency;
      const subBal = unitBalanceAsOf(sub, isoDate(TODAY));
      accRows.push([`  ↳ ${sub.name}`, '', subCur, subBal, Math.round(toAUD(subBal, subCur)), sub.target||'']);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(accRows), 'Net Worth');

  // Bills
  const billRows = [['Name','Amount','Currency','Frequency','Last Paid','Notes']];
  state.bills.forEach(b=> billRows.push([b.name, Number(b.amount)||0, b.currency||'AUD', b.frequency, b.lastPaidDate||'', b.notes||'']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(billRows), 'Bills');

  return wb;
}

function workbookBlob(){
  const wb = buildWorkbook();
  const out = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  return new Blob([out], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function suggestedXlsxName(){
  const meta = profiles.list.find(p=>p.id===profiles.activeId);
  const safeName = (meta ? meta.name : 'profile').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  return `ledger-${safeName}.xlsx`;
}

async function chooseAutoSaveLocation(){
  if(!AUTO_SAVE_SUPPORTED){
    toast('Your browser doesn\'t support picking a save file — auto-save will download a new file each time instead.');
    state.settings.autoSaveEnabled = true;
    saveState(); render();
    return;
  }
  try{
    autoSaveHandle = await window.showSaveFilePicker({
      suggestedName: suggestedXlsxName(),
      startIn: 'downloads',
      types: [{ description:'Excel Workbook', accept:{ 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'] } }]
    });
    state.settings.autoSaveEnabled = true;
    saveState(); render();
    toast('Auto-save linked — this file will update automatically.');
  }catch(e){
    if(e.name!=='AbortError') console.error(e);
  }
}

function scheduleAutoSave(){
  if(!state.settings || !state.settings.autoSaveEnabled) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(performAutoSave, 2500);
}

async function performAutoSave(){
  try{
    const blob = workbookBlob();
    if(autoSaveHandle){
      const writable = await autoSaveHandle.createWritable();
      await writable.write(blob);
      await writable.close();
    } else {
      downloadBlob(blob, suggestedXlsxName());
    }
  }catch(e){
    console.error('Auto-save failed', e);
    toast('Auto-save failed — ' + (typeof XLSX==='undefined' ? 'the Excel library couldn\'t load (are you offline?).' : 'see console for details.'));
  }
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Ledger save/${filename}`; // most browsers create this subfolder under Downloads automatically
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function manualExportXlsx(){
  try{
    downloadBlob(workbookBlob(), suggestedXlsxName());
    toast('Excel file downloaded.');
  }catch(e){
    console.error('Excel export failed', e);
    toast('Could not build the Excel file — ' + (typeof XLSX==='undefined' ? 'the Excel library couldn\'t load (are you offline?).' : 'see console for details.'));
  }
}

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function toast(msg){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  root.innerHTML = ''; root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);

function money(n, decimals){
  const d = decimals===undefined ? 2 : decimals;
  const v = Number(n)||0;
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:d, maximumFractionDigits:d});
  return `${sign}$${abs}`;
}
/* Whole-number version, used on the Dashboard where cents just add clutter */
function moneyWhole(n){ return money(Math.round(Number(n)||0), 0); }
function pct(a,b){ if(!b) return null; return a/b; }

/* =========================================================
   PLANNING HELPERS
========================================================= */
function ensurePlanningYear(year){
  if(!state.planning[year]) state.planning[year] = {};
  TYPES.forEach(t=>{
    if(!state.planning[year][t]) state.planning[year][t] = {};
    state.categories[t].forEach(cat=>{
      if(!state.planning[year][t][cat]) state.planning[year][t][cat] = new Array(12).fill(0);
    });
  });
  return state.planning[year];
}

function budgetFor(year, type, cat, monthIdx){
  const p = ensurePlanningYear(year);
  const arr = p[type][cat];
  return arr ? (Number(arr[monthIdx])||0) : 0;
}

/* =========================================================
   TRANSACTION HELPERS
========================================================= */
function effectiveDate(tx){
  const d = new Date(tx.date+'T00:00:00');
  if(tx.type==='Income' && state.settings.shiftLateIncome){
    if(d.getDate() >= Number(state.settings.shiftDay)){
      // Only the year/month bucket matters here — build it directly from year+month+1
      // rather than mutating the day-of-month in place, which can silently overflow
      // into a further month (e.g. Aug 31 + 1 month overflows to Oct, since September
      // only has 30 days).
      return new Date(d.getFullYear(), d.getMonth()+1, 1);
    }
  }
  return d;
}

/* A transaction's amount converted into AUD, using the currently-fetched FX rates.
   Every AUD-denominated calculation in the app (Dashboard, weekly totals, running
   balance) goes through this, so a transaction can be entered in its real currency
   without silently distorting anything that assumes AUD. */
function txAmountAUD(tx){
  return toAUD(Number(tx.amount)||0, tx.currency||'AUD');
}

/* Categories that shouldn't move the running balance at all. Deliberately separate
   from the ☆ list: an opening balance belongs in the balance but not in the graphs,
   whereas a side-ledger entry belongs in neither. */
function isBalanceExcluded(tx){
  return (state.settings.excludedFromBalance || []).includes(tx.type + '|||' + tx.category);
}

function trackedTotals(year, monthIdx){
  const totals = {Income:{}, Expenses:{}, Savings:{}};
  const excluded = new Set(state.settings.excludedFromSummary || []);
  state.transactions.forEach(tx=>{
    if(excluded.has(tx.type+'|||'+tx.category)) return;
    const ed = effectiveDate(tx);
    if(ed.getFullYear()===year && ed.getMonth()===monthIdx){
      totals[tx.type][tx.category] = (totals[tx.type][tx.category]||0) + txAmountAUD(tx);
    }
  });
  return totals;
}

function sumType(totalsForType){
  return Object.values(totalsForType).reduce((a,b)=>a+b,0);
}

function sortedTransactions(){
  return [...state.transactions].sort((a,b)=> a.date===b.date ? 0 : (a.date<b.date?-1:1));
}

function transactionsWithBalance(){
  const asc = sortedTransactions();
  let bal = 0;
  const withBal = asc.map(tx=>{
    if(isBalanceExcluded(tx)){
      // Still listed, but the balance doesn't move — and the row says so rather
      // than repeating the previous figure as though nothing happened.
      return {...tx, balance: bal, offBalance: true};
    }
    const amtAUD = txAmountAUD(tx);
    bal += (tx.type==='Income' ? amtAUD : -amtAUD);
    return {...tx, balance: bal, offBalance: false};
  });
  return withBal.reverse(); // newest first for display
}

/* =========================================================
   TICKER
========================================================= */
function renderTicker(){
  const y = TODAY.getFullYear(), m = TODAY.getMonth();
  const t = trackedTotals(y,m);
  const inc = sumType(t.Income), exp = sumType(t.Expenses), sav = sumType(t.Savings);
  const net = inc - exp - sav;
  const rate = state.settings.savingsRateType==='active'
    ? pct(sav, inc) : pct(inc-exp, inc);
  const netWorth = netWorthAUD();

  const el = document.getElementById('ticker');
  el.innerHTML = `
    <div class="item"><div class="label">Income MTD</div><div class="value pos">${moneyWhole(inc)}</div></div>
    <div class="item"><div class="label">Expenses MTD</div><div class="value neg">${moneyWhole(exp)}</div></div>
    <div class="item"><div class="label">Savings MTD</div><div class="value savings">${moneyWhole(sav)}</div></div>
    <div class="item"><div class="label">Net Cash Flow</div><div class="value ${net>=0?'pos':'neg'}">${moneyWhole(net)}</div></div>
    <div class="item"><div class="label">Savings Rate</div><div class="value savings">${rate===null?'—':(rate*100).toFixed(2)+'%'}</div></div>
    <div class="item"><div class="label">Net Worth (AUD)</div><div class="value neutral">${moneyWhole(netWorth)}</div></div>
  `;
}

/* =========================================================
   RENDER ROUTER
========================================================= */
function render(){
  setActiveNav();
  renderTicker();
  const c = document.getElementById('content');
  const tab = state.ui.activeTab;
  renderTab(c, tab);
  // Every figure on every tab flows through toAUD(), so the warning belongs above
  // all of them rather than tucked into the Net Worth tab where it started.
  const missingFx = missingFxCurrencies();
  if(missingFx.length){
    c.insertAdjacentHTML('afterbegin', fxGapBannerHTML(missingFx));
    const r = document.getElementById('fxAlertRefresh');
    const m = document.getElementById('fxAlertManual');

   DASHBOARD
========================================================= */
/* Aggregate tracked totals across the selected period (a single month, or a whole year) */
function periodTrackedTotals(year, viewMode, monthIdx){
  if(viewMode==='year'){
    const combined = {Income:{}, Expenses:{}, Savings:{}};
    for(let mo=0; mo<12; mo++){
      const t = trackedTotals(year, mo);
      TYPES.forEach(type=> Object.entries(t[type]).forEach(([cat,val])=>{
        combined[type][cat] = (combined[type][cat]||0) + val;
      }));
    }
    return combined;
  }
  return trackedTotals(year, monthIdx);
}

/* Aggregate budget across the selected period */
function periodBudget(year, type, cat, viewMode, monthIdx){
  if(viewMode==='year'){
    let sum = 0;
    for(let mo=0; mo<12; mo++) sum += budgetFor(year, type, cat, mo);
    return sum;
  }
  return budgetFor(year, type, cat, monthIdx);
}

/* Monday of the week containing the given Date */
function mondayOf(d){
  const dt = new Date(d);
  const day = dt.getDay(); // 0=Sun..6=Sat
  const diff = day===0 ? -6 : 1-day;
  dt.setDate(dt.getDate()+diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function isoDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function formatDateShort(dateISO){
  const d = new Date(dateISO+'T00:00:00');
  return `${d.getDate()}-${MONTHS[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`;
}

/* Last N Monday-Sunday weeks, index 0 = current week, going backwards from there */
function lastNWeeks(n){
  const thisMonday = mondayOf(TODAY);
  const weeks = [];
  for(let i=0; i<n; i++){
    const start = new Date(thisMonday); start.setDate(start.getDate() - 7*i);
    const end = new Date(start); end.setDate(end.getDate()+6);
    weeks.push({start, end});
  }
  return weeks;
}

/* Total Expenses in a Mon-Sun window, excluding whichever categories are configured to be left out */
function weekExpenseTotal(start, end){
  const s = isoDate(start), e = isoDate(end);
  const manualExcluded = state.settings.weeklyExcludedCategories || [];
  const specialExcluded = new Set(state.settings.excludedFromSummary || []);
  return state.transactions
    .filter(t=> t.type==='Expenses' && t.date>=s && t.date<=e
      && !manualExcluded.includes(t.category)
      && !specialExcluded.has(t.type+'|||'+t.category))
    .reduce((sum,t)=> sum+txAmountAUD(t), 0);
}

function weeklyExpenseRows(){
  const weeks = lastNWeeks(6).map(w=> ({ start: isoDate(w.start), end: isoDate(w.end), total: weekExpenseTotal(w.start, w.end) }));
  return weeks.slice(0,5).map((w,i)=>{
    const prev = weeks[i+1];
    let pctChange = null;
    if(prev){
      if(prev.total>0) pctChange = ((w.total-prev.total)/prev.total)*100;
      else if(w.total>0) pctChange = null; // undefined (prior week had nothing to compare against)
      else pctChange = 0;
    }
    return { ...w, pctChange };
  });
}

const TYPE_BASE_HEX = { Income: '#22c55e', Expenses: '#ec4899', Savings: '#3b82f6' };

/* Lighten (+) or darken (-) a hex color by a percentage */
function shadeColor(hex, percent){
  const num = parseInt(hex.replace('#',''), 16);
  const amt = Math.round(2.55 * percent);
  let r = (num >> 16) + amt, g = ((num >> 8) & 0x00FF) + amt, b = (num & 0x0000FF) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

/* Top 5 categories by tracked amount + an "Other" bucket for the rest, shaded from dark to light */
function buildDonutSegments(type, rows){
  const positive = rows.filter(r=>r.tracked>0).sort((a,b)=>b.tracked-a.tracked);
  const top = positive.slice(0,5);
  const restSum = positive.slice(5).reduce((s,r)=>s+r.tracked,0);
  const segments = top.map((r,i)=>({ label:r.cat, value:r.tracked, color:shadeColor(TYPE_BASE_HEX[type], (i-2)*13) }));
  if(restSum>0) segments.push({ label:'Other', value:restSum, color:'var(--text-faint)' });
  return segments;
}

function renderDonut(segments){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let acc = 0;
  const stops = segments.map(s=>{
    const startPct = (acc/total)*100; acc += s.value;
    const endPct = (acc/total)*100;
    return `${s.color} ${startPct.toFixed(2)}% ${endPct.toFixed(2)}%`;
  }).join(', ');
  return `
    <div style="position:relative; width:92px; height:92px; flex-shrink:0;">
      <div style="width:92px; height:92px; border-radius:50%; background:conic-gradient(${stops});"></div>
      <div style="position:absolute; inset:13px; border-radius:50%; background:var(--surface);"></div>
    </div>
  `;
}

/* How far through the selected month/year "today" is, as a % */
function periodProgressPct(year, viewMode, monthIdx){
  const now = new Date(isoDate(TODAY)+'T00:00:00');
  if(viewMode==='year'){
    const start = new Date(year,0,1), end = new Date(year,11,31);
    if(now < start) return 0;
    if(now > end) return 100;
    const totalDays = Math.round((end-start)/86400000)+1;
    const elapsed = Math.round((now-start)/86400000)+1;
    return Math.round((elapsed/totalDays)*100);
  }
  const start = new Date(year, monthIdx, 1), end = new Date(year, monthIdx+1, 0);
  if(now < start) return 0;
  if(now > end) return 100;
  return Math.round((now.getDate()/end.getDate())*100);
}

/* Grouped bar chart: Budget (planned total) vs. tracked Income/Expenses/Savings, per month, toggleable */
const GRAY_BASE_HEX = '#98a1af'; // neutral stand-in for non-selected months

/* Round a value up to a "nice" number (1/2/5/10 x power of ten) for clean axis ticks */
function niceCeil(v){
  if(v<=0) return 1;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const frac = v/base;
  let niceFrac;
  if(frac<=1) niceFrac=1;
  else if(frac<=2) niceFrac=2;
  else if(frac<=5) niceFrac=5;
  else niceFrac=10;
  return niceFrac*base;
}
/* Compact axis label, e.g. 5400 -> "5.4k" */
function formatAxisLabel(v){
  if(Math.abs(v)>=1000) return (v/1000).toFixed(v%1000===0?0:1)+'k';
  return String(Math.round(v));
}

/* Per-category bar tones: light = under-budget headroom, normal = actual within budget, dark = amount over budget */
function barTones(type, isSelected){
  const base = isSelected ? TYPE_BASE_HEX[type] : GRAY_BASE_HEX;
  return { light: shadeColor(base, isSelected ? 42 : 18), normal: base, dark: shadeColor(base, isSelected ? -26 : -30) };
}

function monthlyTrendSVG(year, toggle, selectedMonthIdx, viewMode){
  const types = ['Income','Expenses','Savings'];
  const active = types.filter(k=> toggle[k]);
  const showBudgetShading = toggle.Budget !== false;

  const monthly = [];
  for(let mo=0; mo<12; mo++){
    const t = trackedTotals(year, mo);
    const row = {};
    types.forEach(type=>{
      row[type] = {
        tracked: sumType(t[type]),
        budget: state.categories[type].reduce((s,cat)=> s+budgetFor(year,type,cat,mo), 0)
      };
    });
    monthly.push(row);
  }
  const rawMax = Math.max(1, ...monthly.flatMap(mo=> active.map(k=> Math.max(mo[k].tracked, mo[k].budget))));
  const maxVal = niceCeil(rawMax);
  const width = 900, height = 178, padBottom = 22, padTop = 8, padLeft = 34;
  const plotH = height - padBottom - padTop;
  const plotW = width - padLeft;
  const groupWidth = plotW/12;
  const gap = 3;
  const n = Math.max(1, active.length);
  const barWidth = Math.max(3, (groupWidth - gap*(n+1)) / n);

  // Y-axis gridlines + labels (0, 1/4, 1/2, 3/4, max)
  let gridlines = '';
  for(let i=0;i<=4;i++){
    const val = maxVal * i/4;
    const y = height - padBottom - (val/maxVal)*plotH;
    gridlines += `<line x1="${padLeft}" y1="${y.toFixed(1)}" x2="${width}" y2="${y.toFixed(1)}" style="stroke:var(--border); stroke-width:1; opacity:${i===0?1:0.5};"></line>`;
    gridlines += `<text x="${(padLeft-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" style="fill:var(--text-faint); font-family:var(--sans);">${formatAxisLabel(val)}</text>`;
  }

  let bars = '';
  monthly.forEach((mo, gi)=>{
    const isSelected = viewMode==='year' ? true : gi===selectedMonthIdx;
    active.forEach((type, si)=>{
      const { tracked, budget } = mo[type];
      const col = barTones(type, isSelected);
      const x = padLeft + gi*groupWidth + gap + si*(barWidth+gap);

      const segments = []; // stacked bottom-up: [{h, color, tip}]
      const tipBase = `${MONTHS[gi]} ${type}: tracked ${moneyWhole(tracked)}${budget?' / budget '+moneyWhole(budget):''}`;
      if(!showBudgetShading || budget<=0){
        const h = (tracked/maxVal)*plotH;
        if(h>0.1) segments.push({ h, color: col.normal, tip: tipBase });
      } else if(tracked <= budget){
        const hActual = (tracked/maxVal)*plotH;
        const hHeadroom = ((budget-tracked)/maxVal)*plotH;
        if(hActual>0.1) segments.push({ h:hActual, color: col.normal, tip: tipBase });
        if(hHeadroom>0.1) segments.push({ h:hHeadroom, color: col.light, tip: `${tipBase} — ${moneyWhole(budget-tracked)} remaining` });
      } else {
        const hBudget = (budget/maxVal)*plotH;
        const hExcess = ((tracked-budget)/maxVal)*plotH;
        if(hBudget>0.1) segments.push({ h:hBudget, color: col.normal, tip: tipBase });
        if(hExcess>0.1) segments.push({ h:hExcess, color: col.dark, tip: `${tipBase} — ${moneyWhole(tracked-budget)} over budget` });
      }

      let cursorY = height - padBottom;
      segments.forEach(seg=>{
        cursorY -= seg.h;
        bars += `<rect x="${x.toFixed(1)}" y="${cursorY.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${seg.h.toFixed(1)}" rx="1.5" style="fill:${seg.color}; cursor:pointer;"><title>${seg.tip}</title></rect>`;
      });
    });
  });
  let labels = '';
  MONTHS.forEach((mo,i)=>{
    const x = padLeft + i*groupWidth + groupWidth/2;
    const isSelected = viewMode==='year' ? true : i===selectedMonthIdx;
    labels += `<text x="${x.toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="9.5" style="fill:${isSelected?'var(--gold-bright)':'var(--text-faint)'}; font-family:var(--sans); font-weight:${isSelected?'700':'400'};">${mo}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block; max-height:200px;">
    ${gridlines}
    ${bars}
    ${labels}
  </svg>`;
}

/* Simple line chart: actual tracked amount per month, one line per type, with a guide marking the selected month */
function monthlyLineSVG(year, toggle, selectedMonthIdx, viewMode){
  const types = ['Income','Expenses','Savings'];
  const colorFor = { Income:'var(--green)', Expenses:'var(--pink)', Savings:'var(--blue-bright)' };
  const active = types.filter(k=> toggle[k]);

  const monthly = [];
  for(let mo=0; mo<12; mo++){
    const t = trackedTotals(year, mo);
    monthly.push({ Income:sumType(t.Income), Expenses:sumType(t.Expenses), Savings:sumType(t.Savings) });
  }
  const rawMax = Math.max(1, ...monthly.flatMap(mo=> active.map(k=>mo[k])));
  const maxVal = niceCeil(rawMax);
  const width = 900, height = 178, padTop = 12, padBottom = 22, padLeft = 34, padRight = 8;
  const plotW = width - padLeft - padRight, plotH = height - padTop - padBottom;
  const xFor = i => padLeft + (i/11)*plotW;
  const yFor = v => padTop + plotH - (v/maxVal)*plotH;

  // Y-axis gridlines + labels
  let gridlines = '';
  for(let i=0;i<=4;i++){
    const val = maxVal * i/4;
    const y = yFor(val);
    gridlines += `<line x1="${padLeft}" y1="${y.toFixed(1)}" x2="${width}" y2="${y.toFixed(1)}" style="stroke:var(--border); stroke-width:1; opacity:${i===0?1:0.5};"></line>`;
    gridlines += `<text x="${(padLeft-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" style="fill:var(--text-faint); font-family:var(--sans);">${formatAxisLabel(val)}</text>`;
  }

  let paths = '', dots = '';
  active.forEach(type=>{
    const color = colorFor[type];
    let d = '';
    monthly.forEach((mo,i)=>{
      const x = xFor(i), y = yFor(mo[type]);
      d += (i===0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" style="fill:${color}; cursor:pointer;"><title>${MONTHS[i]} ${type}: ${moneyWhole(mo[type])}</title></circle>`;
    });
    paths += `<path d="${d.trim()}" fill="none" style="stroke:${color}; stroke-width:2;"></path>`;
  });

  const guide = viewMode==='month'
    ? `<line x1="${xFor(selectedMonthIdx).toFixed(1)}" y1="${padTop}" x2="${xFor(selectedMonthIdx).toFixed(1)}" y2="${height-padBottom}" style="stroke:var(--gold); stroke-width:1; stroke-dasharray:3,3; opacity:0.55;"></line>`
    : '';

  let labels = '';
  MONTHS.forEach((mo,i)=>{
    const isSelected = viewMode==='year' ? true : i===selectedMonthIdx;
    labels += `<text x="${xFor(i).toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="9.5" style="fill:${isSelected?'var(--gold-bright)':'var(--text-faint)'}; font-family:var(--sans); font-weight:${isSelected?'700':'400'};">${mo}</text>`;
  });

  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block; max-height:200px;">
    ${gridlines}
    ${guide}
    ${paths}
    ${dots}
    ${labels}
  </svg>`;
}

/* A mistyped date — "0006" for "2026" — used to seed a planning year that then
   stuck around in the dropdown forever, because the year list is built from the
   keys of state.planning and nothing ever removed them. */
const YEAR_MIN = 1970, YEAR_MAX = 2200;
function isSaneYear(y){ return Number.isFinite(y) && y >= YEAR_MIN && y <= YEAR_MAX; }

function yearOptions(){
  const start = state.settings.startingYear;
  const years = new Set([start, TODAY.getFullYear()]);
  Object.keys(state.planning).forEach(y=>{ const n = Number(y); if(isSaneYear(n)) years.add(n); });
  state.transactions.forEach(tx=>{ const n = new Date(tx.date).getFullYear(); if(isSaneYear(n)) years.add(n); });
  const arr = [...years].filter(isSaneYear).sort((a,b)=>a-b);
  if(!arr.length) arr.push(TODAY.getFullYear());
  // pad a few future years for planning convenience
  const maxY = Math.max(...arr);
  for(let y=maxY+1; y<=maxY+3; y++) arr.push(y);
  return arr;
}

function csvEscape(v){
  const s = String(v==null ? '' : v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}

function exportTransactionsCSV(){
  const rows = [...transactionsWithBalance()].reverse(); // oldest first for a natural ledger read
  const header = ['Date','Type','Category','Details','Amount','Currency','Amount (AUD)','Balance (AUD)'];
  const lines = [header.join(',')];
  rows.forEach(r=>{
    const cur = r.currency || 'AUD';
    lines.push([r.date, r.type, r.category, csvEscape(r.details||''), r.amount, cur, txAmountAUD(r).toFixed(2), r.balance.toFixed(2)].join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  downloadBlob(blob, `transactions-${isoDate(TODAY)}.csv`);
  toast('CSV exported.');
}

function renderPlanning(c){
  if(!isSaneYear(Number(state.ui.planYear))) state.ui.planYear = TODAY.getFullYear();
  const y = state.ui.planYear;
  const years = yearOptions();
  ensurePlanningYear(y);
  const mobileMonth = (state.ui.planMobileMonth ?? TODAY.getMonth());

  // Actual tracked amounts per type/month, used to highlight budget cells
  const monthlyActuals = {};
  TYPES.forEach(t=>{
    monthlyActuals[t] = [];
    for(let mi=0; mi<12; mi++) monthlyActuals[t].push(trackedTotals(y, mi)[t]);
  });

  function typeTable(type){
    const excluded = new Set(state.settings.excludedFromSummary || []);
    const cats = state.categories[type];
    const monthTotals = new Array(12).fill(0);
    const rows = cats.map(cat=>{
      const isSpecial = excluded.has(`${type}|||${cat}`);
      const arr = state.planning[y][type][cat];
      arr.forEach((v,i)=> monthTotals[i]+= Number(v)||0);
      const rowTotal = arr.reduce((a,b)=>a+(Number(b)||0),0);
      const cells = arr.map((v,i)=>{
        const budget = Number(v)||0;
        const actual = monthlyActuals[type][i][cat] || 0;
        let cls = '';
        if(budget>0 && actual>0){
          const isOnBudget = Math.abs(actual-budget) < 0.005;
          if(type==='Expenses') cls = actual>budget && !isOnBudget ? 'pinput-over' : (isOnBudget ? 'pinput-met' : (actual/budget>=0.8 ? 'pinput-near' : ''));
          else cls = actual>=budget ? 'pinput-met' : (actual/budget>=0.8 ? 'pinput-near' : '');
        }
        return `<td><input type="number" step="1" class="${cls}" value="${v||''}" placeholder="0" data-m="${i}" title="Actual so far: ${moneyWhole(actual)}"></td>`;
      }).join('');
      return `<tr data-cat="${cat}" data-type="${type}">
        <td class="catname ${type}">${cat}${isSpecial?' <span class="muted" title="Special — excluded from graphs/donuts/breakdown totals" style="font-size:11px;">☆</span>':''}</td>
        ${cells}
        <td class="num" style="font-weight:600;">${moneyWhole(rowTotal)}</td>
      </tr>`;
    }).join('');
    const grandTotal = monthTotals.reduce((a,b)=>a+b,0);
    return `
      <div class="section-title" style="color:${type==='Income'?'var(--green)':type==='Expenses'?'var(--pink)':'var(--blue-bright)'};">${type}</div>
      <div class="card card-${type}"><div class="plan-table-wrap">
      <table class="data plan mobile-condensed pm-${mobileMonth}">
        <thead><tr><th>Category</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}<th class="num">Total</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr style="font-weight:600;"><td>Total</td>${monthTotals.map(v=>`<td class="num">${moneyWhole(v)}</td>`).join('')}<td class="num">${moneyWhole(grandTotal)}</td></tr></tfoot>
      </table>
      </div></div>
    `;
  }

  // To-be-allocated: Income - Expenses - Savings, per month
  const incT = new Array(12).fill(0), expT = new Array(12).fill(0), savT = new Array(12).fill(0);
  state.categories.Income.forEach(cat=> state.planning[y].Income[cat].forEach((v,i)=> incT[i]+=Number(v)||0));
  state.categories.Expenses.forEach(cat=> state.planning[y].Expenses[cat].forEach((v,i)=> expT[i]+=Number(v)||0));
  state.categories.Savings.forEach(cat=> state.planning[y].Savings[cat].forEach((v,i)=> savT[i]+=Number(v)||0));
  const toAllocate = incT.map((v,i)=> v - expT[i] - savT[i]);
  const toAllocateTotal = toAllocate.reduce((a,b)=>a+b,0);

  c.innerHTML = `
    <h1 class="page-title">Planning</h1>
    <div class="page-sub">Set your monthly budget per category. Add categories in Settings. The ☆ marks a category as Special — its transactions still count toward Transactions/Balance, but are left out of graphs, donuts, and breakdown totals (useful for things like an opening balance).</div>
    <div class="toolbar">
      <label class="field">Year
        <select id="planYear">${years.map(yr=>`<option value="${yr}" ${yr===y?'selected':''}>${yr}</option>`).join('')}</select>

   NET WORTH
========================================================= */
/* Sum of all Savings-type transactions in a given category, all-time (by actual transaction date) */
const NET_WORTH_CURRENCIES = ['AUD','THB','USD'];
const CURRENCY_SYMBOLS = { AUD:'$', THB:'฿', USD:'US$' };

/* A "unit" is either an account (no sub-categories) or a sub-category — both have
   openingBalance + openingDate + history, and can be reconstructed as of any date.
   Balances are always in the account's own currency; convert with toAUD() for totals/graphs. */
function unitBalanceAsOf(unit, dateISO){
  const opening = Number(unit.openingBalance)||0;
  const histSum = (unit.history||[]).filter(h=> h.date<=dateISO).reduce((s,h)=> s+(Number(h.delta)||0), 0);
  return opening + histSum;
}

function accountBalanceAsOf(account, dateISO){
  if(account.subCategories && account.subCategories.length){
    return account.subCategories.reduce((s,sub)=> s+unitBalanceAsOf(sub, dateISO), 0);
  }
  return unitBalanceAsOf(account, dateISO);
}

/* An account's live balance, in its own currency — its opening balance + adjustments
   since, or, if split into sub-categories, their sum. */
function computeAccountBalance(a){
  return accountBalanceAsOf(a, isoDate(TODAY));
}

/* Convert an amount from a given currency into AUD using the latest fetched FX rates.
   If a rate is missing the amount is passed through unconverted — which is WRONG by
   whatever the real rate is — so missingFxCurrencies() below drives a loud banner
   rather than letting a ฿238,000 balance quietly masquerade as $238,000. */
function toAUD(amount, currency){
  if(!currency || currency==='AUD') return amount;
  const rate = state.fxRates && state.fxRates[currency];
  return rate ? amount/rate : amount;
}

/* Non-AUD currencies that are actually in use somewhere but have no rate to convert
   with. Scanned from the data rather than recorded during conversion, so the answer
   doesn't depend on which tab happens to be open. */
function missingFxCurrencies(){
  const used = new Set();
  const noteCur = cur=>{ if(cur && cur!=='AUD') used.add(cur); };
  (state.accounts||[]).forEach(a=>{
    if(a.subCategories && a.subCategories.length) a.subCategories.forEach(sub=> noteCur(sub.currency || a.currency));
    else noteCur(a.currency);
  });
  (state.transactions||[]).forEach(t=> noteCur(t.currency));
  (state.bills||[]).forEach(b=> noteCur(b.currency));
  return [...used].filter(cur=> !(state.fxRates && state.fxRates[cur]));
}

      <div class="fx-alert-actions">

        <button class="btn secondary" id="fxAlertManual">Enter manually</button>
      </div>

/* Inverse of toAUD — convert an AUD amount into another currency (e.g. for a portfolio target set in THB). */
function fromAUD(amountAUD, currency){
  if(!currency || currency==='AUD') return amountAUD;
  const rate = state.fxRates && state.fxRates[currency];
  return rate ? amountAUD*rate : amountAUD;
}

function accountBalanceAUD(a, dateISO){
  const d = dateISO || isoDate(TODAY);
  if(a.subCategories && a.subCategories.length){
    return a.subCategories.reduce((s,sub)=> s + toAUD(unitBalanceAsOf(sub, d), sub.currency||a.currency), 0);
  }
  return toAUD(unitBalanceAsOf(a, d), a.currency);
}

/* Whole numbers by default — balances and net worth read better without cents.
   Pass a decimals count where the exact figure matters, such as the amount you
   actually typed on a transaction. */
function moneyCur(amount, currency, decimals){
  const sym = CURRENCY_SYMBOLS[currency] || '$';
  const v = Number(amount)||0;
  const sign = v<0 ? '-' : '';
  const d = decimals===undefined ? 0 : decimals;
  const abs = Math.abs(v).toLocaleString(undefined, { minimumFractionDigits:d, maximumFractionDigits:d });
  return `${sign}${sym}${abs}`;
}

function netWorthAUD(){
  return state.accounts.reduce((sum,a)=> sum + accountBalanceAUD(a), 0);
}

function netWorthAsOf(dateISO){
  return state.accounts.reduce((sum,a)=> sum + accountBalanceAUD(a, dateISO), 0);
}

/* Fetch AUD->THB/USD rates from a free, no-key, CORS-enabled API. Refreshes at most
   once every 24h unless forced (e.g. a manual "Refresh rates" click). */
async function refreshFxRates(force){
  const stale = !state.fxRates || !state.fxRates.fetchedAt || (Date.now() - new Date(state.fxRates.fetchedAt).getTime()) > 24*60*60*1000;
  if(!force && !stale) return;

  // Try frankfurter.app first, then a second free API if that fails for any reason.
  const attempts = [
    async ()=>{
      const res = await fetch('https://api.frankfurter.app/latest?from=AUD&to=THB,USD');
      if(!res.ok) throw new Error('frankfurter.app HTTP '+res.status);
      const data = await res.json();
      if(!data.rates || !data.rates.THB || !data.rates.USD) throw new Error('frankfurter.app: unexpected response');
      return { THB: data.rates.THB, USD: data.rates.USD };
    },
    async ()=>{
      const res = await fetch('https://open.er-api.com/v6/latest/AUD');
      if(!res.ok) throw new Error('open.er-api.com HTTP '+res.status);
      const data = await res.json();
      if(!data.rates || !data.rates.THB || !data.rates.USD) throw new Error('open.er-api.com: unexpected response');
      return { THB: data.rates.THB, USD: data.rates.USD };
    }
  ];

  let lastError = null;
  for(const attempt of attempts){
    try{
      const rates = await attempt();
      state.fxRates = { THB: rates.THB, USD: rates.USD, fetchedAt: new Date().toISOString() };
      saveState();
      if(state.ui.activeTab==='networth') render();
      if(force) toast('Exchange rates updated.');
      return;
    }catch(e){ lastError = e; }
  }

  console.error('Could not refresh FX rates from any source', lastError);
  if(force){
    const hint = location.protocol==='file:'
      ? ' This page is open as a local file — some browsers block outside network requests from local files. Try "Enter rates manually" below, or open this file through a local web server instead.'
      : '';
    toast(`Could not refresh exchange rates (${lastError && lastError.message ? lastError.message : 'unknown error'}).${hint}`);
  }
}

/* Stacked bar chart: net worth by group, one bar per month, over the trailing 12 months */
/* Earliest date any account/sub-category actually started being tracked */
function earliestTrackingDateISO(){
  let earliest = null;
  state.accounts.forEach(a=>{
    const units = (a.subCategories && a.subCategories.length) ? a.subCategories : [a];
    units.forEach(u=>{
      if(u.openingDate && (!earliest || u.openingDate<earliest)) earliest = u.openingDate;
    });
  });
  return earliest;
}

function netWorthStackedSVG(toggle){
  const groupsPresent = [...new Set(state.accounts.map(a=>a.group||'Other'))];
  const active = groupsPresent.filter(g=> toggle[g]!==false);
  const groupColor = {};
  buildNetWorthDonutSegments().forEach(s=> groupColor[s.label]=s.color);
  groupsPresent.forEach((g,i)=>{ if(!groupColor[g]) groupColor[g]=NET_WORTH_PALETTE[i%NET_WORTH_PALETTE.length]; });

  // Only show months since the earliest account actually started being tracked —
  // never invent history before that, and cap at 12 months for chart readability.
  const earliestISO = earliestTrackingDateISO();
  const earliestDate = earliestISO ? new Date(earliestISO+'T00:00:00') : TODAY;
  const monthsSinceStart = (TODAY.getFullYear()-earliestDate.getFullYear())*12 + (TODAY.getMonth()-earliestDate.getMonth()) + 1;
  const numMonths = Math.max(1, Math.min(12, monthsSinceStart));

  const monthEnds = [];
  for(let i=numMonths-1;i>=0;i--){
    monthEnds.push(new Date(TODAY.getFullYear(), TODAY.getMonth()-i+1, 0));
  }
  const monthly = monthEnds.map(d=>{
    const dISO = isoDate(d);
    const row = {};
    active.forEach(g=>{
      row[g] = state.accounts.filter(a=>(a.group||'Other')===g).reduce((s,a)=> s+accountBalanceAUD(a,dISO), 0);
    });
    return row;
  });

  const rawMax = Math.max(1, ...monthly.map(mo=> active.reduce((s,g)=>s+Math.max(0,mo[g]),0)));
  const maxVal = niceCeil(rawMax);
  const width = 900, height = 178, padBottom = 22, padTop = 8, padLeft = 34;
  const plotH = height - padBottom - padTop;
  const plotW = width - padLeft;
  const groupWidth = plotW/numMonths;
  const barWidth = Math.max(6, Math.min(70, groupWidth - 8));

  let gridlines = '';
  for(let i=0;i<=4;i++){
    const val = maxVal*i/4;
    const y = height - padBottom - (val/maxVal)*plotH;
    gridlines += `<line x1="${padLeft}" y1="${y.toFixed(1)}" x2="${width}" y2="${y.toFixed(1)}" style="stroke:var(--border); stroke-width:1; opacity:${i===0?1:0.5};"></line>`;
    gridlines += `<text x="${(padLeft-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" style="fill:var(--text-faint); font-family:var(--sans);">${formatAxisLabel(val)}</text>`;
  }

  let bars = '';
  monthly.forEach((mo,gi)=>{
    const x = padLeft + gi*groupWidth + (groupWidth-barWidth)/2;
    let cursorY = height - padBottom;
    active.forEach(g=>{
      const val = Math.max(0, mo[g]);
      const h = (val/maxVal)*plotH;
      if(h>0.1){
        cursorY -= h;
        bars += `<rect x="${x.toFixed(1)}" y="${cursorY.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" style="fill:${groupColor[g]};"><title>${MONTHS[monthEnds[gi].getMonth()]} ${monthEnds[gi].getFullYear()} — ${g}: ${moneyWhole(val)}</title></rect>`;
      }
    });
  });

  let labels = '';
  monthEnds.forEach((d,i)=>{
    const x = padLeft + i*groupWidth + groupWidth/2;
    const isCurrent = i===numMonths-1;
    labels += `<text x="${x.toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="9" style="fill:${isCurrent?'var(--gold-bright)':'var(--text-faint)'}; font-family:var(--sans); font-weight:${isCurrent?'700':'400'};">${MONTHS[d.getMonth()]}</text>`;
  });

  return { svg: `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block; max-height:200px;">
    ${gridlines}
    ${bars}
    ${labels}
  </svg>`, groupsPresent, groupColor };
}

      const cur = subId ? (unit.currency||acc.currency) : acc.currency;
      const input = prompt(`Long-term target for ${subId?unit.name:acc.name} (in ${cur}). Leave blank to remove.`, unit.target||'');

      const val = input.trim()==='' ? null : Number(input);

    };
  });
  c.querySelectorAll('[data-renameacc]').forEach(b=>{
    b.onclick = ()=>{
      const acc = state.accounts.find(a=>a.id===b.dataset.renameacc);
      if(!acc) return;

      saveState(); render();

  c.querySelectorAll('[data-renamesub]').forEach(b=>{
    b.onclick = ()=>{
      const [accId, subId] = b.dataset.renamesub.split('|||');
      const acc = state.accounts.find(a=>a.id===accId);
      if(!acc) return;
      const sub = (acc.subCategories||[]).find(s=>s.id===subId);
      if(!sub) return;
      const input = prompt('Rename split:', sub.name);
      if(input===null) return;
      const name = input.trim();
      if(!name){ toast('Name cannot be empty.'); return; }
      sub.name = name;
      saveState(); render();
    };
  });
}

/* One screen, every holding, two boxes each. The point is that a monthly price
   update should take under a minute — otherwise it doesn't get done, and a stale
   price is worse than an obviously missing one. */
/* ---- Price fetching --------------------------------------------------------
   Two sources, tried in order, mirroring how FX rates already work. Stooq needs
   no key but is unofficial and sometimes blocks browser requests outright, so
   Finnhub is available as a fallback for anyone willing to hold a key.

   The key is kept in localStorage under a separate key, deliberately NOT in
   state: state syncs to Firestore and gets exported, and this repo is public.
   A token in the saved data is a token you've published. */
/* Most holdings are already named after their ticker — VT, SCHD, QQQM — so asking
   for it a second time is busywork. A name that looks like a symbol is used as one
   unless an explicit ticker overrides it. */
function looksLikeTicker(name){
  return /^[A-Za-z]{1,5}(\.[A-Za-z]{1,3})?$/.test(String(name||'').trim());
}
function effectiveTicker(unit, fallbackName){
  if(unit && unit.ticker) return unit.ticker;
  return looksLikeTicker(fallbackName) ? String(fallbackName).trim().toUpperCase() : '';
}

/* The key can live in one of two places.

   Device only  — localStorage, under its own key. Never leaves this browser, but
                  has to be entered again on every device.
   Synced       — inside state, so Firestore carries it to your other devices.
                  state is private to your Firebase account and is not part of the
                  public repository, so this is a reasonable trade for a read-only,
                  rate-limited market-data key. It is stripped out of exported
                  backups regardless, because those are files that get shared. */
const QUOTE_TOKEN_KEY = 'ledger_quote_token';

function quoteTokenSynced(){ return !!(state.settings && state.settings.quoteToken); }
function quoteToken(){
  if(state.settings && state.settings.quoteToken) return state.settings.quoteToken;
  try{ return localStorage.getItem(QUOTE_TOKEN_KEY) || ''; }catch(e){ return ''; }
}
function setQuoteToken(v, synced){
  const val = (v||'').trim();
  // Whichever mode is chosen, make sure the key isn't left behind in the other one.
  try{ localStorage.removeItem(QUOTE_TOKEN_KEY); }catch(e){}
  if(state.settings) delete state.settings.quoteToken;
  if(!val){ saveState(); return; }
  if(synced){ state.settings.quoteToken = val; saveState(); }
  else { try{ localStorage.setItem(QUOTE_TOKEN_KEY, val); }catch(e){} }
}

/* Returns a number, or throws with a reason worth showing the user. */
async function fetchQuote(ticker){
  const t = String(ticker||'').trim();
  if(!t) throw new Error('no ticker');

  // 1. Stooq — keyless CSV. US tickers need the .us suffix.
  try{
    const sym = t.includes('.') ? t.toLowerCase() : t.toLowerCase()+'.us';
    const res = await fetch(`https://stooq.com/q/l/?s=${encodeURIComponent(sym)}&f=sd2t2ohlcv&h&e=csv`);
    if(res.ok){
      const text = await res.text();
      const line = text.trim().split('\n')[1];
      if(line){
        const close = Number(line.split(',')[6]);
        if(isFinite(close) && close > 0) return { price: close, source: 'Stooq' };
      }
    }
  }catch(e){ /* blocked or offline — fall through */ }

  // 2. Finnhub — documented, but needs a key held on this device only.
  const key = quoteToken();
  if(key){
    const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(t.toUpperCase())}&token=${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error('Finnhub HTTP '+res.status);
    const data = await res.json();
    if(data && isFinite(data.c) && data.c > 0) return { price: data.c, source: 'Finnhub' };
    throw new Error('no price returned');
  }
  throw new Error('blocked, and no API key set');
}
