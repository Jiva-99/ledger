/* Full history for an account or sub-category: opening balance as the first row,
   then every adjustment in date order, with a running balance and edit/delete per entry. */
function openHistoryModal(accId, subId){
  const acc = state.accounts.find(a=>a.id===accId);
  if(!acc) return;
  const unit = subId ? (acc.subCategories||[]).find(s=>s.id===subId) : acc;
  if(!unit) return;
  const label = subId ? `${acc.name} — ${unit.name}` : acc.name;
  const cur = subId ? (unit.currency||acc.currency) : acc.currency;

  function paint(){
    const root = document.getElementById('modalRoot');
    const histWithIdx = (unit.history||[]).map((h,i)=>({...h, _idx:i}));
    histWithIdx.sort((a,b)=> a.date<b.date ? -1 : (a.date>b.date ? 1 : 0));

    let running = Number(unit.openingBalance)||0;
    const rows = [`
      <tr>
        <td class="muted">${unit.openingDate}</td>
        <td class="num">${moneyCur(unit.openingBalance, cur)}</td>
        <td class="muted" style="font-size:12px;">Opening balance</td>
        <td class="num">${moneyCur(running, cur)}</td>
        <td><button class="icon-btn" style="color:var(--gold);" data-histeditopen title="Edit opening balance">✎</button></td>
      </tr>
    `];
    histWithIdx.forEach(h=>{
      running += Number(h.delta)||0;
      rows.push(`
        <tr>
          <td class="muted">${h.date}</td>
          <td class="num ${h.delta>=0?'pos':'neg'}">${h.delta>=0?'+':''}${moneyCur(h.delta, cur)}</td>
          <td class="muted" style="font-size:12px;">${h.note||''}</td>
          <td class="num">${moneyCur(running, cur)}</td>
          <td>
            <button class="icon-btn" style="color:var(--gold);" data-histedit="${h._idx}" title="Edit">✎</button>
            <button class="icon-btn" data-histdel="${h._idx}" title="Delete">✕</button>
          </td>
        </tr>
      `);
    });

    root.innerHTML = `
      <div class="modal-backdrop" id="mb">
        <div class="modal" style="width:540px;">
          <h2>History — ${label}</h2>
          <div class="page-sub">Newest first. "Balance" is the running total after each entry.</div>
          <div style="max-height:360px; overflow-y:auto;">
            <table class="data">
              <thead><tr><th>Date</th><th class="num">Amount</th><th>Note</th><th class="num">Balance</th><th></th></tr></thead>
              <tbody>${rows.slice().reverse().join('')}</tbody>
            </table>
          </div>
          <div class="form-actions">
            <button class="btn secondary" id="fClose">Close</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('fClose').onclick = ()=> root.innerHTML='';
    document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') root.innerHTML=''; });

    const openEditBtn = root.querySelector('[data-histeditopen]');
    if(openEditBtn) openEditBtn.onclick = ()=>{
      const newAmt = prompt(`Opening balance (in ${cur}):`, unit.openingBalance);
      if(newAmt===null) return;
      const newDate = prompt('Opening date (YYYY-MM-DD):', unit.openingDate);
      if(newDate===null) return;
      unit.openingBalance = Number(newAmt)||0;
      if(newDate.trim()) unit.openingDate = newDate.trim();
      saveState(); paint(); render();
    };
    root.querySelectorAll('[data-histedit]').forEach(b=>{
      b.onclick = ()=>{
        const idx = Number(b.dataset.histedit);
        const h = unit.history[idx];
        if(!h) return;
        const newAmt = prompt(`Amount (use negative for withdrawal, in ${cur}):`, h.delta);
        if(newAmt===null) return;
        const newDate = prompt('Date (YYYY-MM-DD):', h.date);
        if(newDate===null) return;
        const newNote = prompt('Note:', h.note||'');
        if(newNote===null) return;
        h.delta = Number(newAmt)||0;
        if(newDate.trim()) h.date = newDate.trim();
        h.note = newNote.trim();
        saveState(); paint(); render();
      };
    });
    root.querySelectorAll('[data-histdel]').forEach(b=>{
      b.onclick = ()=>{
        if(confirm('Delete this entry? This cannot be undone.')){
          const idx = Number(b.dataset.histdel);
          unit.history.splice(idx,1);
          saveState(); paint(); render();
        }
      };
    });
  }
  paint();
}

/* =========================================================
   BILLS
========================================================= */
function currentMonthKey(){ return isoDate(TODAY).slice(0,7); }

function nextDueDate(bill){
  if(!bill.lastPaidDate) return null;
  const d = new Date(bill.lastPaidDate+'T00:00:00');
  if(bill.frequency==='Annually'){
    d.setFullYear(d.getFullYear()+1);
    return d;
  }
  // Clamp to the target month's real last day (e.g. Jan 31 -> Feb 28/29, not overflowing into March).
  const targetYear = d.getFullYear();
  const targetMonth = d.getMonth()+1;
  const lastDayOfTargetMonth = new Date(targetYear, targetMonth+1, 0).getDate();
  const day = Math.min(d.getDate(), lastDayOfTargetMonth);
  return new Date(targetYear, targetMonth, day);
}

function dueBadge(bill){
  const nd = nextDueDate(bill);
  if(!nd) return `<span class="muted">Not yet paid</span>`;
  const days = Math.round((nd - new Date(isoDate(TODAY)+'T00:00:00')) / 86400000);
  const dateStr = isoDate(nd);
  if(days < 0) return `<span class="neg">${dateStr} — overdue ${Math.abs(days)}d</span>`;
  if(days === 0) return `<span class="neg">${dateStr} — due today</span>`;
  if(days <= 5) return `<span style="color:var(--amber);">${dateStr} — in ${days}d</span>`;
  return `<span class="muted">${dateStr} — in ${days}d</span>`;
}

function renderBills(c){
  const mk = currentMonthKey();
  const monthlyEquivalent = state.bills.reduce((s,b)=>{
    const amtAUD = toAUD(Number(b.amount)||0, b.currency||'AUD');
    return s + (b.frequency==='Annually' ? amtAUD/12 : amtAUD);
  },0);

  c.innerHTML = `
    <h1 class="page-title">Bills & Subscriptions</h1>
    <div class="page-sub">Recurring costs, when they're next due, and whether they've been paid this month. Use ↑↓ to reorder.</div>
    <div class="row" style="margin-bottom:16px;">
      <div class="card metric"><h3>Monthly equivalent</h3><div class="big neg">${moneyWhole(monthlyEquivalent)}</div><div class="cap">annual bills ÷ 12 + monthly bills, in AUD</div></div>
    </div>
    <div class="toolbar"><div class="spacer"></div><button class="btn" id="addBillBtn">+ Add bill</button></div>
    ${state.bills.length===0 ? `<div class="empty-state"><div class="glyph">·</div>No recurring bills yet.</div>` : `
    <table class="data">
      <thead><tr><th></th><th>Name</th><th class="num">Amount</th><th>Frequency</th><th>Next due</th><th>Paid this month</th><th></th></tr></thead>
      <tbody>
        ${state.bills.map((b,idx)=>{
          const paid = (b.paidMonths||[]).includes(mk);
          return `
          <tr>
            <td style="white-space:nowrap;">
              <button class="icon-btn" data-billup="${b.id}" title="Move up" ${idx===0?'disabled':''}>↑</button>
              <button class="icon-btn" data-billdown="${b.id}" title="Move down" ${idx===state.bills.length-1?'disabled':''}>↓</button>
            </td>
            <td>${b.name}${b.notes?`<div class="muted" style="font-size:11.5px;">${b.notes}</div>`:''}</td>
            <td class="num">${moneyCur(b.amount, b.currency||'AUD')}</td>
            <td class="muted">${b.frequency}</td>
            <td style="font-size:12.5px;">${dueBadge(b)}</td>
            <td><input type="checkbox" data-paid="${b.id}" ${paid?'checked':''}></td>
            <td>
              <button class="icon-btn" style="color:var(--gold);" data-editbill="${b.id}" title="Edit">✎</button>
              <button class="icon-btn" data-delbill="${b.id}" title="Delete">✕</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  `;

  document.getElementById('addBillBtn').onclick = ()=> openBillModal();
  c.querySelectorAll('[data-paid]').forEach(cb=> cb.onchange = ()=>{
    const b = state.bills.find(x=>x.id===cb.dataset.paid);
    b.paidMonths = b.paidMonths||[];
    if(cb.checked){
      if(!b.paidMonths.includes(mk)) b.paidMonths.push(mk);
      b.lastPaidDate = isoDate(TODAY);
    } else {
      b.paidMonths = b.paidMonths.filter(x=>x!==mk);
    }
    saveState(); render();
  });
  c.querySelectorAll('[data-delbill]').forEach(b=> b.onclick = ()=>{
    if(confirm('Delete this bill?')){
      state.bills = state.bills.filter(x=>x.id!==b.dataset.delbill);
      saveState(); render();
    }
  });
  c.querySelectorAll('[data-editbill]').forEach(b=> b.onclick = ()=> openBillModal(b.dataset.editbill));
  c.querySelectorAll('[data-billup]').forEach(b=>{
    b.onclick = ()=>{
      const idx = state.bills.findIndex(x=>x.id===b.dataset.billup);
      if(idx>0){ [state.bills[idx-1], state.bills[idx]] = [state.bills[idx], state.bills[idx-1]]; saveState(); render(); }
    };
  });
  c.querySelectorAll('[data-billdown]').forEach(b=>{
    b.onclick = ()=>{
      const idx = state.bills.findIndex(x=>x.id===b.dataset.billdown);
      if(idx>=0 && idx<state.bills.length-1){ [state.bills[idx+1], state.bills[idx]] = [state.bills[idx], state.bills[idx+1]]; saveState(); render(); }
    };
  });
}

      <div class="modal">
        <h2>${existing ? 'Edit bill' : 'Add bill'}</h2>
        <div class="form-grid">
          <label class="field">Name <input type="text" id="bName" placeholder="e.g. Netflix" value="${existing ? existing.name : ''}"></label>
          <label class="field">Amount <input type="number" id="bAmt" min="0" step="0.01" inputmode="decimal" value="${existing ? existing.amount : ''}"></label>
          <label class="field">Currency
            <select id="bCurrency">${NET_WORTH_CURRENCIES.map(cur=>`<option ${existing ? (cur===(existing.currency||'AUD')?'selected':'') : (cur==='AUD'?'selected':'')}>${cur}</option>`).join('')}</select>
          </label>
          <label class="field">Frequency <select id="bFreq"><option ${existing&&existing.frequency==='Monthly'?'selected':''}>Monthly</option><option ${existing&&existing.frequency==='Annually'?'selected':''}>Annually</option></select></label>
          <label class="field">Notes <input type="text" id="bNotes" placeholder="optional" value="${existing ? (existing.notes||'') : ''}"></label>
        </div>
        <div class="form-actions">
          <button class="btn secondary" id="fCancel">Cancel</button>
          <button class="btn" id="fSave">${existing ? 'Save changes' : 'Save'}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('fCancel').onclick = ()=> root.innerHTML='';
  document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') root.innerHTML=''; });
  document.getElementById('fSave').onclick = ()=>{
    const name = document.getElementById('bName').value.trim();
    const bAmtVal = Number(document.getElementById('bAmt').value);
    if(!name){ toast('Give the bill a name.'); return; }
    if(!bAmtVal || bAmtVal<=0){ toast('Enter an amount greater than 0.'); return; }
    const frequency = document.getElementById('bFreq').value;
    const currency = document.getElementById('bCurrency').value;
    const notes = document.getElementById('bNotes').value.trim();
    if(existing){
      Object.assign(existing, { name, amount:bAmtVal, currency, frequency, notes });
      toast('Bill updated.');
    } else {
      state.bills.push({
        id:uid(), name, amount:bAmtVal, currency, frequency, notes,
        lastPaidDate:'', paidMonths:[]
      });
      toast('Bill added.');
    }
    saveState(); root.innerHTML=''; render();
  };
}

/* =========================================================
   SETTINGS
========================================================= */
function moveCategory(type, cat, direction){
  const arr = state.categories[type];
  const idx = arr.indexOf(cat);
  if(idx===-1) return;
  const swapIdx = idx + direction;
  if(swapIdx<0 || swapIdx>=arr.length) return;
  [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
  saveState(); render();
}

function toggleCategorySpecial(type, cat){
  const key = type+'|||'+cat;
  const list = new Set(state.settings.excludedFromSummary||[]);
  if(list.has(key)) list.delete(key); else list.add(key);
  state.settings.excludedFromSummary = [...list];
  saveState(); render();
}

function renameCategory(type, oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  if(state.categories[type].includes(newName)){ toast('That category already exists.'); return; }
  const idx = state.categories[type].indexOf(oldName);
  if(idx===-1) return;
  state.categories[type][idx] = newName;

  // Carry the rename through everywhere the old name is referenced
  Object.keys(state.planning).forEach(yr=>{
    const bucket = state.planning[yr] && state.planning[yr][type];
    if(bucket && bucket[oldName]){ bucket[newName] = bucket[oldName]; delete bucket[oldName]; }
  });
  state.transactions.forEach(tx=>{ if(tx.type===type && tx.category===oldName) tx.category = newName; });
  if(type==='Expenses'){
    state.settings.weeklyExcludedCategories = (state.settings.weeklyExcludedCategories||[]).map(c=> c===oldName ? newName : c);
  }
  if(type==='Savings'){
    state.accounts.forEach(a=>{ if(a.linkedCategory===oldName) a.linkedCategory = newName; });
  }
  state.settings.excludedFromSummary = (state.settings.excludedFromSummary||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);

  saveState(); render(); toast(`Renamed to "${newName}".`);
}

function renderSettings(c){
  const s = state.settings;
  c.innerHTML = `
    <h1 class="page-title">Settings</h1>
    <div class="page-sub">App-wide preferences, categories, and data management.</div>

    <div class="section-title">General</div>
    <div class="card">
      <div class="form-grid">
        <label class="field">Starting year (reference only)
          <input type="number" id="sYear" value="${s.startingYear}">
        </label>
        <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
          <input type="checkbox" id="sShift" ${s.shiftLateIncome?'checked':''}>
          Treat income received on/after a certain day as next month's income
        </label>
        <label class="field">Shift starting on day
          <input type="number" id="sShiftDay" min="1" max="31" value="${s.shiftDay}">
        </label>
        <label class="field">Savings rate calculation
          <select id="sRateType">
            <option value="active" ${s.savingsRateType==='active'?'selected':''}>Active — Savings ÷ Income</option>
            <option value="passive" ${s.savingsRateType==='passive'?'selected':''}>Passive — (Income − Expenses) ÷ Income</option>
          </select>
        </label>
      </div>
    </div>

    <div class="section-title">Profiles</div>
    <div class="card">
      <div class="page-sub" style="margin-bottom:14px;">Each profile is a fully separate, unlinked book — its own categories, transactions, planning, accounts, and bills. Nothing is shared or converted between them.</div>
      <table class="data">
        <thead><tr><th>Name</th><th></th><th></th></tr></thead>
        <tbody>
          ${profiles.list.map(p=>`
            <tr>
              <td>${p.name}${p.id===profiles.activeId ? ' <span class="pill Savings" style="margin-left:6px;">Active</span>' : ''}</td>
              <td>${p.id===profiles.activeId ? '' : `<button class="btn secondary" data-switchprofile="${p.id}" style="padding:5px 12px; font-size:12px;">Switch to</button>`}</td>
              <td>
                <button class="icon-btn" style="color:var(--gold);" data-renameprofile="${p.id}" title="Rename">✎</button>
                <button class="icon-btn" data-delprofile="${p.id}" title="Delete">✕</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="toolbar" style="margin-top:14px;"><button class="btn secondary" id="addProfileBtn2">+ New profile</button></div>
    </div>

    <div class="section-title">Categories</div>
    <div class="muted" style="font-size:12px; margin:-4px 0 10px 0;">Use ↑↓ to reorder. The ☆ marks a category as <b>Special</b> — its transactions still count toward Transactions/Balance, but are left out of graphs, donuts, and breakdown totals (useful for things like an opening balance).</div>
    <div class="card">
      <div class="grid-cat">
        ${TYPES.map(t=>`
          <div class="cat-col">
            <h4>${t}</h4>
            <div class="cat-list" id="catList-${t}">
              ${state.categories[t].map((cat,idx)=>{
                const key = t+'|||'+cat;
                const isSpecial = (state.settings.excludedFromSummary||[]).includes(key);
                return `
                <div class="cat-item ${t}">
                  <div style="display:flex; align-items:center; gap:2px; min-width:0; overflow:hidden;">
                    <button class="icon-btn" data-moveup="${key}" title="Move up" ${idx===0?'disabled':''}>↑</button>
                    <button class="icon-btn" data-movedown="${key}" title="Move down" ${idx===state.categories[t].length-1?'disabled':''}>↓</button>
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-left:2px;">${cat}</span>
                    ${isSpecial?'<span class="pill Savings" style="margin-left:6px; flex-shrink:0;">Special</span>':''}
                  </div>
                  <div class="cat-actions">
                    <button class="icon-btn" data-togglespecial="${key}" title="${isSpecial?'Include in graphs/summary':'Exclude from graphs/summary'}">${isSpecial?'★':'☆'}</button>
                    <button class="icon-btn" style="color:var(--gold);" data-editcat="${key}" title="Rename">✎</button>
                    <button class="icon-btn" data-rmcat="${key}" title="Remove">✕</button>
                  </div>
                </div>
              `;}).join('')}
            </div>
            <div class="add-cat-row">
              <input type="text" id="newCat-${t}" placeholder="New category…">
              <button class="btn secondary" data-addcat="${t}">Add</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="section-title">Auto-save to Excel</div>
    <div class="card">
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:10px;">
        <input type="checkbox" id="sAutoSave" ${state.settings.autoSaveEnabled?'checked':''}>
        Automatically keep an Excel (.xlsx) copy of this profile up to date
      </label>
      <div class="muted" style="font-size:12px; margin-bottom:10px;">
        ${AUTO_SAVE_SUPPORTED
          ? (autoSaveHandle
              ? `Linked to a file you chose — it updates automatically a couple of seconds after any change.`
              : `Not linked yet. Turning this on (or clicking below) opens a save dialog starting in your Downloads folder — create or open a "Ledger save" folder there (or pick anywhere else you prefer) and save once; every change updates that same file automatically after that.`)
          : `Your browser doesn't support linking directly to a file, so this will download a new .xlsx to your Downloads folder after each change (files will accumulate as separate copies). Chrome or Edge support updating a single file in place.`}
      </div>
      <div class="toolbar">
        <button class="btn secondary" id="chooseAutoSaveBtn">${autoSaveHandle ? 'Change save location' : 'Choose save location'}</button>
        <button class="btn secondary" id="exportXlsxBtn">Download Excel now</button>
      </div>
    </div>

    <div class="section-title">Data</div>
    <div class="card">
      <div class="toolbar">
        <button class="btn secondary" id="exportBtn2">Export this profile (.json)</button>
        <button class="btn secondary" id="importBtn2">Import into this profile</button>
        <button class="btn danger" id="resetBtn">Reset this profile's data</button>
      </div>
      <div class="muted" style="font-size:12px; margin-top:8px;">Data is stored only in this browser (localStorage), per profile. Export a backup regularly, especially before clearing browser data.</div>
    </div>
  `;

  document.getElementById('sAutoSave').onchange = e=>{
    if(e.target.checked && AUTO_SAVE_SUPPORTED && !autoSaveHandle){
      chooseAutoSaveLocation();
    } else {
      state.settings.autoSaveEnabled = e.target.checked;
      saveState(); render();
      if(e.target.checked) performAutoSave();
    }
  };
  document.getElementById('chooseAutoSaveBtn').onclick = chooseAutoSaveLocation;
  document.getElementById('exportXlsxBtn').onclick = manualExportXlsx;

  document.getElementById('sYear').onchange = e=>{ state.settings.startingYear = Number(e.target.value); saveState(); };
  document.getElementById('sShift').onchange = e=>{ state.settings.shiftLateIncome = e.target.checked; saveState(); render(); };
  document.getElementById('sShiftDay').onchange = e=>{ state.settings.shiftDay = Number(e.target.value); saveState(); render(); };
  document.getElementById('sRateType').onchange = e=>{ state.settings.savingsRateType = e.target.value; saveState(); render(); };

  document.getElementById('addProfileBtn2').onclick = openProfileModal;
  c.querySelectorAll('[data-switchprofile]').forEach(btn=> btn.onclick = ()=> switchProfile(btn.dataset.switchprofile));
  c.querySelectorAll('[data-renameprofile]').forEach(btn=>{
    btn.onclick = ()=>{
      const meta = profiles.list.find(p=>p.id===btn.dataset.renameprofile);
      if(!meta) return;
      const newName = prompt(`Rename profile "${meta.name}" to:`, meta.name);
      if(newName===null) return;
      renameProfile(meta.id, newName);
      render();
    };
  });
  c.querySelectorAll('[data-delprofile]').forEach(btn=>{
    btn.onclick = ()=>{
      const meta = profiles.list.find(p=>p.id===btn.dataset.delprofile);
      if(!meta) return;
      if(confirm(`Delete profile "${meta.name}" and all of its data? This cannot be undone.`)){
        deleteProfile(meta.id);
      }
    };
  });

  c.querySelectorAll('[data-addcat]').forEach(btn=>{
    btn.onclick = ()=>{
      const t = btn.dataset.addcat;
      const inp = document.getElementById(`newCat-${t}`);
      const val = inp.value.trim();
      if(!val) return;
      if(state.categories[t].includes(val)){ toast('That category already exists.'); return; }
      state.categories[t].push(val);
      saveState(); render();
    };
  });
  c.querySelectorAll('[data-editcat]').forEach(btn=>{
    btn.onclick = ()=>{
      const [t, cat] = btn.dataset.editcat.split('|||');
      const newName = prompt(`Rename "${cat}" to:`, cat);
      if(newName===null) return;
      renameCategory(t, cat, newName);
    };
  });
  c.querySelectorAll('[data-rmcat]').forEach(btn=>{
    btn.onclick = ()=>{
      const [t, cat] = btn.dataset.rmcat.split('|||');
      if(confirm(`Remove "${cat}" from ${t}? Existing transactions/planning entries referencing it will remain but won't appear in new dropdowns.`)){
        state.categories[t] = state.categories[t].filter(x=>x!==cat);
        if(t==='Expenses'){
          state.settings.weeklyExcludedCategories = (state.settings.weeklyExcludedCategories||[]).filter(c=>c!==cat);
        }
        state.settings.excludedFromSummary = (state.settings.excludedFromSummary||[]).filter(k=>k!==`${t}|||${cat}`);
        saveState(); render();
      }
    };
  });
  c.querySelectorAll('[data-moveup]').forEach(btn=>{
    btn.onclick = ()=>{ const [t,cat] = btn.dataset.moveup.split('|||'); moveCategory(t, cat, -1); };
  });
  c.querySelectorAll('[data-movedown]').forEach(btn=>{
    btn.onclick = ()=>{ const [t,cat] = btn.dataset.movedown.split('|||'); moveCategory(t, cat, 1); };
  });
  c.querySelectorAll('[data-togglespecial]').forEach(btn=>{
    btn.onclick = ()=>{ const [t,cat] = btn.dataset.togglespecial.split('|||'); toggleCategorySpecial(t, cat); };

  document.getElementById('exportBtn2').onclick = exportBackup;
  document.getElementById('importBtn2').onclick = ()=> document.getElementById('importFile').click();
  document.getElementById('resetBtn').onclick = ()=>{

      if(confirm('Are you absolutely sure? This cannot be undone.')){
        state = defaultState();
        saveState(); render(); toast('This profile has been reset.');
      }
    }
  };
}

/* =========================================================
   BACKUP / RESTORE
========================================================= */
function exportBackup(){
  const meta = profiles.list.find(p=>p.id===profiles.activeId);
  const safeName = (meta ? meta.name : 'profile').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  downloadBlob(blob, `ledger-${safeName}-${isoDate(TODAY)}.json`);
  toast('Backup downloaded.');
}

document.getElementById('exportBtn').onclick = exportBackup;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.categories || !parsed.transactions){ throw new Error('Not a recognized backup file.'); }
      if(confirm('Import will replace all data in the current profile. Continue?')){
        state = {...defaultState(), ...parsed};
        saveState(); render(); toast('Backup imported.');
      }
    }catch(err){
      toast('Could not read that file — is it a Ledger backup?');
      console.error(err);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* =========================================================
   INIT
========================================================= */
if(AUTO_SAVE_SUPPORTED && state.settings.autoSaveEnabled && !autoSaveHandle){
  // The file handle can't survive a page reload — require a conscious re-link
  // rather than silently falling back to downloading a new copy every change.
  state.settings.autoSaveEnabled = false;
}
applyTheme(loadTheme());
renderProfileSwitcher();
renderCloudStatus();
render();
refreshFxRates(false);
</script>
