/* ---- Projection -------------------------------------------------------------
   Semi-annual steps to the retirement year. Each step: every holding grows at its
   own assumed real rate for six months, six months of contributions go in split by
   target weight, then the whole thing is rebalanced back to target — which is what
   the rebalance engine would have you do anyway, and without it the fastest-growing
   holding quietly takes over an allocation you never chose. */
function targetWeights(){
  const inv = investedUnits();
  if(!inv.length) return [];
  const coreT = Math.max(0, Math.min(100, Number(investSettings().coreTarget)||0)) / 100;
  const out = [];
  [['core', coreT], ['satellite', 1-coreT]].forEach(([sleeve, sleeveShare])=>{
    const members = inv.filter(u=> u.sleeve === sleeve);
    if(!members.length) return;
    const wSum = members.reduce((t,u)=> t + (u.targetWeight||0), 0);
    members.forEach(u=>{
      const within = wSum > 0 ? (u.targetWeight||0)/wSum : 1/members.length;
      out.push({ unit:u, sleeve, weight: sleeveShare * within });
    });
  });
  return out;
}

/* The six-month average of savings that actually go into the portfolio. Only
   categories flagged as investing count — a car fund and a holiday fund are both
   Savings, and neither belongs in a projection of the invested sleeves. With
   nothing flagged it falls back to all Savings, and the UI says so. */
function isInvestingCategory(cat){
  return (state.settings.investingCategories||[]).includes('Savings|||' + cat);
}
function toggleInvestingCategory(cat){
  const key = 'Savings|||' + cat;
  const list = new Set(state.settings.investingCategories || []);
  list.has(key) ? list.delete(key) : list.add(key);
  state.settings.investingCategories = [...list];
  saveState(); render();
}

function averageMonthlySavings(){
  const flagged = (state.settings.investingCategories||[]).length > 0;
  const months = completeMonths(6).filter(({year,month})=>{
    const t = trackedTotals(year, month);
    return sumType(t.Expenses) !== 0 || sumType(t.Income) !== 0 || sumType(t.Savings) !== 0;
  });
  if(!months.length) return { value:0, flagged, months:0 };
  const total = months.reduce((sum,{year,month})=>{
    const sav = trackedTotals(year, month).Savings;
    if(!flagged) return sum + sumType(sav);
    return sum + Object.entries(sav).reduce((t,[cat,v])=> t + (isInvestingCategory(cat) ? v : 0), 0);
  }, 0);
  return { value: total/months.length, flagged, months: months.length };
}

/* You type a NOMINAL return — the figure quoted everywhere you'd look one up —
   and inflation is subtracted here to get the real rate the projection runs on.
   Everything else in the app is in today's money, so a nominal projection could
   not be compared against your essentials or your runway. */
function nominalReturn(unit){
  const IS = investSettings();
  if(unit && unit.nominalReturn !== undefined && unit.nominalReturn !== null && unit.nominalReturn !== ''){
    const v = Number(unit.nominalReturn);
    if(isFinite(v)) return v;
  }
  return (Number(IS.baselineReturn)||0) + (Number(IS.inflation)||0);
}

function realReturn(unit){
  return nominalReturn(unit) - (Number(investSettings().inflation)||0);
}

/* The rate actually used, after the ceiling. The cap applies to the real rate,
   since that's what compounds through the projection. */
function assumedReturn(unit){
  const IS = investSettings();
  const cap = Number(IS.returnCap);
  const real = realReturn(unit);
  if(!isFinite(real)) return Number(IS.baselineReturn)||0;
  return isFinite(cap) && cap > 0 ? Math.min(real, cap) : real;
}

/* Returns the path plus the same path with every holding earning the baseline,
   so the UI can show how much of the outcome rests on the per-asset assumptions. */
function projectPortfolio(opts){
  const IS = investSettings();
  const weights = targetWeights();
  if(!weights.length) return null;

  const endYear = Number(IS.retireYear) || 2060;
  const stepsPerYear = 2;
  // Counted in months to the end of the retirement year, so the horizon shortens
  // every month rather than jumping by a whole year each 1 January.
  const monthsLeft = Math.max(0, (endYear - TODAY.getFullYear())*12 + (11 - TODAY.getMonth()));
  const yearsLeft = monthsLeft/12;
  const totalSteps = Math.max(0, Math.round(monthsLeft/6));
  const savingsAvg = averageMonthlySavings();
  const usingAverage = IS.monthlyContribution === null || IS.monthlyContribution === undefined;
  const monthly = usingAverage ? savingsAvg.value : (Number(IS.monthlyContribution)||0);
  const perStep = monthly * (12/stepsPerYear);

  const run = (rateFor)=>{
    let holdings = weights.map(w=> ({ w, value: w.unit.valueAUD }));
    const path = [{ year: TODAY.getFullYear(), value: holdings.reduce((t,h)=>t+h.value,0) }];
    for(let i=1; i<=totalSteps; i++){
      holdings.forEach(h=>{
        const r = rateFor(h.w)/100;
        h.value *= Math.pow(1 + r, 1/stepsPerYear);
      });
      let total = holdings.reduce((t,h)=>t+h.value,0) + perStep;
      // Rebalance: put everything back on target weight, which is also how the
      // contribution gets allocated.
      holdings.forEach(h=>{ h.value = total * h.w.weight; });
      if(i % stepsPerYear === 0 || i === totalSteps){
        path.push({ year: TODAY.getFullYear() + i/stepsPerYear, value: total });
      }
    }
    return path;
  };

  const assumed  = run(w=> assumedReturn(w.unit.unit));
  const baseline = run(()=> Number(IS.baselineReturn)||0);
  const contributed = weights.reduce((t,w)=> t + w.unit.valueAUD, 0) + perStep * totalSteps;

  return {
    endYear, totalSteps, monthly, contributed, yearsLeft, monthsLeft,
    usingAverage, savingsFlagged: savingsAvg.flagged,
    assumed, baseline,
    finalAssumed: assumed[assumed.length-1].value,
    finalBaseline: baseline[baseline.length-1].value,
    weights
  };
}

/* What the invested sleeves were actually worth on a past date, from balance
   history. Only holdings currently tagged core or satellite are counted, so the
   line answers "how has this portfolio grown" rather than "what did I once own". */
function investedValueAsOf(dateISO){
  return investedUnits().reduce((t,u)=> t + toAUD(unitBalanceAsOf(u.unit, dateISO), u.currency), 0);
}

/* The earliest date any invested holding has a figure for. */
function investedHistoryStart(){
  let earliest = null;
  investedUnits().forEach(u=>{
    const dates = [u.unit.openingDate, ...(u.unit.history||[]).map(h=>h.date)].filter(Boolean);
    dates.forEach(d=>{ if(!earliest || d < earliest) earliest = d; });
  });
  return earliest;
}

/* A single chart carrying two different kinds of thing: what happened, and what
   is assumed. They're drawn differently on purpose — solid for recorded history,
   dashed for arithmetic — because the eye should not read them as equally solid. */
function projectionChartSVG(p, toDisplay, unitLabel){
  const W = 720, H = 260, padL = 62, padR = 14, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const startISO = investedHistoryStart();
  const actual = [];
  if(startISO){
    const start = new Date(startISO + 'T00:00:00');
    const months = Math.max(1, Math.round((TODAY - start)/(30.44*86400000)));
    const stepM = Math.max(1, Math.ceil(months/24));   // at most ~24 points
    for(let m=0; m<=months; m+=stepM){
      const d = new Date(start.getFullYear(), start.getMonth()+m, 1);
      if(d > TODAY) break;
      actual.push({ t: d.getFullYear() + d.getMonth()/12, v: toDisplay(investedValueAsOf(isoDate(d))) });
    }
  }
  const nowT = TODAY.getFullYear() + TODAY.getMonth()/12;
  actual.push({ t: nowT, v: toDisplay(p.assumed[0].value) });

  const proj = p.assumed.map(x=> ({ t:x.year, v: toDisplay(x.value) }));
  const base = p.baseline.map(x=> ({ t:x.year, v: toDisplay(x.value) }));

  const allT = [...actual, ...proj].map(x=>x.t);
  const allV = [...actual, ...proj, ...base].map(x=>x.v);
  const t0 = Math.min(...allT), t1 = Math.max(...allT);
  const vMax = Math.max(...allV, 1) * 1.05;
  const X = t=> padL + (t - t0)/((t1-t0)||1) * plotW;
  const Y = v=> padT + plotH - (v/vMax) * plotH;

  const path = pts=> pts.map((pt,i)=> (i?'L':'M') + X(pt.t).toFixed(1) + ' ' + Y(pt.v).toFixed(1)).join(' ');

  // y ticks
  const ticks = 4;
  const short = v=>{
    if(v >= 1e9) return (v/1e9).toFixed(1)+'b';
    if(v >= 1e6) return (v/1e6).toFixed(1)+'m';
    if(v >= 1e3) return Math.round(v/1e3)+'k';
    return Math.round(v);
  };
  let grid = '';
  for(let i=0; i<=ticks; i++){
    const v = vMax*i/ticks, y = Y(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>
      <text x="${padL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-faint)">${short(v)}</text>`;
  }
  let xlab = '';
  const span = t1 - t0;
  const stepY = span > 25 ? 10 : (span > 12 ? 5 : 2);
  for(let yr = Math.ceil(t0); yr <= t1; yr++){
    if(yr % stepY !== 0) continue;
    xlab += `<text x="${X(yr).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--text-faint)">${yr}</text>`;
  }

  const divider = X(nowT);
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" role="img"
       aria-label="Portfolio value: recorded history to now, then projected to ${p.endYear}">
    ${grid}${xlab}
    <line x1="${divider.toFixed(1)}" y1="${padT}" x2="${divider.toFixed(1)}" y2="${padT+plotH}"
          stroke="var(--text-faint)" stroke-width="0.5" stroke-dasharray="3 3"/>
    <text x="${(divider+5).toFixed(1)}" y="${padT+11}" font-size="10" fill="var(--text-faint)">today</text>
    <path d="${path(base)}" fill="none" stroke="var(--text-faint)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75"/>
    <path d="${path(proj)}" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-dasharray="5 4"/>
    ${actual.length>1 ? `<path d="${path(actual)}" fill="none" stroke="var(--green)" stroke-width="2"/>` : ''}
    <circle cx="${X(nowT).toFixed(1)}" cy="${Y(toDisplay(p.assumed[0].value)).toFixed(1)}" r="3" fill="var(--green)"/>
  </svg>
  <div class="chart-key">
    <span><i style="background:var(--green)"></i>Actual (recorded)</span>
    <span><i style="background:var(--gold)"></i>Projected — your assumptions</span>
    <span><i style="background:var(--text-faint)"></i>Projected — everything at baseline</span>
    <span class="muted">${unitLabel}</span>
  </div>`;
}

function projectionSectionHTML(){
  const IS  = investSettings();
  const p   = projectPortfolio();
  if(!p) return '';

  const inv = investedUnits();
  const rate = (state.fxRates && state.fxRates.THB) || null;
  const thb = v=> rate ? v * rate : null;
  const bahtWhole = v=> v===null ? '—' : '฿' + Math.round(v).toLocaleString('en-AU');

  const yearsLeft = p.yearsLeft;
  const growth = p.finalAssumed - p.contributed;
  const wr = Number(IS.withdrawalRate)||4;
  const incomeAUD = p.finalAssumed * wr/100 / 12;

  // Essentials today, for something to measure the projected income against.
  const sp = liquiditySpending();
  const essTHB = thb(sp.essential);

  const capped = inv.filter(u=> realReturn(u.unit) > Number(IS.returnCap));

  const rows = targetWeights().map(w=>{
    const u = w.unit;
    const nom = u.unit.nominalReturn;
    const real = realReturn(u.unit);
    const used = assumedReturn(u.unit);
    const isCapped = real > Number(IS.returnCap);
    const isDefault = nom === undefined || nom === null || nom === '';
    return `<tr>
      <td>${u.subId ? u.unit.name : u.acc.name}<div class="sub">${sleeveLabel(w.sleeve)} · ${(w.weight*100).toFixed(1)}% target</div></td>
      <td class="r">${moneyWhole(u.valueAUD)}</td>
      <td class="r"><input class="reb-weight" type="number" step="0.5" data-assumed="${u.subId?`${u.acc.id}|||${u.subId}`:u.acc.id}"
        value="${isDefault ? '' : nom}" placeholder="${nominalReturn(u.unit).toFixed(1)}"></td>
      <td class="r ${isDefault?'muted':''}">${real.toFixed(1)}%</td>
      <td class="r">${isCapped
        ? `<span class="delta out" title="Above your ${IS.returnCap}% ceiling">${used.toFixed(1)}% ▲</span>`
        : `<span class="muted">${used.toFixed(1)}%</span>`}</td>
    </tr>`;
  }).join('');

  // FX line: the same portfolio, translated at a range of rates.
  const fxRates = rate ? [rate*0.85, rate, rate*1.15] : [];
  const fxCells = fxRates.map((r,i)=>`
    <div class="card metric">
      <h3>${i===0?'Baht weaker for you':i===1?'Rate today':'Baht stronger for you'}</h3>
      <div class="big" style="font-size:19px;${i===1?'color:var(--gold-bright);':''}">฿${Math.round(p.finalAssumed*r).toLocaleString('en-AU')}</div>
      <div class="cap">at ${r.toFixed(1)} THB per AUD</div>
    </div>`).join('');

  return `
    <div class="section-title">Projection to ${p.endYear}</div>
    <div class="muted" style="font-size:12px; margin:-4px 0 10px 0;">
      ${yearsLeft.toFixed(1)} years, contributing ${moneyWhole(p.monthly)} a month${p.usingAverage ? (p.savingsFlagged ? ' (six-month average of your investing categories)' : ' (six-month average of all Savings — flag your investing categories in Settings to narrow it)') : ''},
      rebalanced back to target every six months. Everything is in today's money — assumed returns have ${Number(IS.inflation).toFixed(1)}% inflation taken off,
      so the figures can be compared with what you spend now. This is arithmetic on assumptions, not a forecast.
    </div>

    ${capped.length ? `<div class="liq-banner">${capped.length} holding${capped.length>1?'s have':' has'} a past return above your ${IS.returnCap}% ceiling, so the ceiling is used instead. A single stock's recent run is not a planning assumption — extrapolating it for ${Math.round(yearsLeft)} years would dominate everything else here.</div>` : ''}

    <div class="row" style="margin-bottom:14px;">
      <div class="card metric">
        <h3>Projected at ${p.endYear}</h3>
        <div class="big" style="color:var(--gold-bright);">${bahtWhole(thb(p.finalAssumed))}</div>
        <div class="cap">${moneyWhole(p.finalAssumed)} AUD</div>
      </div>
      <div class="card metric">
        <h3>If everything earned ${IS.baselineReturn}%</h3>
        <div class="big">${bahtWhole(thb(p.finalBaseline))}</div>
        <div class="cap">${p.finalAssumed>=p.finalBaseline?'+':''}${moneyWhole(p.finalAssumed-p.finalBaseline)} from your assumptions</div>
      </div>
      <div class="card metric">
        <h3>Of which you contributed</h3>
        <div class="big">${bahtWhole(thb(p.contributed))}</div>
        <div class="cap">${moneyWhole(growth)} is projected growth</div>
      </div>
      <div class="card metric">
        <h3>Monthly income at ${wr}%</h3>
        <div class="big">${bahtWhole(thb(incomeAUD))}</div>
        <div class="cap">${essTHB!==null&&sp.essential>0 ? `essentials today ${bahtWhole(essTHB)}` : 'set essential categories to compare'}</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px;">
      ${projectionChartSVG(p, v=> rate ? v*rate : v, rate ? 'THB' : 'AUD')}
    </div>

    <div class="section-title" style="font-size:15px;">Exchange rate risk</div>
    <div class="muted" style="font-size:12px; margin:-4px 0 10px 0;">The same portfolio, translated at ±15%. Nothing about the investments changes between these three — only the rate. This is the currency mismatch on the Liquidity tab expressed as an amount of actual retirement.</div>
    <div class="row" style="margin-bottom:14px;">${rate ? fxCells : '<div class="muted" style="font-size:12.5px;">No THB rate loaded.</div>'}</div>

    <div class="section-title" style="font-size:15px;">Assumed returns</div>
    <div class="card">
      <div class="toolbar" style="margin:0 0 12px 0;">
        <div class="liq-basis"><span>Ceiling on real return</span>
          <input type="number" id="projCap" step="1" min="0" max="50" value="${IS.returnCap}" style="width:56px;"> <span>%</span></div>
        <div class="liq-basis"><span>Inflation</span>
          <input type="number" id="projInf" step="0.5" min="0" max="20" value="${IS.inflation}" style="width:56px;"> <span>%</span></div>
        <div class="spacer"></div>
      </div>
      <table class="reb">
        <thead><tr><th>Holding</th><th class="r">Value</th><th class="r">Nominal you enter</th><th class="r">Real (after ${Number(IS.inflation).toFixed(1)}% inflation)</th><th class="r">Used</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="liq-note">Enter the return you'd find quoted for each holding — that figure is nominal, before inflation. The real column is worked out for you by subtracting the inflation rate above, and that is what compounds through the projection. Leave a row blank to use the baseline. A real rate above your ceiling is reduced to the ceiling and marked ▲.</div>
    </div>`;
}

/* =========================================================
   INVESTMENT ANALYTICS
   Everything here reads the tagged history entries written by applyPriceUpdate:
   contribution (money you put in), dividend (income the holding produced),
   revaluation (price movement) and adjustment (reconciliation). Because those
   are separated at the point of entry, cost basis and profit fall out of the
   data instead of being estimated.
========================================================= */
const INVEST_COLOURS = ['#c9a227','#52a97d','#5b8bc9','#d98b3d','#a97dd9','#d9695f','#4fb3a5','#b8b04a'];

function investDisplayCurrency(){
  const c = state.ui.investCur;
  return ['USD','AUD','THB'].includes(c) ? c : 'USD';
}
/* Values are held in each holding's own currency; AUD is the common ground, so
   everything routes through it before being shown in whatever you've picked. */
function fromAUD(amountAUD, currency){
  if(!currency || currency === 'AUD') return amountAUD;
  const rate = state.fxRates && state.fxRates[currency];
  return rate ? amountAUD * rate : amountAUD;
}
function investMoney(amountAUD, decimals){
  const cur = investDisplayCurrency();
  return moneyCur(fromAUD(amountAUD, cur), cur, decimals === undefined ? 0 : decimals);
}

/* ---- Cost basis -------------------------------------------------------------
   Cost is now a stored figure built from recorded orders rather than inferred by
   comparing unit counts between stocktakes. It matters because what you PAY and
   what the stock is WORTH differ by the fee: buy $74.21 of IAU for $74.33 and the
   12c gap is a permanent drag that should show in the return, not vanish.

   unit.lots = [{date, units, price, commission, vat, total}]   purchases
   unit.divs = [{date, amount, units}]                          dividends
   unit.openingCost                                             pre-order basis  */
function unitLots(unit){ return Array.isArray(unit.lots) ? unit.lots : []; }
function unitDivs(unit){ return Array.isArray(unit.divs) ? unit.divs : []; }

function lotTotal(lot){
  const gross = (Number(lot.units)||0) * (Number(lot.price)||0);
  return gross + (Number(lot.commission)||0) + (Number(lot.vat)||0);
}
function lotFees(lot){ return (Number(lot.commission)||0) + (Number(lot.vat)||0); }

/* Everything up to a date, in the holding's own currency. */
function costBasisAsOf(unit, uptoISO){
  let cost = Number(unit.openingCost) || 0;
  let units = Number(unit.openingUnits) || 0;
  let fees = 0, divCash = 0, divUnits = 0, divTotal = 0;
  unitLots(unit).forEach(l=>{
    if(uptoISO && l.date > uptoISO) return;
    cost += lotTotal(l);
    units += Number(l.units) || 0;
    fees += lotFees(l);
  });
  unitDivs(unit).forEach(d=>{
    if(uptoISO && d.date > uptoISO) return;
    const amt = Number(d.amount) || 0;
    divTotal += amt;
    // Units from a dividend cost you nothing — they must not raise the basis.
    if(Number(d.units) > 0) units += Number(d.units); else divCash += amt;
    if(Number(d.units) > 0) divUnits += Number(d.units);
  });
  return { cost, units, fees, dividends: divTotal, dividendCash: divCash, dividendUnits: divUnits };
}

function hasOrderData(unit){ return unitLots(unit).length > 0 || unitDivs(unit).length > 0; }

function historyTotals(unit, uptoISO){
  let contributed = 0, dividends = 0, revaluation = 0;
  const opening = Number(unit.openingBalance) || 0;
  if(!uptoISO || (unit.openingDate || '0000-00-00') <= uptoISO) contributed += opening;
  (unit.history||[]).forEach(h=>{
    if(uptoISO && h.date > uptoISO) return;
    const d = Number(h.delta) || 0;
    if(h.kind === 'revaluation') revaluation += d;
    else if(h.kind === 'dividend') dividends += (h.amount !== undefined ? Number(h.amount) : d);
    else contributed += d;
  });
  return { contributed, dividends, revaluation };
}

/* One row per holding, all figures in AUD for the caller to convert. */
function investmentRows(){
  const today = isoDate(TODAY);
  const units = investedUnits();
  const rows = units.map((u,i)=>{
    // Recorded orders are exact; the inferred history is the fallback for holdings
    // that pre-date order recording.
    const useLots = hasOrderData(u.unit);
    const cb = costBasisAsOf(u.unit, today);
    const t = historyTotals(u.unit, today);
    const cost = toAUD(useLots ? cb.cost : t.contributed, u.currency);
    const value = u.valueAUD;
    const realised = toAUD(useLots ? cb.dividends : t.dividends, u.currency);
    const unrealised = useLots ? (value - cost) : toAUD(t.revaluation, u.currency);
    const fees = toAUD(useLots ? cb.fees : 0, u.currency);
    return {
      key: u.subId ? `${u.acc.id}|||${u.subId}` : u.acc.id,
      name: u.subId ? u.unit.name : u.acc.name,
      sleeve: u.sleeve, colour: INVEST_COLOURS[i % INVEST_COLOURS.length],
      cost, value, unrealised, realised, fees, useLots,
      totalReturn: unrealised + realised,
      pnlPct: cost > 0 ? (unrealised + realised)/cost*100 : null
    };
  });
  const totalCost = rows.reduce((t,r)=>t+r.cost,0);
  const totalValue = rows.reduce((t,r)=>t+r.value,0);
  rows.forEach(r=>{
    r.allocPct = totalCost > 0 ? r.cost/totalCost*100 : 0;      // by money invested
    r.marketPct = totalValue > 0 ? r.value/totalValue*100 : 0;  // by what it's worth now
  });
  return { rows, totalCost, totalValue,
           totalUnrealised: rows.reduce((t,r)=>t+r.unrealised,0),
           totalRealised: rows.reduce((t,r)=>t+r.realised,0),
           totalFees: rows.reduce((t,r)=>t+r.fees,0),
           anyLots: rows.some(r=>r.useLots) };
}

/* Month-end buckets from the first recorded history to now. */
function investMonthlySeries(){
  const units = investedUnits();
  if(!units.length) return { months: [], rows: [] };
  let earliest = null;
  units.forEach(u=>{
    const ds = [u.unit.openingDate, ...(u.unit.history||[]).map(h=>h.date)].filter(Boolean);
    ds.forEach(d=>{ if(!earliest || d < earliest) earliest = d; });
  });
  if(!earliest) return { months: [], rows: [] };

  const months = [];
  let y = Number(earliest.slice(0,4)), m = Number(earliest.slice(5,7)) - 1;
  while(y < TODAY.getFullYear() || (y === TODAY.getFullYear() && m <= TODAY.getMonth())){
    const end = new Date(y, m+1, 0);
    months.push({ key: `${y}-${String(m+1).padStart(2,'0')}`, endISO: isoDate(end), y, m });
    m++; if(m > 11){ m = 0; y++; }
    if(months.length > 600) break;
  }

  const rows = units.map((u,i)=>{
    let prev = { contributed:0, dividends:0, revaluation:0 };
    const useLots = hasOrderData(u.unit);
    const series = months.map(mo=>{
      const cum = useLots
        ? (()=>{ const cb = costBasisAsOf(u.unit, mo.endISO);
                 return { contributed: cb.cost, dividends: cb.dividends }; })()
        : historyTotals(u.unit, mo.endISO);
      const point = {
        monthContribution: toAUD(cum.contributed - prev.contributed, u.currency),
        monthDividend:     toAUD(cum.dividends   - prev.dividends,   u.currency),
        cumContribution:   toAUD(cum.contributed, u.currency),
        value:             toAUD(unitBalanceAsOf(u.unit, mo.endISO), u.currency)
      };
      point.unrealised = useLots
        ? point.value - point.cumContribution
        : point.value - point.cumContribution - toAUD(cum.dividends, u.currency);
      prev = cum;
      return point;
    });
    return { name: u.subId ? u.unit.name : u.acc.name,
             colour: INVEST_COLOURS[i % INVEST_COLOURS.length], series };
  });
  return { months, rows };
}

/* ---- Chart helpers ---------------------------------------------------------
   Deliberately plain SVG: no library, no interactivity beyond a title tooltip.
   Both helpers take values already converted to the display currency. */
function investBarChart(items, opts){
  const o = opts || {};
  const W = 700, H = 220, padL = 66, padR = 12, padT = 12, padB = 46;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  if(!items.length) return '<div class="muted" style="font-size:12.5px;">Nothing to show yet.</div>';
  const vals = items.map(i=>i.value);
  if(vals.every(v=> Math.abs(v) < 0.005))
    return '<div class="muted" style="font-size:12.5px; padding:12px 0;">Nothing to plot yet — every figure here is zero. This fills in once prices move or dividends arrive.</div>';
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  const span = (max - min) || 1;
  const Y = v=> padT + plotH - ((v-min)/span)*plotH;
  const zeroY = Y(0);
  const bw = plotW/items.length;
  // Rounding to whole numbers makes a chart of small values render as a stack of
  // identical "0" labels. Pick the precision from the range being drawn.
  const dp = span >= 100 ? 0 : span >= 10 ? 1 : span >= 1 ? 2 : 3;
  const short = v=> Math.abs(v)>=1e6 ? (v/1e6).toFixed(1)+'m'
                  : Math.abs(v)>=1e3 ? Math.round(v/1e3)+'k'
                  : v.toFixed(dp);

  let grid = '';
  for(let i=0;i<=4;i++){
    const v = min + span*i/4, y = Y(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>
      <text x="${padL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-faint)">${short(v)}</text>`;
  }
  const bars = items.map((it,i)=>{
    const x = padL + i*bw + bw*0.18, w = bw*0.64;
    const y = it.value >= 0 ? Y(it.value) : zeroY;
    const h = Math.max(1, Math.abs(Y(it.value) - zeroY));
    const fill = it.colour || (it.value >= 0 ? 'var(--green)' : 'var(--red)');
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" rx="2">
        <title>${it.label}: ${o.fmt ? o.fmt(it.value) : it.value}</title></rect>
      <text x="${(x+w/2).toFixed(1)}" y="${H-26}" text-anchor="middle" font-size="10" fill="var(--text-dim)">${it.label}</text>
      <text x="${(x+w/2).toFixed(1)}" y="${H-13}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${o.fmt ? o.fmt(it.value) : ''}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" role="img" aria-label="${o.aria||''}">
    ${grid}<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--text-faint)" stroke-width="0.8"/>${bars}</svg>`;
}

/* Stacked bars. Pass percent:true to normalise each column to 100%. */
function investStackedChart(labels, series, opts){
  const o = opts || {};
  const W = 700, H = 240, padL = 66, padR = 12, padT = 12, padB = 34;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  if(!labels.length || !series.length) return '<div class="muted" style="font-size:12.5px;">Nothing to show yet.</div>';

  const colTotals = labels.map((_,i)=> series.reduce((t,s)=> t + Math.max(0, s.values[i]||0), 0));
  const max = o.percent ? 100 : Math.max(1, ...colTotals);
  const Y = v=> padT + plotH - (v/max)*plotH;
  const bw = plotW/labels.length;
  const sdp = max >= 100 ? 0 : max >= 10 ? 1 : max >= 1 ? 2 : 3;
  const short = v=> o.percent ? v+'%'
                  : (Math.abs(v)>=1e6 ? (v/1e6).toFixed(1)+'m'
                  : Math.abs(v)>=1e3 ? Math.round(v/1e3)+'k'
                  : v.toFixed(sdp));

  let grid = '';
  for(let i=0;i<=4;i++){
    const v = max*i/4, y = Y(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>
      <text x="${padL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-faint)">${short(v)}</text>`;
  }

  let cols = '';
  labels.forEach((lab,i)=>{
    const total = colTotals[i];
    let acc = 0;
    const x = padL + i*bw + bw*0.15, w = bw*0.7;
    series.forEach(sr=>{
      const raw = Math.max(0, sr.values[i]||0);
      if(raw <= 0) return;
      const v = o.percent ? (total>0 ? raw/total*100 : 0) : raw;
      const y0 = Y(acc+v), y1 = Y(acc);
      acc += v;
      cols += `<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0.5,y1-y0).toFixed(1)}" fill="${sr.colour}">
        <title>${lab} · ${sr.name}: ${o.fmt ? o.fmt(raw) : raw}${o.percent&&total>0?` (${(raw/total*100).toFixed(1)}%)`:''}</title></rect>`;
    });
  });

  // Label every nth column so they stay legible on long histories
  const step = Math.ceil(labels.length/12);
  let xlab = '';
  labels.forEach((lab,i)=>{
    if(i % step !== 0) return;
    xlab += `<text x="${(padL + i*bw + bw/2).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${lab}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" role="img" aria-label="${o.aria||''}">
    ${grid}${cols}${xlab}</svg>`;
}

function investLegend(series){
  return `<div class="chart-key">${series.map(sr=>
    `<span><i style="background:${sr.colour}"></i>${sr.name}</span>`).join('')}</div>`;
}

/* Wiring for the Core & satellite and Projection blocks. They used to live on the
   Net Worth tab and now sit under Investments, so the handlers travel with them
   rather than being tied to whichever tab happened to render them first. */
function wireInvestingSection(c){
  const unitByKey = key=>{
    const [accId, subId] = key.split('|||');
    const acc = state.accounts.find(a=> a.id === accId);
    if(!acc) return null;
    return subId ? (acc.subCategories||[]).find(x=> x.id === subId) : acc;
  };
  c.querySelectorAll('[data-weight]').forEach(inp=>{
    inp.onchange = ()=>{
      const u = unitByKey(inp.dataset.weight); if(!u) return;
      const v = inp.value === '' ? null : Math.max(0, Math.min(100, Number(inp.value)||0));
      if(v === null) delete u.targetWeight; else u.targetWeight = v;
      saveState(); render();
    };
  });
  c.querySelectorAll('[data-assumed]').forEach(inp=>{
    inp.onchange = ()=>{
      const u = unitByKey(inp.dataset.assumed); if(!u) return;
      if(inp.value === '') delete u.nominalReturn;
      else u.nominalReturn = Number(inp.value)||0;
      saveState(); render();
    };
  });
  const bind = (id, fn, ev)=>{ const el = document.getElementById(id); if(el) el[ev||'onclick'] = fn; };
  bind('updatePricesBtn', ()=> openPriceModal());
  bind('recordBuyBtn',    ()=> openPurchaseModal());
  bind('recordDivBtn',    ()=> openDividendModal());
  bind('rebScope', function(){ investSettings().scope = this.value; saveState(); render(); }, 'onchange');
  bind('rebContribution', function(){
    investSettings().contribution = Math.max(0, Number(this.value)||0); saveState(); render();
  }, 'onchange');
  bind('rebCoreTarget', function(){
    investSettings().coreTarget = Math.max(0, Math.min(100, Number(this.value)||0)); saveState(); render();
  }, 'onchange');
  const projField = (id, apply)=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{ apply(Number(el.value)||0); saveState(); render(); };
  };
  projField('projCap', v=> investSettings().returnCap = Math.max(0, v));
  projField('projInf', v=> investSettings().inflation = Math.max(0, v));
}

function investingSectionHTML(){
  const inv = investedUnits();
  if(!inv.length){
    return `
      <div class="section-title">Core &amp; satellite</div>
      <div class="card">
        <div class="muted" style="font-size:12.5px;">
          Tag a holding as Core or Satellite above and this section will track the split, flag drift,
          and work out where your next contribution should go.
        </div>
      </div>`;
  }

  const IS    = investSettings();
  const scope = ['whole','core','satellite'].includes(IS.scope) ? IS.scope : 'whole';
  const plan  = rebalancePlan(scope, IS.contribution);
  const band  = Number(IS.driftBand) || 5;
  const split = contributionSplit(inv);
  const stale = stalePricedUnits();
  const buckets = rebalanceBuckets(scope);

  const scopeEmpty = !plan.rows.length;
  // Being under target is not "good" and over target is not "bad" — both are drift.
  // Inside the band is grey, outside is amber, regardless of direction.
  const driftClass = d=> Math.abs(d) <= band ? 'flat' : 'out';
  const pp = d=> (d>0?'+':'') + d.toFixed(1) + 'pp';

  const rowsHTML = plan.rows.map(r=>`
    <tr>
      <td>${r.name}</td>
      <td class="r">${moneyWhole(r.value)}</td>
      <td class="r">${r.currentPct.toFixed(1)}%</td>
      ${scope==='whole'
        ? `<td class="r muted">${r.target.toFixed(1)}%</td>`
        : `<td class="r"><input class="reb-weight" type="number" step="1" min="0" max="100" data-weight="${r.key}"
             value="${r.rawWeight !== null && r.rawWeight !== undefined ? r.rawWeight : ''}" placeholder="—"> <span class="muted">%</span></td>`}
      <td class="r"><span class="delta ${driftClass(r.driftPp)}">${pp(r.driftPp)}</span></td>
      ${plan.contribution > 0
        ? `<td class="r">${r.allocate > 0.5 ? moneyWhole(r.allocate) : '—'}</td>
           <td class="r"><span class="delta ${driftClass(r.afterDriftPp)}">${pp(r.afterDriftPp)}</span></td>`
        : `<td class="r">${Math.abs(r.trade) < 1 ? '—' : (r.trade > 0 ? 'buy ' : 'sell ') + moneyWhole(Math.abs(r.trade))}</td>`}
    </tr>`).join('');

  const withinBand = plan.worstDrift !== undefined && plan.worstDrift <= band;
  const fixedByContribution = plan.contribution > 0 && plan.worstAfter <= band;

  let verdict;
  if(scopeEmpty) verdict = '';
  else if(withinBand) verdict = `Everything is within your ${band}pp band. Nothing to do.`;
  else if(plan.contribution > 0 && fixedByContribution)
    verdict = `Contributing ${moneyWhole(plan.contribution)} as split above brings every holding back inside the ${band}pp band — no selling, so no capital gains event.`;
  else if(plan.contribution > 0)
    verdict = `Even after ${moneyWhole(plan.contribution)}, the worst drift is ${plan.worstAfter.toFixed(1)}pp — still outside your ${band}pp band. Either contribute more, keep directing contributions this way for a few months, or sell to rebalance outright.`;
  else
    verdict = `Worst drift is ${plan.worstDrift.toFixed(1)}pp against a ${band}pp band. Enter what you're about to invest and this will try to fix it with new money first, since selling triggers capital gains.`;

  let weightWarn = '';
  if(scope !== 'whole'){
    if(buckets.weightsSet === false){
      weightWarn = `<div class="liq-banner" style="margin-top:12px;">No target weights set inside ${sleeveLabel(scope)}, so an equal split is assumed. Type a target % against each holding above.</div>`;
    } else {
      const raw = buckets.buckets.reduce((t,b)=> t + (b.rawWeight||0), 0);
      if(Math.abs(raw - 100) > 0.5){
        weightWarn = `<div class="liq-banner" style="margin-top:12px;">Your weights add up to ${raw.toFixed(0)}%, not 100%. They're being scaled to 100% so the comparison still works — the Target column shows the scaled figures.</div>`;
      }
    }
  }

  return `
    <div class="section-title" style="margin-top:26px;">Core &amp; satellite <span class="muted" style="font-size:13px;">— rebalancing, all values in AUD</span></div>
    ${stale.length ? `<div class="fx-alert" style="color:var(--amber); border-color:rgba(217,139,61,0.45); background:rgba(217,139,61,0.09);">
      <div><b>${stale.length} holding${stale.length>1?'s have':' has'} a stale price.</b>
      ${stale.slice(0,3).map(x=> `${x.name} (${x.days===null?'never':x.days+'d'})`).join(', ')}${stale.length>3?` and ${stale.length-3} more`:''}.
      Values, drift and your runway are all based on these.</div>
      <div class="fx-alert-actions"><button class="btn secondary" id="updatePricesBtn">Update prices</button></div>
    </div>` : ''}

    <div class="row" style="margin-bottom:14px;">
      <div class="card metric">
        <h3>Invested value</h3>
        <div class="big" style="color:var(--gold-bright);">${moneyWhole(split.value)}</div>
        <div class="cap">${inv.length} holding${inv.length>1?'s':''} across both sleeves</div>
      </div>
      <div class="card metric">
        <h3>You put in</h3>
        <div class="big">${moneyWhole(split.contributed)}</div>
        <div class="cap">contributions and opening balances</div>
      </div>
      <div class="card metric">
        <h3>The market gave you</h3>
        <div class="big" style="color:${split.gained>=0?'var(--green)':'var(--red)'};">${split.gained>=0?'+':''}${moneyWhole(split.gained)}</div>
        <div class="cap">${split.returnPct===null?'—':`${split.returnPct>=0?'+':''}${split.returnPct.toFixed(1)}% on what you contributed`}</div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar" style="margin:0 0 14px 0;">
        <div class="liq-basis">
          <span>Rebalance</span>
          <select id="rebScope" style="width:auto;">
            <option value="whole" ${scope==='whole'?'selected':''}>Whole portfolio — core vs satellite</option>
            <option value="core" ${scope==='core'?'selected':''}>Within core only</option>
            <option value="satellite" ${scope==='satellite'?'selected':''}>Within satellite only</option>
          </select>
        </div>
        ${scope==='whole' ? `<div class="liq-basis"><span>Core target</span>
          <input type="number" id="rebCoreTarget" step="5" min="0" max="100" value="${IS.coreTarget}" style="width:64px;"> <span>%</span></div>` : ''}
        <div class="liq-basis"><span>About to invest</span>
          <input type="number" id="rebContribution" step="100" min="0" value="${IS.contribution||0}" style="width:96px;"></div>
        <div class="spacer"></div>
        <button class="btn secondary" id="recordBuyBtn">Record purchase</button>
        <button class="btn secondary" id="recordDivBtn">Record dividend</button>
        <button class="btn secondary" id="updatePricesBtn">Update prices</button>
      </div>

      ${scopeEmpty
        ? `<div class="muted" style="font-size:12.5px;">Nothing tagged as ${sleeveLabel(scope)} yet.</div>`
        : `<table class="reb">
        <thead>
          <tr>
            <th>${scope==='whole'?'Sleeve':'Holding'}</th>
            <th class="r">Value</th><th class="r">Now</th><th class="r">Target${scope!=='whole'?' %':''}</th><th class="r">Drift</th>
            ${plan.contribution>0 ? '<th class="r">Put in</th><th class="r">After</th>' : '<th class="r">To rebalance</th>'}
          </tr>
        </thead>
        <tbody>${rowsHTML}</tbody>
      </table>
      <div class="liq-note">${verdict}</div>`}
      ${weightWarn}
    </div>
    ${projectionSectionHTML()}`;
}

function openQuoteKeyModal(onDone){
  const root = document.getElementById('modalRoot');
  const prev = root.innerHTML;            // the price screen, to restore afterwards
  const cur = quoteToken();
  const synced = quoteTokenSynced();
  root.innerHTML = `
    <div class="modal-backdrop" id="kb">
      <div class="modal" style="max-width:520px;">
        <h2>Price API key</h2>
        <div class="page-sub">Only needed if the keyless source is blocked in your browser. A free Finnhub key works; it is read-only market data, rate limited, and can be regenerated at any time.</div>
        <label class="field">Key <input type="text" id="qkVal" value="${cur.replace(/"/g,'&quot;')}" placeholder="paste key, or leave blank to remove"></label>
        <div class="form-grid" style="margin-top:10px;">
          <label class="field" style="flex-direction:row; align-items:flex-start; gap:9px;">
            <input type="checkbox" id="qkSync" ${synced?'checked':''} style="width:16px; height:16px; margin-top:2px; flex:none;">
            <span style="font-size:12.5px; line-height:1.5;">Sync this key to my other devices<br>
              <span class="muted" style="font-size:11.5px;">Stores it with your data, so it travels through Firestore to your phone and iPad. Your data is private to your account and is not in the public repository. Leave unticked to keep the key in this browser only.</span>
            </span>
          </label>
        </div>
        <div class="muted" style="font-size:11.5px; margin-top:10px; line-height:1.5;">
          Either way, the key is removed from downloaded backups — those are files you might send somewhere.
        </div>
        <div class="form-actions">
          <button class="btn secondary" id="qkCancel">Cancel</button>
          <button class="btn" id="qkSave">Save key</button>
        </div>
      </div>
    </div>
  `;
  const back = ()=>{ root.innerHTML = prev; };
  document.getElementById('qkCancel').onclick = back;
  document.getElementById('kb').addEventListener('click', e=>{ if(e.target.id==='kb') back(); });
  document.getElementById('qkSave').onclick = ()=>{
    const v = document.getElementById('qkVal').value.trim();
    const sync = document.getElementById('qkSync').checked;
    setQuoteToken(v, sync);
    back();
    if(onDone) onDone();
    toast(!v ? 'API key removed.' : (sync ? 'API key saved and will sync to your other devices.' : 'API key saved on this device only.'));
  };
}

/* A confirm() dialog says "Delete this account?" and gives no way to tell which
   account or what goes with it. This names the thing, lists what's attached, and
   puts the destructive action on the right in red — so a stray tap on the wrong
   row is caught by reading, not by luck. */
function confirmDestructive(opts){
  const root = document.getElementById('modalRoot');
  const prev = root.innerHTML;
  root.innerHTML = `
    <div class="modal-backdrop" id="cdb">
      <div class="modal" style="max-width:440px;">
        <h2>${opts.title}</h2>
        <div style="font-size:15px; margin:2px 0 10px 0;">${opts.what}</div>
        ${opts.lines && opts.lines.length ? `<ul class="confirm-list">${opts.lines.map(l=>`<li>${l}</li>`).join('')}</ul>` : ''}
        <div class="muted" style="font-size:12px; margin-top:12px; line-height:1.5;">This can't be undone from here, but a restore point is saved first — Settings → Restore points.</div>
        <div class="form-actions">
          <button class="btn secondary" id="cdCancel">Cancel</button>
          <button class="btn danger" id="cdGo">${opts.confirmLabel || 'Delete'}</button>
        </div>
      </div>
    </div>
  `;
  const close = ()=>{ root.innerHTML = prev; };
  document.getElementById('cdCancel').onclick = close;
  document.getElementById('cdb').addEventListener('click', e=>{ if(e.target.id==='cdb') close(); });
  document.getElementById('cdGo').onclick = ()=>{ close(); opts.onConfirm(); };
}

/* Record one monthly buy across every holding. Laid out to match the Dime order
   screen field for field — shares, executed price, commission, VAT — so the
   numbers can be copied across without any mental arithmetic. The computed total
   is shown back so a typo is caught against the figure on the phone. */
function openPurchaseModal(){
  const rows = allUnits().filter(u=> accountSleeve(u.acc));
  const root = document.getElementById('modalRoot');
  if(!rows.length){ toast('Tag an account as Core or Satellite first.'); return; }

  root.innerHTML = `
    <div class="modal-backdrop" id="pb">
      <div class="modal price-modal">
        <h2>Record purchase</h2>
        <div class="page-sub">Copy the figures from each Dime order. Leave a row blank to skip it. The total is what actually left your account, fees included — that is what becomes your cost.</div>
        <label class="field" style="max-width:200px;">Date
          <input type="date" id="buyDate" value="${isoDate(TODAY)}" min="1970-01-01" max="2200-12-31">
        </label>
        <div class="price-scroll">
        <table class="price-grid">
          <thead><tr><th>Holding</th><th class="r">Shares</th><th class="r">Executed price</th><th class="r">Commission</th><th class="r">VAT</th><th class="r">Total</th></tr></thead>
          <tbody>
            ${rows.map((u,i)=>`
              <tr>
                <td class="hold"><div class="hn">${u.unit.name || u.acc.name}</div>
                  <div class="sub">${u.subId ? u.acc.name + ' · ' : ''}${u.currency}</div></td>
                <td class="r"><input type="number" step="any" min="0" id="bu${i}" placeholder="—"></td>
                <td class="r"><input type="number" step="any" min="0" id="bp${i}" placeholder="—"></td>
                <td class="r"><input type="number" step="any" min="0" id="bc${i}" placeholder="0"></td>
                <td class="r"><input type="number" step="any" min="0" id="bv${i}" placeholder="0"></td>
                <td class="r val" id="bt${i}">—</td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
        <div class="liq-note" id="buySummary">Nothing entered yet.</div>
        <div class="form-actions">
          <button class="btn secondary" id="buyCancel">Cancel</button>
          <button class="btn" id="buySave">Save purchase</button>
        </div>
      </div>
    </div>`;

  const close = ()=> root.innerHTML='';
  document.getElementById('buyCancel').onclick = close;
  document.getElementById('pb').addEventListener('click', e=>{ if(e.target.id==='pb') close(); });

  const num = id=> Number(document.getElementById(id).value) || 0;
  const recalc = ()=>{
    let grand = 0, feeTotal = 0, n = 0;
    rows.forEach((u,i)=>{
      const units = num('bu'+i), price = num('bp'+i);
      const cell = document.getElementById('bt'+i);
      if(units > 0 && price > 0){
        const total = units*price + num('bc'+i) + num('bv'+i);
        cell.textContent = moneyCur(total, u.currency, 2);
        grand += toAUD(total, u.currency);
        feeTotal += toAUD(num('bc'+i) + num('bv'+i), u.currency);
        n++;
      } else cell.textContent = '—';
    });
    document.getElementById('buySummary').textContent = n
      ? `${n} holding${n>1?'s':''} · ${moneyWhole(grand)} total, of which ${moneyCur(feeTotal,'AUD',2)} is fees.`
      : 'Nothing entered yet.';
  };
  rows.forEach((u,i)=> ['bu','bp','bc','bv'].forEach(pre=>{
    document.getElementById(pre+i).oninput = recalc;
  }));

  document.getElementById('buySave').onclick = ()=>{
    const date = document.getElementById('buyDate').value;
    if(!date || !isSaneYear(Number(date.slice(0,4)))){ toast('Check the date.'); return; }
    let n = 0, spent = 0;
    rows.forEach((u,i)=>{
      const units = num('bu'+i), price = num('bp'+i);
      if(!(units > 0 && price > 0)) return;
      const lot = { id: uid(), date, units, price,
                    commission: num('bc'+i), vat: num('bv'+i) };
      lot.total = lotTotal(lot);
      u.unit.lots = unitLots(u.unit).concat([lot]);
      // Opening position: whatever was already there becomes the starting basis,
      // recorded once so earlier holdings aren't lost or double counted.
      if(u.unit.openingCost === undefined){
        const prior = unitBalanceAsOf(u.unit, date);
        u.unit.openingCost = Math.max(0, prior);
        u.unit.openingUnits = Number(u.unit.units) || 0;
      }
      const newUnits = (Number(u.unit.units)||0) + units;
      applyPriceUpdate(u.unit, newUnits, price, date);
      n++; spent += toAUD(lot.total, u.currency);
    });
    if(!n){ toast('Enter shares and a price for at least one holding.'); return; }
    saveState(); close(); render();
    toast(`${n} purchase${n>1?'s':''} recorded — ${moneyWhole(spent)} invested.`);
  };
}

  if(!rows.length){ toast('Tag an account as Core or Satellite first.'); return; }

  root.innerHTML = `
    <div class="modal-backdrop" id="db">
      <div class="modal price-modal">
        <h2>Record dividend</h2>
        <div class="page-sub">Enter what each holding paid. If it was reinvested, put the extra shares in too — those cost you nothing, so they must not raise your cost basis. Leave shares blank for a cash dividend.</div>
        <label class="field" style="max-width:200px;">Date
          <input type="date" id="divDate" value="${isoDate(TODAY)}" min="1970-01-01" max="2200-12-31">
        </label>
        <div class="price-scroll">
        <table class="price-grid">
          <thead><tr><th>Holding</th><th class="r">Amount</th><th class="r">Shares received</th><th class="r">Type</th></tr></thead>
          <tbody>
            ${rows.map((u,i)=>`
              <tr>
                <td class="hold"><div class="hn">${u.unit.name || u.acc.name}</div>
                  <div class="sub">${u.subId ? u.acc.name + ' · ' : ''}${u.currency}</div></td>
                <td class="r"><input type="number" step="any" min="0" id="da${i}" placeholder="—"></td>
                <td class="r"><input type="number" step="any" min="0" id="ds${i}" placeholder="cash"></td>
                <td class="r val muted" id="dt${i}">—</td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
        <div class="form-actions">
          <button class="btn secondary" id="divCancel">Cancel</button>
          <button class="btn" id="divSave">Save dividend</button>
        </div>
      </div>
    </div>`;

  const close = ()=> root.innerHTML='';
  document.getElementById('divCancel').onclick = close;
  document.getElementById('db').addEventListener('click', e=>{ if(e.target.id==='db') close(); });
  const num = id=> Number(document.getElementById(id).value) || 0;
  rows.forEach((u,i)=> ['da','ds'].forEach(pre=>{
    document.getElementById(pre+i).oninput = ()=>{
      const a = num('da'+i), sh = num('ds'+i);
      document.getElementById('dt'+i).textContent = a > 0 ? (sh > 0 ? 'reinvested' : 'cash') : '—';
    };
  }));

  document.getElementById('divSave').onclick = ()=>{
    const date = document.getElementById('divDate').value;
    if(!date || !isSaneYear(Number(date.slice(0,4)))){ toast('Check the date.'); return; }
    let n = 0, total = 0;
    rows.forEach((u,i)=>{
      const amount = num('da'+i);
      if(!(amount > 0)) return;
      const shares = num('ds'+i);
      u.unit.divs = unitDivs(u.unit).concat([{ id: uid(), date, amount, units: shares }]);
      if(u.unit.openingCost === undefined){
        u.unit.openingCost = Math.max(0, unitBalanceAsOf(u.unit, date));
        u.unit.openingUnits = Number(u.unit.units) || 0;
      }
      if(shares > 0 && isPriced(u.unit)){
        applyPriceUpdate(u.unit, (Number(u.unit.units)||0) + shares, Number(u.unit.price), date, amount);
      }
      n++; total += toAUD(amount, u.currency);
    });
    if(!n){ toast('Enter an amount for at least one holding.'); return; }
    saveState(); close(); render();
    toast(`${n} dividend${n>1?'s':''} recorded — ${moneyWhole(total)}.`);
  };
}

function openPriceModal(){
  const rows = allUnits().filter(u=> accountSleeve(u.acc) || isPriced(u.unit));
  const root = document.getElementById('modalRoot');
  if(!rows.length){
    toast('Assign a holding to Core or Satellite first, then prices can be tracked here.');
    return;
  }
  root.innerHTML = `
    <div class="modal-backdrop" id="mb">
      <div class="modal price-modal">
        <h2>Update prices</h2>
        <div class="page-sub">Enter how many units you hold and what one unit is worth. Changing the units records a contribution; changing the price records a gain or loss. Leave a row untouched to skip it.</div>
        <div class="price-scroll">
        <table class="price-grid">
          <thead><tr><th>Holding</th><th>Ticker</th><th class="r">Units</th><th class="r">Price</th><th class="r">Value</th></tr></thead>
          <tbody>
            ${rows.map((u,i)=>{
              const cur = u.currency;
              const bal = unitBalanceAsOf(u.unit, isoDate(TODAY));
              const age = daysSince(u.unit.pricedAt);
              const auto = effectiveTicker(u.unit, u.unit.name);
              return `
              <tr>
                <td class="hold">
                  <div class="hn">${u.unit.name || u.acc.name}</div>
                  <div class="sub" id="pn${i}">${u.subId ? u.acc.name + ' · ' : ''}${cur}${u.unit.pricedAt?` · priced ${age===0?'today':age+'d ago'}`:' · never priced'}</div>
                </td>
                <td><input type="text" id="pt${i}" value="${u.unit.ticker||''}" placeholder="${auto||'—'}" class="ticker-in" title="${auto?`Blank uses “${auto}”, taken from the name`:'No ticker detected from the name'}"></td>
                <td class="r"><input type="number" step="any" min="0" id="pu${i}" value="${isPriced(u.unit)?u.unit.units:''}" placeholder="—"></td>
                <td class="r"><input type="number" step="any" min="0" id="pp${i}" value="${isPriced(u.unit)?u.unit.price:''}" placeholder="—"></td>
                <td class="r val" id="pv${i}">${moneyCur(bal, cur)}<div class="sub" id="ps${i}">${cur!=='AUD'?'≈'+moneyWhole(toAUD(bal,cur)):''}</div></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>
        <div class="muted" style="font-size:11.5px; margin-top:8px; line-height:1.5;">
          Use Record purchase for buys and Record dividend for income — this screen is only for what a share is
          worth today, so it never touches your cost basis.
          Where a holding is already named after its symbol, that name is used as the ticker — the grey
          text in the box shows what will be looked up, so leave it blank unless it's wrong.
          Fetched prices fill the boxes for you to check —
          nothing saves until you press Save. Units are never fetched: buying is your decision, not the market's.
          The fetched price is assumed to be in the holding's own currency.
        </div>
        <div class="form-actions" style="justify-content:space-between;">
          <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn secondary" id="fFetch">Fetch prices</button>
            <button class="btn secondary" id="fKey" title="Set an API key for this device only">${quoteToken()?'Change API key':'Add API key'}</button>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn secondary" id="fCancel">Cancel</button>
            <button class="btn" id="fSave">Save prices</button>
          </div>
        </div>
      </div>
    </div>
  `;
  const close = ()=> root.innerHTML='';
  document.getElementById('fCancel').onclick = close;
  document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') close(); });

  // Live value preview so a typo in the price is obvious before it's saved
  rows.forEach((u,i)=>{
    const recalc = ()=>{
      const un = Number(document.getElementById('pu'+i).value);
      const pr = Number(document.getElementById('pp'+i).value);
      const cell = document.getElementById('pv'+i);
      const val = (un && pr) ? un*pr : unitBalanceAsOf(u.unit, isoDate(TODAY));
      cell.firstChild ? cell.firstChild.nodeValue = moneyCur(val, u.currency) : cell.textContent = moneyCur(val, u.currency);
      const aud = document.getElementById('ps'+i);
      if(aud) aud.textContent = u.currency !== 'AUD' ? '≈'+moneyWhole(toAUD(val, u.currency)) : '';
    };
    document.getElementById('pu'+i).oninput = recalc;
    document.getElementById('pp'+i).oninput = recalc;
  });

  document.getElementById('fKey').onclick = ()=> openQuoteKeyModal(()=>{
    document.getElementById('fKey').textContent = quoteToken() ? 'Change API key' : 'Add API key';
  });

  document.getElementById('fFetch').onclick = async ()=>{
    const btn = document.getElementById('fFetch');
    btn.disabled = true; btn.textContent = 'Fetching…';
    let ok = 0, failed = [];
    for(let i=0; i<rows.length; i++){
      const typed = document.getElementById('pt'+i).value.trim();
      const tick = typed || effectiveTicker(rows[i].unit, rows[i].unit.name);
      const note = document.getElementById('pn'+i);
      if(!tick){ continue; }
      try{
        const q = await fetchQuote(tick);
        document.getElementById('pp'+i).value = q.price;
        document.getElementById('pp'+i).dispatchEvent(new Event('input'));
        note.textContent = `${rows[i].currency} · ${q.price} from ${q.source}`;
        note.style.color = 'var(--green)';
        ok++;
      }catch(e){
        note.textContent = `${rows[i].currency} · could not fetch (${e.message})`;
        note.style.color = 'var(--amber)';
        failed.push(tick);
      }
    }
    btn.disabled = false; btn.textContent = 'Fetch prices';
    if(!ok && failed.length){
      toast(`No prices could be fetched. Free sources block browser requests fairly often — add an API key, or type the prices in.`);
    } else if(ok){
      toast(`${ok} price${ok>1?'s':''} filled in${failed.length?`, ${failed.length} failed`:''}. Check them, then Save.`);
    } else {
      toast('Add a ticker to a holding first.');
    }
  };

  document.getElementById('fSave').onclick = ()=>{
    let changed = 0, contributed = 0, revalued = 0, dividends = 0;
    rows.forEach((u,i)=>{
      // Only store a ticker that was actually typed. Leaving it blank keeps the
      // holding following its own name, so renaming VT to VTI just works.
      const tick = document.getElementById('pt'+i).value.trim();
      if(tick) u.unit.ticker = tick.toUpperCase(); else delete u.unit.ticker;
      const un = document.getElementById('pu'+i).value;
      const pr = document.getElementById('pp'+i).value;
      if(un === '' || pr === '') return;
      const nu = Number(un), np = Number(pr);
      if(!(nu >= 0) || !(np >= 0)) return;
      const dEl = document.getElementById('pd'+i);
      const dVal = dEl ? Number(dEl.value) || 0 : 0;
      if(isPriced(u.unit) && Number(u.unit.units) === nu && Number(u.unit.price) === np && dVal === 0) return;
      const divEl = document.getElementById('pd'+i);
      const div = divEl ? Number(divEl.value) || 0 : 0;
      const entries = applyPriceUpdate(u.unit, nu, np, undefined, div);
      if(entries.length) changed++;
      entries.forEach(e=>{
        const d = toAUD(e.delta, u.currency);
        if(e.kind === 'revaluation') revalued += d;
        else if(e.kind === 'dividend') dividends += d;
        else contributed += d;
      });
    });
    saveState(); close(); render();
    toast(changed
      ? `${changed} holding${changed>1?'s':''} updated — ${moneyWhole(contributed)} in, ${revalued>=0?'+':''}${moneyWhole(revalued)} market movement${dividends>0?`, ${moneyWhole(dividends)} dividends`:''}.`
      : 'Nothing changed.');
  };
}

/* Full history for an account or sub-category: opening balance as the first row,
   then every adjustment in date order, with a running balance and edit/delete per entry. */
function openHistoryModal(accId, subId){
  const acc = state.accounts.find(a=>a.id===accId);
  if(!acc) return;
  const unit = subId ? (acc.subCategories||[]).find(s=>s.id===subId) : acc;
  if(!unit) return;
  const label = subId ? `${acc.name} — ${unit.name}` : acc.name;
  const cur = subId ? (unit.currency||acc.currency) : acc.currency;

  function paint(){
    const root = document.getElementById('modalRoot');
    const histWithIdx = (unit.history||[]).map((h,i)=>({...h, _idx:i}));
    histWithIdx.sort((a,b)=> a.date<b.date ? -1 : (a.date>b.date ? 1 : 0));

    let running = Number(unit.openingBalance)||0;
    const rows = [`
      <tr>
        <td class="muted">${unit.openingDate}</td>
        <td class="num">${moneyCur(unit.openingBalance, cur)}</td>
        <td class="muted" style="font-size:12px;">Opening balance</td>
        <td class="num">${moneyCur(running, cur)}</td>
        <td><button class="icon-btn" style="color:var(--gold);" data-histeditopen title="Edit opening balance">✎</button></td>
      </tr>
    `];
    histWithIdx.forEach(h=>{
      running += Number(h.delta)||0;
      rows.push(`
        <tr>
          <td class="muted">${h.date}</td>
          <td class="num ${h.delta>=0?'pos':'neg'}">${h.delta>=0?'+':''}${moneyCur(h.delta, cur)}</td>
          <td class="muted" style="font-size:12px;">${h.note||''}</td>
          <td class="num">${moneyCur(running, cur)}</td>
          <td>
            <button class="icon-btn" style="color:var(--gold);" data-histedit="${h._idx}" title="Edit">✎</button>
            <button class="icon-btn" data-histdel="${h._idx}" title="Delete">✕</button>
          </td>
        </tr>
      `);
    });

    root.innerHTML = `
      <div class="modal-backdrop" id="mb">
        <div class="modal" style="width:540px;">
          <h2>History — ${label}</h2>
          <div class="page-sub">Newest first. "Balance" is the running total after each entry.</div>
          <div style="max-height:360px; overflow-y:auto;">
            <table class="data">
              <thead><tr><th>Date</th><th class="num">Amount</th><th>Note</th><th class="num">Balance</th><th></th></tr></thead>
              <tbody>${rows.slice().reverse().join('')}</tbody>
            </table>
          </div>
          <div class="form-actions">
            <button class="btn secondary" id="fClose">Close</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('fClose').onclick = ()=> root.innerHTML='';
    document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') root.innerHTML=''; });

    const openEditBtn = root.querySelector('[data-histeditopen]');
    if(openEditBtn) openEditBtn.onclick = ()=>{
      const newAmt = prompt(`Opening balance (in ${cur}):`, unit.openingBalance);
      if(newAmt===null) return;
      const newDate = prompt('Opening date (YYYY-MM-DD):', unit.openingDate);
      if(newDate===null) return;
      unit.openingBalance = Number(newAmt)||0;
      if(newDate.trim()) unit.openingDate = newDate.trim();
      saveState(); paint(); render();
    };
    root.querySelectorAll('[data-histedit]').forEach(b=>{
      b.onclick = ()=>{
        const idx = Number(b.dataset.histedit);
        const h = unit.history[idx];
        if(!h) return;
        const newAmt = prompt(`Amount (use negative for withdrawal, in ${cur}):`, h.delta);
        if(newAmt===null) return;
        const newDate = prompt('Date (YYYY-MM-DD):', h.date);
        if(newDate===null) return;
        const newNote = prompt('Note:', h.note||'');
        if(newNote===null) return;
        h.delta = Number(newAmt)||0;
        if(newDate.trim()) h.date = newDate.trim();
        h.note = newNote.trim();
        saveState(); paint(); render();
      };
    });
    root.querySelectorAll('[data-histdel]').forEach(b=>{
      b.onclick = ()=>{
        if(confirm('Delete this entry? This cannot be undone.')){
          const idx = Number(b.dataset.histdel);
          unit.history.splice(idx,1);
          saveState(); paint(); render();
        }
      };
    });
  }
  paint();
}

   BILLS
========================================================= */
function currentMonthKey(){ return isoDate(TODAY).slice(0,7); }

function nextDueDate(bill){
  if(!bill.lastPaidDate) return null;
  const d = new Date(bill.lastPaidDate+'T00:00:00');
  if(bill.frequency==='Annually'){
    d.setFullYear(d.getFullYear()+1);
    return d;
  }
  // Clamp to the target month's real last day (e.g. Jan 31 -> Feb 28/29, not overflowing into March).
  const targetYear = d.getFullYear();
  const targetMonth = d.getMonth()+1;
  const lastDayOfTargetMonth = new Date(targetYear, targetMonth+1, 0).getDate();
  const day = Math.min(d.getDate(), lastDayOfTargetMonth);
  return new Date(targetYear, targetMonth, day);
}

function dueBadge(bill){
  const nd = nextDueDate(bill);
  if(!nd) return `<span class="muted">Not yet paid</span>`;
  const days = Math.round((nd - new Date(isoDate(TODAY)+'T00:00:00')) / 86400000);
  const dateStr = isoDate(nd);
  if(days < 0) return `<span class="neg">${dateStr} — overdue ${Math.abs(days)}d</span>`;
  if(days === 0) return `<span class="neg">${dateStr} — due today</span>`;
  if(days <= 5) return `<span style="color:var(--amber);">${dateStr} — in ${days}d</span>`;
  return `<span class="muted">${dateStr} — in ${days}d</span>`;
}

function moveCategory(type, cat, direction){
  const arr = state.categories[type];
  const idx = arr.indexOf(cat);
  if(idx===-1) return;
  const swapIdx = idx + direction;
  if(swapIdx<0 || swapIdx>=arr.length) return;
  [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
  saveState(); render();
}

/* Un-starring hides the ⊘ toggle, so the stricter flag goes with it — otherwise it
   would keep applying with no visible control to turn it off. */
function clearBalanceExclusionIfNotSpecial(key){
  if(!(state.settings.excludedFromSummary||[]).includes(key)){
    state.settings.excludedFromBalance = (state.settings.excludedFromBalance||[]).filter(k=> k!==key);
  }
}

function toggleCategorySpecial(type, cat){
  const key = type+'|||'+cat;
  const list = new Set(state.settings.excludedFromSummary||[]);
  if(list.has(key)) list.delete(key); else list.add(key);
  state.settings.excludedFromSummary = [...list];
  clearBalanceExclusionIfNotSpecial(key);
  saveState(); render();
}

function renameCategory(type, oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  if(state.categories[type].includes(newName)){ toast('That category already exists.'); return; }
  const idx = state.categories[type].indexOf(oldName);
  if(idx===-1) return;
  state.categories[type][idx] = newName;

  // Carry the rename through everywhere the old name is referenced
  Object.keys(state.planning).forEach(yr=>{
    const bucket = state.planning[yr] && state.planning[yr][type];
    if(bucket && bucket[oldName]){ bucket[newName] = bucket[oldName]; delete bucket[oldName]; }
  });
  state.transactions.forEach(tx=>{ if(tx.type===type && tx.category===oldName) tx.category = newName; });
  if(type==='Expenses'){
    state.settings.weeklyExcludedCategories = (state.settings.weeklyExcludedCategories||[]).map(c=> c===oldName ? newName : c);
  }
  if(type==='Savings'){
    state.accounts.forEach(a=>{ if(a.linkedCategory===oldName) a.linkedCategory = newName; });
  }
  state.settings.excludedFromSummary = (state.settings.excludedFromSummary||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);
  state.settings.essentialCategories = (state.settings.essentialCategories||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);
  state.settings.investingCategories = (state.settings.investingCategories||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);
  state.settings.excludedFromBalance = (state.settings.excludedFromBalance||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);

  saveState(); render(); toast(`Renamed to "${newName}".`);
}
