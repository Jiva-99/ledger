  `;

  c.querySelectorAll('[data-invcur]').forEach(b=>{
    b.onclick = ()=>{ if(state.ui.investCur !== b.dataset.invcur){ state.ui.investCur = b.dataset.invcur; saveState(); render(); } };
  });
  // The same three actions as the Net Worth tab — this is where you'd look for them.
  const bind = (id, fn)=>{ const b = document.getElementById(id); if(b) b.onclick = fn; };
  c.querySelectorAll('[data-ledger]').forEach(b=> b.onclick = ()=> openOrderLedger(b.dataset.ledger));
  bind('invBuyBtn',   ()=> openPurchaseModal());
  bind('invDivBtn',   ()=> openDividendModal());
  bind('invPriceBtn', ()=> openPriceModal());
  bind('invResetBtn', ()=>{
    const affected = (state.accounts||[]).filter(a=> accountSleeve(a));
    const names = affected.map(a=> a.name).join(', ');
    confirmDestructive({
      title: 'Reset investment records',
      what: names || 'No sleeved accounts',
      lines: [
        'Clears every purchase, dividend, price and balance history for these holdings',
        'Keeps the holdings themselves — names, currencies, sleeve, target weights, targets, assumed returns and tickers',
        'Cash and other accounts are untouched',
        'Net Worth for these accounts will read zero until you record your first purchase'
      ],
      confirmLabel: 'Reset records',
      onConfirm: ()=>{
        captureRestorePoint('Before resetting investment records', true);
        const r = resetInvestmentRecords();
        saveState(); render();
        toast(`${r.holdings} holding${r.holdings===1?'':'s'} cleared across ${r.accounts} account${r.accounts===1?'':'s'}. Settings → Restore points has a copy from just before.`);
      }
    });
  });
  wireInvestingSection(c);   // Core & satellite and Projection now live on this tab
}

/* Wiring for the Core & satellite and Projection blocks. They used to live on the
   Net Worth tab and now sit under Investments, so the handlers travel with them
   rather than being tied to whichever tab happened to render them first. */
function wireInvestingSection(c){
  const unitByKey = key=>{
    const [accId, subId] = key.split('|||');
    const acc = state.accounts.find(a=> a.id === accId);
    if(!acc) return null;
    return subId ? (acc.subCategories||[]).find(x=> x.id === subId) : acc;
  };
  c.querySelectorAll('[data-weight]').forEach(inp=>{
    inp.onchange = ()=>{
      const u = unitByKey(inp.dataset.weight); if(!u) return;
      const v = inp.value === '' ? null : Math.max(0, Math.min(100, Number(inp.value)||0));
      if(v === null) delete u.targetWeight; else u.targetWeight = v;
      saveState(); render();
    };
  });
  c.querySelectorAll('[data-assumed]').forEach(inp=>{
    inp.onchange = ()=>{
      const u = unitByKey(inp.dataset.assumed); if(!u) return;
      if(inp.value === '') delete u.nominalReturn;
      else u.nominalReturn = Number(inp.value)||0;
      saveState(); render();
    };
  });
  const bind = (id, fn, ev)=>{ const el = document.getElementById(id); if(el) el[ev||'onclick'] = fn; };
  bind('updatePricesBtn', ()=> openPriceModal());
  bind('recordBuyBtn',    ()=> openPurchaseModal());
  bind('recordDivBtn',    ()=> openDividendModal());
  bind('rebScope', function(){ investSettings().scope = this.value; saveState(); render(); }, 'onchange');
  bind('rebByWeight', function(){
    investSettings().contributionMode = this.checked ? 'weight' : 'gaps'; saveState(); render();
  }, 'onchange');
  bind('rebContribution', function(){
    investSettings().contribution = Math.max(0, Number(this.value)||0); saveState(); render();
  }, 'onchange');
  bind('rebCoreTarget', function(){
    investSettings().coreTarget = Math.max(0, Math.min(100, Number(this.value)||0)); saveState(); render();
  }, 'onchange');
  bind('rebLastDate', function(){
    investSettings().lastRebalanceDate = this.value || ''; saveState(); render();
  }, 'onchange');
  const projField = (id, apply)=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{ apply(Number(el.value)||0); saveState(); render(); };
  };
  projField('projCap', v=> investSettings().returnCap = Math.max(0, v));
  projField('projInf', v=> investSettings().inflation = Math.max(0, v));
  projField('projBase', v=> investSettings().baselineReturn = Math.max(0, Math.min(20, v)));
  projField('projWr',   v=> investSettings().withdrawalRate = Math.max(1, Math.min(10, v)));
  const projYear = document.getElementById('projYear');
  if(projYear) projYear.onchange = ()=>{
    const v = Math.round(Number(projYear.value));
    if(!isFinite(v) || v < TODAY.getFullYear()+1 || v > 2100){
      toast(`Pick a year between ${TODAY.getFullYear()+1} and 2100.`); render(); return;
    }
    investSettings().retireYear = v; saveState(); render();
  };
  const projMonthly = document.getElementById('projMonthly');
  if(projMonthly) projMonthly.onchange = ()=>{
    // Blank goes back to the six-month average rather than meaning zero.
    investSettings().monthlyContribution = projMonthly.value.trim()==='' ? null : Math.max(0, Number(projMonthly.value)||0);
    saveState(); render();
  };
}

function investingSectionHTML(){
  const inv = investedUnits();
  if(!inv.length){
    return `
      <div class="card dash-card" style="margin-top:16px;">
        <div class="dash-card-head"><span class="dash-card-title">Core &amp; satellite</span></div>
        <div class="muted" style="font-size:12.5px;">
          Set an account's sleeve to Core or Satellite on the Net Worth tab (Edit setup) and this section will track the split, flag drift,
          and work out where your next contribution should go.
        </div>
      </div>`;
  }

  const IS    = investSettings();
  const scope = ['whole','core','satellite'].includes(IS.scope) ? IS.scope : 'whole';
  const plan  = rebalancePlan(scope, IS.contribution, IS.contributionMode);
  const band  = Number(IS.driftBand) || 5;
  const split = contributionSplit(inv);
  const buckets = rebalanceBuckets(scope);

  const scopeEmpty = !plan.rows.length;
  // Being under target is not "good" and over target is not "bad" — both are drift.
  // Inside the band is grey, outside is amber, regardless of direction.
  const driftClass = d=> Math.abs(d) <= band ? 'flat' : 'out';
  const pp = d=> (d>0?'+':'') + d.toFixed(1) + 'pp';

  const rowsHTML = plan.rows.map(r=>`
    <tr>
      <td>${r.name}</td>
      <td class="r">${moneyWhole(r.value)}</td>
      <td class="r">${r.currentPct.toFixed(1)}%</td>
      ${scope==='whole'
        ? `<td class="r muted">${r.target.toFixed(1)}%</td>`
        : `<td class="r"><input class="reb-weight" type="number" step="1" min="0" max="100" data-weight="${r.key}"
             value="${r.rawWeight !== null && r.rawWeight !== undefined ? r.rawWeight : ''}" placeholder="—"> <span class="muted">%</span></td>`}
      <td class="r"><span class="delta ${driftClass(r.driftPp)}">${pp(r.driftPp)}</span></td>
      ${plan.contribution > 0
        ? `<td class="r">${r.allocate > 0.5 ? moneyWhole(r.allocate) : '—'}</td>
           <td class="r"><span class="delta ${driftClass(r.afterDriftPp)}">${pp(r.afterDriftPp)}</span></td>`
        : `<td class="r">${Math.abs(r.trade) < 1 ? '—' : (r.trade > 0 ? 'buy ' : 'sell ') + moneyWhole(Math.abs(r.trade))}</td>`}
    </tr>`).join('');

  const withinBand = plan.worstDrift !== undefined && plan.worstDrift <= band;
  const fixedByContribution = plan.contribution > 0 && plan.worstAfter <= band;

  let verdict;
  if(scopeEmpty) verdict = '';
  else if(withinBand) verdict = `Everything is within your ${band}pp band. Nothing to do.`;
  else if(plan.contribution > 0 && fixedByContribution)
    verdict = `Contributing ${moneyWhole(plan.contribution)} as split above brings every holding back inside the ${band}pp band — no selling, so no capital gains event.`;
  else if(plan.contribution > 0)
    verdict = `Even after ${moneyWhole(plan.contribution)}, the worst drift is ${plan.worstAfter.toFixed(1)}pp — still outside your ${band}pp band. Either contribute more, keep directing contributions this way for a few months, or sell to rebalance outright.`;
  else
    verdict = `Worst drift is ${plan.worstDrift.toFixed(1)}pp against a ${band}pp band. Enter what you're about to invest and this will try to fix it with new money first, since selling triggers capital gains.`;

  let weightWarn = '';
  if(scope !== 'whole'){
    if(buckets.weightsSet === false){
      weightWarn = `<div class="liq-banner" style="margin-top:12px;">No target weights set inside ${sleeveLabel(scope)}, so an equal split is assumed. Type a target % against each holding above.</div>`;
    } else {
      const raw = buckets.buckets.reduce((t,b)=> t + (b.rawWeight||0), 0);
      if(Math.abs(raw - 100) > 0.5){
        weightWarn = `<div class="liq-banner" style="margin-top:12px;">Your weights add up to ${raw.toFixed(0)}%, not 100%. They're being scaled to 100% so the comparison still works — the Target column shows the scaled figures.</div>`;
      }
    }
  }

  // V4.9 — the sleeve split on the left, the rebalance calculator on the right.
  // The sleeve bars always show the whole portfolio, whatever scope Rebalance is set to.
  const whole = rebalancePlan('whole', 0, IS.contributionMode);
  const sleeveBars = whole.rows.map(r=>`
    <div class="inv-sleeve-row">
      <span class="inv-sleeve-name">${r.name}</span>
      <span class="inv-sleeve-track" role="img" aria-label="${r.name}: ${r.currentPct.toFixed(1)}% now, target ${r.target.toFixed(0)}%">
        <span class="fill ${r.key||r.name}" style="width:${Math.max(0,Math.min(100,r.currentPct))}%"></span>
        <span class="mark" style="left:${Math.max(0,Math.min(100,r.target))}%"></span>
      </span>
      <span class="inv-sleeve-val num-font">${moneyWhole(r.value)}</span>
      <span class="inv-sleeve-pct num-font">${r.currentPct.toFixed(1)}% / ${r.target.toFixed(0)}%</span>
      <span class="delta ${driftClass(r.driftPp)}">${pp(r.driftPp)}</span>
    </div>`).join('');

  return `
    <div class="inv-two">
      <div class="card dash-card" id="invSleeves">
        <div class="dash-card-head"><span class="dash-card-title">Core &amp; satellite</span><span class="muted">all values in AUD</span></div>
        <div class="dash-kpis inv-mini">
          <div class="dash-kpi"><div class="k-label">Invested value</div><div class="k-val" style="color:var(--gold-bright)">${moneyWhole(split.value)}</div><div class="k-sub">${inv.length} holding${inv.length>1?'s':''} across both sleeves</div></div>
          <div class="dash-kpi"><div class="k-label">You put in</div><div class="k-val">${moneyWhole(split.contributed)}</div><div class="k-sub">contributions and opening balances</div></div>
          <div class="dash-kpi"><div class="k-label">The market gave you</div><div class="k-val ${split.gained>=0?'pos':'neg'}">${split.gained>=0?'+':''}${moneyWhole(split.gained)}</div><div class="k-sub">${split.returnPct===null?'—':`${split.returnPct>=0?'+':''}${split.returnPct.toFixed(1)}% on what you contributed`}</div></div>
        </div>
        ${whole.rows.length ? `<div class="inv-sleeves">${sleeveBars}</div>
          <div class="muted inv-small">Bar: share of the portfolio now. Marker: target. Grey drift is inside your ${band}pp band, amber is outside it.</div>` : ''}
      </div>

      <div class="card dash-card" id="invRebalance">
        <div class="dash-card-head"><span class="dash-card-title">Rebalance</span><span class="muted">where the next contribution should go</span></div>
        <div class="inv-reb-controls">
          <label class="liq-basis"><span>Scope</span>
            <select id="rebScope" style="width:auto;">
              <option value="whole" ${scope==='whole'?'selected':''}>Whole portfolio — core vs satellite</option>
              <option value="core" ${scope==='core'?'selected':''}>Within core only</option>
              <option value="satellite" ${scope==='satellite'?'selected':''}>Within satellite only</option>
            </select>
          </label>
          ${scope==='whole' ? `<label class="liq-basis"><span>Core target</span>
            <input type="number" id="rebCoreTarget" step="5" min="0" max="100" value="${IS.coreTarget}" style="width:64px;"> <span>%</span></label>` : ''}
          <label class="liq-basis"><span>About to invest</span>
            <input type="number" id="rebContribution" step="100" min="0" value="${IS.contribution||0}" style="width:96px;"></label>
          <label class="liq-basis" style="cursor:pointer;" title="Split the contribution by target weight instead of sending it to whatever is furthest below target">
            <input type="checkbox" id="rebByWeight" ${IS.contributionMode==='weight'?'checked':''} style="width:auto;">
            <span>Split by target weight</span></label>
          <label class="liq-basis" title="The Calendar shows a reminder every six months from this date">
            <span>Last rebalanced</span>
            <input type="date" id="rebLastDate" value="${IS.lastRebalanceDate||''}" style="width:auto;"></label>
        </div>
        ${scopeEmpty
          ? `<div class="muted" style="font-size:12.5px;">Nothing tagged as ${sleeveLabel(scope)} yet.</div>`
          : `<div class="plan-table-wrap"><table class="reb inv-reb">
          <thead>
            <tr>
              <th>${scope==='whole'?'Sleeve':'Holding'}</th>
              <th class="r">Value</th><th class="r">Now</th><th class="r">Target${scope!=='whole'?' %':''}</th><th class="r">Drift</th>
              ${plan.contribution>0 ? '<th class="r">Put in</th><th class="r">After</th>' : '<th class="r">To rebalance</th>'}
            </tr>
          </thead>
          <tbody>${rowsHTML}</tbody>
        </table></div>
        <div class="liq-note">${verdict}</div>`}
        ${weightWarn}
      </div>
    </div>
    <div class="inv-proj">${projectionSectionHTML()}</div>`;
}

/* Opened from on top of the price screen. Restoring that screen by stashing and
   re-assigning innerHTML looked right but rebuilt every element as a fresh node,
   dropping all its event handlers — the dialog closed and nothing was clickable
   afterwards. Stacking a layer instead leaves the screen underneath untouched. */
function openQuoteKeyModal(onDone){
  const root = document.getElementById('modalRoot');
  const layer = document.createElement('div');
  const cur = quoteToken();
  const synced = quoteTokenSynced();
  layer.innerHTML = `
    <div class="modal-backdrop" id="kb" style="z-index:60;">
      <div class="modal" style="max-width:520px;">
        <h2>Price API key</h2>
        <div class="page-sub">Only needed if the keyless source is blocked in your browser. A free Finnhub key works; it is read-only market data, rate limited, and can be regenerated at any time.</div>
        <label class="field">Key <input type="text" id="qkVal" value="${cur.replace(/"/g,'&quot;')}" placeholder="paste key, or leave blank to remove"></label>
        <div class="form-grid" style="margin-top:10px;">
          <label class="field" style="flex-direction:row; align-items:flex-start; gap:9px;">
            <input type="checkbox" id="qkSync" ${synced?'checked':''} style="width:16px; height:16px; margin-top:2px; flex:none;">
            <span style="font-size:12.5px; line-height:1.5;">Sync this key to my other devices<br>
              <span class="muted" style="font-size:11.5px;">Stores it with your data, so it travels through Firestore to your phone and iPad. Your data is private to your account and is not in the public repository. Leave unticked to keep the key in this browser only.</span>
            </span>
          </label>
        </div>
        <div class="muted" style="font-size:11.5px; margin-top:10px; line-height:1.5;">
          Either way, the key is removed from downloaded backups — those are files you might send somewhere.
        </div>
        <div class="form-actions">
          <button class="btn secondary" id="qkCancel">Cancel</button>
          <button class="btn" id="qkSave">Save key</button>
        </div>
      </div>
    </div>
  `;
  root.appendChild(layer);
  const back = ()=>{ layer.remove(); };
  // Scoped to the layer, so these never collide with same-named ids underneath.
  const q = sel=> layer.querySelector(sel);
  q('#qkCancel').onclick = back;
  q('#kb').addEventListener('click', e=>{ if(e.target.id==='kb') back(); });
  q('#qkSave').onclick = ()=>{
    const v = q('#qkVal').value.trim();
    const sync = q('#qkSync').checked;
    setQuoteToken(v, sync);
    back();
    if(onDone) onDone();
    toast(!v ? 'API key removed.' : (sync ? 'API key saved and will sync to your other devices.' : 'API key saved on this device only.'));
  };
}

/* A confirm() dialog says "Delete this account?" and gives no way to tell which
   account or what goes with it. This names the thing, lists what's attached, and
   puts the destructive action on the right in red — so a stray tap on the wrong
   row is caught by reading, not by luck. */
function confirmDestructive(opts){
  const root = document.getElementById('modalRoot');
  const layer = document.createElement('div');
  layer.innerHTML = `
    <div class="modal-backdrop" id="cdb" style="z-index:60;">
      <div class="modal" style="max-width:440px;">
        <h2>${opts.title}</h2>
        <div style="font-size:15px; margin:2px 0 10px 0;">${opts.what}</div>
        ${opts.lines && opts.lines.length ? `<ul class="confirm-list">${opts.lines.map(l=>`<li>${l}</li>`).join('')}</ul>` : ''}
        <div class="muted" style="font-size:12px; margin-top:12px; line-height:1.5;">This can't be undone from here, but a restore point is saved first — Settings → Restore points.</div>
        <div class="form-actions">
          <button class="btn secondary" id="cdCancel">Cancel</button>
          <button class="btn danger" id="cdGo">${opts.confirmLabel || 'Delete'}</button>
        </div>
      </div>
    </div>
  `;
  root.appendChild(layer);
  const close = ()=>{ layer.remove(); };
  const q = sel=> layer.querySelector(sel);
  q('#cdCancel').onclick = close;
  q('#cdb').addEventListener('click', e=>{ if(e.target.id==='cdb') close(); });
  q('#cdGo').onclick = ()=>{
    close();
    // Clear anything underneath too: the action about to run will re-render.
    root.innerHTML = '';
    opts.onConfirm();
  };
}

/* Record one monthly buy across every holding. Shares and executed price only:
   what a holding cost is units x price, and the total is shown back so a typo is
   caught against the figure on the phone. */
function openPurchaseModal(){
  const rows = allUnits().filter(u=> accountSleeve(u.acc));
  const root = document.getElementById('modalRoot');
  if(!rows.length){ toast('Tag an account as Core or Satellite first.'); return; }

  root.innerHTML = `
    <div class="modal-backdrop" id="pb">
      <div class="modal price-modal">
        <h2>Record purchase</h2>
        <div class="page-sub">Copy the shares and executed price from each Dime order. Leave a row blank to skip it.</div>
        <label class="field" style="max-width:170px;">Date
          <input type="date" id="buyDate" value="${isoDate(TODAY)}" min="1970-01-01" max="2200-12-31">
        </label>
        <div class="price-scroll">
        <table class="price-grid">
          <thead><tr><th>Holding</th><th class="r">Shares</th><th class="r">Executed price</th>
            <th class="r">Total</th></tr></thead>
          <tbody>
            ${rows.map((u,i)=>`
              <tr>
                <td class="hold"><div class="hn">${u.unit.name || u.acc.name}</div>
                  <div class="sub">${u.subId ? u.acc.name + ' · ' : ''}${u.currency}</div></td>
                <td class="r"><input type="number" step="any" min="0" id="bu${i}" placeholder="—"></td>
                <td class="r"><input type="number" step="any" min="0" id="bp${i}" placeholder="—"></td>
                <td class="r val" id="bt${i}">—</td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
        <div class="liq-note" id="buySummary">Nothing entered yet.</div>
        <div class="form-actions">
          <button class="btn secondary" id="buyCancel">Cancel</button>
          <button class="btn" id="buySave">Save purchase</button>
        </div>
      </div>
    </div>`;

  const close = ()=> root.innerHTML='';
  document.getElementById('buyCancel').onclick = close;
  document.getElementById('pb').addEventListener('click', e=>{ if(e.target.id==='pb') close(); });

  const num = id=> Number(document.getElementById(id).value) || 0;
  const recalc = ()=>{
    let grand = 0, n = 0;
    rows.forEach((u,i)=>{
      const units = num('bu'+i), price = num('bp'+i);
      const cell = document.getElementById('bt'+i);
      if(units > 0 && price > 0){
        const total = units*price;
        cell.textContent = moneyCur(total, u.currency, 2);
        grand += toAUD(total, u.currency);
        n++;
      } else cell.textContent = '—';
    });
    document.getElementById('buySummary').textContent = n
      ? `${n} holding${n>1?'s':''} · ${moneyWhole(grand)} total.`
      : 'Nothing entered yet.';
  };
  rows.forEach((u,i)=> ['bu','bp'].forEach(pre=>{
    document.getElementById(pre+i).oninput = recalc;
  }));

  document.getElementById('buySave').onclick = ()=>{
    const date = document.getElementById('buyDate').value;
    if(!date || !isSaneYear(Number(date.slice(0,4)))){ toast('Check the date.'); return; }
    let n = 0, spent = 0;
    rows.forEach((u,i)=>{
      const units = num('bu'+i), price = num('bp'+i);
      if(!(units > 0 && price > 0)) return;
      const lot = { id: uid(), date, units, price };
      lot.total = lotTotal(lot);
      u.unit.lots = unitLots(u.unit).concat([lot]);
      // Opening position: whatever was already there becomes the starting basis,
      // recorded once so earlier holdings aren't lost or double counted.
      if(u.unit.openingCost === undefined){
        const prior = unitBalanceAsOf(u.unit, date);
        u.unit.openingCost = Math.max(0, prior);
        u.unit.openingUnits = Number(u.unit.units) || 0;
      }
      const newUnits = (Number(u.unit.units)||0) + units;
      applyPriceUpdate(u.unit, newUnits, price, date);
      n++; spent += toAUD(lot.total, u.currency);
    });
    if(!n){ toast('Enter shares and a price for at least one holding.'); return; }
    saveState(); close(); render();
    toast(`${n} purchase${n>1?'s':''} recorded — ${moneyWhole(spent)} invested.`);
  };
}

        <div class="page-sub">Put the amount paid in the first column. Only fill in Shares received if the dividend bought more units — those cost you nothing, so they must not raise your cost basis. Check the date matches the payment, not today.</div>
        <label class="field" style="max-width:200px;">Date

        </label>
        <div class="price-scroll">
        <table class="price-grid">
          <thead><tr><th>Holding</th><th class="r">Amount<div class="sub">cash received</div></th><th class="r">Shares received<div class="sub">only if reinvested</div></th><th class="r">Type</th></tr></thead>
          <tbody>
            ${rows.map((u,i)=>`
              <tr>
                <td class="hold"><div class="hn">${u.unit.name || u.acc.name}</div>
                  <div class="sub">${u.subId ? u.acc.name + ' · ' : ''}${u.currency}</div></td>
                <td class="r"><input type="number" step="any" min="0" id="da${i}" placeholder="—"></td>
                <td class="r"><input type="number" step="any" min="0" id="ds${i}" placeholder="leave blank"></td>
                <td class="r val muted" id="dt${i}">—</td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
        <div class="form-actions">
          <button class="btn secondary" id="divCancel">Cancel</button>
          <button class="btn" id="divSave">Save dividend</button>
        </div>
      </div>
    </div>`;

  const close = ()=> root.innerHTML='';
  document.getElementById('divCancel').onclick = close;
  document.getElementById('db').addEventListener('click', e=>{ if(e.target.id==='db') close(); });
  const num = id=> Number(document.getElementById(id).value) || 0;
  rows.forEach((u,i)=> ['da','ds'].forEach(pre=>{
    document.getElementById(pre+i).oninput = ()=>{
      const a = num('da'+i), sh = num('ds'+i);
      document.getElementById('dt'+i).textContent = a > 0 ? (sh > 0 ? 'reinvested' : 'cash') : '—';
    };
  }));

  document.getElementById('divSave').onclick = ()=>{
    const date = document.getElementById('divDate').value;
    if(!date || !isSaneYear(Number(date.slice(0,4)))){ toast('Check the date.'); return; }
    let n = 0, total = 0;
    rows.forEach((u,i)=>{
      const amount = num('da'+i);
      if(!(amount > 0)) return;
      const shares = num('ds'+i);
      u.unit.divs = unitDivs(u.unit).concat([{ id: uid(), date, amount, units: shares }]);
      if(u.unit.openingCost === undefined){
        u.unit.openingCost = Math.max(0, unitBalanceAsOf(u.unit, date));
        u.unit.openingUnits = Number(u.unit.units) || 0;
      }
      if(shares > 0 && isPriced(u.unit)){
        applyPriceUpdate(u.unit, (Number(u.unit.units)||0) + shares, Number(u.unit.price), date, amount);
      }
      n++; total += toAUD(amount, u.currency);
    });
    if(!n){ toast('Enter an amount for at least one holding.'); return; }
    saveState(); close(); render();
    toast(`${n} dividend${n>1?'s':''} recorded — ${moneyWhole(total)}.`);
  };
}

function openPriceModal(){

  if(!rows.length){
    toast('Assign a holding to Core or Satellite first, then prices can be tracked here.');
    return;
  }
  root.innerHTML = `
    <div class="modal-backdrop" id="mb">
      <div class="modal price-modal">
        <h2>Update prices</h2>
        <div class="page-sub">Enter how many units you hold and what one unit is worth. Changing the units records a contribution; changing the price records a gain or loss. Leave a row untouched to skip it.</div>
        <div class="price-scroll">
        <table class="price-grid">
          <thead><tr><th>Holding</th><th>Ticker</th><th class="r">Units</th><th class="r">Price</th><th class="r">Value</th></tr></thead>
          <tbody>
            ${rows.map((u,i)=>{
              const cur = u.currency;
              const bal = unitBalanceAsOf(u.unit, isoDate(TODAY));
              const age = daysSince(u.unit.pricedAt);
              const auto = effectiveTicker(u.unit, u.unit.name);
              return `
              <tr>
                <td class="hold">
                  <div class="hn">${u.unit.name || u.acc.name}</div>
                  <div class="sub" id="pn${i}">${u.subId ? u.acc.name + ' · ' : ''}${cur}${u.unit.pricedAt?` · priced ${age===0?'today':age+'d ago'}`:' · never priced'}</div>
                </td>
                <td><input type="text" id="pt${i}" value="${u.unit.ticker||''}" placeholder="${auto||'—'}" class="ticker-in" title="${auto?`Blank uses “${auto}”, taken from the name`:'No ticker detected from the name'}"></td>
                <td class="r"><input type="number" step="any" min="0" id="pu${i}" value="${isPriced(u.unit)?u.unit.units:''}" placeholder="—"></td>
                <td class="r"><input type="number" step="any" min="0" id="pp${i}" value="${isPriced(u.unit)?u.unit.price:''}" placeholder="—"></td>

              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>
        <div class="muted" style="font-size:11.5px; margin-top:8px; line-height:1.5;">
          Use Record purchase for buys and Record dividend for income — this screen is only for what a share is
          worth today, so it never touches your cost basis.
          Where a holding is already named after its symbol, that name is used as the ticker — the grey
          text in the box shows what will be looked up, so leave it blank unless it's wrong.
          Fetched prices fill the boxes for you to check —
          nothing saves until you press Save. Units are never fetched: buying is your decision, not the market's.
          The fetched price is assumed to be in the holding's own currency.
        </div>
        <div class="form-actions" style="justify-content:space-between;">
          <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn secondary" id="fFetch">Fetch prices</button>
            <button class="btn secondary" id="fKey" title="Set an API key for this device only">${quoteToken()?'Change API key':'Add API key'}</button>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn secondary" id="fCancel">Cancel</button>
            <button class="btn" id="fSave">Save prices</button>
          </div>
        </div>
      </div>
    </div>
  `;
  const close = ()=> root.innerHTML='';
  document.getElementById('fCancel').onclick = close;
  document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') close(); });

  // Live value preview so a typo in the price is obvious before it's saved
  rows.forEach((u,i)=>{
    const recalc = ()=>{
      const un = Number(document.getElementById('pu'+i).value);
      const pr = Number(document.getElementById('pp'+i).value);
      const cell = document.getElementById('pv'+i);
      const val = (un && pr) ? un*pr : unitBalanceAsOf(u.unit, isoDate(TODAY));
      cell.firstChild ? cell.firstChild.nodeValue = moneyCur(val, u.currency) : cell.textContent = moneyCur(val, u.currency);
      const aud = document.getElementById('ps'+i);
      if(aud) aud.textContent = u.currency !== 'AUD' ? '≈'+moneyWhole(toAUD(val, u.currency)) : '';
    };
    document.getElementById('pu'+i).oninput = recalc;
    document.getElementById('pp'+i).oninput = recalc;
  });

  document.getElementById('fKey').onclick = ()=> openQuoteKeyModal(()=>{
    document.getElementById('fKey').textContent = quoteToken() ? 'Change API key' : 'Add API key';
  });

  document.getElementById('fFetch').onclick = async ()=>{
    const btn = document.getElementById('fFetch');
    btn.disabled = true; btn.textContent = 'Fetching…';
    let ok = 0, failed = [];
    for(let i=0; i<rows.length; i++){
      const typed = document.getElementById('pt'+i).value.trim();
      const tick = typed || effectiveTicker(rows[i].unit, rows[i].unit.name);
      const note = document.getElementById('pn'+i);
      if(!tick){ continue; }
      try{
        const q = await fetchQuote(tick);
        document.getElementById('pp'+i).value = q.price;
        document.getElementById('pp'+i).dispatchEvent(new Event('input'));
        note.textContent = `${rows[i].currency} · ${q.price} from ${q.source}`;
        note.style.color = 'var(--green)';
        ok++;
      }catch(e){
        note.textContent = `${rows[i].currency} · could not fetch (${e.message})`;
        note.style.color = 'var(--amber)';
        failed.push(tick);
      }
    }
    btn.disabled = false; btn.textContent = 'Fetch prices';
    if(!ok && failed.length){
      toast(`No prices could be fetched. Free sources block browser requests fairly often — add an API key, or type the prices in.`);
    } else if(ok){
      toast(`${ok} price${ok>1?'s':''} filled in${failed.length?`, ${failed.length} failed`:''}. Check them, then Save.`);
    } else {
      toast('Add a ticker to a holding first.');
    }
  };

  document.getElementById('fSave').onclick = ()=>{
    let changed = 0, contributed = 0, revalued = 0, dividends = 0;
    rows.forEach((u,i)=>{
      // Only store a ticker that was actually typed. Leaving it blank keeps the
      // holding following its own name, so renaming VT to VTI just works.
      const tick = document.getElementById('pt'+i).value.trim();
      if(tick) u.unit.ticker = tick.toUpperCase(); else delete u.unit.ticker;
      const un = document.getElementById('pu'+i).value;
      const pr = document.getElementById('pp'+i).value;
      if(un === '' || pr === '') return;
      const nu = Number(un), np = Number(pr);
      if(!(nu >= 0) || !(np >= 0)) return;
      const dEl = document.getElementById('pd'+i);
      const dVal = dEl ? Number(dEl.value) || 0 : 0;
      if(isPriced(u.unit) && Number(u.unit.units) === nu && Number(u.unit.price) === np && dVal === 0) return;
      const divEl = document.getElementById('pd'+i);
      const div = divEl ? Number(divEl.value) || 0 : 0;
      const entries = applyPriceUpdate(u.unit, nu, np, undefined, div);
      if(entries.length) changed++;
      entries.forEach(e=>{
        const d = toAUD(e.delta, u.currency);
        if(e.kind === 'revaluation') revalued += d;
        else if(e.kind === 'dividend') dividends += d;
        else contributed += d;
      });
    });
    saveState(); close(); render();
    toast(changed
      ? `${changed} holding${changed>1?'s':''} updated — ${moneyWhole(contributed)} in, ${revalued>=0?'+':''}${moneyWhole(revalued)} market movement${dividends>0?`, ${moneyWhole(dividends)} dividends`:''}.`
      : 'Nothing changed.');
  };
}

/* Full history for an account or sub-category: opening balance as the first row,
   then every adjustment in date order, with a running balance and edit/delete per entry. */
/* The balance impact of a dividend record. Reinvested dividends bought units and
   so grew the holding; cash dividends left the account entirely and never touched
   it. Either way the amount still counts as return, which comes from the record
   itself rather than from the balance. */
function divBalanceValue(d){ return (Number(d.units) > 0) ? (Number(d.amount)||0) : 0; }

/* Applies a correction as a delta rather than an absolute. Setting the unit count
   outright would silently wipe any units entered through a price update that never
   had an order behind it; adding the difference leaves those alone.
   The balance entry is dated at the record's own date, not today, so the Net Worth
   chart is right from the day the thing actually happened. */
function reconcileOrderChange(unit, dateISO, unitsDelta, valueDelta, kind, note){
  if(Math.abs(unitsDelta) > 1e-9) unit.units = (Number(unit.units)||0) + unitsDelta;
  if(Math.abs(valueDelta) > 0.005){
    unit.history = unit.history || [];
    unit.history.push({ id: uid(), date: dateISO, delta: valueDelta, kind, note });
  }
}

/* Every purchase and dividend for one holding, in date order, editable. These two
   lists drive the cost basis and therefore every return figure on this tab, so
   without a way to see them a typo was permanent — the only remedy was wiping the
   whole account's record and re-entering it from the broker. */
function openOrderLedger(key){
  const [accId, subId] = String(key).split('|||');
  const acc = (state.accounts||[]).find(a=> a.id === accId);
  if(!acc) return;
  const unit = subId ? (acc.subCategories||[]).find(s=> s.id === subId) : acc;
  if(!unit) return;
  const label = subId ? `${acc.name} — ${unit.name}` : acc.name;
  const cur = subId ? (unit.currency||acc.currency) : acc.currency;
  const root = document.getElementById('modalRoot');

  const paint = ()=>{
    const cb = costBasisAsOf(unit, null);
    const entries = [
      ...unitLots(unit).map(l=> ({ kind:'buy', rec:l })),
      ...unitDivs(unit).map(d=> ({ kind:'div', rec:d }))
    ].sort((a,b)=> (a.rec.date||'').localeCompare(b.rec.date||'')
                || (a.kind === b.kind ? 0 : a.kind === 'buy' ? -1 : 1));

    const rows = entries.map(e=>{
      const r = e.rec;
      if(e.kind === 'buy') return `
        <tr>
          <td><input type="date" data-oldate="${r.id}" value="${r.date||''}" style="width:135px;"></td>
          <td><span class="pill kind-saving">Purchase</span></td>
          <td class="num"><input type="number" step="any" min="0" data-olunits="${r.id}" value="${Number(r.units)||0}" style="width:88px;"></td>
          <td class="num"><input type="number" step="any" min="0" data-olprice="${r.id}" value="${Number(r.price)||0}" style="width:96px;"></td>
          <td class="num">${moneyCur(lotTotal(r), cur, 2)}</td>
          <td><button class="icon-btn" data-oldel="${r.id}" title="Delete">✕</button></td>
        </tr>`;
      return `
        <tr>
          <td><input type="date" data-oldate="${r.id}" value="${r.date||''}" style="width:135px;"></td>
          <td><span class="pill kind-income">Dividend</span><div class="muted" style="font-size:11px;">${Number(r.units)>0?'reinvested':'cash'}</div></td>
          <td class="num"><input type="number" step="any" min="0" data-olunits="${r.id}" value="${Number(r.units)||0}" style="width:88px;"></td>
          <td class="num muted">—</td>
          <td class="num"><input type="number" step="any" min="0" data-olamt="${r.id}" value="${Number(r.amount)||0}" style="width:96px;"></td>
          <td><button class="icon-btn" data-oldel="${r.id}" title="Delete">✕</button></td>
        </tr>`;
    }).join('');

    const liveUnits = Number(unit.units) || 0;
    const drift = Math.abs(liveUnits - cb.units) > 0.0005;

    root.innerHTML = `
      <div class="modal-backdrop" id="olb">
        <div class="modal" style="width:680px; max-width:96vw;">
          <h2>Order record — ${label}</h2>
          <div class="page-sub">Every purchase and dividend behind this holding's cost and return. Edit a figure and the return recalculates; the balance correction is dated to the record, not to today.</div>
          <div class="row" style="margin-bottom:12px;">
            <div class="card metric"><h3>Cost basis</h3><div class="big">${moneyCur(cb.cost, cur)}</div><div class="cap">what you paid, ${cur}</div></div>
            <div class="card metric"><h3>Units from records</h3><div class="big">${cb.units.toLocaleString('en-AU',{maximumFractionDigits:4})}</div><div class="cap">${drift ? `holding shows ${liveUnits.toLocaleString('en-AU',{maximumFractionDigits:4})}` : 'matches the holding'}</div></div>
            <div class="card metric"><h3>Dividends</h3><div class="big" style="color:var(--green);">${moneyCur(cb.dividends, cur)}</div><div class="cap">${moneyCur(cb.dividendCash, cur)} cash</div></div>
          </div>
          ${entries.length ? `
          <div style="max-height:320px; overflow-y:auto;">
            <table class="data">
              <thead><tr><th>Date</th><th>Type</th><th class="num">Units</th><th class="num">Price</th><th class="num">Amount</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>` : `<div class="empty-state"><div class="glyph">·</div>No purchases or dividends recorded for this holding yet. Use Record purchase or Record dividend.</div>`}
          ${Number(unit.openingCost) ? `<div class="muted" style="font-size:11.5px; margin-top:10px;">Opening position before the first recorded order: ${moneyCur(unit.openingCost, cur)} across ${(Number(unit.openingUnits)||0).toLocaleString('en-AU',{maximumFractionDigits:4})} units. It is part of the cost basis and is not listed above.</div>` : ''}
          <div class="form-actions"><button class="btn" id="olClose">Close</button></div>
        </div>
      </div>`;

    const done = ()=>{ saveState(); paint(); render(); };
    document.getElementById('olClose').onclick = ()=> root.innerHTML = '';
    document.getElementById('olb').addEventListener('click', e=>{ if(e.target.id==='olb') root.innerHTML=''; });

    const findLot = id=> unitLots(unit).find(x=> x.id === id);
    const findDiv = id=> unitDivs(unit).find(x=> x.id === id);

    root.querySelectorAll('[data-oldate]').forEach(inp=> inp.onchange = ()=>{
      const id = inp.dataset.oldate;
      const rec = findLot(id) || findDiv(id);
      if(!rec || !inp.value) return;
      rec.date = inp.value;
      done();
    });
    root.querySelectorAll('[data-olprice]').forEach(inp=> inp.onchange = ()=>{
      const l = findLot(inp.dataset.olprice); if(!l) return;
      const before = lotTotal(l);
      l.price = Math.max(0, Number(inp.value)||0);
      l.total = lotTotal(l);
      reconcileOrderChange(unit, l.date, 0, lotTotal(l) - before, 'contribution', 'Purchase corrected');
      done();
    });
    root.querySelectorAll('[data-olunits]').forEach(inp=> inp.onchange = ()=>{
      const id = inp.dataset.olunits;
      const l = findLot(id);
      if(l){
        const beforeU = Number(l.units)||0, beforeV = lotTotal(l);
        l.units = Math.max(0, Number(inp.value)||0);
        l.total = lotTotal(l);
        reconcileOrderChange(unit, l.date, l.units - beforeU, lotTotal(l) - beforeV,
                             'contribution', 'Purchase corrected');
        return done();
      }
      const d = findDiv(id); if(!d) return;
      const beforeU = Number(d.units)||0, beforeV = divBalanceValue(d);
      d.units = Math.max(0, Number(inp.value)||0);
      reconcileOrderChange(unit, d.date, d.units - beforeU, divBalanceValue(d) - beforeV,
                           'dividend', 'Dividend corrected');
      done();
    });
    root.querySelectorAll('[data-olamt]').forEach(inp=> inp.onchange = ()=>{
      const d = findDiv(inp.dataset.olamt); if(!d) return;
      const beforeV = divBalanceValue(d);
      d.amount = Math.max(0, Number(inp.value)||0);
      reconcileOrderChange(unit, d.date, 0, divBalanceValue(d) - beforeV,
                           'dividend', 'Dividend corrected');
      done();
    });
    root.querySelectorAll('[data-oldel]').forEach(b=> b.onclick = ()=>{
      const id = b.dataset.oldel;
      const l = findLot(id), d = l ? null : findDiv(id);
      const rec = l || d; if(!rec) return;
      const after = l
        ? costBasisAsOf({ ...unit, lots: unitLots(unit).filter(x=> x.id !== id) }, null)
        : costBasisAsOf({ ...unit, divs: unitDivs(unit).filter(x=> x.id !== id) }, null);
      confirmDestructive({
        title: l ? 'Delete purchase' : 'Delete dividend',
        what: `${rec.date} — ${l ? `${Number(l.units)} units at ${moneyCur(l.price, cur, 2)}`
                                 : moneyCur(d.amount, cur, 2)}`,
        lines: [`Cost basis becomes ${moneyCur(after.cost, cur)} across ${after.units.toLocaleString('en-AU',{maximumFractionDigits:4})} units.`],
        confirmLabel: 'Delete',
        onConfirm: ()=>{
          if(l){
            unit.lots = unitLots(unit).filter(x=> x.id !== id);
            reconcileOrderChange(unit, l.date, -(Number(l.units)||0), -lotTotal(l),
                                 'contribution', 'Purchase removed');
          } else {
            unit.divs = unitDivs(unit).filter(x=> x.id !== id);
            reconcileOrderChange(unit, d.date, -(Number(d.units)||0), -divBalanceValue(d),
                                 'dividend', 'Dividend removed');
          }
          saveState(); render(); openOrderLedger(key);
        }
      });
    });
  };
  paint();
}

function openHistoryModal(accId, subId){
  const acc = state.accounts.find(a=>a.id===accId);
  if(!acc) return;
  const unit = subId ? (acc.subCategories||[]).find(s=>s.id===subId) : acc;
  if(!unit) return;
  const label = subId ? `${acc.name} — ${unit.name}` : acc.name;
  const cur = subId ? (unit.currency||acc.currency) : acc.currency;

  function paint(){
    const root = document.getElementById('modalRoot');
    const histWithIdx = (unit.history||[]).map((h,i)=>({...h, _idx:i}));
    histWithIdx.sort((a,b)=> a.date<b.date ? -1 : (a.date>b.date ? 1 : 0));

    let running = Number(unit.openingBalance)||0;
    const rows = [`
      <tr>
        <td class="muted">${unit.openingDate}</td>
        <td class="num">${moneyCur(unit.openingBalance, cur)}</td>
        <td class="muted" style="font-size:12px;">Opening balance</td>
        <td class="num">${moneyCur(running, cur)}</td>
        <td><button class="icon-btn" style="color:var(--gold);" data-histeditopen title="Edit opening balance">✎</button></td>
      </tr>
    `];
    histWithIdx.forEach(h=>{
      running += Number(h.delta)||0;
      rows.push(`
        <tr>
          <td class="muted">${h.date}</td>
          <td class="num ${h.delta>=0?'pos':'neg'}">${h.delta>=0?'+':''}${moneyCur(h.delta, cur)}</td>
          <td class="muted" style="font-size:12px;">${h.note||''}</td>
          <td class="num">${moneyCur(running, cur)}</td>
          <td>
            <button class="icon-btn" style="color:var(--gold);" data-histedit="${h._idx}" title="Edit">✎</button>
            <button class="icon-btn" data-histdel="${h._idx}" title="Delete">✕</button>
          </td>
        </tr>
      `);
    });

    root.innerHTML = `
      <div class="modal-backdrop" id="mb">

          ${hasOrderData(unit) ? `<div class="liq-note" style="margin-bottom:10px;">This holding's cost and return come from its purchase and dividend records, not from this list. Editing here changes the balance only — to correct what you paid, open the order record on the Investments tab.</div>` : ''}
          <div style="max-height:360px; overflow-y:auto;">
            <table class="data">
              <thead><tr><th>Date</th><th class="num">Amount</th><th>Note</th><th class="num">Balance</th><th></th></tr></thead>
              <tbody>${rows.slice().reverse().join('')}</tbody>
            </table>
          </div>
          <div class="form-actions">
            <button class="btn secondary" id="fClose">Close</button>
          </div>
        </div>
      </div>
    `;
