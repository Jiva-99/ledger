/* =========================================================
   INVESTMENTS — units, price, sleeves and rebalancing

   Balance history stays the single source of truth for what an account is worth
   on any given date, because the charts and the liquidity ladder read it. Units
   and price sit on top as the way you UPDATE that balance: entering them writes
   history entries that are tagged as either a contribution or a revaluation, so
   "I put money in" and "the market moved" stop being the same number.
========================================================= */
/* Net Worth carries a lot of setup — cash speed, sleeve, targets, splits — that is
   configured once and then read hundreds of times. Edit mode hides the controls so
   the default view is numbers, not knobs. Purely visual: nothing is locked, no data
   moves, and leaving it on gives back exactly the old screen. */
function nwEditing(){ return !!state.ui.nwEdit; }

/* Two decimals is enough to recognise a holding; the stored value keeps full
   precision so nothing is lost. Very small holdings widen rather than round to
   0.00, which would read as "nothing here". */
function fmtUnits(v){
  const n = Number(v);
  if(!isFinite(n)) return '—';
  if(n !== 0 && Math.abs(n) < 0.005) return n.toPrecision(2);
  return n.toLocaleString('en-AU', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function investSettings(){ return state.settings.investing; }

/* The sleeve is set once on the ACCOUNT, and every holding inside it inherits.
   An account called "Core Invesment" is core, so asking the same question again
   for each of VT, QQQM and SCHD is just noise on the screen. */
function accountSleeve(a){
  return (a && (a.sleeve==='core' || a.sleeve==='satellite')) ? a.sleeve : null;
}

/* What the dropdowns say, as plain text, when not editing. */
function nwTagsHTML(a){
  const bits = [];
  const sl = accountSleeve(a);
  if(sl) bits.push(`<span class="nw-tag">${sleeveLabel(sl)}</span>`);
  const sp = accountSpeed(a);
  if(sp) bits.push(`<span>${SPEED_LABELS[sp]}</span>`);
  if(!bits.length) return '';
  return `<div class="nw-inv">${bits.join('<span class="muted">·</span>')}</div>`;
}

function sleeveSelectHTML(a){
  const sleeve = accountSleeve(a) || '';
  return `
    <div class="nw-inv">
      <span>Sleeve</span>
      <select class="nw-speed" data-sleeve="${a.id}" title="Core or satellite — every holding in this account inherits it">
        <option value="" ${!sleeve?'selected':''}>—</option>
        ${SLEEVES.map(([v,l])=>`<option value="${v}" ${sleeve===v?'selected':''}>${l}</option>`).join('')}
      </select>
      ${sleeve ? `<span class="muted">applies to everything in this account · weights set under Rebalance</span>` : ''}
    </div>`;
}

/* The units-and-price line under a holding. Read-only here; editing happens on
   the Update prices screen. */
function pricedInfoHTML(unit, currency){
  if(!isPriced(unit)) return '';
  const age = daysSince(unit.pricedAt);
  const limit = Number(investSettings().staleDays) || 30;
  const stale = age === null || age > limit;
  return `<div class="nw-inv ${stale?'nw-stale':''}" title="${unit.units} units">${fmtUnits(unit.units)} @ ${moneyCur(unit.price, currency||'AUD')} · ${age===null?'never priced':(age===0?'priced today':`priced ${age}d ago`)}</div>`;
}

const SLEEVES = [['core','Core'], ['satellite','Satellite']];
function sleeveLabel(k){ const s = SLEEVES.find(x=>x[0]===k); return s ? s[1] : '—'; }

/* A unit is "priced" once it carries both a holding size and a price. */
function isPriced(unit){
  return unit && unit.units !== null && unit.units !== undefined && unit.units !== ''
      && unit.price !== null && unit.price !== undefined && unit.price !== '';
}

function daysSince(dateISO){
  if(!dateISO) return null;
  const then = new Date(dateISO + 'T00:00:00');
  return Math.floor((TODAY - then) / 86400000);
}

/* Every unit that can carry a price: each sub-category of a split account, or the
   account itself when it isn't split. Returned with its parent for editing. */
function allUnits(){
  const out = [];
  (state.accounts||[]).forEach(a=>{
    if(a.subCategories && a.subCategories.length){
      a.subCategories.forEach(sub=> out.push({
        acc:a, unit:sub, subId:sub.id,
        name:`${a.name} · ${sub.name}`,
        currency: sub.currency || a.currency
      }));
    } else {
      out.push({ acc:a, unit:a, subId:null, name:a.name, currency:a.currency });
    }
  });
  return out;
}

/* Units taking part in the core/satellite structure, valued in AUD. */
function investedUnits(){
  return allUnits()
    .filter(u=> accountSleeve(u.acc))
    .map(u=>{
      const bal = unitBalanceAsOf(u.unit, isoDate(TODAY));
      return { ...u,
        sleeve: accountSleeve(u.acc),
        targetWeight: Number(u.unit.targetWeight) || 0,
        balance: bal,
        valueAUD: toAUD(bal, u.currency),
        units: Number(u.unit.units) || 0,
        price: Number(u.unit.price) || 0,
        pricedAt: u.unit.pricedAt || null,
        staleDays: daysSince(u.unit.pricedAt)
      };
    });
}

/* Record a new holding size and price. The change in value is split three ways:
     contribution = units bought or sold, valued at the new price
     revaluation  = the old holding repriced
     residual     = anything left over, e.g. a manual adjustment made in between
   so the decomposition always reconciles exactly to the balance. */
function applyPriceUpdate(unit, newUnits, newPrice, dateISO, dividend){
  const date = dateISO || isoDate(TODAY);
  const oldValue = unitBalanceAsOf(unit, date);
  const hadBoth  = isPriced(unit);
  const oldUnits = hadBoth ? Number(unit.units) : null;
  const oldPrice = hadBoth ? Number(unit.price) : null;
  const target   = newUnits * newPrice;
  const div      = Math.max(0, Number(dividend) || 0);

  const entries = [];
  if(hadBoth){
    // A reinvested dividend shows up as extra units, but it is NOT money you put
    // in — it's return the holding produced. Splitting it out here keeps the cost
    // basis honest, and therefore the profit percentage honest too.
    const unitChangeValue = (newUnits - oldUnits) * newPrice;
    // A dividend can only have been reinvested to the extent the holding actually
    // grew. Anything beyond that was taken as cash: it's income, but it never
    // entered this holding, so it must not reduce the cost basis either.
    const reinvested = Math.max(0, Math.min(div, unitChangeValue));
    const cashDiv    = div - reinvested;
    const contribution = unitChangeValue - reinvested;
    const revaluation  = oldUnits * (newPrice - oldPrice);
    const residual     = target - oldValue - unitChangeValue - revaluation;
    if(reinvested > 0.005) entries.push({ delta: reinvested, kind:'dividend' });
    // delta 0 keeps it out of the balance; amount carries the figure for reporting.
    if(cashDiv > 0.005)    entries.push({ delta: 0, amount: cashDiv, kind:'dividend' });
    if(Math.abs(contribution) > 0.005) entries.push({ delta: contribution, kind:'contribution' });
    if(Math.abs(revaluation)  > 0.005) entries.push({ delta: revaluation,  kind:'revaluation'  });
    if(Math.abs(residual)     > 0.005) entries.push({ delta: residual,     kind:'adjustment'   });
  } else {
    // First time priced: we don't know how much of what's already there was
    // contributed versus gained, so it all counts as opening cost, not as return.
    const delta = target - oldValue;
    if(Math.abs(delta) > 0.005) entries.push({ delta, kind:'adjustment' });
  }

  unit.history = unit.history || [];
  const noteFor = { contribution:'Units changed', revaluation:'Price change',
                    dividend:'Dividend', adjustment:'Reconciliation' };
  entries.forEach(e=>{
    const rec = { id: uid(), date, delta: e.delta, kind: e.kind, note: noteFor[e.kind] || 'Adjustment' };
    if(e.amount !== undefined){ rec.amount = e.amount; rec.note = 'Dividend (cash)'; }
    unit.history.push(rec);
  });
  unit.units = newUnits;
  unit.price = newPrice;
  unit.pricedAt = date;
  return entries;
}

/* What you put in versus what the market gave you. Contributions include the
   opening reconciliation, since money that was already invested is still money
   you put in — it just isn't a gain. */
function contributionSplit(units){
  let contributed = 0, gained = 0, value = 0;
  units.forEach(u=>{
    value += u.valueAUD;
    (u.unit.history||[]).forEach(h=>{
      const d = toAUD(Number(h.delta)||0, u.currency);
      if(h.kind === 'revaluation') gained += d;
      else if(h.kind === 'dividend') gained += (h.amount !== undefined ? Number(h.amount) : d);
      else contributed += d;
    });
    contributed += toAUD(Number(u.unit.openingBalance)||0, u.currency);
  });
  return { contributed, gained, value,
           returnPct: contributed > 0 ? gained/contributed*100 : null };
}

function stalePricedUnits(){
  const limit = Number(investSettings().staleDays) || 30;
  return allUnits()
    .filter(u=> isPriced(u.unit))
    .map(u=> ({ name:u.name, days: daysSince(u.unit.pricedAt) }))
    .filter(u=> u.days === null || u.days > limit)
    .sort((a,b)=> (b.days||0) - (a.days||0));
}

/* ---- Rebalancing ---------------------------------------------------------
   Three scopes, all running through the same maths. "whole" treats the two
   sleeves as the two buckets; "core" and "satellite" treat the holdings inside
   one sleeve as the buckets, with their target weights normalised to 100%. */
function rebalanceBuckets(scope){
  const inv = investedUnits();
  if(!inv.length) return { buckets:[], total:0, scope };

  if(scope === 'whole'){
    const coreTarget = Math.max(0, Math.min(100, Number(investSettings().coreTarget) || 0));
    const sum = k=> inv.filter(u=> u.sleeve===k).reduce((s,u)=> s+u.valueAUD, 0);
    const buckets = [
      { key:'core',      name:'Core',      value: sum('core'),      target: coreTarget },
      { key:'satellite', name:'Satellite', value: sum('satellite'), target: 100-coreTarget }
    ];
    return { buckets, total: buckets.reduce((s,b)=>s+b.value,0), scope };
  }

  const inSleeve = inv.filter(u=> u.sleeve === scope);
  const weightSum = inSleeve.reduce((s,u)=> s + u.targetWeight, 0);
  const buckets = inSleeve.map(u=> ({
    key: u.subId ? `${u.acc.id}|||${u.subId}` : u.acc.id,
    name: u.subId ? u.unit.name : u.acc.name,
    value: u.valueAUD,
    rawWeight: (u.unit.targetWeight === undefined || u.unit.targetWeight === null) ? null : u.unit.targetWeight,
    // With no weights set, an equal split is the only defensible default.
    target: weightSum > 0 ? u.targetWeight/weightSum*100 : 100/inSleeve.length,
    weightsSet: weightSum > 0
  }));
  return { buckets, total: buckets.reduce((s,b)=>s+b.value,0), scope,
           weightsSet: weightSum > 0 };
}

/* Drift, plus the trades that would close it. A positive action means buy. */
function rebalancePlan(scope, contribution){
  const { buckets, total } = rebalanceBuckets(scope);
  const C = Math.max(0, Number(contribution) || 0);
  if(!buckets.length || total + C <= 0) return { rows:[], total, contribution:C, allocated:0 };

  const newTotal = total + C;
  const rows = buckets.map(b=>{
    const desired = b.target/100 * newTotal;
    return { ...b,
      currentPct: total > 0 ? b.value/total*100 : 0,
      desired,
      need: Math.max(0, desired - b.value),     // shortfall against the post-contribution target
      trade: desired - b.value                  // + buy, − sell, if rebalancing outright
    };
  });
  rows.forEach(r=> r.driftPp = r.currentPct - r.target);

  // Allocate the contribution to whatever is furthest below target first. When the
  // contribution more than covers every shortfall, the remainder goes out by target
  // weight — which keeps you on target rather than overshooting into a new drift.
  const needSum = rows.reduce((s,r)=> s+r.need, 0);
  if(C > 0){
    if(needSum <= 0){
      rows.forEach(r=> r.allocate = C * r.target/100);
    } else if(needSum <= C){
      const left = C - needSum;
      rows.forEach(r=> r.allocate = r.need + left * r.target/100);
    } else {
      rows.forEach(r=> r.allocate = C * r.need/needSum);
    }
  } else {
    rows.forEach(r=> r.allocate = 0);
  }

  // Where each bucket lands once the contribution is applied — the honest test of
  // whether new money alone is enough to fix the drift.
  rows.forEach(r=>{
    r.afterValue = r.value + r.allocate;
    r.afterPct = newTotal > 0 ? r.afterValue/newTotal*100 : 0;
    r.afterDriftPp = r.afterPct - r.target;
  });

  const worstAfter = rows.reduce((m,r)=> Math.max(m, Math.abs(r.afterDriftPp)), 0);
  return { rows, total, contribution:C, newTotal,
           allocated: rows.reduce((s,r)=> s+r.allocate, 0),
           worstDrift: rows.reduce((m,r)=> Math.max(m, Math.abs(r.driftPp)), 0),
           worstAfter };
}

/* =========================================================
   LIQUIDITY
   Four questions the balance sheet should answer: how long you'd last if
   income stopped, how much cash you could actually raise and how fast,
   whether the currency you hold matches the currency you'll spend, and
   whether you're still inside the limits you set yourself.
========================================================= */
const SPEED_ORDER  = ['today','week','month','locked'];
const SPEED_LABELS = { today:'Today', week:'This week', month:'This month', locked:'Locked' };
const DEFAULT_SPEED = 'month';   // used for accounts not yet tagged; flagged in the UI

function liqSettings(){ return state.settings.liquidity; }

/* An expense category you'd keep paying if income stopped. Stored as
   "Expenses|||<category>" so it survives a rename the same way the ☆ flag does. */
function isEssentialCategory(cat){
  return (state.settings.essentialCategories||[]).includes('Expenses|||' + cat);
}
function toggleCategoryEssential(cat){
  const key = 'Expenses|||' + cat;
  const list = new Set(state.settings.essentialCategories || []);
  list.has(key) ? list.delete(key) : list.add(key);
  state.settings.essentialCategories = [...list];
  saveState(); render();
}

/* An account's tagged cash speed, or null when it hasn't been set yet. */
function accountSpeed(a){
  const s = (liqSettings().speeds||{})[a.id];
  return SPEED_ORDER.includes(s) ? s : null;
}

/* The last n COMPLETE calendar months, newest first. The current month is
   deliberately excluded — it's only part-way through, so averaging it in
   would understate spending and flatter the runway. */
function completeMonths(n){
  const out = [];
  let y = TODAY.getFullYear(), m = TODAY.getMonth() - 1;
  for(let i=0; i<n; i++){
    if(m < 0){ m = 11; y--; }
    out.push({ year:y, month:m });
    m--;
  }
  return out;
}

/* Monthly spending, split into everything vs essentials only, plus monthly income.
   Two bases: a rolling average of the last three complete months of actuals
   (the default — how you really live), or the year's budget (how you planned to). */
function liquiditySpending(){
  const basis = liqSettings().spendBasis === 'budget' ? 'budget' : 'actuals';
  const perCat = {};
  let income = 0, label = '';

  if(basis === 'budget'){
    const y = state.ui.planYear || TODAY.getFullYear();
    const plan = (state.planning||{})[y] || {};
    Object.entries(plan.Expenses || {}).forEach(([cat, arr])=>{
      const nums = (arr||[]).map(v=> Number(v)||0);
      perCat[cat] = nums.reduce((a,b)=>a+b, 0) / 12;
    });
    Object.entries(plan.Income || {}).forEach(([cat, arr])=>{
      const nums = (arr||[]).map(v=> Number(v)||0);
      income += nums.reduce((a,b)=>a+b, 0) / 12;
    });
    label = `${y} budget, monthly average`;
  } else {
    const win = Math.max(1, Math.min(24, Number(liqSettings().spendWindow) || 6));
    // Only months that actually contain transactions are averaged. Counting a month
    // you simply hadn't started recording yet as a zero-spend month would halve the
    // figure and double the runway — the most flattering possible way to be wrong.
    const observed = completeMonths(win).filter(({year, month})=>{
      const t = trackedTotals(year, month);
      return sumType(t.Expenses) !== 0 || sumType(t.Income) !== 0;
    });
    if(!observed.length){
      return { perCat:{}, total:0, essential:0, essCount:0, income:0, basis, months:0,
               label:'no complete months recorded yet' };
    }
    observed.forEach(({year, month})=>{
      const t = trackedTotals(year, month);
      Object.entries(t.Expenses).forEach(([cat, v])=>{ perCat[cat] = (perCat[cat]||0) + v; });
      income += sumType(t.Income);
    });
    Object.keys(perCat).forEach(cat=> perCat[cat] = perCat[cat] / observed.length);
    income = income / observed.length;
    const first = observed[observed.length-1], last = observed[0];
    const shortfall = observed.length < win ? ` · only ${observed.length} of ${win} recorded` : '';
    label = `average of ${MONTHS[first.month]} ${first.year} – ${MONTHS[last.month]} ${last.year}${shortfall}`;
  }

  const essential = new Set(state.settings.essentialCategories || []);
  let total = 0, ess = 0, essCount = 0;
  Object.entries(perCat).forEach(([cat, v])=>{
    total += v;
    if(essential.has('Expenses|||' + cat)){ ess += v; essCount++; }
  });
  return { perCat, total, essential: ess, essCount, income, basis, label };
}

/* Cash grouped by how quickly it can actually be spent, then accumulated.
   Savings contributions are not counted as spending anywhere here: if income
   stops, saving stops with it — only expenses keep running. */
function liquidityLadder(){
  const buckets = { today:0, week:0, month:0, locked:0 };
  const untagged = [];
  (state.accounts||[]).forEach(a=>{
    const bal = accountBalanceAUD(a);
    const sp  = accountSpeed(a);
    if(!sp) untagged.push(a.name);
    buckets[sp || DEFAULT_SPEED] += bal;
  });
  const cum = {
    today: buckets.today,
    week:  buckets.today + buckets.week,
    month: buckets.today + buckets.week + buckets.month
  };
  return { buckets, cum, locked: buckets.locked,
           reachable: cum.month, net: cum.month + buckets.locked, untagged };
}

/* Share of the balance sheet held in baht, walking sub-categories so a split
   account with mixed currencies is counted correctly rather than by its parent. */
function currencyExposure(){
  const today = isoDate(TODAY);
  let thb = 0, all = 0;
  (state.accounts||[]).forEach(a=>{
    if(a.subCategories && a.subCategories.length){
      a.subCategories.forEach(sub=>{
        const cur = sub.currency || a.currency;
        const v = toAUD(unitBalanceAsOf(sub, today), cur);
        all += v; if(cur === 'THB') thb += v;
      });
    } else {
      const v = accountBalanceAUD(a);
      all += v; if(a.currency === 'THB') thb += v;
    }
  });
  return { thbAUD: thb, net: all, thbPct: all > 0 ? thb/all*100 : 0 };
}

/* Concentration measured at HOLDING level: a split account contributes each
   sub-category separately, so a broker holding VT, NVDA and cash reads as three
   positions rather than one lump. Locked accounts are excluded throughout.
   The account-level figure is returned alongside it, because holding-level
   concentration says nothing about having one provider between you and all of it. */
function liquidityConcentration(reachable){
  const today = isoDate(TODAY);
  const units = [], accts = [];
  (state.accounts||[])
    .filter(a=> (accountSpeed(a) || DEFAULT_SPEED) !== 'locked')
    .forEach(a=>{
      accts.push({ name:a.name, bal: accountBalanceAUD(a) });
      if(a.subCategories && a.subCategories.length){
        a.subCategories.forEach(sub=> units.push({
          name: `${a.name} · ${sub.name}`,
          bal: toAUD(unitBalanceAsOf(sub, today), sub.currency || a.currency)
        }));
      } else {
        units.push({ name:a.name, bal: accountBalanceAUD(a) });
      }
    });
  const top = list=> list.length ? list.reduce((m,x)=> x.bal > m.bal ? x : m, list[0]) : { name:'—', bal:0 };
  if(reachable <= 0) return { pct:0, name:'—', acctPct:0, acctName:'—', splitCount: units.length - accts.length };
  const u = top(units), a = top(accts);
  return {
    pct: u.bal/reachable*100, name: u.name,
    acctPct: a.bal/reachable*100, acctName: a.name,
    splitCount: units.length - accts.length
  };
}

function months1(v){ return (v === Infinity || isNaN(v)) ? '—' : v.toFixed(1) + ' mo'; }

/* ---- Snapshots -------------------------------------------------------------
   Every figure on this tab is point-in-time, which hides the thing that matters
   most: direction. One record a month is enough to show whether runway is
   improving or the fixed-cost share is creeping up. Captured automatically the
   first time the tab is opened in a new month, and never back-dated — a month
   that was never observed stays absent rather than being invented later. */
const SNAPSHOT_CAP = 120;

function monthKey(d){ return isoDate(d).slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-');
  return `${MONTHS[Number(m)-1]} ${y.slice(2)}`;
}

function buildSnapshot(){
  const sp   = liquiditySpending();
  const lad  = liquidityLadder();
  const fx   = currencyExposure();
  const conc = liquidityConcentration(lad.reachable);
  const L    = liqSettings();
  const tierCash = lad.cum[L.runwayTier] !== undefined ? lad.cum[L.runwayTier] : lad.cum.week;
  return {
    month: monthKey(TODAY),
    capturedAt: isoDate(TODAY),
    today: lad.cum.today, week: lad.cum.week, month_: lad.cum.month,
    locked: lad.locked, net: lad.net,
    spendTotal: sp.total, spendEss: sp.essential, income: sp.income,
    tier: L.runwayTier,
    runwayEss: sp.essential > 0 ? tierCash/sp.essential : null,
    fixedPct:  sp.income   > 0 ? sp.essential/sp.income*100 : null,
    thbPct: fx.thbPct, concPct: conc.pct
  };
}

/* Returns true when a new record was written, so the caller can re-render. */
function captureSnapshot(force){
  const L = liqSettings();
  L.snapshots = Array.isArray(L.snapshots) ? L.snapshots : [];
  const key = monthKey(TODAY);
  const idx = L.snapshots.findIndex(s=> s.month === key);
  if(idx >= 0 && !force) return false;
  const snap = buildSnapshot();
  if(idx >= 0) L.snapshots[idx] = snap; else L.snapshots.push(snap);
  L.snapshots.sort((a,b)=> a.month < b.month ? -1 : 1);
  if(L.snapshots.length > SNAPSHOT_CAP) L.snapshots = L.snapshots.slice(-SNAPSHOT_CAP);
  saveState();
  return true;
}

function deltaCell(cur, prev, opts){
  const o = opts || {};
  if(cur === null || cur === undefined || prev === null || prev === undefined) return '';
  const d = cur - prev;
  if(Math.abs(d) < (o.epsilon || 0.05)) return `<span class="delta flat">→</span>`;
  const good = o.higherIsBetter ? d > 0 : d < 0;
  const txt = (d > 0 ? '+' : '') + (o.money ? moneyWhole(d) : d.toFixed(1) + (o.pct ? '%' : ''));
  return `<span class="delta ${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${txt}</span>`;
}

/* A bare sparkline — no axes, no labels. It only has to answer "which way". */
function sparkline(values){
  const pts = values.filter(v=> v !== null && v !== undefined && isFinite(v));
  if(pts.length < 2) return '';
  const w = 120, h = 26, pad = 2;
  const min = Math.min(...pts), max = Math.max(...pts);
  const span = (max - min) || 1;
  const step = (w - pad*2) / (pts.length - 1);
  const coords = pts.map((v,i)=> [pad + i*step, h - pad - ((v-min)/span)*(h - pad*2)]);
  const path = coords.map((c,i)=> (i?'L':'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1)).join(' ');
  const last = coords[coords.length-1];
  const rising = pts[pts.length-1] >= pts[0];
  const col = rising ? 'var(--green)' : 'var(--amber)';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px; height:${h}px; display:block;">
    <path d="${path}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2" fill="${col}"/>
  </svg>`;
}

/* The three spendable tiers, cheapest-to-touch first. Locked is never included:
   the point of the tier view is to see how far you get WITHOUT reaching for the
   money you'd rather leave alone. */
const RUNWAY_TIERS = [
  { key:'today', label:'Today only',        note:'cash in hand' },
  { key:'week',  label:'+ within a week',   note:'plus anything that clears in days' },
  { key:'month', label:'+ within a month',  note:'plus term deposits and slower assets' }
];
function tierLabel(key){
  const t = RUNWAY_TIERS.find(x=> x.key===key);
  return t ? t.label : key;
}

/* Green when the limit holds, amber within 10% of the line, pink once breached —
   a limit you're about to cross is more use than one you already have. */
function limitPill(value, limit, higherIsBetter){
  const pass = higherIsBetter ? value >= limit : value <= limit;
  const near = higherIsBetter ? value >= limit*0.9 : value <= limit*1.1;
  const cls  = pass ? 'pass' : (near ? 'close' : 'breach');
  const txt  = pass ? 'Pass' : (near ? 'Close' : 'Breach');
  return `<span class="pill ${cls}">${txt}</span>`;
}

function renderLiquidity(c){
  captureSnapshot(false);   // first visit each month writes a record; later visits don't
  const L    = liqSettings();
  const sp   = liquiditySpending();

  const conc = liquidityConcentration(lad.reachable);

  const runCur = sp.total > 0 ? lad.reachable/sp.total : Infinity;
  const runEss = sp.essential > 0 ? lad.reachable/sp.essential : Infinity;
  // The limit is judged against whichever tier you're willing to spend down,
  // not automatically the largest one — untouched investments shouldn't flatter it.
  const limitCash = lad.cum[L.runwayTier] !== undefined ? lad.cum[L.runwayTier] : lad.cum.week;
  const runEssTier = sp.essential > 0 ? limitCash/sp.essential : Infinity;
  const fixedPct = sp.income > 0 ? sp.essential/sp.income*100 : 0;
  const gap = Math.abs((Number(L.thbSpendShare)||0) - fx.thbPct);

  const notice = [];
  if(!sp.essCount) notice.push('No categories are marked essential yet, so the essentials-only runway is empty. Tick them in Settings → Categories.');
  if(lad.untagged.length) notice.push(`${lad.untagged.length} account${lad.untagged.length>1?'s have':' has'} no cash speed set and ${lad.untagged.length>1?'are':'is'} being counted as “this month”: ${lad.untagged.join(', ')}. Set them on the Net Worth tab.`);

  const max = Math.max(lad.net, 1);
  const rung = (label, val, cls)=> `
    <div class="rung ${cls||''}">

      <div class="track"><div class="fill" style="width:${Math.min(100, val/max*100).toFixed(1)}%"></div></div>
      <div class="rv">${moneyWhole(val)}</div>
    </div>`;

  c.innerHTML = `
    <div class="toolbar">
      <div class="liq-basis">
        <span>Spending measured from</span>
        <select id="liqBasis" style="width:auto;">
          <option value="actuals" ${sp.basis==='actuals'?'selected':''}>Actuals — last 3 complete months</option>
          <option value="budget" ${sp.basis==='budget'?'selected':''}>Budget — this year's plan</option>
        </select>
      </div>
      <div class="spacer"></div>
      <div class="muted" style="font-size:11.5px;">${sp.label}</div>
    </div>

    ${notice.map(n=> `<div class="liq-banner">${n}</div>`).join('')}

    <div class="liq-q"><span class="n">1</span><span class="t">If income stopped today, how long could I live?</span></div>
    <div class="liq-sub">Each row adds a slower source of cash, so you can see how far you get before having to touch the money you'd rather leave invested. Locked accounts are excluded entirely. Savings contributions aren't counted as spending &mdash; if income stops, saving stops with it.</div>
    <div class="liq-body">
      <div class="card">
        <table class="tiers">
          <thead>
            <tr>
              <th>What you'd spend down</th>
              <th class="r">Cash</th>

              <th class="r">Essentials only<div class="sub">${moneyWhole(sp.essential)}/mo</div></th>
            </tr>
          </thead>
          <tbody>
            ${RUNWAY_TIERS.map(t=>{
              const cash = lad.cum[t.key];
              const rc = sp.total > 0 ? cash/sp.total : Infinity;
              const re = sp.essential > 0 ? cash/sp.essential : Infinity;
              const isLimit = (L.runwayTier||'week') === t.key;
              return `
              <tr class="${isLimit?'tier-limit':''}">
                <td>${t.label}${isLimit?' <span class="pill Savings" style="margin-left:5px;">limit</span>':''}<div class="sub">${t.note}</div></td>
                <td class="r">${moneyWhole(cash)}</td>
                <td class="r">${months1(rc)}</td>
                <td class="r" style="color:var(--gold-bright);">${months1(re)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div class="liq-note">
          Essentials cover ${sp.essCount} categor${sp.essCount===1?'y':'ies'}; cutting the rest frees ${moneyWhole(sp.total - sp.essential)} a month.

    <div class="liq-q"><span class="n">2</span><span class="t">If I needed cash urgently, how much could I get?</span></div>
    <div class="liq-sub">Net worth is not the same as available money. Each rung adds the accounts that clear within that window.</div>
    <div class="liq-body">
      <div class="card">
        ${rung('Today', lad.cum.today)}

    <div class="liq-sub">If most of your eventual spending is in baht but most of your assets sit in dollars, you're carrying an exchange rate bet whether you chose it or not.</div>
    <div class="liq-body">
      <div class="row">
        <div class="card metric">
          <h3>Assets held in baht</h3>

          </tr>

            <td class="lv">${moneyWhole(lad.cum.today)}</td>

          </tr>
        </table>
        ${conc.splitCount > 0 ? `<div class="liq-note">Holdings inside split accounts are measured separately. At account level the largest single exposure is ${conc.acctName} at ${conc.acctPct.toFixed(0)}% — that's one provider between you and that money, which the limit above doesn't capture.</div>` : ''}

  if(snapBtn) snapBtn.onclick = ()=>{
    captureSnapshot(true);

function liquidityTrendHTML(){
  const snaps = (liqSettings().snapshots || []).slice(-6);
  const thisMonth = monthKey(TODAY);
  if(snaps.length < 2){
    return `
      <div class="liq-q"><span class="n">5</span><span class="t">Which way is this moving?</span></div>
      <div class="liq-sub">A snapshot is saved automatically the first time you open this tab each month. Once there are two, this section shows the direction of travel rather than just today's position.</div>
      <div class="liq-body">
        <div class="card">
          <div class="muted" style="font-size:12.5px;">
            ${snaps.length===1
              ? `First snapshot saved for ${monthLabel(snaps[0].month)}. The trend appears next month.`
              : `No snapshots yet.`}
          </div>
          <div class="toolbar" style="margin:12px 0 0 0;"><button class="btn secondary" id="liqSnapNow">Update this month's snapshot</button></div>
        </div>
      </div>`;
  }
  const prev = snaps[snaps.length-2], cur = snaps[snaps.length-1];
  const col = k=> snaps.map(s=> s[k]);
  const row = (label, key, fmt, opts)=> `
    <tr>
      <td>${label}</td>
      <td class="r">${fmt(cur[key])}</td>
      <td class="r">${deltaCell(cur[key], prev[key], opts)}</td>
      <td class="spark">${sparkline(col(key))}</td>
    </tr>`;
  const mo   = v=> (v===null||v===undefined) ? '—' : v.toFixed(1)+' mo';
  const pct  = v=> (v===null||v===undefined) ? '—' : v.toFixed(0)+'%';
  return `
    <div class="liq-q"><span class="n">5</span><span class="t">Which way is this moving?</span></div>
    <div class="liq-sub">Last ${snaps.length} monthly snapshots, ${monthLabel(snaps[0].month)} to ${monthLabel(cur.month)}. A direction is worth more than a level — a shrinking runway tells you something months before it breaches a limit.</div>
    <div class="liq-body">
      <div class="card">
        <table class="trend">
          <thead><tr><th></th><th class="r">${monthLabel(cur.month)}</th><th class="r">vs ${monthLabel(prev.month)}</th><th class="spark"></th></tr></thead>
          <tbody>
            ${row('Runway on essentials', 'runwayEss', mo,  { higherIsBetter:true })}
            ${row('Cash reachable today', 'today',     moneyWhole, { higherIsBetter:true, money:true, epsilon:1 })}
            ${row('Essential spending',   'spendEss',  moneyWhole, { higherIsBetter:false, money:true, epsilon:1 })}
            ${row('Essential share of income', 'fixedPct', pct, { higherIsBetter:false, pct:true })}
            ${row('Largest holding',      'concPct',   pct, { higherIsBetter:false, pct:true })}
            ${row('Assets held in baht',  'thbPct',    pct, { higherIsBetter:true, pct:true })}
          </tbody>
        </table>
        <div class="liq-note" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <span>${cur.month===thisMonth ? `${monthLabel(cur.month)} was captured on ${formatDateShort(cur.capturedAt)}.` : `No snapshot yet for ${monthLabel(thisMonth)}.`}</span>
          <button class="btn secondary" id="liqSnapNow" style="margin-left:auto;">Update this month's snapshot</button>
        </div>
      </div>
    </div>`;
}

/* =========================================================
   BACKUP / RESTORE
========================================================= */
/* A backup is a file that gets emailed, uploaded and left in Downloads, so any
   credential comes out before it's written. Restoring simply asks for the key again. */
function exportSafeState(){
  const copy = JSON.parse(JSON.stringify(state));
  if(copy.settings) delete copy.settings.quoteToken;
  return copy;
}

function exportBackup(){
  const meta = profiles.list.find(p=>p.id===profiles.activeId);
  const safeName = (meta ? meta.name : 'profile').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  const blob = new Blob([JSON.stringify(exportSafeState(), null, 2)], {type:'application/json'});
  downloadBlob(blob, `ledger-${safeName}-${isoDate(TODAY)}.json`);
  toast('Backup downloaded.');
}

document.getElementById('exportBtn').onclick = exportBackup;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.categories || !parsed.transactions){ throw new Error('Not a recognized backup file.'); }
      if(confirm('Import will replace all data in the current profile. Continue?')){
        state = {...defaultState(), ...parsed};
        saveState(); render(); toast('Backup imported.');
      }
    }catch(err){
      toast('Could not read that file — is it a Ledger backup?');
      console.error(err);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* =========================================================
   INIT
========================================================= */
if(AUTO_SAVE_SUPPORTED && state.settings.autoSaveEnabled && !autoSaveHandle){
  // The file handle can't survive a page reload — require a conscious re-link
  // rather than silently falling back to downloading a new copy every change.
  state.settings.autoSaveEnabled = false;
}
applyTheme(loadTheme());
renderProfileSwitcher();
renderCloudStatus();
wireMoreSheet();
render();
refreshFxRates(false);
// A copy of whatever we opened with, before this session can change anything.
// Rate limited internally, so reopening the app repeatedly doesn't churn the list.
captureRestorePoint('App opened', false);
