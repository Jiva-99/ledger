/* Full history for an account or sub-category: opening balance as the first row,
   then every adjustment in date order, with a running balance and edit/delete per entry. */
function openHistoryModal(accId, subId){
  const acc = state.accounts.find(a=>a.id===accId);
  if(!acc) return;
  const unit = subId ? (acc.subCategories||[]).find(s=>s.id===subId) : acc;
  if(!unit) return;
  const label = subId ? `${acc.name} — ${unit.name}` : acc.name;
  const cur = subId ? (unit.currency||acc.currency) : acc.currency;

  function paint(){
    const root = document.getElementById('modalRoot');
    const histWithIdx = (unit.history||[]).map((h,i)=>({...h, _idx:i}));
    histWithIdx.sort((a,b)=> a.date<b.date ? -1 : (a.date>b.date ? 1 : 0));

    let running = Number(unit.openingBalance)||0;
    const rows = [`
      <tr>
        <td class="muted">${unit.openingDate}</td>
        <td class="num">${moneyCur(unit.openingBalance, cur)}</td>
        <td class="muted" style="font-size:12px;">Opening balance</td>
        <td class="num">${moneyCur(running, cur)}</td>
        <td><button class="icon-btn" style="color:var(--gold);" data-histeditopen title="Edit opening balance">✎</button></td>
      </tr>
    `];
    histWithIdx.forEach(h=>{
      running += Number(h.delta)||0;
      rows.push(`
        <tr>
          <td class="muted">${h.date}</td>
          <td class="num ${h.delta>=0?'pos':'neg'}">${h.delta>=0?'+':''}${moneyCur(h.delta, cur)}</td>
          <td class="muted" style="font-size:12px;">${h.note||''}</td>
          <td class="num">${moneyCur(running, cur)}</td>
          <td>
            <button class="icon-btn" style="color:var(--gold);" data-histedit="${h._idx}" title="Edit">✎</button>
            <button class="icon-btn" data-histdel="${h._idx}" title="Delete">✕</button>
          </td>
        </tr>
      `);
    });

    root.innerHTML = `
      <div class="modal-backdrop" id="mb">
        <div class="modal" style="width:540px;">
          <h2>History — ${label}</h2>
          <div class="page-sub">Newest first. "Balance" is the running total after each entry.</div>
          <div style="max-height:360px; overflow-y:auto;">
            <table class="data">
              <thead><tr><th>Date</th><th class="num">Amount</th><th>Note</th><th class="num">Balance</th><th></th></tr></thead>
              <tbody>${rows.slice().reverse().join('')}</tbody>
            </table>
          </div>
          <div class="form-actions">
            <button class="btn secondary" id="fClose">Close</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('fClose').onclick = ()=> root.innerHTML='';
    document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') root.innerHTML=''; });

    const openEditBtn = root.querySelector('[data-histeditopen]');
    if(openEditBtn) openEditBtn.onclick = ()=>{
      const newAmt = prompt(`Opening balance (in ${cur}):`, unit.openingBalance);
      if(newAmt===null) return;
      const newDate = prompt('Opening date (YYYY-MM-DD):', unit.openingDate);
      if(newDate===null) return;
      unit.openingBalance = Number(newAmt)||0;
      if(newDate.trim()) unit.openingDate = newDate.trim();
      saveState(); paint(); render();
    };
    root.querySelectorAll('[data-histedit]').forEach(b=>{
      b.onclick = ()=>{
        const idx = Number(b.dataset.histedit);
        const h = unit.history[idx];
        if(!h) return;
        const newAmt = prompt(`Amount (use negative for withdrawal, in ${cur}):`, h.delta);
        if(newAmt===null) return;
        const newDate = prompt('Date (YYYY-MM-DD):', h.date);
        if(newDate===null) return;
        const newNote = prompt('Note:', h.note||'');
        if(newNote===null) return;
        h.delta = Number(newAmt)||0;
        if(newDate.trim()) h.date = newDate.trim();
        h.note = newNote.trim();
        saveState(); paint(); render();
      };
    });
    root.querySelectorAll('[data-histdel]').forEach(b=>{
      b.onclick = ()=>{
        if(confirm('Delete this entry? This cannot be undone.')){
          const idx = Number(b.dataset.histdel);
          unit.history.splice(idx,1);
          saveState(); paint(); render();
        }
      };
    });
  }
  paint();
}

/* =========================================================
   BILLS
========================================================= */
function currentMonthKey(){ return isoDate(TODAY).slice(0,7); }

function nextDueDate(bill){
  if(!bill.lastPaidDate) return null;
  const d = new Date(bill.lastPaidDate+'T00:00:00');
  if(bill.frequency==='Annually'){
    d.setFullYear(d.getFullYear()+1);
    return d;
  }
  // Clamp to the target month's real last day (e.g. Jan 31 -> Feb 28/29, not overflowing into March).
  const targetYear = d.getFullYear();
  const targetMonth = d.getMonth()+1;
  const lastDayOfTargetMonth = new Date(targetYear, targetMonth+1, 0).getDate();
  const day = Math.min(d.getDate(), lastDayOfTargetMonth);
  return new Date(targetYear, targetMonth, day);
}

function dueBadge(bill){
  const nd = nextDueDate(bill);
  if(!nd) return `<span class="muted">Not yet paid</span>`;
  const days = Math.round((nd - new Date(isoDate(TODAY)+'T00:00:00')) / 86400000);
  const dateStr = isoDate(nd);
  if(days < 0) return `<span class="neg">${dateStr} — overdue ${Math.abs(days)}d</span>`;
  if(days === 0) return `<span class="neg">${dateStr} — due today</span>`;
  if(days <= 5) return `<span style="color:var(--amber);">${dateStr} — in ${days}d</span>`;
  return `<span class="muted">${dateStr} — in ${days}d</span>`;
}

function moveCategory(type, cat, direction){
  const arr = state.categories[type];
  const idx = arr.indexOf(cat);
  if(idx===-1) return;
  const swapIdx = idx + direction;
  if(swapIdx<0 || swapIdx>=arr.length) return;
  [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
  saveState(); render();
}

function toggleCategorySpecial(type, cat){
  const key = type+'|||'+cat;
  const list = new Set(state.settings.excludedFromSummary||[]);
  if(list.has(key)) list.delete(key); else list.add(key);
  state.settings.excludedFromSummary = [...list];
  saveState(); render();
}

function renameCategory(type, oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  if(state.categories[type].includes(newName)){ toast('That category already exists.'); return; }
  const idx = state.categories[type].indexOf(oldName);
  if(idx===-1) return;
  state.categories[type][idx] = newName;

  // Carry the rename through everywhere the old name is referenced
  Object.keys(state.planning).forEach(yr=>{
    const bucket = state.planning[yr] && state.planning[yr][type];
    if(bucket && bucket[oldName]){ bucket[newName] = bucket[oldName]; delete bucket[oldName]; }
  });
  state.transactions.forEach(tx=>{ if(tx.type===type && tx.category===oldName) tx.category = newName; });
  if(type==='Expenses'){
    state.settings.weeklyExcludedCategories = (state.settings.weeklyExcludedCategories||[]).map(c=> c===oldName ? newName : c);
  }
  if(type==='Savings'){
    state.accounts.forEach(a=>{ if(a.linkedCategory===oldName) a.linkedCategory = newName; });
  }
  state.settings.excludedFromSummary = (state.settings.excludedFromSummary||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);
  state.settings.essentialCategories = (state.settings.essentialCategories||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);

  saveState(); render(); toast(`Renamed to "${newName}".`);
}

/* =========================================================
   LIQUIDITY
   Four questions the balance sheet should answer: how long you'd last if
   income stopped, how much cash you could actually raise and how fast,
   whether the currency you hold matches the currency you'll spend, and
   whether you're still inside the limits you set yourself.
========================================================= */
const SPEED_ORDER  = ['today','week','month','locked'];
const SPEED_LABELS = { today:'Today', week:'This week', month:'This month', locked:'Locked' };
const DEFAULT_SPEED = 'month';   // used for accounts not yet tagged; flagged in the UI

function liqSettings(){ return state.settings.liquidity; }

/* An expense category you'd keep paying if income stopped. Stored as
   "Expenses|||<category>" so it survives a rename the same way the ☆ flag does. */
function isEssentialCategory(cat){
  return (state.settings.essentialCategories||[]).includes('Expenses|||' + cat);
}
function toggleCategoryEssential(cat){
  const key = 'Expenses|||' + cat;
  const list = new Set(state.settings.essentialCategories || []);
  list.has(key) ? list.delete(key) : list.add(key);
  state.settings.essentialCategories = [...list];
  saveState(); render();
}

/* An account's tagged cash speed, or null when it hasn't been set yet. */
function accountSpeed(a){
  const s = (liqSettings().speeds||{})[a.id];
  return SPEED_ORDER.includes(s) ? s : null;
}

/* The last n COMPLETE calendar months, newest first. The current month is
   deliberately excluded — it's only part-way through, so averaging it in
   would understate spending and flatter the runway. */
function completeMonths(n){
  const out = [];
  let y = TODAY.getFullYear(), m = TODAY.getMonth() - 1;
  for(let i=0; i<n; i++){
    if(m < 0){ m = 11; y--; }
    out.push({ year:y, month:m });
    m--;
  }
  return out;
}

/* Monthly spending, split into everything vs essentials only, plus monthly income.
   Two bases: a rolling average of the last three complete months of actuals
   (the default — how you really live), or the year's budget (how you planned to). */
function liquiditySpending(){
  const basis = liqSettings().spendBasis === 'budget' ? 'budget' : 'actuals';
  const perCat = {};
  let income = 0, label = '';

  if(basis === 'budget'){
    const y = state.ui.planYear || TODAY.getFullYear();
    const plan = (state.planning||{})[y] || {};
    Object.entries(plan.Expenses || {}).forEach(([cat, arr])=>{
      const nums = (arr||[]).map(v=> Number(v)||0);
      perCat[cat] = nums.reduce((a,b)=>a+b, 0) / 12;
    });
    Object.entries(plan.Income || {}).forEach(([cat, arr])=>{
      const nums = (arr||[]).map(v=> Number(v)||0);
      income += nums.reduce((a,b)=>a+b, 0) / 12;
    });
    label = `${y} budget, monthly average`;
  } else {
    const months = completeMonths(3);
    months.forEach(({year, month})=>{
      const t = trackedTotals(year, month);
      Object.entries(t.Expenses).forEach(([cat, v])=>{ perCat[cat] = (perCat[cat]||0) + v; });
      income += sumType(t.Income);
    });
    Object.keys(perCat).forEach(cat=> perCat[cat] = perCat[cat] / months.length);
    income = income / months.length;
    const first = months[months.length-1], last = months[0];
    label = `average of ${MONTHS[first.month]} ${first.year} – ${MONTHS[last.month]} ${last.year}`;
  }

  const essential = new Set(state.settings.essentialCategories || []);
  let total = 0, ess = 0, essCount = 0;
  Object.entries(perCat).forEach(([cat, v])=>{
    total += v;
    if(essential.has('Expenses|||' + cat)){ ess += v; essCount++; }
  });
  return { perCat, total, essential: ess, essCount, income, basis, label };
}

/* Cash grouped by how quickly it can actually be spent, then accumulated.
   Savings contributions are not counted as spending anywhere here: if income
   stops, saving stops with it — only expenses keep running. */
function liquidityLadder(){
  const buckets = { today:0, week:0, month:0, locked:0 };
  const untagged = [];
  (state.accounts||[]).forEach(a=>{
    const bal = accountBalanceAUD(a);
    const sp  = accountSpeed(a);
    if(!sp) untagged.push(a.name);
    buckets[sp || DEFAULT_SPEED] += bal;
  });
  const cum = {
    today: buckets.today,
    week:  buckets.today + buckets.week,
    month: buckets.today + buckets.week + buckets.month
  };
  return { buckets, cum, locked: buckets.locked,
           reachable: cum.month, net: cum.month + buckets.locked, untagged };
}

/* Share of the balance sheet held in baht, walking sub-categories so a split
   account with mixed currencies is counted correctly rather than by its parent. */
function currencyExposure(){
  const today = isoDate(TODAY);
  let thb = 0, all = 0;
  (state.accounts||[]).forEach(a=>{
    if(a.subCategories && a.subCategories.length){
      a.subCategories.forEach(sub=>{
        const cur = sub.currency || a.currency;
        const v = toAUD(unitBalanceAsOf(sub, today), cur);
        all += v; if(cur === 'THB') thb += v;
      });
    } else {
      const v = accountBalanceAUD(a);
      all += v; if(a.currency === 'THB') thb += v;
    }
  });
  return { thbAUD: thb, net: all, thbPct: all > 0 ? thb/all*100 : 0 };
}

/* Largest single reachable account as a share of all reachable cash. Locked
   accounts are excluded — they're not part of the money you could move. */
function liquidityConcentration(reachable){
  const live = (state.accounts||[])
    .filter(a=> (accountSpeed(a) || DEFAULT_SPEED) !== 'locked')
    .map(a=> ({ name:a.name, bal: accountBalanceAUD(a) }));
  if(!live.length || reachable <= 0) return { pct:0, name:'—' };
  const top = live.reduce((m, x)=> x.bal > m.bal ? x : m, live[0]);
  return { pct: top.bal/reachable*100, name: top.name };
}

function months1(v){ return (v === Infinity || isNaN(v)) ? '—' : v.toFixed(1) + ' mo'; }

/* The three spendable tiers, cheapest-to-touch first. Locked is never included:
   the point of the tier view is to see how far you get WITHOUT reaching for the
   money you'd rather leave alone. */
const RUNWAY_TIERS = [
  { key:'today', label:'Today only',        note:'cash in hand' },
  { key:'week',  label:'+ within a week',   note:'plus anything that clears in days' },
  { key:'month', label:'+ within a month',  note:'plus term deposits and slower assets' }
];
function tierLabel(key){
  const t = RUNWAY_TIERS.find(x=> x.key===key);
  return t ? t.label : key;
}

/* Green when the limit holds, amber within 10% of the line, pink once breached —
   a limit you're about to cross is more use than one you already have. */
function limitPill(value, limit, higherIsBetter){
  const pass = higherIsBetter ? value >= limit : value <= limit;
  const near = higherIsBetter ? value >= limit*0.9 : value <= limit*1.1;
  const cls  = pass ? 'pass' : (near ? 'close' : 'breach');
  const txt  = pass ? 'Pass' : (near ? 'Close' : 'Breach');
  return `<span class="pill ${cls}">${txt}</span>`;
}

function renderLiquidity(c){
  const L    = liqSettings();
  const sp   = liquiditySpending();
  const lad  = liquidityLadder();
  const fx   = currencyExposure();
  const conc = liquidityConcentration(lad.reachable);

  const runCur = sp.total > 0 ? lad.reachable/sp.total : Infinity;
  const runEss = sp.essential > 0 ? lad.reachable/sp.essential : Infinity;
  // The limit is judged against whichever tier you're willing to spend down,
  // not automatically the largest one — untouched investments shouldn't flatter it.
  const limitCash = lad.cum[L.runwayTier] !== undefined ? lad.cum[L.runwayTier] : lad.cum.week;
  const runEssTier = sp.essential > 0 ? limitCash/sp.essential : Infinity;
  const fixedPct = sp.income > 0 ? sp.essential/sp.income*100 : 0;
  const gap = Math.abs((Number(L.thbSpendShare)||0) - fx.thbPct);

  const notice = [];
  if(!sp.essCount) notice.push('No categories are marked essential yet, so the essentials-only runway is empty. Tick them in Settings → Categories.');
  if(lad.untagged.length) notice.push(`${lad.untagged.length} account${lad.untagged.length>1?'s have':' has'} no cash speed set and ${lad.untagged.length>1?'are':'is'} being counted as “this month”: ${lad.untagged.join(', ')}. Set them on the Net Worth tab.`);

  const max = Math.max(lad.net, 1);
  const rung = (label, val, cls)=> `
    <div class="rung ${cls||''}">
      <div class="rl">${label}</div>
      <div class="track"><div class="fill" style="width:${Math.min(100, val/max*100).toFixed(1)}%"></div></div>
      <div class="rv">${moneyWhole(val)}</div>
    </div>`;

  c.innerHTML = `
    <div class="toolbar">
      <div class="liq-basis">
        <span>Spending measured from</span>
        <select id="liqBasis" style="width:auto;">
          <option value="actuals" ${sp.basis==='actuals'?'selected':''}>Actuals — last 3 complete months</option>
          <option value="budget" ${sp.basis==='budget'?'selected':''}>Budget — this year's plan</option>
        </select>
      </div>
      <div class="spacer"></div>
      <div class="muted" style="font-size:11.5px;">${sp.label}</div>
    </div>

    ${notice.map(n=> `<div class="liq-banner">${n}</div>`).join('')}

    <div class="liq-q"><span class="n">1</span><span class="t">If income stopped today, how long could I live?</span></div>
    <div class="liq-sub">Each row adds a slower source of cash, so you can see how far you get before having to touch the money you'd rather leave invested. Locked accounts are excluded entirely. Savings contributions aren't counted as spending &mdash; if income stops, saving stops with it.</div>
    <div class="liq-body">
      <div class="card">
        <table class="tiers">
          <thead>
            <tr>
              <th>What you'd spend down</th>
              <th class="r">Cash</th>
              <th class="r">All spending<div class="sub">${moneyWhole(sp.total)}/mo</div></th>
              <th class="r">Essentials only<div class="sub">${moneyWhole(sp.essential)}/mo</div></th>
            </tr>
          </thead>
          <tbody>
            ${RUNWAY_TIERS.map(t=>{
              const cash = lad.cum[t.key];
              const rc = sp.total > 0 ? cash/sp.total : Infinity;
              const re = sp.essential > 0 ? cash/sp.essential : Infinity;
              const isLimit = (L.runwayTier||'week') === t.key;
              return `
              <tr class="${isLimit?'tier-limit':''}">
                <td>${t.label}${isLimit?' <span class="pill Savings" style="margin-left:5px;">limit</span>':''}<div class="sub">${t.note}</div></td>
                <td class="r">${moneyWhole(cash)}</td>
                <td class="r">${months1(rc)}</td>
                <td class="r" style="color:var(--gold-bright);">${months1(re)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div class="liq-note">
          Essentials cover ${sp.essCount} categor${sp.essCount===1?'y':'ies'}; cutting the rest frees ${moneyWhole(sp.total - sp.essential)} a month.
          ${lad.locked>0 ? `${moneyWhole(lad.locked)} is locked and left out of every row.` : ''}
        </div>
      </div>
    </div>

    <div class="liq-q"><span class="n">2</span><span class="t">If I needed cash urgently, how much could I get?</span></div>
    <div class="liq-sub">Net worth is not the same as available money. Each rung adds the accounts that clear within that window.</div>
    <div class="liq-body">
      <div class="card">
        ${rung('Today', lad.cum.today)}
        ${rung('Within a week', lad.cum.week)}
        ${rung('Within a month', lad.cum.month)}
        ${rung('Locked up', lad.locked, 'locked')}
        <div class="liq-note">Net worth ${moneyWhole(lad.net)} — of which ${moneyWhole(lad.reachable)} is reachable inside a month.</div>
      </div>
    </div>

    <div class="liq-q"><span class="n">3</span><span class="t">Am I holding the right currency?</span></div>
    <div class="liq-sub">If most of your eventual spending is in baht but most of your assets sit in dollars, you're carrying an exchange rate bet whether you chose it or not.</div>
    <div class="liq-body">
      <div class="row">
        <div class="card metric">
          <h3>Assets held in baht</h3>
          <div class="big">${fx.thbPct.toFixed(0)}%</div>
          <div class="cap">${moneyWhole(fx.thbAUD)} of ${moneyWhole(fx.net)}</div>
        </div>
        <div class="card metric">
          <h3>Retirement spending in baht</h3>
          <div class="big">${Math.round(Number(L.thbSpendShare)||0)}%</div>
          <div class="cap">your estimate, set in Settings</div>
        </div>
        <div class="card metric">
          <h3>Mismatch</h3>
          <div class="big" style="color:${gap>40?'var(--amber)':'var(--text)'};">${gap.toFixed(0)} pts</div>
          <div class="cap">${gap>40?'largely unhedged':'broadly aligned'}</div>
        </div>
      </div>
    </div>

    <div class="liq-q"><span class="n">4</span><span class="t">Am I still inside my own rules?</span></div>
    <div class="liq-sub">Thresholds you set once in Settings. Amber means you're within 10% of the line rather than over it.</div>
    <div class="liq-body">
      <div class="card">
        <table class="limits">
          <tr>
            <td>Runway on essentials, at least ${L.limits.runwayMonths} months <span class="muted" style="font-size:11px;">(${tierLabel(L.runwayTier||'week').toLowerCase()})</span></td>
            <td class="lv">${runEssTier===Infinity?'—':runEssTier.toFixed(1)}</td>
            <td class="ls">${limitPill(runEssTier===Infinity?0:runEssTier, L.limits.runwayMonths, true)}</td>
          </tr>
          <tr>
            <td>Essential costs under ${L.limits.fixedPct}% of income</td>
            <td class="lv">${fixedPct.toFixed(0)}%</td>
            <td class="ls">${limitPill(fixedPct, L.limits.fixedPct, false)}</td>
          </tr>
          <tr>
            <td>No single account over ${L.limits.concPct}% of reachable cash <span class="muted" style="font-size:11px;">(${conc.name})</span></td>
            <td class="lv">${conc.pct.toFixed(0)}%</td>
            <td class="ls">${limitPill(conc.pct, L.limits.concPct, false)}</td>
          </tr>
          <tr>
            <td>Cash reachable today above ${moneyWhole(L.limits.bufferToday)}</td>
            <td class="lv">${moneyWhole(lad.cum.today)}</td>
            <td class="ls">${limitPill(lad.cum.today, L.limits.bufferToday, true)}</td>
          </tr>
        </table>
      </div>
    </div>
  `;

  document.getElementById('liqBasis').onchange = e=>{
    liqSettings().spendBasis = e.target.value;
    saveState(); render();
  };
}

    </div>
    <div class="card">
      ${VERSION_LOG.map(v=>`
        <div class="ver ${v.current?'current':''}">
          <div class="vh">
            <span class="vno">${v.no}</span>
            <span class="vname">${v.name}</span>
            ${v.current?'<span class="pill Savings">Current</span>':''}
            <span class="vdate">${v.date||''}</span>
          </div>
          <ul>${v.items.map(i=>`<li>${i}</li>`).join('')}</ul>
        </div>
      `).join('')}
    </div>
  `;
}

/* =========================================================
   BACKUP / RESTORE
========================================================= */
function exportBackup(){
  const meta = profiles.list.find(p=>p.id===profiles.activeId);
  const safeName = (meta ? meta.name : 'profile').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  downloadBlob(blob, `ledger-${safeName}-${isoDate(TODAY)}.json`);
  toast('Backup downloaded.');
}

document.getElementById('exportBtn').onclick = exportBackup;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.categories || !parsed.transactions){ throw new Error('Not a recognized backup file.'); }
      if(confirm('Import will replace all data in the current profile. Continue?')){
        state = {...defaultState(), ...parsed};
        saveState(); render(); toast('Backup imported.');
      }
    }catch(err){
      toast('Could not read that file — is it a Ledger backup?');
      console.error(err);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* =========================================================
   INIT
========================================================= */
if(AUTO_SAVE_SUPPORTED && state.settings.autoSaveEnabled && !autoSaveHandle){
  // The file handle can't survive a page reload — require a conscious re-link
  // rather than silently falling back to downloading a new copy every change.
  state.settings.autoSaveEnabled = false;
}
applyTheme(loadTheme());
renderProfileSwitcher();
renderCloudStatus();
render();
refreshFxRates(false);
</script>
