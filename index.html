    document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') root.innerHTML=''; });

    const openEditBtn = root.querySelector('[data-histeditopen]');
    if(openEditBtn) openEditBtn.onclick = ()=>{
      const newAmt = prompt(`Opening balance (in ${cur}):`, unit.openingBalance);
      if(newAmt===null) return;
      const newDate = prompt('Opening date (YYYY-MM-DD):', unit.openingDate);
      if(newDate===null) return;
      unit.openingBalance = Number(newAmt)||0;
      if(newDate.trim()) unit.openingDate = newDate.trim();
      saveState(); paint(); render();
    };
    root.querySelectorAll('[data-histedit]').forEach(b=>{
      b.onclick = ()=>{
        const idx = Number(b.dataset.histedit);
        const h = unit.history[idx];
        if(!h) return;
        const newAmt = prompt(`Amount (use negative for withdrawal, in ${cur}):`, h.delta);
        if(newAmt===null) return;
        const newDate = prompt('Date (YYYY-MM-DD):', h.date);
        if(newDate===null) return;
        const newNote = prompt('Note:', h.note||'');
        if(newNote===null) return;
        h.delta = Number(newAmt)||0;
        if(newDate.trim()) h.date = newDate.trim();
        h.note = newNote.trim();
        saveState(); paint(); render();
      };
    });
    root.querySelectorAll('[data-histdel]').forEach(b=>{
      b.onclick = ()=>{
        if(confirm('Delete this entry? This cannot be undone.')){
          const idx = Number(b.dataset.histdel);
          unit.history.splice(idx,1);
          saveState(); paint(); render();
        }
      };
    });
  }
  paint();
}

/* =========================================================
   BILLS
========================================================= */
function currentMonthKey(){ return isoDate(TODAY).slice(0,7); }

/* Move a date n periods forward (or backward, for a negative n), clamping to the
   target month's real last day. Date.setMonth() would overflow — the 31st of a
   month stepped once lands in the month after next — and setFullYear() does the
   same to Feb 29. Building the date from parts is the only way to avoid both. */
function addPeriod(d, frequency, n){
  const step  = frequency === 'Annually' ? 12 : 1;
  const total = step * (n === undefined ? 1 : n);
  const idx = d.getMonth() + total;
  const ty  = d.getFullYear() + Math.floor(idx / 12);
  const tm  = ((idx % 12) + 12) % 12;
  const lastDay = new Date(ty, tm + 1, 0).getDate();
  return new Date(ty, tm, Math.min(d.getDate(), lastDay));
}

/* ---------- V4.13 cycles ----------
   A bill repeats every N weeks, months or years. unit/every are the source of truth;
   frequency is kept as a readable label (and so versions before V4.13 still find
   'Monthly' or 'Annually' there). Loading never turns a cycle back into Monthly. */
const BILL_FREQ_PRESETS = [
  ['weekly',      'Weekly',          'week',  1],
  ['fortnightly', 'Fortnightly',     'week',  2],
  ['4weekly',     'Every 4 weeks',   'week',  4],
  ['monthly',     'Monthly',         'month', 1],
  ['2monthly',    'Every 2 months',  'month', 2],
  ['quarterly',   'Quarterly',       'month', 3],
  ['6monthly',    'Every 6 months',  'month', 6],
  ['annually',    'Annually',        'year',  1]
];
const BILL_UNITS = ['week','month','year'];
const BILL_MATCH_DAYS = 3;   // how far either side of the due date a transaction still counts
const BILL_KIND_TYPE = { expense:'Expenses', income:'Income', saving:'Savings' };

function billCycle(bill){
  const u = bill && bill.unit, e = Math.round(Number(bill && bill.every));
  if(BILL_UNITS.includes(u) && e >= 1 && e <= 520) return { unit:u, every:e };
  return (bill && bill.frequency === 'Annually') ? { unit:'year', every:1 } : { unit:'month', every:1 };
}
function cycleLabel(c){
  const p = BILL_FREQ_PRESETS.find(x=> x[2]===c.unit && x[3]===c.every);
  return p ? p[1] : `Every ${c.every} ${c.unit}s`;
}
function cyclePresetKey(c){
  const p = BILL_FREQ_PRESETS.find(x=> x[2]===c.unit && x[3]===c.every);
  return p ? p[0] : 'custom';
}
const WEEKDAYS_LONG = ['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
function billFreqLabel(bill){
  const c = billCycle(bill);
  const a = billAnchor(bill);
  return cycleLabel(c) + (c.unit==='week' && a ? ` · ${WEEKDAYS_LONG[a.getDay()].slice(0,3)}` : '');
}

/* The day of the month the bill is really on. Clamping a bill due on the 31st into
   February has to be presentational: if the clamped date became the new anchor, a
   rent bill would walk 31st → 28th and stay there. Keeping the intended day
   separately makes the clamp reversible and non-accumulating. */
function billDueDay(bill){
  const explicit = Number(bill.dueDay);
  if(Number.isFinite(explicit) && explicit >= 1 && explicit <= 31) return explicit;
  return bill.dueDate ? Number(bill.dueDate.slice(8,10)) : null;
}

/* n cycles from a date. Weeks step in whole days; months and years are built from
   parts (never setMonth), clamped to the month's last day, back to the intended day
   when the month allows. new Date(y, m, d + days) is local-time safe. */
function billStepDate(bill, from, n){
  const c = billCycle(bill);
  if(c.unit === 'week') return new Date(from.getFullYear(), from.getMonth(), from.getDate() + 7*c.every*n);
  const months = (c.unit === 'year' ? 12 : 1) * c.every * n;
  const idx = from.getMonth() + months;
  const ty  = from.getFullYear() + Math.floor(idx / 12);
  const tm  = ((idx % 12) + 12) % 12;
  const day = billDueDay(bill) || from.getDate();
  const lastDay = new Date(ty, tm + 1, 0).getDate();
  return new Date(ty, tm, Math.min(day, lastDay));
}

/* How the due date was worked out before bills carried one of their own. Kept for
   the one-time migration and as a fallback. */
function dueFromLastPaid(bill){
  if(!bill.lastPaidDate) return null;
  return billStepDate(bill, new Date(bill.lastPaidDate+'T00:00:00'), 1);
}
/* The stored date is an anchor: any date the bill falls on. Every other date follows
   from the cycle, so nothing needs ticking off to move it on. */
function billAnchor(bill){
  if(bill.dueDate) return new Date(bill.dueDate+'T00:00:00');
  return dueFromLastPaid(bill);
}
function shiftDue(bill, n){
  const a = billAnchor(bill);
  return a ? billStepDate(bill, a, n) : null;
}

/* Every date this bill falls on inside a window, oldest first. */
function billOccurrences(bill, fromISO, toISO){
  const out = [];
  if(!billAnchor(bill)) return out;
  const from = new Date(fromISO+'T00:00:00');
  const to   = new Date(toISO+'T00:00:00');
  // Jump close to the window first rather than walking one cycle at a time.
  const c = billCycle(bill);
  const approxDays = c.unit==='week' ? 7*c.every : (c.unit==='month' ? 30.44*c.every : 365.25*c.every);
  let start = Math.floor(dayDiff(billAnchor(bill), from) / approxDays) - 2;
  for(let guard=0; guard<50 && shiftDue(bill, start) >= from; guard++) start -= 2;
  for(let i = start; i < start + 3000; i++){
    const d = shiftDue(bill, i);
    if(d > to) break;
    if(d >= from) out.push(isoDate(d));
  }
  return out;
}

/* ---------- Checking Transactions ----------
   A linked bill looks for a transaction of its type and category (and a word in the
   details, if given) within BILL_MATCH_DAYS of each due date. It only reads. */
function billIsLinked(bill){ return !!(bill.match && bill.match.category); }
function billFindMatch(bill, iso){
  if(!billIsLinked(bill)) return null;
  const type = BILL_KIND_TYPE[bill.kind] || 'Expenses';
  const kw = (bill.match.keyword||'').trim().toLowerCase();
  const d0 = new Date(iso+'T00:00:00');
  let best = null;
  (state.transactions||[]).forEach(t=>{
    if(t.type !== type || t.category !== bill.match.category) return;
    if(kw && !(t.details||'').toLowerCase().includes(kw)) return;
    const gap = Math.abs(dayDiff(d0, new Date(t.date+'T00:00:00')));
    if(gap <= BILL_MATCH_DAYS && (!best || gap < best.gap)) best = { tx:t, gap };
  });
  return best ? best.tx : null;
}

/* Where a bill stands today.
   state: 'nodate' | 'scheduled' (not linked) | 'upcoming' | 'waiting' (due, inside
   the match window) | 'late' (window passed, nothing found).
   next: the date the bill is next expected — for a late one, the date it was due. */
function billStatus(bill, todayISO){
  const today = todayISO || isoDate(TODAY);
  const anchor = billAnchor(bill);
  if(!anchor) return { state:'nodate', next:null, lastSeen:null };
  const c = billCycle(bill);
  const cycleDays = c.unit==='week' ? 7*c.every : (c.unit==='month' ? 31*c.every : 366*c.every);
  const ahead = isoDate(addDays(new Date(today+'T00:00:00'), cycleDays + 1));
  if(!billIsLinked(bill)){
    const next = billOccurrences(bill, today, ahead)[0] || null;
    return { state:'scheduled', next, lastSeen:null };
  }
  // Linked: look back one cycle plus the window (never before the link was made,
  // so turning it on doesn't flag months you never asked it to check).
  let back = isoDate(addDays(new Date(today+'T00:00:00'), -Math.min(cycleDays + BILL_MATCH_DAYS, 45)));
  if(bill.match.since && bill.match.since > back) back = bill.match.since;
  const occ = billOccurrences(bill, back, ahead);
  // Only the latest date that has come round can be waiting or late. An older one
  // that never showed up is superseded once the next is due, so one missed record
  // doesn't leave the bill stuck on a month long gone.
  const latestDue = occ.filter(o=> o <= today).pop() || null;
  let lastSeen = null;
  for(const o of occ){
    const tx = billFindMatch(bill, o);
    if(tx){ lastSeen = { due:o, tx }; continue; }
    if(latestDue && o < latestDue) continue;
    const windowEnd = isoDate(addDays(new Date(o+'T00:00:00'), BILL_MATCH_DAYS));
    if(o > today) return { state:'upcoming', next:o, lastSeen };
    if(today <= windowEnd) return { state:'waiting', next:o, lastSeen };
    return { state:'late', next:o, lastSeen, lateDays: dayDiff(new Date(o+'T00:00:00'), new Date(today+'T00:00:00')) };
  }
  return { state:'upcoming', next:null, lastSeen };
}
function nextDueDate(bill){
  const s = billStatus(bill);
  return s.next ? new Date(s.next+'T00:00:00') : null;
}

/* Money in adds to the balance; money out and money moved to savings both take
   from it. Savings is not spending, but it does leave the spendable balance. */
function billSign(bill){ return bill.kind === 'income' ? 1 : -1; }
function billSignedAUD(bill){
  return billSign(bill) * toAUD(Number(bill.amount)||0, bill.currency||'AUD');
}
/* A month's share: 52 weeks, 12 months, 1 year to the year, each divided by 12. */
function billMonthlyAUD(bill){
  const amt = toAUD(Number(bill.amount)||0, bill.currency||'AUD');
  const c = billCycle(bill);
  if(c.unit === 'week')  return amt * 52 / 12 / c.every;
  if(c.unit === 'year')  return amt / 12 / c.every;
  return amt / c.every;
}

function dueBadge(bill){
  const s = billStatus(bill);
  if(s.state === 'nodate') return `<span class="muted">No date set</span>`;
  if(!s.next) return `<span class="muted">—</span>`;
  const dateStr = `${shortIsoDate(s.next)}${s.next.slice(0,4)!==String(TODAY.getFullYear()) ? ' '+s.next.slice(0,4) : ''}`;
  const rel = relFromToday(s.next);
  const days = dayDiff(new Date(isoDate(TODAY)+'T00:00:00'), new Date(s.next+'T00:00:00'));
  const title = `title="${formatDateShort(s.next)}, ${days===0 ? 'today' : (days>0 ? `${days} day${days===1?'':'s'} from now` : `${-days} day${days===-1?'':'s'} ago`)}"`;
  if(s.state === 'late') return `<span style="color:var(--amber);" ${title}>${dateStr} — ${rel}</span>`;
  if(days < 0) return `<span style="color:var(--gold-bright);" ${title}>${dateStr} — ${rel}</span>`;
  if(days === 0) return `<span class="neg" ${title}>${dateStr} — today</span>`;
  if(days <= 5) return `<span style="color:var(--amber);" ${title}>${dateStr} — ${rel}</span>`;
  return `<span class="muted" ${title}>${dateStr} — ${rel}</span>`;
}
function billStatusHTML(bill){
  const s = billStatus(bill);
  if(s.state === 'nodate') return '<span class="muted">—</span>';
  if(s.state === 'scheduled') return `<span class="muted" title="Rolls on by date. Edit the entry to have it check Transactions.">By date</span>`;
  const seen = s.lastSeen ? `✓ seen ${shortIsoDate(s.lastSeen.tx.date)}` : '';
  if(s.state === 'late') return `<span class="bl-late" title="No ${bill.match.category} transaction${bill.match.keyword?` mentioning “${escHTML(bill.match.keyword)}”`:''} within ${BILL_MATCH_DAYS} days of ${formatDateShort(s.next)}. It stays in the forecast until one appears.">Not seen yet</span>`;
  if(s.state === 'waiting') return `<span class="bl-wait" title="Due — looking for it in Transactions for ${BILL_MATCH_DAYS} days either side">Looking for it</span>`;
  return seen ? `<span class="pos">${seen}</span>` : `<span class="muted">Linked</span>`;
}

function renderBills(c){
  const sumKind = k=> state.bills.filter(b=> b.kind===k).reduce((s,b)=> s + billMonthlyAUD(b), 0);
  const outM  = sumKind('expense');
  const inM   = sumKind('income');
  const saveM = sumKind('saving');
  const netM  = inM - outM - saveM;
  const filter = ['all','expense','income','saving'].includes(state.ui.billFilter) ? state.ui.billFilter : 'all';
  const todayISO = isoDate(TODAY);
  const in7  = isoDate(new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()+7));
  const in21 = isoDate(new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()+21));

  // What's still to come this month, and linked bills that haven't shown up in Transactions
  const monthEnd = isoDate(new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 0));
  const stat = new Map(state.bills.map(b=> [b.id, billStatus(b, todayISO)]));
  const toCome = k=> state.bills.filter(b=> b.kind===k).reduce((n,b)=>
    n + billOccurrences(b, todayISO, monthEnd).filter(d=> !(billIsLinked(b) && billFindMatch(b, d))).length, 0);
  const late = state.bills.filter(b=> stat.get(b.id).state==='late');
  const soon = [];
  // Linked bills already seen in Transactions drop out; one that's late sits at the top.
  late.forEach(b=> soon.push({ b, d: stat.get(b.id).next, late:true }));
  state.bills.forEach(b=> billOccurrences(b, todayISO, in21).forEach(d=>{
    if(billIsLinked(b) && billFindMatch(b, d)) return;
    if(stat.get(b.id).state==='late' && stat.get(b.id).next===d) return;
    soon.push({ b, d });
  }));
  soon.sort((x,y)=> (y.late?1:0)-(x.late?1:0) || (x.d < y.d ? -1 : x.d > y.d ? 1 : 0));
  const week = soon.filter(x=> !x.late && x.d <= in7 && x.b.kind==='expense');
  const weekSum = week.reduce((s,x)=> s + toAUD(Number(x.b.amount)||0, x.b.currency||'AUD'), 0);

  const KIND_ORDER = [['expense','Money out'], ['income','Money in'], ['saving','To savings']];
  const shownKinds = KIND_ORDER.filter(([k])=> filter==='all' || filter===k);
  // ↑↓ move an entry past the previous / next entry of the same type, since that is
  // the neighbour you can see; the stored order of everything else is left alone.
  const sameKindNeighbour = (idx, dir)=>{
    const kind = state.bills[idx].kind;
    for(let j = idx+dir; j>=0 && j<state.bills.length; j+=dir) if(state.bills[j].kind===kind) return j;
    return -1;
  };
  const groupHTML = ([k,label])=>{
    const items = state.bills.map((b,idx)=>({ b, idx })).filter(x=> x.b.kind===k);
    if(!items.length) return '';
    const monthly = items.reduce((s,x)=> s + billMonthlyAUD(x.b), 0);
    return `
      <tr class="bl-group"><td colspan="6"><div class="bl-group-line">
        <span class="bl-group-name kind-${k}"><span class="dash-sw bl-sw kind-${k}"></span>${label}</span>
        <span class="muted">${items.length} entr${items.length===1?'y':'ies'}</span>
        <span class="spacer"></span>
        <span class="num-font">${moneyWhole(monthly)} a month</span>
      </div></td></tr>
      ${items.map(({b, idx})=>{
        return `
        <tr class="bl-row">
          <td class="bl-name">${b.name}${b.notes?` <span class="muted bl-notes">${b.notes}</span>`:''}</td>
          <td class="num bl-amt kind-${k}">${moneyCur(b.amount, b.currency||'AUD')}</td>
          <td class="muted bl-freq">${billFreqLabel(b)}</td>
          <td class="bl-due">${dueBadge(b)}</td>
          <td class="bl-status">${billStatusHTML(b)}</td>
          <td class="bl-actions">
            <button class="icon-btn" data-billup="${b.id}" title="Move up" ${sameKindNeighbour(idx,-1)<0?'disabled':''}>↑</button>
            <button class="icon-btn" data-billdown="${b.id}" title="Move down" ${sameKindNeighbour(idx,1)<0?'disabled':''}>↓</button>
            <button class="icon-btn" style="color:var(--gold);" data-editbill="${b.id}" title="Edit">✎</button>
            <button class="icon-btn" data-delbill="${b.id}" title="Delete">✕</button>
          </td>
        </tr>`;}).join('')}`;
  };
  const kindCls = k=> k==='income' ? 'pos' : (k==='saving' ? 'tx-sav' : 'neg');

  c.innerHTML = `
    <div class="dash-head">
      <h1 class="page-title">Bills &amp; Scheduled Money</h1>
      <span class="muted dash-head-sub">everything that lands on a date — the Calendar projects these forward</span>
      <div class="spacer"></div>
      <div class="dash-seg" role="group" aria-label="Show">
        ${[['all','All'], ...KIND_ORDER].map(([k,l])=>`<button type="button" data-billfilter="${k}" class="${filter===k?'on':''}" aria-pressed="${filter===k}">${l}</button>`).join('')}
      </div>
      <button class="btn" id="addBillBtn">+ Add entry</button>
    </div>

    <div class="dash-kpis bl-kpis">
      <div class="dash-kpi"><div class="k-label">Money out</div><div class="k-val neg">${moneyWhole(outM)}</div><div class="k-sub">a month, AUD${toCome('expense')?` · ${toCome('expense')} still to come`:''}${late.filter(b=>b.kind==='expense').length?` · <span class="bl-late">${late.filter(b=>b.kind==='expense').length} not seen yet</span>`:''}</div></div>
      <div class="dash-kpi"><div class="k-label">Money in</div><div class="k-val pos">${moneyWhole(inM)}</div><div class="k-sub">a month, AUD${late.filter(b=>b.kind==='income').length?` · <span class="bl-late">${late.filter(b=>b.kind==='income').length} not seen yet</span>`:''}</div></div>
      <div class="dash-kpi"><div class="k-label">To savings</div><div class="k-val" style="color:var(--blue-bright);">${moneyWhole(saveM)}</div><div class="k-sub">leaves spendable cash, not spending${toCome('saving')?` · ${toCome('saving')} still to come`:''}</div></div>
      <div class="dash-kpi"><div class="k-label">Left over</div><div class="k-val ${netM>=0?'pos':'neg'}">${moneyWhole(netM)}</div><div class="k-sub">scheduled in less out and saved</div></div>
      <div class="dash-kpi"><div class="k-label">Due in 7 days</div><div class="k-val ${week.length?'':'muted'}" style="${week.length?'color:var(--amber);':''}">${week.length ? `${week.length} · ${moneyWhole(weekSum)}` : 'Nothing'}</div>
        <div class="k-sub">${week.length ? week.slice(0,2).map(x=> `${x.b.name} ${shortIsoDate(x.d)}`).join(' · ') : 'money out, next 7 days'}</div></div>
    </div>

    ${state.bills.length===0 ? `<div class="empty-state"><div class="glyph">·</div>Nothing scheduled yet. Add a bill, your salary, or a monthly transfer to savings.</div>` : `
    <div class="bl-grid">
      <div class="card dash-card bl-card">
        <div class="plan-table-wrap">
        <table class="data bl-table">
          <thead><tr><th>Name</th><th class="num">Amount</th><th>Frequency</th><th>Next due</th><th>Status</th><th></th></tr></thead>
          <tbody>${shownKinds.map(groupHTML).join('')}</tbody>
        </table>
        </div>
      </div>
      <div class="card dash-card bl-soon">
        <div class="dash-card-head"><span class="dash-card-title">Next 3 weeks</span><span class="muted">from these entries</span></div>
        ${soon.length ? soon.map(x=>`
          <div class="bl-soon-row${x.late?' late':''}">
            <span class="bl-soon-date muted">${x.late ? 'late' : shortIsoDate(x.d)}</span>
            <span class="dash-sw bl-sw kind-${x.b.kind}"></span>
            <span class="bl-soon-name">${x.b.name}</span>
            <span class="num-font ${kindCls(x.b.kind)}">${x.b.kind==='income'?'+':'−'}${moneyCur(x.b.amount, x.b.currency||'AUD')}</span>
          </div>`).join('') : `<div class="muted" style="font-size:12px;">Nothing dated in the next 21 days.</div>`}
        <div class="muted bl-soon-foot">Entries linked to Transactions drop off once the payment shows up. The Calendar shows these against your cash.</div>
      </div>
    </div>`}
  `;

  c.querySelectorAll('[data-billfilter]').forEach(b=> b.onclick = ()=>{ state.ui.billFilter = b.dataset.billfilter; saveState(); render(); });
  document.getElementById('addBillBtn').onclick = ()=> openBillModal();
  c.querySelectorAll('[data-delbill]').forEach(b=> b.onclick = ()=>{
    if(confirm('Delete this bill?')){
      state.bills = state.bills.filter(x=>x.id!==b.dataset.delbill);
      saveState(); render();
    }
  });
  c.querySelectorAll('[data-editbill]').forEach(b=> b.onclick = ()=> openBillModal(b.dataset.editbill));
  const move = (id, dir)=>{
    const idx = state.bills.findIndex(x=>x.id===id);
    if(idx<0) return;
    const j = sameKindNeighbour(idx, dir);
    if(j<0) return;
    [state.bills[j], state.bills[idx]] = [state.bills[idx], state.bills[j]];
    saveState(); render();
  };
  c.querySelectorAll('[data-billup]').forEach(b=> b.onclick = ()=> move(b.dataset.billup, -1));
  c.querySelectorAll('[data-billdown]').forEach(b=> b.onclick = ()=> move(b.dataset.billdown, 1));
}

function openBillModal(editId){
  const root = document.getElementById('modalRoot');
  const existing = editId ? state.bills.find(b=>b.id===editId) : null;
  const cyc = existing ? billCycle(existing) : { unit:'month', every:1 };
  const presetKey = cyclePresetKey(cyc);
  const m = existing && existing.match ? existing.match : null;
  const catOptions = (kind, sel)=> {
    const t = BILL_KIND_TYPE[kind] || 'Expenses';
    return `<option value="">Choose a ${t.toLowerCase()} category…</option>` +
      state.categories[t].map(cat=> `<option ${cat===sel?'selected':''}>${escHTML(cat)}</option>`).join('');
  };
  root.innerHTML = `
    <div class="modal-backdrop" id="mb">
      <div class="modal">
        <h2>${existing ? 'Edit scheduled entry' : 'Add scheduled entry'}</h2>
        <div class="form-grid">
          <label class="field">Name <input type="text" id="bName" placeholder="e.g. Netflix, or Salary" value="${existing ? escHTML(existing.name) : ''}"></label>
          <label class="field">Type
            <select id="bKind">${BILL_KINDS.map(([k,lab])=>`<option value="${k}" ${(existing?existing.kind:'expense')===k?'selected':''}>${lab}</option>`).join('')}</select>
          </label>
          <label class="field">Amount <input type="number" id="bAmt" min="0" step="0.01" inputmode="decimal" value="${existing ? existing.amount : ''}"></label>
          <label class="field">Currency
            <select id="bCurrency">${NET_WORTH_CURRENCIES.map(cur=>`<option ${existing ? (cur===(existing.currency||'AUD')?'selected':'') : (cur==='AUD'?'selected':'')}>${cur}</option>`).join('')}</select>
          </label>
          <label class="field">Repeats
            <select id="bFreq">
              ${BILL_FREQ_PRESETS.map(p=>`<option value="${p[0]}" ${presetKey===p[0]?'selected':''}>${p[1]}</option>`).join('')}
              <option value="custom" ${presetKey==='custom'?'selected':''}>Custom…</option>
            </select>
          </label>
          <div class="field bl-custom" id="bCustomWrap" ${presetKey==='custom'?'':'hidden'}>Every
            <div style="display:flex; gap:6px;">
              <input type="number" id="bEvery" min="1" max="520" step="1" value="${cyc.every}" style="width:70px;" aria-label="Every how many">
              <select id="bUnit" aria-label="Unit">${BILL_UNITS.map(u=>`<option value="${u}" ${cyc.unit===u?'selected':''}>${u}s</option>`).join('')}</select>
            </div>
          </div>
          <label class="field">Next due
            <input type="date" id="bDue" value="${existing ? (existing.dueDate||'') : ''}">
            <span class="muted" style="font-size:11px;">Any date it falls on — every other date follows from how often it repeats, and it moves on by itself. Leave blank to keep it off the calendar.</span>
          </label>
          <label class="field">Notes <input type="text" id="bNotes" placeholder="optional" value="${existing ? escHTML(existing.notes||'') : ''}"></label>
        </div>
        <div class="bl-cycle-hint" id="bHint" aria-live="polite"></div>

        <div class="bl-match">
          <label class="set-check"><input type="checkbox" id="bMatchOn" ${m?'checked':''}> Check it was paid in Transactions</label>
          <div class="muted" style="font-size:11px; margin:2px 0 8px 24px;">Looks for a transaction in this category within ${BILL_MATCH_DAYS} days of each due date. Found: it shows ✓ and moves on. Not found: it shows “not seen yet” and stays in the Calendar forecast until it turns up. It only reads Transactions — it never adds or changes one.</div>
          <div class="form-grid" id="bMatchFields" ${m?'':'hidden'}>
            <label class="field">Category <select id="bMatchCat">${catOptions(existing?existing.kind:'expense', m?m.category:'')}</select></label>
            <label class="field">Details contain <input type="text" id="bMatchKw" placeholder="optional, e.g. Vodafone" value="${m ? escHTML(m.keyword||'') : ''}"></label>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn secondary" id="fCancel">Cancel</button>
          <button class="btn" id="fSave">${existing ? 'Save changes' : 'Save'}</button>
        </div>
      </div>
    </div>
  `;
  const $ = id=> document.getElementById(id);
  const readCycle = ()=>{
    const k = $('bFreq').value;
    if(k === 'custom'){
      const every = Math.round(Number($('bEvery').value));
      return { unit: $('bUnit').value, every: (every>=1 && every<=520) ? every : null };
    }
    const p = BILL_FREQ_PRESETS.find(x=> x[0]===k);
    return { unit:p[2], every:p[3] };
  };
  const hint = ()=>{
    const c = readCycle(), due = $('bDue').value;
    $('bCustomWrap').hidden = $('bFreq').value !== 'custom';
    if(!c.every){ $('bHint').textContent = 'Enter how many (1 to 520).'; return; }
    if(!due){ $('bHint').textContent = `${cycleLabel(c)} — add a date to put it on the calendar.`; return; }
    const tmp = { unit:c.unit, every:c.every, dueDate:due, dueDay:Number(due.slice(8,10)) };
    const d = new Date(due+'T00:00:00');
    const next = billOccurrences(tmp, isoDate(TODAY), isoDate(addDays(TODAY, 800))).slice(0,3);
    const on = c.unit==='week' ? ` on ${WEEKDAYS_LONG[d.getDay()]}`
      : (Number(due.slice(8,10))>28 ? ` on the ${Number(due.slice(8,10))}th, or the month's last day when it's shorter` : '');
    $('bHint').textContent = `${cycleLabel(c)}${on}. Next: ${next.map(x=> formatDateShort(x)).join(', ') || '—'}.`;
  };
  ['bFreq','bEvery','bUnit','bDue'].forEach(id=>{ $(id).addEventListener('change', hint); $(id).addEventListener('input', hint); });
  $('bKind').addEventListener('change', ()=>{ $('bMatchCat').innerHTML = catOptions($('bKind').value, ''); });
  $('bMatchOn').addEventListener('change', ()=>{ $('bMatchFields').hidden = !$('bMatchOn').checked; });
  hint();

  $('fCancel').onclick = ()=> root.innerHTML='';
  $('mb').addEventListener('click', e=>{ if(e.target.id==='mb') root.innerHTML=''; });
  $('fSave').onclick = ()=>{
    const name = $('bName').value.trim();
    const bAmtVal = Number($('bAmt').value);
    if(!name){ toast('Give the bill a name.'); return; }
    if(!bAmtVal || bAmtVal<=0){ toast('Enter an amount greater than 0.'); return; }
    const c = readCycle();
    if(!c.every){ toast('Enter how often it repeats — 1 to 520.'); return; }
    const currency = $('bCurrency').value;
    const kind = $('bKind').value;
    const dueDate = $('bDue').value || '';
    // The day you typed is the day you mean, kept apart from the date so a month
    // that has no 31st can't quietly become the new rule.
    const dueDay = dueDate ? Number(dueDate.slice(8,10)) : null;
    const notes = $('bNotes').value.trim();
    let match = null;
    if($('bMatchOn').checked){
      const category = $('bMatchCat').value;
      if(!category){ toast('Choose the category to look for, or untick the Transactions check.'); return; }
      const keyword = $('bMatchKw').value.trim();
      // Checking reaches back one cycle from when it was switched on — enough to show
      // ✓ for the latest payment — but no further, so a month you never recorded
      // doesn't come up as missing.
      const cyc = c.unit==='week' ? 7*c.every : (c.unit==='month' ? 31*c.every : 366*c.every);
      const since = (m && m.category===category && m.since) ? m.since : isoDate(addDays(TODAY, -(cyc + BILL_MATCH_DAYS)));
      match = { category, keyword, since };
    }
    const fields = { name, amount:bAmtVal, currency, kind, unit:c.unit, every:c.every, frequency:cycleLabel(c), dueDate, dueDay, notes, match };
    if(existing){
      Object.assign(existing, fields);
      toast('Entry updated.');
    } else {
      state.bills.push(Object.assign({ id:uid(), lastPaidDate:'', paidMonths:[] }, fields));
      toast('Entry added.');
    }
    saveState(); root.innerHTML=''; render();
  };
}

/* =========================================================
   CALENDAR & TO DO

   The calendar draws two layers. Derived events — bills, income, transfers to
   savings, the rebalance reminder — are computed on every render and never
   stored, so changing an amount on the Bills tab changes the calendar at once
   and there is only ever one copy of a due date. Manual events are dated to-do
   items; there is deliberately no separate event store, because two places to
   put "book flight" is one place too many.
========================================================= */

/* Deliberately module-level rather than in state.ui: which month you were looking
   at and which list was open are this device's business, not something worth a
   Firestore write or worth carrying to the iPad. */
let calMonth = null;        // 'YYYY-MM' being viewed; null means the current month
let calPane  = 'calendar';  // phone only — which of the two panes is showing
let todoActiveList = null;
/* Which layers are drawn. Personal events will usually outnumber money events, and
   the point of this tab is seeing when money lands — so the layers can be muted
   individually rather than letting the cashflow signal get buried. */
let calLayers = { money:true, events:true, todos:true };

/* ---------- Personal events ---------- */

/* Occurrence start dates for one event, in order, generated from the series start
   rather than from the window — an "ends after 10 times" rule has to count from
   the beginning or the tenth occurrence moves depending on which month you happen
   to be looking at. Capped so a malformed rule can't spin. */
function eventOccurrenceDates(ev, stopISO){
  const rep = ev.repeat || { freq:'none' };
  const start = new Date(ev.startDate+'T00:00:00');
  const out = [];
  if(!rep.freq || rep.freq === 'none') return [start];

  const interval = Math.max(1, Number(rep.interval) || 1);
  const maxCount = rep.endMode === 'after' ? Math.max(1, Number(rep.count) || 1) : Infinity;
  const untilISO = (rep.endMode === 'on' && rep.endDate) ? rep.endDate : null;

  // Returns false when the series is finished or has run past the window.
  const push = d=>{
    const iso = isoDate(d);
    if(untilISO && iso > untilISO) return false;
    out.push(d);
    if(out.length >= maxCount) return false;
    return iso <= stopISO;
  };

  if(rep.freq === 'weekly'){
    const wds = (rep.weekdays && rep.weekdays.length)
      ? rep.weekdays.slice().sort((a,b)=> ((a+6)%7) - ((b+6)%7))
      : [start.getDay()];
    const weekBase = mondayOf(start);
    outer: for(let w=0; w<4000; w++){
      const base = addDays(weekBase, w * 7 * interval);
      for(const wd of wds){
        const d = addDays(base, (wd + 6) % 7);   // offset from the Monday
        if(d < start) continue;
        if(!push(d)) break outer;
      }
    }
  } else if(rep.freq === 'weekday'){
    for(let k=0; k<9000; k++){
      const d = addDays(start, k);
      const dw = d.getDay();
      if(dw === 0 || dw === 6) continue;
      if(!push(d)) break;
    }
  } else {
    for(let k=0; k<4000; k++){
      const d = rep.freq === 'daily'   ? addDays(start, k * interval)
              : rep.freq === 'monthly' ? addPeriod(start, 'Monthly',  k * interval)
              : rep.freq === 'yearly'  ? addPeriod(start, 'Annually', k * interval)
              : null;
      if(!d || !push(d)) break;
    }
  }
  return out;
}

/* The occurrences that touch a window, as start/end pairs. A multi-day event keeps
   its length on every repeat, so a three-day trip repeated monthly stays three days. */
function eventOccurrences(ev, fromISO, toISO){
  if(!ev.startDate) return [];
  const span = ev.endDate
    ? Math.max(0, dayDiff(new Date(ev.startDate+'T00:00:00'), new Date(ev.endDate+'T00:00:00')))
    : 0;
  return eventOccurrenceDates(ev, toISO).map(d=>{
    const startISO = isoDate(d), endISO = isoDate(addDays(d, span));
    return { startISO, endISO, span };
  }).filter(o=> o.endISO >= fromISO && o.startISO <= toISO);
}

function eventCategory(ev){
  return (state.eventCategories||[]).find(c=> c.id === ev.categoryId) || null;
}
function eventColourKey(ev){
  const c = eventCategory(ev);
  return (c && EVENT_COLOURS.includes(c.colour)) ? c.colour : 'neutral';
}

function eventTimeLabel(ev){
  if(!ev.startTime) return '';
  const [h, m] = ev.startTime.split(':');
  return `${Number(h)}:${m}`;
}

function repeatSummary(ev){
  const r = ev.repeat || { freq:'none' };
  const meta = EVENT_FREQS.find(f=> f[0] === r.freq);
  if(!meta || r.freq === 'none') return '';
  const n = Math.max(1, Number(r.interval)||1);
  let base = r.freq === 'weekday' ? 'Every weekday'
           : n === 1 ? meta[1]
           : `Every ${n} ${meta[2]}`;
  if(r.freq === 'weekly' && (r.weekdays||[]).length){
    const names = WEEKDAYS.filter(([d])=> r.weekdays.includes(d))
      .map(([d])=> ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]);
    base += ` on ${names.join(', ')}`;
  }
  if(r.endMode === 'on' && r.endDate) base += `, until ${formatDateShort(r.endDate)}`;
  if(r.endMode === 'after') base += `, ${r.count} time${r.count===1?'':'s'}`;
  return base;
}

function escHTML(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, ch=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[ch]);
}

/* Whole days between two dates, immune to daylight saving shifting an hour and
   turning a 24-hour gap into 23. */
function dayDiff(a, b){
  return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())
                   - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
}
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function todayDate(){ return new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()); }

function calMonthKey(){ return calMonth || currentMonthKey(); }
function monthBounds(key){
  const y = Number(key.slice(0,4)), m = Number(key.slice(5,7)) - 1;
  const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
  return { y, m, first, last, firstISO: isoDate(first), lastISO: isoDate(last) };
}
function shiftMonthKey(key, n){
  const { y, m } = monthBounds(key);
  const idx = m + n;
  const ny = y + Math.floor(idx/12), nm = ((idx % 12) + 12) % 12;
  return `${ny}-${String(nm+1).padStart(2,'0')}`;
}
function calMonthLabel(key){
  const FULL = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];
  return `${FULL[Number(key.slice(5,7))-1]} ${key.slice(0,4)}`;
}

/* Every six months from the date you last rebalanced. Derived rather than stored
   as a reminder you have to keep re-setting — set the date once on Investments
   and the next one appears by itself. */
function rebalanceDates(fromISO, toISO){
  const anchor = (investSettings().lastRebalanceDate || '').trim();
  if(!anchor) return [];
  const base = new Date(anchor+'T00:00:00');
  const out = [];
  for(let i=1; i<=240; i++){
    const iso = isoDate(addPeriod(base, 'Monthly', i*6));
    if(iso > toISO) break;
    if(iso >= fromISO) out.push(iso);
  }
  return out;
}

/* Everything that falls inside a window, keyed by date. Layers that are muted are
   left out of the map entirely rather than hidden in CSS, so a muted layer also
   drops out of the agenda and out of anything that counts events. */
function calendarEvents(fromISO, toISO, opts){
  const layers = (opts && opts.layers) || calLayers;
  const map = {};
  const add = (iso, ev)=>{ (map[iso] = map[iso] || []).push(ev); };
  if(layers.money !== false){
    (state.bills||[]).forEach(b=>{
      const signed = billSignedAUD(b);
      const linked = billIsLinked(b);
      billOccurrences(b, fromISO, toISO).forEach(iso=>{
        // Seen in Transactions: still drawn (with ✓), but the forecast skips it.
        const seen = linked && !!billFindMatch(b, iso);
        add(iso, { type:'money', kind:b.kind, name:b.name, signed, id:b.id, seen });
      });
      // A linked payment that is due or late and not seen yet hasn't left the account,
      // so the forecast carries it on today rather than letting it vanish.
      if(opts && opts.carryLate && linked){
        const st = billStatus(b), today = isoDate(TODAY);
        if((st.state==='late' || st.state==='waiting') && st.next && st.next < today && today >= fromISO && today <= toISO)
          add(today, { type:'money', kind:b.kind, name:`${b.name} (not seen yet)`, signed, id:b.id, carried:true });
      }
    });
    rebalanceDates(fromISO, toISO).forEach(iso=>
      add(iso, { type:'rebalance', name:'Rebalance due', signed:0 }));
  }
  if(layers.events !== false){
    (state.events||[]).forEach(ev=>{
      eventOccurrences(ev, fromISO, toISO).forEach(o=>{
        // A span is drawn on each day it covers, so paging to a month in the middle
        // of a trip still shows it.
        for(let i=0; i<=o.span; i++){
          const iso = isoDate(addDays(new Date(o.startISO+'T00:00:00'), i));
          if(iso < fromISO || iso > toISO) continue;
          add(iso, { type:'event', name:ev.title, signed:0, id:ev.id, colour:eventColourKey(ev),
                     time: i === 0 ? eventTimeLabel(ev) : '',
                     part: o.span ? (i === 0 ? 'start' : (i === o.span ? 'end' : 'mid')) : '' });
        }
      });
    });
  }
  if(layers.todos !== false){
    (state.todos||[]).forEach(t=>{
      if(!t.dueDate || t.dueDate < fromISO || t.dueDate > toISO) return;
      add(t.dueDate, { type:'todo', name:t.text, done:!!t.done, signed:0, id:t.id });
    });
  }
  return map;
}

/* Walk forward from the cash you can actually reach today, applying each dated
   amount on the day it lands. Nothing from Planning is spread across the days:
   dividing a monthly budget by 30 would put the same figure on every date and
   bury the lumpiness this view exists to show. */
function cashflowProjection(){
  const start   = todayDate();
  const horizon = addDays(start, 60);
  const viewEnd = monthBounds(calMonthKey()).last;
  const end     = viewEnd > horizon ? viewEnd : horizon;
  const startISO = isoDate(start), endISO = isoDate(end), horizonISO = isoDate(horizon);

  const opening = liquidityLadder().cum.today;
  // Money only, and explicitly regardless of which layers are being shown — muting
  // the money layer is a display choice and must not silently change the forecast.
  const events  = calendarEvents(startISO, endISO, { layers:{ money:true, events:false, todos:false }, carryLate:true });
  const balances = {};
  let bal = opening;
  let min = { date: startISO, balance: opening };

  for(let i=0; i<=dayDiff(start, end); i++){
    const iso = isoDate(addDays(start, i));
    (events[iso]||[]).forEach(e=>{ if(!e.seen) bal += e.signed; });
    balances[iso] = bal;
    if(iso <= horizonISO && bal < min.balance) min = { date: iso, balance: bal };
  }
  return { opening, balances, min, startISO, endISO, horizonISO };
}

function calEventHTML(ev, compact){
  const cls = ev.type === 'money'
    ? ({ expense:'out', income:'in', saving:'save' })[ev.kind]
    : ev.type === 'rebalance' ? 'reb'
    : ev.type === 'event' ? 'event' + (ev.part ? ' span-' + ev.part : '')
    : 'todo' + (ev.done ? ' done' : '');
  const amt = ev.type === 'money'
    ? `<span class="amt">${ev.signed >= 0 ? '+' : '−'}${moneyWhole(Math.abs(ev.signed))}</span>`
    : '';
  const attr = ev.type === 'todo'  ? `data-caltodo="${ev.id}"`
             : ev.type === 'money' ? `data-calbill="${ev.id}"`
             : ev.type === 'event' ? `data-calevent="${ev.id}"`
             : 'data-calreb="1"';
  const label = (ev.seen ? '✓ ' : '') + escHTML(ev.name);
  const time  = ev.type === 'event' && ev.time ? `<span class="tm">${ev.time}</span> ` : '';
  const dot   = ev.type === 'event' ? `<span class="dot"></span>` : '';
  // The colour key is validated on load and again here, so it can only ever name
  // one of the ten swatches — never arbitrary text reaching a style attribute.
  const key   = EVENT_COLOURS.includes(ev.colour) ? ev.colour : 'neutral';
  const style = ev.type === 'event' ? ` style="--ev-col:var(--ec-${key})"` : '';
  return `<button class="cev ${cls}"${style} ${attr} title="${label}">${dot}${time}${
    compact ? `${label}${amt ? ' ' + amt : ''}` : `${label}${amt ? ' · ' + amt : ''}`}</button>`;
}

/* ---------- V4.13.1 relative dates ----------
   "in 3mo 2w" reads faster than "in 97d". Months are counted on the calendar (never as
   30 days), built from parts so the 31st can't overflow into the month after. */
function relSpanParts(from, to){
  let months = (to.getFullYear() - from.getFullYear())*12 + (to.getMonth() - from.getMonth());
  const stepTo = n=>{
    const idx = from.getMonth() + n;
    const ty = from.getFullYear() + Math.floor(idx/12), tm = ((idx%12)+12)%12;
    return new Date(ty, tm, Math.min(from.getDate(), new Date(ty, tm+1, 0).getDate()));
  };
  if(months > 0 && stepTo(months) > to) months--;
  if(months < 0) months = 0;
  const days = dayDiff(stepTo(months), to);
  return { years: Math.floor(months/12), months: months%12, totalMonths: months, weeks: Math.floor(days/7), days: days%7, totalDays: dayDiff(from, to) };
}
function relSpanText(from, to){
  const p = relSpanParts(from, to);
  if(p.totalDays < 7) return `${p.totalDays}d`;
  if(p.totalMonths === 0) return `${p.weeks}w${p.days ? ' '+p.days+'d' : ''}`;
  if(p.years === 0) return `${p.months}mo${p.weeks ? ' '+p.weeks+'w' : ''}`;
  return `${p.years}y${p.months ? ' '+p.months+'mo' : ''}`;
}
function relFromToday(iso){
  const t = new Date(isoDate(TODAY)+'T00:00:00'), d = new Date(iso+'T00:00:00');
  const n = dayDiff(t, d);
  if(n === 0) return 'today';
  if(n === 1) return 'tomorrow';
  if(n === -1) return 'yesterday';
  return n > 0 ? `in ${relSpanText(t, d)}` : `${relSpanText(d, t)} ago`;
}

/* ---------- V4.13.1 reachable-cash chart ----------
   Money lands on a day, so the line steps rather than slopes. Only the line, fills
   and gridlines live in the stretched SVG (with non-scaling strokes); every label,
   dot and the tooltip are HTML placed by percentage, so nothing gets distorted. */
function niceStep(range, target){
  const raw = range / Math.max(1, target);
  const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function moneyShort(v){
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if(a >= 1e6) return `${s}$${(a/1e6).toFixed(a >= 1e7 ? 0 : 1)}m`;
  if(a >= 1e3) return `${s}$${(a/1e3).toFixed(a >= 1e4 ? 0 : 1)}k`;
  return `${s}$${Math.round(a)}`;
}
let cashChartData = null;
function cashChartHTML(proj, buffer){
  const days = Object.keys(proj.balances).filter(iso=> iso >= proj.startISO && iso <= proj.horizonISO).sort();
  if(days.length < 2) return '';
  const vals = days.map(d=> proj.balances[d]);
  // What moves the balance each day, for the dots and the tooltip.
  const evs = calendarEvents(proj.startISO, proj.horizonISO, { layers:{ money:true, events:false, todos:false }, carryLate:true });
  const dayEvents = days.map(d=> (evs[d]||[]).filter(e=> e.type==='money' && !e.seen && e.signed));

  let lo = Math.min(...vals, buffer > 0 ? buffer : Infinity), hi = Math.max(...vals, buffer > 0 ? buffer : -Infinity);
  if(lo === hi){ lo -= 1; hi += 1; }
  const step = niceStep(hi - lo, 3);
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  if(hi - lo < step*2) hi = lo + step*2;
  const n = days.length;
  const X = i=> (i / n) * 100;                    // day i occupies [X(i), X(i+1))
  const Y = v=> (1 - (v - lo)/(hi - lo)) * 100;   // % from the top
  cashChartData = { days, vals, dayEvents, n, lo, hi };

  // Step path in a 100×100 box.
  let path = `M0,${Y(vals[0]).toFixed(2)}`;
  for(let i=1; i<n; i++) path += ` H${X(i).toFixed(3)} V${Y(vals[i]).toFixed(2)}`;
  path += ` H100`;
  const area = `${path} V100 H0 Z`;
  const shade = buffer > 0 ? vals.map((v,i)=> v < buffer
    ? `<rect x="${X(i).toFixed(3)}" y="${Y(buffer).toFixed(2)}" width="${(X(i+1)-X(i)).toFixed(3)}" height="${(Y(v)-Y(buffer)).toFixed(2)}" class="cc-below"></rect>` : '').join('') : '';
  const grid = [];
  for(let v = lo; v <= hi + 0.001; v += step) grid.push(v);

  const minI = days.indexOf(proj.min.date);
  const lastI = n - 1;
  const mondays = days.map((d,i)=> ({ d, i })).filter(x=> x.i > 2 && new Date(x.d+'T00:00:00').getDay() === 1);
  const dots = dayEvents.map((list,i)=> list.length && i>0 ? `<span class="cc-dot ${list.some(e=>e.signed>0)?'in':'out'}" style="left:${X(i)}%; top:${Y(vals[i])}%;"></span>` : '').join('');
  const edgeCls = (i)=> X(i) > 80 ? ' right' : (X(i) < 12 ? ' left' : '');

  return `
    <div class="cc" id="cashChart">
      <div class="cc-y">${grid.map(v=> `<span style="top:${Y(v)}%;">${moneyShort(v)}</span>`).join('')}</div>
      <div class="cc-plot" id="ccPlot" tabindex="0" role="img"
        aria-label="Reachable cash over the next 60 days: ${moneyWhole(vals[0])} today, lowest ${moneyWhole(proj.min.balance)} on ${formatDateShort(proj.min.date)}, ${moneyWhole(vals[lastI])} on day 60. Use the arrow keys to read each day.">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          ${grid.map(v=> `<line x1="0" x2="100" y1="${Y(v).toFixed(2)}" y2="${Y(v).toFixed(2)}" class="cc-grid"></line>`).join('')}
          <path d="${area}" class="cc-area"></path>
          ${shade}
          ${buffer > 0 ? `<line x1="0" x2="100" y1="${Y(buffer).toFixed(2)}" y2="${Y(buffer).toFixed(2)}" class="cc-buffer"></line>` : ''}
          <path d="${path}" class="cc-line"></path>
        </svg>
        ${dots}
        <span class="cc-lbl start${minI===0 && vals[0] < buffer ? ' warn' : ''}" style="top:${Y(vals[0])}%;">${moneyWhole(vals[0])}${minI===0 ? ' · lowest' : ''}</span>
        ${minI > 0 ? `<span class="cc-min ${proj.min.balance < buffer ? 'low':''}" style="left:${X(minI)}%; top:${Y(vals[minI])}%;"></span>
          <span class="cc-lbl low${edgeCls(minI)}" style="left:${X(minI)}%; top:${Y(vals[minI])}%;">Low ${moneyWhole(proj.min.balance)} · ${shortIsoDate(proj.min.date)}</span>` : ''}
        <span class="cc-lbl end" style="top:${Y(vals[lastI])}%;">${moneyWhole(vals[lastI])}</span>
        ${buffer > 0 ? `<span class="cc-lbl buf" style="top:${Y(buffer)}%;">buffer ${moneyShort(buffer)}</span>` : ''}
        <div class="cc-guide" id="ccGuide" hidden></div>
        <div class="cc-tip" id="ccTip" hidden></div>
      </div>
      <div class="cc-x">
        <span style="left:0;" class="first">today</span>
        ${mondays.map(x=> `<span style="left:${X(x.i)}%;">${shortIsoDate(x.d)}</span>`).join('')}
      </div>
    </div>`;
}
function wireCashChart(){
  const plot = document.getElementById('ccPlot');
  if(!plot || !cashChartData) return;
  const { days, vals, dayEvents, n } = cashChartData;
  const tip = document.getElementById('ccTip'), guide = document.getElementById('ccGuide');
  const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cur = -1;
  const show = i=>{
    i = Math.max(0, Math.min(n-1, i)); cur = i;
    const d = days[i], x = (i + 0.5) / n * 100;
    guide.hidden = false; guide.style.left = x + '%';
    const lines = dayEvents[i].map(e=> `<div class="cc-tip-ev"><span>${escHTML(e.name)}</span><span class="${e.signed>0?'pos':'neg'}">${e.signed>0?'+':'−'}${moneyWhole(Math.abs(e.signed))}</span></div>`).join('');
    tip.innerHTML = `<div class="cc-tip-h">${DOWS[new Date(d+'T00:00:00').getDay()]} ${shortIsoDate(d)}${i===0?' · today':''}</div>${lines}<div class="cc-tip-bal">${moneyWhole(vals[i])}</div>`;
    tip.hidden = false;
    tip.style.left = x + '%';
    tip.classList.toggle('flip', x > 70);
  };
  const hide = ()=>{ tip.hidden = true; guide.hidden = true; cur = -1; };
  const at = e=>{ const r = plot.getBoundingClientRect(); return r.width ? Math.floor(((e.clientX - r.left) / r.width) * n) : 0; };
  plot.addEventListener('pointermove', e=> show(at(e)));
  plot.addEventListener('pointerdown', e=> show(at(e)));
  plot.addEventListener('pointerleave', e=>{ if(e.pointerType === 'mouse') hide(); });
  plot.addEventListener('blur', hide);
  plot.addEventListener('keydown', e=>{
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      e.preventDefault();
      // Arrow keys jump to the next day something happens, or step a day if nothing does.
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      let i = cur < 0 ? 0 : cur + dir;
      while(i > 0 && i < n-1 && !dayEvents[i].length && Math.abs(i - cur) < n) i += dir;
      show(i);
    } else if(e.key === 'Escape'){ hide(); }
  });
}

function renderCalendar(c){
  const key    = calMonthKey();
  const mb     = monthBounds(key);
  const todayISO = isoDate(TODAY);
  const proj   = cashflowProjection();
  const events = calendarEvents(mb.firstISO, mb.lastISO);
  const buffer = (liqSettings().limits||{}).bufferToday || 0;

  // Same reasoning as the projection: the month's net is a fact about the month,
  // not about what happens to be on screen.
  let monthNet = 0;
  Object.values(calendarEvents(mb.firstISO, mb.lastISO,
    { layers:{ money:true, events:false, todos:false } }))
    .forEach(list=> list.forEach(e=> { monthNet += e.signed; }));

  const minDays = dayDiff(todayDate(), new Date(proj.min.date+'T00:00:00'));
  const noSchedule = !(state.bills||[]).some(b=> b.dueDate);

  const cells = [];
  const gridStart = mondayOf(mb.first);
  const total = Math.ceil((dayDiff(gridStart, mb.last) + 1) / 7) * 7;
  for(let i=0; i<total; i++){
    const d   = addDays(gridStart, i);
    const iso = isoDate(d);
    const evs = events[iso] || [];
    const outside = d.getMonth() !== mb.m;
    const bal = proj.balances[iso];
    const showBal = bal !== undefined && evs.some(e=> e.type === 'money');
    cells.push(`
      <div class="cal-day${outside?' out':''}${iso===todayISO?' today':''}" data-calday="${iso}" title="Add an event on ${formatDateShort(iso)}">
        <div class="cd-top">
          <span class="cd-num">${d.getDate()}</span>
          ${showBal ? `<span class="cd-bal${bal < buffer ? ' low':''}">${moneyWhole(bal)}</span>` : ''}
        </div>
        ${evs.map(e=> calEventHTML(e, true)).join('')}
      </div>`);
  }

  const agendaDays = Object.keys(events).filter(iso=> iso >= mb.firstISO && iso <= mb.lastISO).sort();
  const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const agenda = agendaDays.map(iso=>{
    const d = new Date(iso+'T00:00:00');
    const bal = proj.balances[iso];
    const showBal = bal !== undefined && (events[iso]||[]).some(e=> e.type === 'money');
    return `
      <div class="cal-ag-day${iso===todayISO?' today':''}">
        <div class="cal-ag-date">
          <div class="d">${d.getDate()}</div>
          <div class="w">${DOW[(d.getDay()+6)%7]}</div>
        </div>
        <div class="cal-ag-evs">
          ${events[iso].map(e=> calEventHTML(e, false)).join('')}
          ${showBal ? `<div class="cal-ag-bal${bal < buffer ? ' low':''}">balance ${moneyWhole(bal)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  // V4.11 — header row, summary strip, and the next 60 days of reachable cash as a line.
  const openTodos = todoItems().filter(t=> !t.done);
  const dueThisMonth = openTodos.filter(t=> t.dueDate && t.dueDate.slice(0,7) === currentMonthKey()).length;
  c.innerHTML = `
    <div class="dash-head">
      <h1 class="page-title">Calendar</h1>
      <span class="muted dash-head-sub">when money actually lands, not just how much</span>
      <div class="spacer"></div>
      <div class="cal-layers" role="group" aria-label="Show on the calendar">
        <button class="tchip${calLayers.money?' active':''}" data-callayer="money" aria-pressed="${!!calLayers.money}">Money</button>
        <button class="tchip${calLayers.events?' active':''}" data-callayer="events" aria-pressed="${!!calLayers.events}">Events</button>
        <button class="tchip${calLayers.todos?' active':''}" data-callayer="todos" aria-pressed="${!!calLayers.todos}">To dos</button>
      </div>
      <div class="dash-step">
        <button type="button" id="calPrev" aria-label="Previous month">‹</button>
        <span class="cal-title-lbl">${calMonthLabel(key)}</span>
        <button type="button" id="calNext" aria-label="Next month">›</button>
      </div>
      ${key === currentMonthKey() ? '' : `<button class="btn secondary" id="calToday">Today</button>`}
      <button class="btn secondary" id="calCats">Categories</button>
      <button class="btn" id="calAddEvent">+ Event</button>
    </div>

    <div class="dash-kpis cal-kpis">
      <div class="dash-kpi"><div class="k-label">Cash you can reach today</div><div class="k-val">${moneyWhole(proj.opening)}</div><div class="k-sub">the "today" tier from Liquidity</div></div>
      <div class="dash-kpi"><div class="k-label">Lowest point in 60 days</div><div class="k-val ${proj.min.balance < buffer ? 'neg' : ''}">${moneyWhole(proj.min.balance)}</div>
        <div class="k-sub">${minDays === 0 ? 'today — nothing scheduled brings it lower' : `${formatDateShort(proj.min.date)}, in ${minDays} day${minDays===1?'':'s'}`}</div></div>
      <div class="dash-kpi"><div class="k-label">Scheduled in ${calMonthLabel(key).split(' ')[0]}</div><div class="k-val ${monthNet>=0?'pos':'neg'}">${monthNet>=0?'+':'−'}${moneyWhole(Math.abs(monthNet))}</div><div class="k-sub">money in less money out and saved</div></div>
      <div class="dash-kpi"><div class="k-label">Open to-dos</div><div class="k-val">${openTodos.length}</div><div class="k-sub">${dueThisMonth ? `${dueThisMonth} due this month` : 'none due this month'}</div></div>
    </div>

    ${noSchedule ? `<div class="liq-banner">Nothing on the calendar yet. Add your salary, your bills and your monthly transfer to savings on the Bills tab, each with a next-due date, and the projection above becomes real.</div>` : `
    <div class="card dash-card cl-card">
      <div class="dash-card-head wrap"><span class="dash-card-title">Reachable cash, next 60 days</span>
        <span class="muted">each step is money landing${buffer>0 ? ` · amber: below your ${moneyWhole(buffer)} buffer` : ''} · hover or tap a day</span></div>
      ${cashChartHTML(proj, buffer)}
    </div>`}

    <div class="cal-pane-tabs">
      <button class="tchip${calPane==='calendar'?' active':''}" data-calpane="calendar">Calendar</button>
      <button class="tchip${calPane==='todo'?' active':''}" data-calpane="todo">To do</button>
    </div>

    <div class="cal-wrap pane-${calPane}">
      <div class="cal-pane-cal">
        <div class="cal-grid">
          ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${cells.join('')}
        </div>
        <div class="cal-agenda">
          ${agenda || `<div class="empty-state"><div class="glyph">·</div>Nothing scheduled in ${calMonthLabel(key)}.</div>`}
        </div>
        <div class="cal-legend">
          <span><i style="background:var(--green);"></i>Money in</span>
          <span><i style="background:var(--pink);"></i>Money out</span>
          <span><i style="background:var(--blue-bright);"></i>To savings</span>
          <span><i style="background:var(--gold);"></i>Rebalance</span>
          <span><i style="background:var(--ec-neutral);"></i>Event</span>
          <span><i style="background:var(--text-faint);"></i>To do</span>
          <span class="muted">Click an empty part of a day to add an event there.</span>
        </div>
      </div>
      <div class="cal-pane-todo">${todoPaneHTML()}</div>
    </div>
  `;

  const bind = (id, fn)=>{ const el = document.getElementById(id); if(el) el.onclick = fn; };
  bind('calPrev',  ()=>{ calMonth = shiftMonthKey(key, -1); render(); });
  bind('calNext',  ()=>{ calMonth = shiftMonthKey(key,  1); render(); });
  bind('calToday', ()=>{ calMonth = null; render(); });
  c.querySelectorAll('[data-calpane]').forEach(b=>
    b.onclick = ()=>{ calPane = b.dataset.calpane; render(); });
  c.querySelectorAll('[data-callayer]').forEach(b=>
    b.onclick = ()=>{ const k = b.dataset.callayer; calLayers[k] = !calLayers[k]; render(); });
  bind('calAddEvent', ()=> openEventModal(null, isoDate(TODAY)));
  bind('calCats', ()=> openCategoryManager());
  // Clicking the empty part of a day adds an event there. Chips sit on top and
  // stop the click, so tapping one still opens the thing it points at.
  c.querySelectorAll('[data-calday]').forEach(cell=>
    cell.onclick = e=>{ if(e.target === cell || e.target.closest('.cd-top') === e.target.parentElement)
      openEventModal(null, cell.dataset.calday); });
  // A derived event is a view of something owned elsewhere, so tapping it goes to
  // where it is actually edited rather than opening a second editor for it here.
  c.querySelectorAll('[data-calbill]').forEach(b=> b.onclick = e=>{ e.stopPropagation(); goToTab('bills'); });
  c.querySelectorAll('[data-calreb]').forEach(b=> b.onclick = e=>{ e.stopPropagation(); goToTab('investments'); });
  c.querySelectorAll('[data-caltodo]').forEach(b=> b.onclick = e=>{ e.stopPropagation(); openTodoModal(b.dataset.caltodo); });
  c.querySelectorAll('[data-calevent]').forEach(b=> b.onclick = e=>{ e.stopPropagation(); openEventModal(b.dataset.calevent); });
  wireCashChart();
  wireTodoPane(c);
}

function todoLists(){ return state.todoLists || (state.todoLists = []); }
function todoItems(){ return state.todos || (state.todos = []); }
function activeListId(){
  const lists = todoLists();
  if(todoActiveList && lists.some(l=> l.id === todoActiveList)) return todoActiveList;
  return lists.length ? lists[0].id : null;
}

function todoDueBadge(t){
  if(!t.dueDate) return '';
  const days = dayDiff(todayDate(), new Date(t.dueDate+'T00:00:00'));
  let cls = '', text = formatDateShort(t.dueDate);
  if(!t.done){
    if(days < 0){ cls = 'over'; text = `${text} — overdue ${Math.abs(days)}d`; }
    else if(days === 0){ cls = 'soon'; text = `${text} — today`; }
    else if(days <= 3){ cls = 'soon'; text = `${text} — in ${days}d`; }
  }
  return `<div class="tdue ${cls}">${text}</div>`;
}

function todoPaneHTML(){
  const lists = todoLists();
  const listId = activeListId();
  const list = lists.find(l=> l.id === listId);
  const items = todoItems().filter(t=> t.listId === listId);

  // Undone first, soonest due at the top, undated after them. Completed items are
  // kept rather than swept away — they just sink.
  const rank = t=> t.dueDate || '9999-99-99';
  const open = items.filter(t=> !t.done)
    .sort((a,b)=> rank(a).localeCompare(rank(b)) || (a.createdAt||'').localeCompare(b.createdAt||''));
  const done = items.filter(t=> t.done)
    .sort((a,b)=> (b.doneAt||'').localeCompare(a.doneAt||''));

  const row = t=> `
    <div class="todo-item${t.done?' done':''}">
      <input type="checkbox" data-todocheck="${t.id}" ${t.done?'checked':''}>
      <div class="tt">${escHTML(t.text)}${todoDueBadge(t)}</div>
      <button class="icon-btn" style="color:var(--gold);" data-todoedit="${t.id}" title="Edit">✎</button>
    </div>`;

  return `
    <div class="card">
      <div class="todo-chips">
        ${lists.map(l=>{
          const n = todoItems().filter(t=> t.listId === l.id && !t.done).length;
          return `<button class="tchip${l.id===listId?' active':''}" data-todolist="${l.id}">${escHTML(l.name)}${n?`<span class="c">${n}</span>`:''}</button>`;
        }).join('')}
        <button class="tchip add" id="todoAddList" title="New list">＋</button>
      </div>
      ${!list ? `<div class="muted" style="font-size:12.5px;">No lists yet.</div>` : `
      <div class="todo-add">
        <input type="text" id="todoNew" placeholder="Add to ${escHTML(list.name)}" autocomplete="off">
        <button class="btn" id="todoAddBtn">Add</button>
      </div>
      ${(open.length || done.length)
        ? open.map(row).join('') + done.map(row).join('')
        : `<div class="muted" style="font-size:12.5px; padding:8px 0;">Nothing here yet. Type above to add the first item.</div>`}
      <div class="todo-foot">
        <span>${open.length} open${done.length?`, ${done.length} done`:''}</span>
        <div class="spacer" style="flex:1;"></div>
        ${done.length ? `<button id="todoClearDone">Clear completed</button>` : ''}
        <button id="todoRenameList">Rename</button>
        ${list.locked ? '' : `<button class="del" id="todoDelList">Delete list</button>`}
      </div>`}
    </div>`;
}

function wireTodoPane(c){
  const bind = (id, fn)=>{ const el = document.getElementById(id); if(el) el.onclick = fn; };
  c.querySelectorAll('[data-todolist]').forEach(b=>
    b.onclick = ()=>{ todoActiveList = b.dataset.todolist; render(); });
  c.querySelectorAll('[data-todocheck]').forEach(cb=> cb.onchange = ()=>{
    const t = todoItems().find(x=> x.id === cb.dataset.todocheck);
    if(!t) return;
    t.done = cb.checked;
    t.doneAt = cb.checked ? new Date().toISOString() : '';
    saveState(); render();
  });
  c.querySelectorAll('[data-todoedit]').forEach(b=>
    b.onclick = ()=> openTodoModal(b.dataset.todoedit));

  const input = document.getElementById('todoNew');
  const addItem = ()=>{
    const text = (input.value||'').trim();
    if(!text) return;
    todoItems().push({ id:uid(), listId:activeListId(), text, done:false, dueDate:'',
                       createdAt:new Date().toISOString(), doneAt:'' });
    input.value = '';
    saveState(); render();
    const again = document.getElementById('todoNew');
    if(again) again.focus();
  };
  if(input) input.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); addItem(); } };
  bind('todoAddBtn', addItem);
  bind('todoAddList', ()=> openTodoListModal());
  bind('todoRenameList', ()=> openTodoListModal(activeListId()));
  bind('todoClearDone', ()=>{
    const listId = activeListId();
    state.todos = todoItems().filter(t=> !(t.listId === listId && t.done));
    saveState(); render(); toast('Completed items cleared.');
  });
  bind('todoDelList', ()=>{
    const listId = activeListId();
    const list = todoLists().find(l=> l.id === listId);
    if(!list || list.locked) return;
    const n = todoItems().filter(t=> t.listId === listId).length;
    confirmDestructive({
      title: 'Delete list',
      what: `Delete "${escHTML(list.name)}"${n ? ` and its ${n} item${n===1?'':'s'}` : ''}?`,
      lines: n ? [`${n} item${n===1?'':'s'} will be deleted with the list.`] : ['The list is empty.'],
      confirmLabel: 'Delete list',
      onConfirm: ()=>{
        state.todoLists = todoLists().filter(l=> l.id !== listId);
        state.todos = todoItems().filter(t=> t.listId !== listId);
        todoActiveList = null;
        saveState(); render(); toast('List deleted.');
      }
    });
  });
}

  root.innerHTML = `
    <div class="modal-backdrop" id="tlb">

  };
  document.getElementById('tiSave').onclick = ()=>{
    const text = document.getElementById('tiText').value.trim();
    if(!text){ toast('The item needs some text.'); return; }
    t.text = text;
    t.listId = document.getElementById('tiList').value;
    t.dueDate = document.getElementById('tiDue').value || '';
    saveState(); close(); render();
  };
}

/* The repeat controls appear only once a pattern is chosen, and the "every N"
   unit follows the pattern, so the form stays a single field until you ask it for
   more. Laid out to read the way the rule is spoken: every 2 weeks on Tue, Thu,
   until 30 June. */
function openEventModal(id, prefillDate){
  const root = document.getElementById('modalRoot');
  const ev = id ? (state.events||[]).find(e=> e.id === id) : null;
  const r  = ev ? ev.repeat : { freq:'none', interval:1, weekdays:[], endMode:'never', endDate:'', count:10 };
  const startDate = ev ? ev.startDate : (prefillDate || isoDate(TODAY));

  root.innerHTML = `
    <div class="modal-backdrop" id="evb">
      <div class="modal" style="max-width:480px;">
        <h2>${ev ? 'Edit event' : 'New event'}</h2>
        <div class="form-grid">
          <label class="field">Title <input type="text" id="evTitle" placeholder="e.g. Dentist"
            value="${ev ? escHTML(ev.title) : ''}"></label>
          <div class="ev-2col">
            <label class="field">Starts <input type="date" id="evStart" value="${startDate}"></label>
            <label class="field">Time <input type="time" id="evTime" value="${ev ? (ev.startTime||'') : ''}"></label>
          </div>
          <label class="field">Ends
            <input type="date" id="evEnd" value="${ev ? (ev.endDate||'') : ''}">
            <span class="muted" style="font-size:11px;">Leave blank for a single day. Set it for something spanning several, like a trip.</span>
          </label>
          <label class="field">Repeats
            <select id="evFreq">${EVENT_FREQS.map(([k,lab])=>
              `<option value="${k}" ${r.freq===k?'selected':''}>${lab}</option>`).join('')}</select>
          </label>
          <div id="evRepeatOpts">
            <div class="ev-2col" id="evEveryRow">
              <label class="field">Every <input type="number" id="evInterval" min="1" max="99" step="1" value="${r.interval||1}"></label>
              <div class="field"><span>&nbsp;</span><div class="ev-unit" id="evUnit"></div></div>
            </div>
            <label class="field" id="evDaysRow" style="margin-top:10px;">On
              <div class="ev-days">${WEEKDAYS.map(([d,lab])=>
                `<button type="button" class="ev-day${(r.weekdays||[]).includes(d)?' on':''}" data-evday="${d}">${lab}</button>`).join('')}</div>
            </label>
            <label class="field" style="margin-top:10px;">Ends
              <select id="evEndMode">
                <option value="never" ${r.endMode==='never'?'selected':''}>Never</option>
                <option value="on" ${r.endMode==='on'?'selected':''}>On a date</option>
                <option value="after" ${r.endMode==='after'?'selected':''}>After a number of times</option>
              </select>
            </label>
            <label class="field" id="evUntilRow" style="margin-top:10px;">Until
              <input type="date" id="evUntil" value="${r.endDate||''}"></label>
            <label class="field" id="evCountRow" style="margin-top:10px;">Number of times
              <input type="number" id="evCount" min="1" max="999" step="1" value="${r.count||10}"></label>
          </div>
          <label class="field">Category
            <div class="ev-cat-row">
              <select id="evCat"></select>
              <button type="button" class="btn secondary" id="evCatManage">Manage</button>
            </div>
          </label>
          <label class="field">Note <input type="text" id="evNote" placeholder="optional"
            value="${ev ? escHTML(ev.note||'') : ''}"></label>
        </div>
        <div class="ev-preview muted" id="evPreview"></div>
        <div class="form-actions">
          ${ev ? `<button class="btn danger" id="evDel" style="margin-right:auto;">Delete</button>` : ''}
          <button class="btn secondary" id="evCancel">Cancel</button>
          <button class="btn" id="evSave">${ev ? 'Save' : 'Add event'}</button>
        </div>
      </div>
    </div>`;

  const close = ()=> root.innerHTML = '';
  const q = sel=> root.querySelector(sel);
  const picked = new Set(r.weekdays || []);

  /* Rebuilt rather than re-rendered, so adding a category from inside the editor
     doesn't discard the title and dates already typed in. */
  const fillCats = (keep)=>{
    const sel = q('#evCat');
    const want = keep !== undefined ? keep : (ev ? (ev.categoryId||'') : '');
    sel.innerHTML = `<option value="">No category</option>` +
      (state.eventCategories||[]).map(c=>
        `<option value="${c.id}">${escHTML(c.name)}</option>`).join('');
    sel.value = (state.eventCategories||[]).some(c=> c.id === want) ? want : '';
  };
  fillCats();
  q('#evCatManage').onclick = ()=> openCategoryManager(()=> fillCats(q('#evCat').value));

  const syncForm = ()=>{
    const freq = q('#evFreq').value;
    const meta = EVENT_FREQS.find(f=> f[0] === freq);
    const repeats = freq !== 'none';
    q('#evRepeatOpts').style.display = repeats ? 'block' : 'none';
    // "Every N weekdays" is not a thing, so the interval row goes away for it.
    q('#evEveryRow').style.display = (repeats && meta[2]) ? 'grid' : 'none';
    q('#evUnit').textContent = meta[2] || '';
    q('#evDaysRow').style.display = freq === 'weekly' ? 'flex' : 'none';
    const mode = q('#evEndMode').value;
    q('#evUntilRow').style.display = mode === 'on' ? 'flex' : 'none';
    q('#evCountRow').style.display = mode === 'after' ? 'flex' : 'none';
    q('#evPreview').textContent = repeats
      ? repeatSummary({ repeat:{ freq, interval:Number(q('#evInterval').value)||1,
          weekdays:[...picked], endMode:mode, endDate:q('#evUntil').value, count:Number(q('#evCount').value)||1 } })
      : '';
  };

  q('#evCancel').onclick = close;
  q('#evb').addEventListener('click', e=>{ if(e.target.id==='evb') close(); });
  ['#evFreq','#evEndMode','#evInterval','#evUntil','#evCount'].forEach(sel=>
    q(sel).addEventListener('change', syncForm));
  root.querySelectorAll('[data-evday]').forEach(b=> b.onclick = ()=>{
    const d = Number(b.dataset.evday);
    if(picked.has(d)) picked.delete(d); else picked.add(d);
    b.classList.toggle('on', picked.has(d));
    syncForm();
  });
  if(ev) q('#evDel').onclick = ()=>{
    confirmDestructive({
      title:'Delete event',
      what:`Delete "${escHTML(ev.title)}"?`,
      lines: (ev.repeat && ev.repeat.freq !== 'none')
        ? ['This is a repeating event — every occurrence goes, not just one.'] : [],
      confirmLabel:'Delete event',
      onConfirm: ()=>{
        state.events = (state.events||[]).filter(x=> x.id !== ev.id);
        saveState(); render(); toast('Event deleted.');
      }
    });
  };
  q('#evSave').onclick = ()=>{
    const title = q('#evTitle').value.trim();
    const start = q('#evStart').value;
    if(!title){ toast('Give the event a title.'); return; }
    if(!start){ toast('Pick a start date.'); return; }
    const end = q('#evEnd').value || '';
    if(end && end < start){ toast('The end date is before the start date.'); return; }
    const freq = q('#evFreq').value;
    const repeat = {
      freq,
      interval: Math.max(1, Math.min(99, Number(q('#evInterval').value)||1)),
      // Weekly with nothing ticked repeats on the start date's own weekday, which
      // is what "weekly" means without further instruction.
      weekdays: freq === 'weekly' ? [...picked] : [],
      endMode: q('#evEndMode').value,
      endDate: q('#evUntil').value || '',
      count: Math.max(1, Math.min(999, Number(q('#evCount').value)||10))
    };
    const payload = { title, note:q('#evNote').value.trim(), startDate:start,
                      startTime:q('#evTime').value || '', endDate:end,
                      categoryId:q('#evCat').value || '', repeat };
    if(ev){ Object.assign(ev, payload); toast('Event updated.'); }
    else { (state.events || (state.events = [])).push({ id:uid(), ...payload }); toast('Event added.'); }
    saveState(); close(); render();
  };
  syncForm();
  q('#evTitle').focus();
}

/* Categories carry the colour so it is set once per category rather than picked
   on every event. Opened as its own layer on top of whatever is already showing,
   so it can be reached from inside the event editor without losing that form. */
function openCategoryManager(onClose){
  const root = document.getElementById('modalRoot');
  const layer = document.createElement('div');
  const draw = ()=>{
    const cats = state.eventCategories || (state.eventCategories = []);
    layer.innerHTML = `
      <div class="modal-backdrop" id="ecb" style="z-index:60;">
        <div class="modal" style="max-width:470px;">
          <h2>Event categories</h2>
          <div class="muted" style="font-size:12px; margin-bottom:6px;">Each category has a colour, and every event in it takes that colour. Events keep their own shape, so a colour here can never be mistaken for money.</div>
          ${cats.length ? cats.map(c=>`
            <div class="ec-row">
              <input type="text" data-ecname="${c.id}" value="${escHTML(c.name)}">
              <button class="icon-btn" data-ecdel="${c.id}" title="Delete">✕</button>
              <div class="ec-swatches">${EVENT_COLOURS.map(k=>
                `<button type="button" class="ec-sw${c.colour===k?' on':''}" style="--sw:var(--ec-${k})" data-eccol="${c.id}" data-k="${k}" title="${k}"></button>`).join('')}</div>
            </div>`).join('')
            : `<div class="muted" style="font-size:12.5px; padding:8px 0;">No categories yet. Add one below — events without a category use the default colour.</div>`}
          <div class="todo-add" style="margin-top:14px;">
            <input type="text" id="ecNew" placeholder="New category name" autocomplete="off">
            <button class="btn" id="ecAdd">Add</button>
          </div>
          <div class="form-actions"><button class="btn" id="ecDone">Done</button></div>
        </div>
      </div>`;
    const q = sel=> layer.querySelector(sel);
    const add = ()=>{
      const name = q('#ecNew').value.trim();
      if(!name){ toast('Give the category a name.'); return; }
      state.eventCategories.push({ id:uid(), name, colour:'neutral' });
      saveState(); draw();
    };
    q('#ecAdd').onclick = add;
    q('#ecNew').onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); add(); } };
    q('#ecDone').onclick = ()=>{ layer.remove(); if(onClose) onClose(); render(); };
    q('#ecb').addEventListener('click', e=>{
      if(e.target.id === 'ecb'){ layer.remove(); if(onClose) onClose(); render(); } });
    layer.querySelectorAll('[data-ecname]').forEach(inp=> inp.onchange = ()=>{
      const c = state.eventCategories.find(x=> x.id === inp.dataset.ecname);
      if(c && inp.value.trim()){ c.name = inp.value.trim(); saveState(); }
    });
    layer.querySelectorAll('[data-eccol]').forEach(b=> b.onclick = ()=>{
      const c = state.eventCategories.find(x=> x.id === b.dataset.eccol);
      if(c){ c.colour = b.dataset.k; saveState(); draw(); }
    });
    layer.querySelectorAll('[data-ecdel]').forEach(b=> b.onclick = ()=>{
      const id = b.dataset.ecdel;
      const c = state.eventCategories.find(x=> x.id === id);
      const used = (state.events||[]).filter(e=> e.categoryId === id).length;
      // Deleting a category must never delete events — they fall back to the
      // default colour, which is recoverable; a deleted appointment is not.
      confirmDestructive({
        title:'Delete category',
        what:`Delete "${escHTML(c.name)}"?`,
        lines: used
          ? [`${used} event${used===1?'':'s'} will keep their dates and move to the default colour.`]
          : ['No events are using it.'],
        confirmLabel:'Delete category',
        onConfirm: ()=>{
          state.eventCategories = state.eventCategories.filter(x=> x.id !== id);
          (state.events||[]).forEach(e=>{ if(e.categoryId === id) e.categoryId = ''; });
          saveState();
          // confirmDestructive clears the layers beneath it, so put this one back.
          openCategoryManager(onClose);
        }
      });
    });
  };
  draw();
  root.appendChild(layer);
}

function moveCategory(type, cat, direction){
  const arr = state.categories[type];
  const idx = arr.indexOf(cat);
  if(idx===-1) return;
  const swapIdx = idx + direction;
  if(swapIdx<0 || swapIdx>=arr.length) return;
  [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
  saveState(); render();
}

/* Un-starring hides the ⊘ toggle, so the stricter flag goes with it — otherwise it
   would keep applying with no visible control to turn it off. */
function clearBalanceExclusionIfNotSpecial(key){
  if(!(state.settings.excludedFromSummary||[]).includes(key)){
    state.settings.excludedFromBalance = (state.settings.excludedFromBalance||[]).filter(k=> k!==key);
  }
}

function toggleCategorySpecial(type, cat){
  const key = type+'|||'+cat;
  const list = new Set(state.settings.excludedFromSummary||[]);
  if(list.has(key)) list.delete(key); else list.add(key);
  state.settings.excludedFromSummary = [...list];
  clearBalanceExclusionIfNotSpecial(key);
  saveState(); render();
}

function renameCategory(type, oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  if(state.categories[type].includes(newName)){ toast('That category already exists.'); return; }
  const idx = state.categories[type].indexOf(oldName);
  if(idx===-1) return;
  state.categories[type][idx] = newName;

  // Carry the rename through everywhere the old name is referenced
  Object.keys(state.planning).forEach(yr=>{
    const bucket = state.planning[yr] && state.planning[yr][type];
    if(bucket && bucket[oldName]){ bucket[newName] = bucket[oldName]; delete bucket[oldName]; }
  });
  state.transactions.forEach(tx=>{ if(tx.type===type && tx.category===oldName) tx.category = newName; });
  if(type==='Expenses'){
    state.settings.weeklyExcludedCategories = (state.settings.weeklyExcludedCategories||[]).map(c=> c===oldName ? newName : c);
  }
  if(type==='Savings'){
    state.accounts.forEach(a=>{ if(a.linkedCategory===oldName) a.linkedCategory = newName; });
  }
  state.settings.excludedFromSummary = (state.settings.excludedFromSummary||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);
  state.settings.essentialCategories = (state.settings.essentialCategories||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);
  state.settings.investingCategories = (state.settings.investingCategories||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);
  state.settings.excludedFromBalance = (state.settings.excludedFromBalance||[]).map(k=> k===`${type}|||${oldName}` ? `${type}|||${newName}` : k);

  saveState(); render(); toast(`Renamed to "${newName}".`);
}
