/* V4.4 — compact dashboard. Same data, same settings keys, denser layout.
   Period is stepped with ‹ › instead of three dropdowns; the weekly threshold and
   exclusions live in a popover so they stop taking a third of the right column. */
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let dashWeekPopOpen = false;
let _dashPopCleanup = null;

/* "2026-09-21" -> "21 Sep". Split the string rather than build a Date, so no timezone can move the day. */
function shortIsoDate(iso){
  const p = String(iso||'').split('-');
  if(p.length!==3) return iso||'';
  const mi = Number(p[1])-1;
  return `${Number(p[2])} ${MONTHS[mi]||''}`;
}

function compactDonutHTML(type, segments, totalTracked){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let acc = 0;
  const stops = segments.map(s=>{
    const a = (acc/total)*100; acc += s.value;
    return `${s.color} ${a.toFixed(2)}% ${((acc/total)*100).toFixed(2)}%`;
  }).join(', ');
  return `
    <div class="dash-donut">
      <div class="dash-donut-ring" style="background:conic-gradient(${stops});" role="img" aria-label="${type} by category"><div class="dash-donut-hole">${type.slice(0,3)}</div></div>
      <div class="dash-donut-legend">
        ${segments.map(s=>`
          <div class="dash-leg-row" title="${s.label}: ${moneyWhole(s.value)}">
            <span class="dash-sw" style="background:${s.color};"></span>
            <span class="dash-leg-name">${s.label}</span>
            <span class="muted">${totalTracked>0 ? ((s.value/totalTracked)*100).toFixed(0)+'%' : '—'}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

/* The ‹ › range. yearOptions() counts every key in state.planning, and merely viewing a
   year creates an all-zero planning entry for it — so stepping › would push its own limit
   three years further every time. Only planning years with a real budget count here. */
function dashYearBounds(){
  const years = new Set([state.settings.startingYear, TODAY.getFullYear()]);
  state.transactions.forEach(tx=>{ const n = new Date(tx.date).getFullYear(); if(isSaneYear(n)) years.add(n); });
  Object.keys(state.planning).forEach(k=>{
    const n = Number(k); if(!isSaneYear(n)) return;
    const py = state.planning[k] || {};
    const used = TYPES.some(t=> Object.values(py[t]||{}).some(arr=> Array.isArray(arr) && arr.some(v=> Number(v))));
    if(used) years.add(n);
  });
  const arr = [...years].filter(isSaneYear);
  return { minYear: Math.min(...arr), maxYear: Math.max(...arr) + 3 };
}

/* =========================================================
   DASHBOARD ANALYSIS (V4.5): budget pace and category heatmap.
   Everything here is derived at render time from transactions, Planning and
   Bills; nothing new is stored apart from which heatmap colouring is chosen.
   Months are handled as a single index (year*12 + month) so stepping back
   across a year boundary is plain arithmetic, never Date.setMonth().
========================================================= */
const mIndex = (y, mo)=> y*12 + mo;
const mYear = k=> Math.floor(k/12);
const mMonth = k=> ((k%12)+12)%12;

/* trackedTotals() walks every transaction, and the analysis asks for the same
   month many times over, so each render gets one memo. */
function dashMonthMemo(){
  const memo = new Map();
  return k=>{
    if(!memo.has(k)) memo.set(k, trackedTotals(mYear(k), mMonth(k)));
    return memo.get(k);
  };
}

function isSummaryExcluded(type, cat){
  return (state.settings.excludedFromSummary || []).includes(type + '|||' + cat);
}

/* The month of the earliest transaction. Months before it read as zero spend,
   which isn't real data, so they're kept out of every average. */
function firstTrackedMonthIdx(){
  let min = null;
  state.transactions.forEach(tx=>{
    const d = effectiveDate(tx);
    if(!isSaneYear(d.getFullYear())) return;
    const k = mIndex(d.getFullYear(), d.getMonth());
    if(min===null || k<min) min = k;
  });
  return min;
}

/* Day-by-day expenses in one month, ☆ Special categories left out as they are
   everywhere else on the dashboard. Index 1 = the 1st. */
function dailyExpensesAUD(k){
  const y = mYear(k), mo = mMonth(k), days = new Date(y, mo+1, 0).getDate();
  const out = new Array(days+1).fill(0);
  state.transactions.forEach(tx=>{
    if(tx.type!=='Expenses' || isSummaryExcluded(tx.type, tx.category)) return;
    const d = effectiveDate(tx);
    if(d.getFullYear()===y && d.getMonth()===mo) out[d.getDate()] += txAmountAUD(tx);
  });
  return out;
}
const cumulate = arr=>{ let c = 0; return arr.map(v=> (c += v)); };

function dashExpenseBudget(y, mo){
  return state.categories.Expenses
    .filter(cat=> !isSummaryExcluded('Expenses', cat))
    .reduce((s,cat)=> s + budgetFor(y, 'Expenses', cat, mo), 0);
}

/* Month pace. A straight line from zero to the budget would put you "over pace"
   on the 1st every month, because rent lands then. So the line steps up by each
   money-out bill on its due day, and only the rest of the budget is spread evenly.
   If the bills alone exceed the budget, the line follows the bills. */
function paceMonthData(y, m){
  const k = mIndex(y, m), nowK = mIndex(TODAY.getFullYear(), TODAY.getMonth());
  const days = new Date(y, m+1, 0).getDate();
  const budget = dashExpenseBudget(y, m);
  const billByDay = new Array(days+1).fill(0);
  const from = isoDate(new Date(y, m, 1)), to = isoDate(new Date(y, m, days));
  (state.bills || []).filter(b=> (b.kind||'expense')==='expense').forEach(b=>{
    billOccurrences(b, from, to).forEach(iso=>{
      billByDay[Number(iso.slice(8,10))] += toAUD(Number(b.amount)||0, b.currency||'AUD');
    });
  });
  const billsTotal = billByDay.reduce((a,b)=> a+b, 0);
  const spread = Math.max(0, budget - billsTotal);
  let c = 0;
  const pace = billByDay.map((v,d)=>{ c += v; return c + spread*d/days; });
  const upTo = k<nowK ? days : (k===nowK ? TODAY.getDate() : 0);
  const spentAll = cumulate(dailyExpensesAUD(k));
  const spent = spentAll.slice(0, upTo+1);
  const ghosts = [1,2,3].map(i=>{
    const g = cumulate(dailyExpensesAUD(k-i));
    return g[g.length-1] > 0 ? g.map((v,d)=> [d/(g.length-1), v]) : null;
  }).filter(Boolean);
  return {
    days, budget, billsTotal, upTo, state: k<nowK ? 'past' : (k===nowK ? 'current' : 'future'),
    pace: pace.map((v,d)=> [d/days, v]),
    spent: spent.map((v,d)=> [d/days, v]),
    ghosts,
    spentNow: spent[spent.length-1] || 0,
    paceNow: pace[upTo] || 0,
    fracNow: upTo/days
  };
}

/* Year pace: year-to-date spend against the Planning months added up, so an
   uneven budget (a bigger December) is followed rather than averaged away. */
function paceYearData(y, memo){
  const nowK = mIndex(TODAY.getFullYear(), TODAY.getMonth());
  const bud = [], act = [], prev = [];
  for(let mo=0; mo<12; mo++){
    bud.push(dashExpenseBudget(y, mo));
    act.push(sumType(memo(mIndex(y, mo)).Expenses));
    prev.push(sumType(memo(mIndex(y-1, mo)).Expenses));
  }
  const cb = [0, ...cumulate(bud)], cp = [0, ...cumulate(prev)];
  const ca = [0, ...cumulate(act)];
  let frac; // months elapsed, fractional in the current month
  if(mIndex(y, 11) < nowK) frac = 12;
  else if(mIndex(y, 0) > nowK) frac = 0;
  else {
    const mo = TODAY.getMonth(), dim = new Date(y, mo+1, 0).getDate();
    frac = mo + TODAY.getDate()/dim;
  }
  const full = Math.floor(frac);
  const spent = ca.slice(0, full+1).map((v,i)=> [i/12, v]);
  if(frac > full) spent.push([frac/12, ca[full+1]]);
  const paceNow = cb[full] + (full<12 ? bud[full]*(frac-full) : 0);
  return {
    budget: cb[12], state: frac>=12 ? 'past' : (frac<=0 ? 'future' : 'current'),
    pace: cb.map((v,i)=> [i/12, v]),
    spent, ghosts: cp[12] > 0 ? [cp.map((v,i)=> [i/12, v])] : [],
    spentNow: spent.length ? spent[spent.length-1][1] : 0,
    paceNow, fracNow: frac/12
  };
}

function paceSVG(d, ticks){
  const W = 900, H = 132, pl = 40, pr = 8, pt = 8, pb = 18;
  const all = [...d.pace, ...d.spent, ...d.ghosts.flat()].map(p=> p[1]);
  const mx = niceCeil(Math.max(1, ...all) * 1.05);
  const X = f=> pl + f*(W-pl-pr), Y = v=> H-pb - (v/mx)*(H-pb-pt);
  const line = (pts, cls)=> pts.length > 1 ? `<polyline class="${cls}" points="${pts.map(p=> X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"></polyline>` : '';
  let g = '';
  for(let i=0; i<=4; i++){
    const v = mx*i/4, yy = Y(v).toFixed(1);
    g += `<line class="pace-grid" x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" opacity="${i===0?1:0.5}"></line><text class="pace-axis" x="${pl-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${formatAxisLabel(v)}</text>`;
  }
  d.ghosts.forEach(gh=> g += line(gh, 'pace-ghost'));
  if(d.budget > 0 || d.pace.some(p=> p[1] > 0)) g += line(d.pace, 'pace-budget');
  g += line(d.spent, 'pace-spent');
  if(d.state==='current'){
    const nx = X(d.fracNow).toFixed(1);
    const paceY = d.pace.some(p=> p[1] > 0) ? `<circle class="pace-dot-budget" cx="${nx}" cy="${Y(d.paceNow).toFixed(1)}" r="2.5"></circle>` : '';
    g += `<line class="pace-now" x1="${nx}" y1="${pt}" x2="${nx}" y2="${H-pb}"></line>${paceY}<circle class="pace-dot-spent" cx="${nx}" cy="${Y(d.spentNow).toFixed(1)}" r="3"></circle>`;
  }
  ticks.forEach(t=> g += `<text class="pace-axis${t.cur?' cur':''}" x="${X(t.f).toFixed(1)}" y="${H-5}" text-anchor="middle">${t.label}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Expenses against budget pace">${g}</svg>`;
}

function paceCardHTML(y, m, viewMode, memo){
  const isYear = viewMode==='year';
  const d = isYear ? paceYearData(y, memo) : paceMonthData(y, m);
  let ticks;
  if(isYear){
    const curMo = y===TODAY.getFullYear() ? TODAY.getMonth() : -1;
    ticks = MONTHS.map((lab,i)=> ({ f:(i+0.5)/12, label:lab, cur:i===curMo }));
  } else {
    const marks = [1,5,10,15,20,25,d.days];
    if(d.state==='current' && !marks.includes(d.upTo)) marks.push(d.upTo);
    ticks = marks.filter(n=> !(d.state==='current' && n!==d.upTo && Math.abs(n-d.upTo)<2))
      .map(n=> ({ f:n/d.days, label:String(n), cur: d.state==='current' && n===d.upTo }));
  }
  const stat = (label, val, cls, sub, attr)=> `<div class="pace-stat" ${attr||''}><div class="k-label">${label}</div><div class="k-val ${cls||''}">${val}</div><div class="k-sub">${sub}</div></div>`;
  const pctOf = d.budget > 0 ? ` · ${((d.spentNow/d.budget)*100).toFixed(0)}%` : '';
  const hasPace = d.pace.some(p=> p[1] > 0);
  let side;
  if(d.state==='future'){
    side = stat('Budget', moneyWhole(d.budget), '', isYear ? 'Planning months, summed' : 'nothing spent yet')
         + stat('Pace', '—', 'muted', `this ${viewMode} hasn't started`);
  } else if(!hasPace){
    side = stat(d.state==='past' ? 'Spent' : 'Spent so far', moneyWhole(d.spentNow), 'neg', 'no expense budget set')
         + stat('Pace', '—', 'muted', 'add budgets in Planning');
  } else if(d.state==='past'){
    const diff = d.spentNow - Math.max(d.budget, d.pace[d.pace.length-1][1]);
    side = stat('Spent', moneyWhole(d.spentNow), 'neg', `of ${moneyWhole(d.budget)} budget${pctOf}`)
         + stat(diff>0 ? 'Over budget' : 'Under budget', (diff>0?'+':'') + moneyWhole(Math.abs(diff)), diff>0?'neg':'pos', `${viewMode} complete`, 'data-pace-diff');
  } else {
    const diff = d.spentNow - d.paceNow;
    side = stat('Spent so far', moneyWhole(d.spentNow), 'neg', `of ${moneyWhole(d.budget)} budget${pctOf}`)
         + stat('Pace line today', moneyWhole(d.paceNow), '', isYear ? 'Planning months, summed' : (d.billsTotal>0 ? 'bills on due days + rest spread' : 'budget spread evenly'), 'data-pace-now')
         + stat(diff>0 ? 'Over pace' : 'Under pace', (diff>0?'+':'') + moneyWhole(Math.abs(diff)), diff>0?'neg':'pos', `at ${(d.fracNow*100).toFixed(0)}% of the ${viewMode}`, 'data-pace-diff');
  }
  const ghostLabel = isYear ? String(y-1) : [3,2,1].map(i=> MONTHS[mMonth(mIndex(y,m)-i)]).join(' · ');
  const legend = `<div class="dash-legend"><span><i style="border-color:var(--pink)"></i>Spent</span><span><i style="border-color:var(--gold); border-top-style:dashed"></i>Budget pace</span>${d.ghosts.length ? `<span><i style="border-color:var(--text-dim); opacity:.45"></i>${ghostLabel}</span>` : ''}</div>`;
  return `
    <div class="card dash-card dash-pace" id="dashPace">
      <div class="dash-pace-main">
        <div class="dash-card-head wrap"><span class="dash-card-title">Budget pace</span><span class="muted">expenses, ${isYear ? 'year' : 'month'} to date</span><div class="spacer"></div>${legend}</div>
        ${paceSVG(d, ticks)}
      </div>
      <div class="dash-pace-side">${side}</div>
    </div>`;
}

/* Category × month heatmap. Coloured by how far each month sits from that
   category's own average over the six months before it (months before the first
   transaction don't count), or by raw amount. The current month is partial, so
   it's outlined and marked MTD rather than adjusted.
   A category spent on in fewer than three of those six months is irregular —
   travel, gifts, medical — and a % against its average is noise: a trip reads
   as a huge spike and every quiet month after it as −100%. Those cells show the
   plain amount in a neutral tint instead, and their $0 months a dot. "new" is
   kept for a category that has never had any spending before. */
function heatmapCardHTML(y, m, viewMode, memo){
  const mode = state.ui.heatMode==='raw' ? 'raw' : 'dev';
  const nowK = mIndex(TODAY.getFullYear(), TODAY.getMonth());
  const first = firstTrackedMonthIdx();
  const cols = viewMode==='year'
    ? MONTHS.map((_,i)=> mIndex(y, i))
    : Array.from({length:12}, (_,i)=> mIndex(y, m) - 11 + i);
  const val = (cat, k)=> memo(k).Expenses[cat] || 0;
  const avgBefore = (cat, k)=>{
    const ks = [1,2,3,4,5,6].map(i=> k-i).filter(x=> first!==null && x>=first && x<=nowK);
    const spendN = ks.filter(x=> val(cat,x) > 0).length;
    return ks.length ? { avg: ks.reduce((s,x)=> s+val(cat,x), 0)/ks.length, n: ks.length, spendN } : { avg: 0, n: 0, spendN: 0 };
  };
  const everBefore = (cat, k)=>{
    if(first===null) return false;
    for(let x=first; x<k; x++) if(val(cat,x) > 0) return true;
    return false;
  };
  const cats = state.categories.Expenses.filter(cat=> !isSummaryExcluded('Expenses', cat));
  const rows = cats.map(cat=>{
    const cells = cols.map(k=>{
      if(k > nowK) return { k, future:true };
      const v = val(cat, k);
      const { avg, n, spendN } = avgBefore(cat, k);
      const isNew = v > 0 && n > 0 && !everBefore(cat, k);
      return { k, v, avg, n, partial: k===nowK, isNew, irregular: !isNew && spendN < 3 };
    });
    const total = cells.reduce((s,c)=> s + (c.v||0), 0);
    const lastK = Math.min(cols[cols.length-1], nowK);
    const ks = (lastK===nowK ? [1,2,3,4,5,6].map(i=> lastK-i) : [0,1,2,3,4,5].map(i=> lastK-i))
      .filter(x=> first!==null && x>=first);
    const rowAvg = ks.length ? ks.reduce((s,x)=> s+val(cat,x), 0)/ks.length : null;
    return { cat, cells, total, rowAvg };
  }).filter(r=> r.total > 0).sort((a,b)=> b.total - a.total);

  const rawMax = Math.max(1, ...rows.flatMap(r=> r.cells.filter(c=> !c.future).map(c=> c.v)));
  const mixBg = (color, pct)=> `background:color-mix(in srgb, ${color} ${pct.toFixed(0)}%, var(--surface-raised))`;
  const colLabel = k=> MONTHS[mMonth(k)] + (viewMode==='month' && mYear(k)!==y ? ' ’' + String(mYear(k)).slice(2) : '') + (k===nowK ? ' · MTD' : '');
  const cellHTML = (r, c)=>{
    if(c.future) return `<td><div class="hm-cell future" aria-label="${r.cat}, ${colLabel(c.k)}: not yet"></div></td>`;
    const name = `${r.cat} · ${MONTHS[mMonth(c.k)]} ${mYear(c.k)}${c.partial?' (month to date)':''} · ${moneyWhole(c.v)}${c.n ? ' · 6-mo avg ' + moneyWhole(c.avg) : ''}`;
    let style = '', text = '·', weak = true;
    if(mode==='raw'){
      if(c.v > 0){
        const t = Math.sqrt(c.v/rawMax);
        style = mixBg('var(--pink)', 8 + 70*t); text = moneyWhole(c.v); weak = t < 0.45;
      }
    } else if(c.isNew){
      style = mixBg('var(--red)', 75); text = 'new'; weak = false;
    } else if(c.irregular){
      if(c.v > 0){ style = mixBg('var(--text-faint)', 14); text = moneyWhole(c.v); }
    } else {
      if(c.avg>0){
        const dev = (c.v - c.avg)/c.avg;
        if(Math.abs(dev) >= 0.03){
          const t = Math.min(1, Math.abs(dev)/0.5);
          style = mixBg(dev>0 ? 'var(--red)' : 'var(--gold)', 15 + 60*t);
          text = (dev>0?'+':'−') + Math.round(Math.abs(dev)*100) + '%';
          weak = t < 0.5;
        }
      }
    }
    return `<td><div class="hm-cell${weak?' weak':''}${c.partial?' partial':''}${mode==='dev' && c.irregular ? ' irr' : ''}" style="${style}" title="${name}" data-hm="${r.cat}|${c.k}">${text}</div></td>`;
  };
  const scale = mode==='raw'
    ? `<span>less</span>${[8,25,42,60,78].map(p=> `<span class="sw" style="${mixBg('var(--pink)', p)}"></span>`).join('')}<span>more</span>`
    : `<span>below avg</span>${[['var(--gold)',75],['var(--gold)',35],[null,0],['var(--red)',35],['var(--red)',75]].map(([c,p])=> `<span class="sw" style="${c ? mixBg(c,p) : 'background:var(--surface-raised)'}"></span>`).join('')}<span>above avg</span><span class="hm-irr-key" title="Categories spent on in fewer than 3 of the previous 6 months show the amount instead of a %">$ = irregular</span>`;
  const sub = viewMode==='year' ? `Jan–Dec ${y}` : 'last 12 months';
  return `
    <div class="card dash-card dash-heat-card" id="dashHeat">
      <div class="dash-card-head wrap"><span class="dash-card-title">Spending by category</span><span class="muted">${sub} · ☆ Special excluded</span><div class="spacer"></div>
        <div class="dash-heat-scale">${scale}</div>
        <div class="dash-seg sm" role="group" aria-label="Heatmap colour">
          <button type="button" data-heatmode="dev" class="${mode==='dev'?'on':''}" aria-pressed="${mode==='dev'}">vs 6-mo avg</button>
          <button type="button" data-heatmode="raw" class="${mode==='raw'?'on':''}" aria-pressed="${mode==='raw'}">Amount</button>
        </div>
      </div>
      ${rows.length===0 ? `<div class="empty-state"><div class="glyph">·</div>No expenses tracked in these twelve months.</div>` : `
      <div class="dash-heat-wrap">
        <table class="dash-heat">
          <thead><tr><th>Category</th>${cols.map(k=> `<th class="${k===nowK?'cur':''}">${colLabel(k)}</th>`).join('')}<th class="avg">6-mo avg</th></tr></thead>
          <tbody>${rows.map(r=> `<tr><td title="${r.cat}">${r.cat}</td>${r.cells.map(c=> cellHTML(r,c)).join('')}<td class="avg">${r.rowAvg===null ? '—' : moneyWhole(r.rowAvg)}</td></tr>`).join('')}</tbody>
        </table>
      </div>`}
    </div>`;
}

function renderDashboard(c){
  if(_dashPopCleanup){ _dashPopCleanup(); _dashPopCleanup = null; }

  const { minYear, maxYear } = dashYearBounds();
  const y = state.ui.dashYear, m = state.ui.dashMonth;
  const viewMode = state.ui.dashViewMode || 'month';
  const totals = periodTrackedTotals(y, viewMode, m);
  const memo = dashMonthMemo();

  // Prior period for comparison: previous month (month view) or previous year (year view)
  let priorY = y, priorM = m;
  if(viewMode==='year'){ priorY = y-1; }
  else { priorM = m-1; if(priorM<0){ priorM = 11; priorY = y-1; } }
  const priorTotals = periodTrackedTotals(priorY, viewMode, priorM);
  const vsLabel = viewMode==='year' ? `vs ${priorY}` : `vs ${MONTHS[priorM]}`;
  function periodChangeHTML(type){
    const cur = sumType(totals[type]);
    const prior = sumType(priorTotals[type]);
    if(prior<=0) return `<span class="muted">no ${vsLabel.slice(3)} data</span>`;
    const chg = ((cur-prior)/prior)*100;
    const good = type==='Expenses' ? chg<0 : chg>0;
    const cls = chg===0 ? 'muted' : (good ? 'pos' : 'neg');
    return `<span class="${cls}">${chg>=0?'+':''}${chg.toFixed(1)}%</span> <span class="muted">${vsLabel}</span>`;
  }
  const threshold = Number(state.settings.weeklyThreshold)||300;

  const breakdownSections = TYPES.map(type=>{
    const cats = state.categories[type];
    const rows = cats.map(cat=>{
      const tracked = totals[type][cat]||0;
      const budget = periodBudget(y, type, cat, viewMode, m);
      const p = pct(tracked, budget);
      const remaining = budget - tracked;
      return {cat, tracked, budget, p, remaining};
    }).filter(r=> r.tracked!==0 || r.budget!==0)
      .sort((a,b)=> b.tracked - a.tracked);

    const totalTracked = sumType(totals[type]);
    // ☆ Special categories are already left out of the tracked figure, so their
    // budgets come out of the header's budget too — otherwise it compares unlike totals.
    const totalBudget = cats.filter(cat=> !isSummaryExcluded(type, cat)).reduce((s,cat)=> s+periodBudget(y,type,cat,viewMode,m), 0);
    const maxTracked = Math.max(1, ...rows.map(r=>r.tracked));

    return `
      <div class="card card-${type} dash-card">
        <div class="dash-card-head"><span class="dash-card-title">${type}</span><span class="muted num-font">${moneyWhole(totalTracked)} / ${moneyWhole(totalBudget)}</span></div>
        ${rows.length===0 ? `<div class="empty-state"><div class="glyph">·</div>No ${type.toLowerCase()} recorded or budgeted for this ${viewMode}.</div>` : `
        <div class="plan-table-wrap">
        <table class="data dash-table">
          <thead><tr><th>Category</th><th class="num">Tracked</th><th class="num">Budget</th><th class="num">Left</th></tr></thead>
          <tbody>
            ${rows.map(r=>{
              let barClass = 'neutral', barWidth = Math.min(100, (r.tracked/maxTracked)*100);
              if(r.budget>0){
                const ratio = r.tracked / r.budget;
                barWidth = Math.min(100, ratio*100);
                barClass = ratio >= 1 ? 'over' : (ratio >= 0.8 ? 'near' : '');
              }
              let left = '—', leftCls = 'muted';
              if(r.budget){
                if(r.remaining>0){ left = moneyWhole(r.remaining); leftCls = 'dim'; }
                else if(r.remaining<0){ left = '+'+moneyWhole(Math.abs(r.remaining)); leftCls = 'neg'; }
                else { left = '0'; leftCls = 'dim'; }
              }
              return `
              <tr>
                <td><div class="dash-cat">
                  <span class="dash-cat-name">${r.cat}</span>
                  <span class="dash-bar"><span class="bar-fill ${barClass}" style="width:${barWidth}%"></span></span>
                  <span class="dash-pct muted">${r.p===null ? '—' : (r.p*100).toFixed(0)+'%'}</span>
                </div></td>
                <td class="num">${moneyWhole(r.tracked)}</td>
                <td class="num muted">${r.budget ? moneyWhole(r.budget) : '—'}</td>
                <td class="num ${leftCls}" data-left="${r.cat}">${left}</td>
              </tr>`;}).join('')}
          </tbody>
        </table>
        </div>`}
      </div>`;
  }).join('');

  const summaryDonuts = TYPES.map(type=>{
    const cats = state.categories[type];
    const rows = cats.map(cat=>({cat, tracked: totals[type][cat]||0}));
    const totalTracked = sumType(totals[type]);
    if(totalTracked<=0) return `<div class="card card-${type} dash-card"><div class="dash-card-head"><span class="dash-card-title">${type}</span></div><div class="muted" style="font-size:12px;">Nothing tracked for this ${viewMode} yet.</div></div>`;
    return `<div class="card card-${type} dash-card">${compactDonutHTML(type, buildDonutSegments(type, rows), totalTracked)}</div>`;
  }).join('');

  const rate = state.settings.savingsRateType==='active'
    ? pct(sumType(totals.Savings), sumType(totals.Income))
    : pct(sumType(totals.Income)-sumType(totals.Expenses), sumType(totals.Income));

  const weeks = weeklyExpenseRows(); // index 0 = current week ... index 4 = 4 weeks ago
  const currentWeek = weeks[0];
  const priorFour = weeks.slice(1,5);
  const avgLast4 = priorFour.reduce((s,w)=>s+w.total,0) / (priorFour.length || 1);
  const vsAvgPct = avgLast4 > 0 ? ((currentWeek.total - avgLast4) / avgLast4) * 100 : null;
  const weekScale = Math.max(1, threshold, ...weeks.map(w=>w.total));

  const periodProgress = periodProgressPct(y, viewMode, m);
  let progressText;
  if(periodProgress<=0) progressText = 'Not started';
  else if(periodProgress>=100) progressText = viewMode==='year' ? 'Year complete' : 'Month complete';
  else if(viewMode==='year') progressText = `${periodProgress}% of the year elapsed`;
  else progressText = `Day ${TODAY.getDate()} of ${new Date(y, m+1, 0).getDate()} · ${periodProgress}% elapsed`;

  const periodBalance = sumType(totals.Income) - sumType(totals.Expenses) - sumType(totals.Savings);
  const trendSeries = state.ui.trendSeries || { Budget:true, Income:true, Expenses:true, Savings:true };
  const lineSeries = state.ui.lineSeries || { Income:true, Expenses:true, Savings:true };
  const excludedWeekly = (state.settings.weeklyExcludedCategories||[]).filter(cat=> state.categories.Expenses.includes(cat));
  const exclText = excludedWeekly.length===0 ? 'no exclusions'
    : (excludedWeekly.length<=2 ? excludedWeekly.join(', ')+' excluded' : `${excludedWeekly.length} excluded`);

  const periodLabel = viewMode==='year' ? String(y) : `${MONTHS_LONG[m]} ${y}`;
  const atMin = viewMode==='year' ? y<=minYear : (y<minYear || (y===minYear && m===0));
  const atMax = viewMode==='year' ? y>=maxYear : (y>maxYear || (y===maxYear && m===11));
  const swatch = k=> k==='Budget' ? 'var(--text-faint)' : k==='Income' ? 'var(--green)' : k==='Expenses' ? 'var(--pink)' : 'var(--blue-bright)';
  const chip = (attr, k, on, label)=> `<label class="dash-chip"><input type="checkbox" ${attr}="${k}" ${on?'checked':''}><span class="dash-sw" style="background:${swatch(k)};"></span>${label}</label>`;

  c.innerHTML = `
    <div class="dash-head">
      <h1 class="page-title">Dashboard</h1>
      <span class="muted dash-head-sub">Budget vs. actual</span>
      <div class="spacer"></div>
      <div class="dash-seg" role="group" aria-label="Period type">
        <button type="button" id="dashModeMonth" class="${viewMode==='month'?'on':''}" aria-pressed="${viewMode==='month'}">Month</button>
        <button type="button" id="dashModeYear" class="${viewMode==='year'?'on':''}" aria-pressed="${viewMode==='year'}">Year</button>
      </div>
      <div class="dash-step">
        <button type="button" id="dashPrev" aria-label="Previous ${viewMode}" ${atMin?'disabled':''}>‹</button>
        <span id="dashPeriodLabel">${periodLabel}</span>
        <button type="button" id="dashNext" aria-label="Next ${viewMode}" ${atMax?'disabled':''}>›</button>
      </div>
      <button type="button" class="btn secondary dash-today" id="dashToday">Today</button>
    </div>
    <div class="dash-progress">
      <div class="dash-progress-track"><div class="dash-progress-fill" style="width:${periodProgress}%;"></div></div>
      <span class="muted">${progressText}</span>
    </div>
    ${paceCardHTML(y, m, viewMode, memo)}

    <div class="dash-kpis">
      <div class="dash-kpi"><div class="k-label">Income</div><div class="k-val pos">${moneyWhole(sumType(totals.Income))}</div><div class="k-sub">${periodChangeHTML('Income')}</div></div>
      <div class="dash-kpi"><div class="k-label">Expenses</div><div class="k-val neg">${moneyWhole(sumType(totals.Expenses))}</div><div class="k-sub">${periodChangeHTML('Expenses')}</div></div>
      <div class="dash-kpi"><div class="k-label">Savings</div><div class="k-val" style="color:var(--blue-bright)">${moneyWhole(sumType(totals.Savings))}</div><div class="k-sub">${periodChangeHTML('Savings')}</div></div>
      <div class="dash-kpi"><div class="k-label">Savings rate</div><div class="k-val" style="color:var(--blue-bright)">${rate===null?'—':(rate*100).toFixed(1)+'%'}</div><div class="k-sub muted">${state.settings.savingsRateType==='active'?'savings ÷ income':'(income − expenses) ÷ income'}</div></div>
      <div class="dash-kpi"><div class="k-label">${periodBalance>=0?'Unallocated':'Over-allocated'}</div><div class="k-val ${periodBalance<0?'neg':'pos'}">${moneyWhole(Math.abs(periodBalance))}</div><div class="k-sub muted">${periodBalance>=0 ? 'tracked income not yet assigned' : 'allocated more than tracked income'}</div></div>
      <div class="dash-kpi"><div class="k-label">This week</div><div class="k-val neg">${moneyWhole(currentWeek.total)} <span class="week-badge ${currentWeek.total>threshold?'over':'under'}">${currentWeek.total>threshold?'Over':'Under'}</span></div><div class="k-sub muted">${vsAvgPct===null ? '' : `${vsAvgPct>=0?'+':''}${vsAvgPct.toFixed(0)}% vs 4-wk avg · `}${shortIsoDate(currentWeek.start)}–${shortIsoDate(currentWeek.end)}</div></div>
    </div>

    <div class="dash-grid">
      <div class="dash-col">${breakdownSections}</div>
      <div class="dash-col">${summaryDonuts}</div>
      <div class="dash-col">
        <div class="card dash-card">
          <div class="dash-card-head wrap"><span class="dash-card-title">Monthly trend</span><span class="muted">tracked vs. budget, ${y}</span><div class="spacer"></div>
            ${['Budget','Income','Expenses','Savings'].map(k=> chip('data-trendseries', k, trendSeries[k], k)).join('')}
          </div>
          ${monthlyTrendSVG(y, trendSeries, m, viewMode)}
        </div>
        <div class="card dash-card">
          <div class="dash-card-head wrap"><span class="dash-card-title">Actuals over time</span><span class="muted">by month</span><div class="spacer"></div>
            ${['Income','Expenses','Savings'].map(k=> chip('data-lineseries', k, lineSeries[k], k)).join('')}
          </div>
          ${monthlyLineSVG(y, lineSeries, m, viewMode)}
        </div>
        <div class="card dash-card dash-weekly">
          <div class="dash-card-head"><span class="dash-card-title">Weekly expenses</span><span class="muted">Mon–Sun · 4-wk avg ${moneyWhole(avgLast4)}</span></div>
          ${weeks.map((w,i)=>`
            <div class="dash-week-row ${w.total>threshold?'over':''} ${i===0?'now':''}">
              <span class="dash-week-dates">${shortIsoDate(w.start)} – ${shortIsoDate(w.end)}</span>
              <span class="dash-bar"><span class="bar-fill ${w.total>threshold?'over':'near'}" style="width:${Math.min(100,(w.total/weekScale)*100)}%"></span></span>
              <span class="dash-week-amt num-font">${moneyWhole(w.total)}</span>
              <span class="dash-week-chg num-font ${w.pctChange===null?'muted':(w.pctChange>0?'neg':(w.pctChange<0?'pos':'muted'))}">${w.pctChange===null?'—':(w.pctChange>=0?'+':'')+w.pctChange.toFixed(1)+'%'}</span>
            </div>`).join('')}
          <div class="dash-week-foot">
            <span class="muted" id="dashWeekSummary">Threshold ${moneyWhole(threshold)} · ${exclText}</span>
            <div class="spacer"></div>
            <button type="button" class="dash-link" id="dashWeekEdit" aria-expanded="${dashWeekPopOpen}" aria-controls="dashWeekPop">Edit</button>
          </div>
          ${dashWeekPopOpen ? `
          <div class="dash-pop" id="dashWeekPop" role="dialog" aria-label="Weekly expense settings">
            <label class="field">Alert threshold
              <input type="number" id="weekThreshold" step="10" min="0" value="${threshold}" style="width:90px;">
            </label>
            <div class="dash-pop-title">Exclude from weekly total</div>
            <div class="muted" style="font-size:11.5px; margin-bottom:6px;">Ticked categories (e.g. Rent) are left out of the weekly totals.</div>
            <div class="dash-pop-list">
              ${state.categories.Expenses.map(cat=>{
                const excluded = (state.settings.weeklyExcludedCategories||[]).includes(cat);
                return `<label><input type="checkbox" data-weekexcl="${cat}" ${excluded?'checked':''}> ${cat}</label>`;
              }).join('')}
            </div>
            <div style="display:flex; justify-content:flex-end; margin-top:8px;"><button type="button" class="btn secondary" id="dashWeekDone">Done</button></div>
          </div>` : ''}
        </div>
      </div>
    </div>
    ${heatmapCardHTML(y, m, viewMode, memo)}
  `;

  const go = (yy, mm)=>{ state.ui.dashYear = yy; if(mm!==undefined) state.ui.dashMonth = mm; saveState(); render(); };
  document.getElementById('dashModeMonth').onclick = ()=>{ if(viewMode!=='month'){ state.ui.dashViewMode = 'month'; saveState(); render(); } };
  document.getElementById('dashModeYear').onclick = ()=>{ if(viewMode!=='year'){ state.ui.dashViewMode = 'year'; saveState(); render(); } };
  document.getElementById('dashPrev').onclick = ()=>{
    if(atMin) return;
    if(viewMode==='year') go(y-1); else go(m===0 ? y-1 : y, m===0 ? 11 : m-1);
  };
  document.getElementById('dashNext').onclick = ()=>{
    if(atMax) return;
    if(viewMode==='year') go(y+1); else go(m===11 ? y+1 : y, m===11 ? 0 : m+1);
  };
  document.getElementById('dashToday').onclick = ()=>{ state.ui.dashYear=TODAY.getFullYear(); state.ui.dashMonth=TODAY.getMonth(); state.ui.dashViewMode='month'; saveState(); render(); };

  const closePop = ()=>{ if(!dashWeekPopOpen) return; dashWeekPopOpen = false; render(); };
  document.getElementById('dashWeekEdit').onclick = ()=>{ dashWeekPopOpen = !dashWeekPopOpen; render(); };
  if(dashWeekPopOpen){
    const pop = document.getElementById('dashWeekPop');
    document.getElementById('dashWeekDone').onclick = closePop;
    document.getElementById('weekThreshold').onchange = e=>{ state.settings.weeklyThreshold = Number(e.target.value)||300; saveState(); render(); };
    pop.querySelectorAll('[data-weekexcl]').forEach(cb=>{
      cb.onchange = ()=>{
        const cat = cb.dataset.weekexcl;
        const list = new Set(state.settings.weeklyExcludedCategories||[]);
        if(cb.checked) list.add(cat); else list.delete(cat);
        state.settings.weeklyExcludedCategories = [...list];
        saveState(); render();
      };
    });
    // Outside click or Escape closes it. If the dashboard has been navigated away from,
    // the popover is gone from the DOM and the listeners just remove themselves.
    const onDown = e=>{
      const p = document.getElementById('dashWeekPop');
      if(!p){ cleanup(); dashWeekPopOpen = false; return; }
      if(p.contains(e.target) || e.target.id==='dashWeekEdit') return;
      closePop();
    };
    const onKey = e=>{ if(e.key==='Escape'){ if(!document.getElementById('dashWeekPop')){ cleanup(); dashWeekPopOpen = false; return; } closePop(); } };
    const cleanup = ()=>{ document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey);
    _dashPopCleanup = cleanup;
  }

  c.querySelectorAll('[data-trendseries]').forEach(cb=>{
    cb.onchange = ()=>{
      state.ui.trendSeries = state.ui.trendSeries || { Budget:true, Income:true, Expenses:true, Savings:true };
      state.ui.trendSeries[cb.dataset.trendseries] = cb.checked;
      saveState(); render();
    };
  });
  c.querySelectorAll('[data-heatmode]').forEach(b=>{
    b.onclick = ()=>{
      if((state.ui.heatMode||'dev')===b.dataset.heatmode) return;
      state.ui.heatMode = b.dataset.heatmode; saveState(); render();
    };
  });
  c.querySelectorAll('[data-lineseries]').forEach(cb=>{
    cb.onchange = ()=>{
      state.ui.lineSeries = state.ui.lineSeries || { Income:true, Expenses:true, Savings:true };
      state.ui.lineSeries[cb.dataset.lineseries] = cb.checked;
      saveState(); render();
    };
  });
}

/* A mistyped date — "0006" for "2026" — used to seed a planning year that then
   stuck around in the dropdown forever, because the year list is built from the
   keys of state.planning and nothing ever removed them. */
const YEAR_MIN = 1970, YEAR_MAX = 2200;
function isSaneYear(y){ return Number.isFinite(y) && y >= YEAR_MIN && y <= YEAR_MAX; }

function yearOptions(){
  const start = state.settings.startingYear;
  const years = new Set([start, TODAY.getFullYear()]);
  Object.keys(state.planning).forEach(y=>{ const n = Number(y); if(isSaneYear(n)) years.add(n); });
  state.transactions.forEach(tx=>{ const n = new Date(tx.date).getFullYear(); if(isSaneYear(n)) years.add(n); });
  const arr = [...years].filter(isSaneYear).sort((a,b)=>a-b);
  if(!arr.length) arr.push(TODAY.getFullYear());
  // pad a few future years for planning convenience
  const maxY = Math.max(...arr);
  for(let y=maxY+1; y<=maxY+3; y++) arr.push(y);
  return arr;
}

  document.getElementById('addTxBtn').onclick = ()=> openTxModal();

function csvEscape(v){
  const s = String(v==null ? '' : v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}

function exportTransactionsCSV(){
  const rows = [...transactionsWithBalance()].reverse(); // oldest first for a natural ledger read
  const header = ['Date','Type','Category','Details','Amount','Currency','Amount (AUD)','Balance (AUD)'];
  const lines = [header.join(',')];
  rows.forEach(r=>{
    const cur = r.currency || 'AUD';
    lines.push([r.date, r.type, r.category, csvEscape(r.details||''), r.amount, cur, txAmountAUD(r).toFixed(2), r.balance.toFixed(2)].join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  downloadBlob(blob, `transactions-${isoDate(TODAY)}.csv`);
  toast('CSV exported.');
}

function openTxModal(editId){
  const root = document.getElementById('modalRoot');
  const existing = editId ? state.transactions.find(t=>t.id===editId) : null;
  const type = existing ? existing.type : 'Expenses';
  root.innerHTML = `
    <div class="modal-backdrop" id="mb">
      <div class="modal">
        <h2>${existing ? 'Edit transaction' : 'Add transaction'}</h2>
        <div class="form-grid">
          <label class="field">Date <input type="date" id="fDate" min="1970-01-01" max="2200-12-31" value="${existing ? existing.date : isoDate(TODAY)}"></label>
          <label class="field">Type

          </label>
          <label class="field">Category <select id="fCat"></select></label>
          <label class="field">Amount <input type="number" id="fAmt" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="${existing ? existing.amount : ''}"></label>
          <label class="field">Currency
            <select id="fCurrency">${NET_WORTH_CURRENCIES.map(cur=>`<option ${(existing ? (existing.currency||'AUD') : 'AUD')===cur?'selected':''}>${cur}</option>`).join('')}</select>

        </div>
        <div class="form-actions">
          <button class="btn secondary" id="fCancel">Cancel</button>
          <button class="btn" id="fSave">${existing ? 'Save changes' : 'Save'}</button>
        </div>
      </div>
    </div>
  `;
  function fillCats(){
    const t = document.getElementById('fType').value;
    document.getElementById('fCat').innerHTML = state.categories[t].map(cat=>`<option ${existing && existing.category===cat ? 'selected':''}>${cat}</option>`).join('');
  }
  fillCats();
  document.getElementById('fType').onchange = fillCats;
  document.getElementById('fCancel').onclick = ()=> root.innerHTML='';

  document.getElementById('fSave').onclick = ()=>{
    const date = document.getElementById('fDate').value;
    const t = document.getElementById('fType').value;
    const cat = document.getElementById('fCat').value;
    const amt = Number(document.getElementById('fAmt').value);
    const currency = document.getElementById('fCurrency').value;

    const yr = Number(date.slice(0,4));

    }

function renderPlanning(c){
  if(!isSaneYear(Number(state.ui.planYear))) state.ui.planYear = TODAY.getFullYear();
  const y = state.ui.planYear;
  ensurePlanningYear(y);
  const mobileMonth = (state.ui.planMobileMonth ?? TODAY.getMonth());
  // Same range as the dashboard's arrows: years with real data, plus three ahead.
  // yearOptions() grows every time a year is merely looked at, so it can't bound ‹ ›.
  const { minYear, maxYear } = dashYearBounds();
  const curMonth = y===TODAY.getFullYear() ? TODAY.getMonth() : -1;
  const excluded = new Set(state.settings.excludedFromSummary || []);

  // Actual tracked amounts per type/month, used to highlight budget cells
  const monthlyActuals = {};
  TYPES.forEach(t=>{
    monthlyActuals[t] = [];
    for(let mi=0; mi<12; mi++) monthlyActuals[t].push(trackedTotals(y, mi)[t]);
  });
  const typeTotals = {};
  TYPES.forEach(t=>{
    typeTotals[t] = new Array(12).fill(0);
    state.categories[t].forEach(cat=> state.planning[y][t][cat].forEach((v,i)=> typeTotals[t][i] += Number(v)||0));
  });
  const toAllocate = typeTotals.Income.map((v,i)=> v - typeTotals.Expenses[i] - typeTotals.Savings[i]);
  const toAllocateTotal = toAllocate.reduce((a,b)=>a+b,0);
  const monthsDone = toAllocate.filter((v,i)=> Math.abs(v) < 0.005 && typeTotals.Income[i] > 0).length;
  const yearSum = t=> typeTotals[t].reduce((a,b)=>a+b,0);
  const curCls = i=> i===curMonth ? ' pl-cur' : '';
  // Copy is only offered for a year with nothing planned at all, so it can never
  // overwrite a budget. Reset clears the year back to that state.
  const planHasValues = yr=> !!state.planning[yr] && TYPES.some(t=> Object.values(state.planning[yr][t]||{}).some(arr=> Array.isArray(arr) && arr.some(v=> Number(v))));
  const yearHasPlan = planHasValues(y);
  const canCopy = !yearHasPlan && planHasValues(y-1);

  const typeRows = type=>{
    const cats = state.categories[type];
    const head = `
      <tr class="pl-type" data-plantype="${type}">
        <td class="catname pl-type-name ${type}">${type}</td>
        ${typeTotals[type].map((v,i)=>`<td class="num muted${curCls(i)}">${moneyWhole(v)}</td>`).join('')}
        <td class="num muted">${moneyWhole(yearSum(type))}</td>
      </tr>`;
    const rows = cats.map(cat=>{
      const isSpecial = excluded.has(`${type}|||${cat}`);
      const arr = state.planning[y][type][cat];
      const rowTotal = arr.reduce((a,b)=>a+(Number(b)||0),0);
      const cells = arr.map((v,i)=>{
        const budget = Number(v)||0;
        const actual = monthlyActuals[type][i][cat] || 0;
        let cls = '';
        if(budget>0 && actual>0){
          const isOnBudget = Math.abs(actual-budget) < 0.005;
          if(type==='Expenses') cls = actual>budget && !isOnBudget ? 'pinput-over' : (isOnBudget ? 'pinput-met' : (actual/budget>=0.8 ? 'pinput-near' : ''));
          else cls = actual>=budget ? 'pinput-met' : (actual/budget>=0.8 ? 'pinput-near' : '');
        }
        return `<td class="${curCls(i).trim()}"><input type="number" step="1" class="${cls}" value="${v||''}" placeholder="0" data-m="${i}" title="Actual so far: ${moneyWhole(actual)}" aria-label="${cat}, ${MONTHS[i]} budget"></td>`;
      }).join('');
      return `<tr data-cat="${cat}" data-type="${type}">
        <td class="catname ${type} pl-cat">${cat}${isSpecial?' <span class="muted" title="Special — excluded from graphs/donuts/breakdown totals" style="font-size:11px;">☆</span>':''}</td>
        ${cells}
        <td class="num" style="font-weight:600;">${moneyWhole(rowTotal)}</td>
      </tr>`;
    }).join('');
    return head + rows;
  };

  c.innerHTML = `
    <div class="dash-head">
      <h1 class="page-title">Planning</h1>
      <span class="muted dash-head-sub">monthly budget per category — type into any cell</span>
      <div class="spacer"></div>
      <div class="dash-step">
        <button type="button" id="planPrev" aria-label="Previous year" ${y<=minYear?'disabled':''}>‹</button>
        <span id="planYearLabel" style="min-width:70px; text-align:center; font-size:13px;">${y}</span>
        <button type="button" id="planNext" aria-label="Next year" ${y>=maxYear?'disabled':''}>›</button>
      </div>
      <label class="field plan-mobile-month-picker">Month
        <select id="planMobileMonth">${MONTHS.map((m,i)=>`<option value="${i}" ${i===mobileMonth?'selected':''}>${m}</option>`).join('')}</select>
      </label>
      ${canCopy ? `<button class="btn secondary" id="planCopyBtn" title="Fill ${y} with every budget from ${y-1}">Copy ${y-1} plan</button>` : ''}
    </div>

    <div class="dash-kpis pl-kpis">
      <div class="dash-kpi"><div class="k-label">Planned income</div><div class="k-val pos">${moneyWhole(yearSum('Income'))}</div><div class="k-sub">${y} · ${moneyWhole(yearSum('Income')/12)} a month on average</div></div>
      <div class="dash-kpi"><div class="k-label">Planned expenses</div><div class="k-val" style="color:var(--pink)">${moneyWhole(yearSum('Expenses'))}</div><div class="k-sub">${y} · ${moneyWhole(yearSum('Expenses')/12)} a month on average</div></div>
      <div class="dash-kpi"><div class="k-label">Planned savings</div><div class="k-val" style="color:var(--blue-bright)">${moneyWhole(yearSum('Savings'))}</div><div class="k-sub">${y} · ${moneyWhole(yearSum('Savings')/12)} a month on average</div></div>
      <div class="dash-kpi"><div class="k-label">To be allocated</div><div class="k-val ${Math.abs(toAllocateTotal)<0.005?'pos':(toAllocateTotal<0?'neg':'')}" style="${Math.abs(toAllocateTotal)>=0.005 && toAllocateTotal>0?'color:var(--amber)':''}">${Math.abs(toAllocateTotal)<0.005 ? 'Done ✓' : moneyWhole(toAllocateTotal)}</div><div class="k-sub">income − expenses − savings, whole year</div></div>
      <div class="dash-kpi"><div class="k-label">Months done</div><div class="k-val">${monthsDone} of 12</div><div class="k-sub">every planned dollar assigned</div></div>
    </div>

/* =========================================================
   NET WORTH
========================================================= */
/* Sum of all Savings-type transactions in a given category, all-time (by actual transaction date) */
const NET_WORTH_CURRENCIES = ['AUD','THB','USD'];
const CURRENCY_SYMBOLS = { AUD:'$', THB:'฿', USD:'US$' };

/* A "unit" is either an account (no sub-categories) or a sub-category — both have
   openingBalance + openingDate + history, and can be reconstructed as of any date.
   Balances are always in the account's own currency; convert with toAUD() for totals/graphs. */
function unitBalanceAsOf(unit, dateISO){
  const opening = Number(unit.openingBalance)||0;
  const histSum = (unit.history||[]).filter(h=> h.date<=dateISO).reduce((s,h)=> s+(Number(h.delta)||0), 0);
  return opening + histSum;
}

function accountBalanceAsOf(account, dateISO){
  if(account.subCategories && account.subCategories.length){
    return account.subCategories.reduce((s,sub)=> s+unitBalanceAsOf(sub, dateISO), 0);
  }
  return unitBalanceAsOf(account, dateISO);
}

/* An account's live balance, in its own currency — its opening balance + adjustments
   since, or, if split into sub-categories, their sum. */
function computeAccountBalance(a){
  return accountBalanceAsOf(a, isoDate(TODAY));
}

/* Convert an amount from a given currency into AUD using the latest fetched FX rates.
   If a rate is missing the amount is passed through unconverted — which is WRONG by
   whatever the real rate is — so missingFxCurrencies() below drives a loud banner
   rather than letting a ฿238,000 balance quietly masquerade as $238,000. */
function toAUD(amount, currency){
  if(!currency || currency==='AUD') return amount;
  const rate = state.fxRates && state.fxRates[currency];
  return rate ? amount/rate : amount;
}

/* Non-AUD currencies that are actually in use somewhere but have no rate to convert
   with. Scanned from the data rather than recorded during conversion, so the answer
   doesn't depend on which tab happens to be open. */
function missingFxCurrencies(){
  const used = new Set();
  const noteCur = cur=>{ if(cur && cur!=='AUD') used.add(cur); };
  (state.accounts||[]).forEach(a=>{
    if(a.subCategories && a.subCategories.length) a.subCategories.forEach(sub=> noteCur(sub.currency || a.currency));
    else noteCur(a.currency);
  });
  (state.transactions||[]).forEach(t=> noteCur(t.currency));
  (state.bills||[]).forEach(b=> noteCur(b.currency));
  return [...used].filter(cur=> !(state.fxRates && state.fxRates[cur]));
}

function fxGapBannerHTML(missing){
  return `
    <div class="fx-alert">
      <div><b>Exchange rates haven't loaded.</b> ${missing.join(' and ')} amounts are being counted at 1:1 against AUD,
      so every total on this page — balances, net worth, runway and currency mix — is overstated.</div>
      <div class="fx-alert-actions">
        <button class="btn secondary" id="fxAlertRefresh">Refresh rates</button>
        <button class="btn secondary" id="fxAlertManual">Enter manually</button>
      </div>
    </div>`;
}

/* Inverse of toAUD — convert an AUD amount into another currency (e.g. for a portfolio target set in THB). */
function fromAUD(amountAUD, currency){
  if(!currency || currency==='AUD') return amountAUD;
  const rate = state.fxRates && state.fxRates[currency];
  return rate ? amountAUD*rate : amountAUD;
}

function accountBalanceAUD(a, dateISO){
  const d = dateISO || isoDate(TODAY);
  if(a.subCategories && a.subCategories.length){
    return a.subCategories.reduce((s,sub)=> s + toAUD(unitBalanceAsOf(sub, d), sub.currency||a.currency), 0);
  }
  return toAUD(unitBalanceAsOf(a, d), a.currency);
}

/* Whole numbers by default — balances and net worth read better without cents.
   Pass a decimals count where the exact figure matters, such as the amount you
   actually typed on a transaction. */
function moneyCur(amount, currency, decimals){
  const sym = CURRENCY_SYMBOLS[currency] || '$';
  const v = Number(amount)||0;
  const sign = v<0 ? '-' : '';
  const d = decimals===undefined ? 0 : decimals;
  const abs = Math.abs(v).toLocaleString(undefined, { minimumFractionDigits:d, maximumFractionDigits:d });
  return `${sign}${sym}${abs}`;
}

function netWorthAUD(){
  return state.accounts.reduce((sum,a)=> sum + accountBalanceAUD(a), 0);
}

function netWorthAsOf(dateISO){
  return state.accounts.reduce((sum,a)=> sum + accountBalanceAUD(a, dateISO), 0);
}

/* Fetch AUD->THB/USD rates from a free, no-key, CORS-enabled API. Refreshes at most
   once every 24h unless forced (e.g. a manual "Refresh rates" click). */

/* =========================================================
   FX HISTORY (V4.6)
   Balances are stored in their own currency, so valuing a past month needs the
   rates of that month, not today's. One entry per month, keyed 'YYYY-MM':
   { THB, USD, asOf, source }. The current month's entry follows every refresh,
   so it's the latest rate seen; once a month is over, the backfill replaces it
   with the published month-end rate. 'backfilled' entries are final.
========================================================= */
function recordFxSnapshot(rates, source, dateISO){
  if(!rates || !rates.THB || !rates.USD) return false;
  const d = dateISO || isoDate(TODAY), key = d.slice(0,7);
  state.fxHistory = state.fxHistory || {};
  const cur = state.fxHistory[key];
  if(cur && (cur.source==='backfilled' || cur.asOf > d)) return false;
  state.fxHistory[key] = { THB: rates.THB, USD: rates.USD, asOf: d, source };
  return true;
}

const monthEndISO = k=> isoDate(new Date(mYear(k), mMonth(k)+1, 0));
const monthKeyOf = k=> `${mYear(k)}-${String(mMonth(k)+1).padStart(2,'0')}`;

/* Past months still without a final month-end rate: from the month before
   tracking began (a first month needs a starting rate) or 13 months back,
   whichever is earlier, up to last month. Capped at ten years. */
function fxMonthsNeeded(){
  const nowK = mIndex(TODAY.getFullYear(), TODAY.getMonth());
  const earliest = earliestTrackingDateISO();
  let fromK = earliest ? mIndex(Number(earliest.slice(0,4)), Number(earliest.slice(5,7))-1) - 1 : nowK - 13;
  fromK = Math.max(nowK - 120, Math.min(fromK, nowK - 13));
  const hist = state.fxHistory || {};
  const need = [];
  for(let k=fromK; k<nowK; k++){
    const s = hist[monthKeyOf(k)];
    if(!s || s.source!=='backfilled') need.push(k);
  }
  return need;
}

const FRANKFURTER_HOSTS = ['https://api.frankfurter.dev/v1', 'https://api.frankfurter.app'];
/* Second source for past rates: one file per date, served from two mirrors. */
const FAWAZ_URLS = [
  d=> `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${d}/v1/currencies/aud.min.json`,
  d=> `https://${d}.currency-api.pages.dev/v1/currencies/aud.min.json`
];

/* Frankfurter's time series in one request: { 'YYYY-MM-DD': {THB, USD}, … } */
async function fetchFrankfurterSeries(fromISO, toISO){
  let lastErr = null;
  for(const host of FRANKFURTER_HOSTS){
    try{
      const res = await fetch(`${host}/${fromISO}..${toISO}?base=AUD&symbols=THB,USD`);
      if(!res.ok) throw new Error(host.replace('https://','')+' HTTP '+res.status);
      const data = await res.json();
      if(!data || !data.rates || !Object.keys(data.rates).length) throw new Error(host.replace('https://','')+': no rates');
      return { rates: data.rates, provider: 'frankfurter' };
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

/* One month-end rate from the fallback source. */
async function fetchFawazRate(dateISO){
  let lastErr = null;
  for(const url of FAWAZ_URLS){
    try{
      const res = await fetch(url(dateISO));
      if(!res.ok) throw new Error('currency-api HTTP '+res.status);
      const data = await res.json();
      const r = data && data.aud;
      if(!r || !r.thb || !r.usd) throw new Error('currency-api: unexpected response');
      return { THB: r.thb, USD: r.usd, rateDate: data.date || dateISO };
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

let _fxBackfillBusy = false;
async function backfillFxHistory(){
  if(_fxBackfillBusy) return 0;
  const need = fxMonthsNeeded();
  if(!need.length) return 0;
  _fxBackfillBusy = true;
  try{
    state.fxHistory = state.fxHistory || {};
    let n = 0, errors = [];
    const put = (k, r, rateDate, provider)=>{
      state.fxHistory[monthKeyOf(k)] = { THB: r.THB, USD: r.USD, asOf: monthEndISO(k), rateDate, source: 'backfilled', provider };
      n++;
    };
    let left = need;
    try{
      const from = isoDate(new Date(mYear(need[0]), mMonth(need[0]), 1));
      const { rates } = await fetchFrankfurterSeries(from, monthEndISO(need[need.length-1]));
      const days = Object.keys(rates).sort();
      left = need.filter(k=>{
        const key = monthKeyOf(k);
        const inMonth = days.filter(d=> d.slice(0,7)===key);
        const last = inMonth[inMonth.length-1];
        const r = last && rates[last];
        if(!r || !r.THB || !r.USD) return true;
        put(k, r, last, 'frankfurter');
        return false;
      });
    }catch(e){ errors.push(e && e.message ? e.message : String(e)); }
    for(const k of left){
      try{ const r = await fetchFawazRate(monthEndISO(k)); put(k, r, r.rateDate, 'currency-api'); }
      catch(e){ errors.push(e && e.message ? e.message : String(e)); break; }
    }
    if(n){ saveState(); if(state.ui.activeTab==='networth') render(); }
    if(!n && errors.length) throw new Error(errors.join('; '));
    return n;
  } finally { _fxBackfillBusy = false; }
}

async function refreshFxRates(force){
  // Rates already on hand still belong to the month they were fetched in.
  if(state.fxRates && state.fxRates.fetchedAt && recordFxSnapshot(state.fxRates, 'fetched', isoDate(new Date(state.fxRates.fetchedAt)))) saveState();
  backfillFxHistory().catch(()=>{});
  const stale = !state.fxRates || !state.fxRates.fetchedAt || (Date.now() - new Date(state.fxRates.fetchedAt).getTime()) > 24*60*60*1000;
  if(!force && !stale) return;

  // Frankfurter moved to api.frankfurter.dev; the old frankfurter.app host now
  // answers with a redirect to another domain, which browsers refuse ("Failed to
  // fetch"). New host first, old host in case, then a second free API.
  const attempts = [
    ...FRANKFURTER_HOSTS.map(host=> async ()=>{
      const res = await fetch(`${host}/latest?base=AUD&symbols=THB,USD`);
      if(!res.ok) throw new Error(host.replace('https://','')+' HTTP '+res.status);
      const data = await res.json();
      if(!data.rates || !data.rates.THB || !data.rates.USD) throw new Error(host.replace('https://','')+': unexpected response');
      return { THB: data.rates.THB, USD: data.rates.USD };
    }),
    async ()=>{
      const res = await fetch('https://open.er-api.com/v6/latest/AUD');
      if(!res.ok) throw new Error('open.er-api.com HTTP '+res.status);
      const data = await res.json();
      if(!data.rates || !data.rates.THB || !data.rates.USD) throw new Error('open.er-api.com: unexpected response');
      return { THB: data.rates.THB, USD: data.rates.USD };
    }
  ];

  let lastError = null;
  for(const attempt of attempts){
    try{
      const rates = await attempt();
      state.fxRates = { THB: rates.THB, USD: rates.USD, fetchedAt: new Date().toISOString() };
      recordFxSnapshot(state.fxRates, 'fetched');
      saveState();
      if(state.ui.activeTab==='networth') render();
      if(force) toast('Exchange rates updated.');
      return;
    }catch(e){ lastError = e; }
  }

  console.error('Could not refresh FX rates from any source', lastError);
  if(force){
    const hint = location.protocol==='file:'
      ? ' This page is open as a local file — some browsers block outside network requests from local files. Try "Enter rates manually" below, or open this file through a local web server instead.'
      : '';
    toast(`Could not refresh exchange rates (${lastError && lastError.message ? lastError.message : 'unknown error'}).${hint}`);
  }
}

        </div>
      </div>
    </div>
  `;
  document.getElementById('fCancel').onclick = ()=> root.innerHTML='';
  document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') root.innerHTML=''; });
  const removeBtn = document.getElementById('fRemove');

  document.getElementById('fSave').onclick = ()=>{

    acc.target = amount;
    acc.targetCurrency = document.getElementById('atCurrency').value;
    saveState(); root.innerHTML=''; render(); toast('Target saved.');
  };
}
