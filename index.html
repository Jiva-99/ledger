/* Stacked bar chart: net worth by group, one bar per month, over the trailing 12 months */
/* Earliest date any account/sub-category actually started being tracked */
function earliestTrackingDateISO(){
  let earliest = null;
  state.accounts.forEach(a=>{
    const units = (a.subCategories && a.subCategories.length) ? a.subCategories : [a];
    units.forEach(u=>{
      if(u.openingDate && (!earliest || u.openingDate<earliest)) earliest = u.openingDate;
    });
  });
  return earliest;
}


/* =========================================================
   NET WORTH WATERFALL (V4.6)
   Splits the change in net worth over a period into what you did and what the
   market and currencies did. With native balances B0 at the start and B1 at the
   end, and rates r0 and r1:
     closing − opening = (B1 − B0) at r1  +  B0 × (r1 − r0)
   The first part is every history entry in the period, sorted by kind; the
   second is FX. Nothing is left over, so the bars always add up to the closing
   figure. An account whose opening date falls inside the period isn't a gain —
   tracking just started — so it gets its own bar.
========================================================= */
const NW_WF_PERIODS = [['month','This month'],['last','Last month'],['ytd','Year to date'],['year','Last 12 months']];

function nwWaterfallRange(p){
  const k = mIndex(TODAY.getFullYear(), TODAY.getMonth()), today = isoDate(TODAY);
  if(p==='last') return { start: monthEndISO(k-2), end: monthEndISO(k-1) };
  if(p==='ytd')  return { start: monthEndISO(mIndex(TODAY.getFullYear()-1, 11)), end: today };
  if(p==='year') return { start: monthEndISO(k-12), end: today };
  return { start: monthEndISO(k-1), end: today };
}

/* Rates for a date: today's live rates for today, otherwise that month's entry. */
function fxRatesFor(dateISO){
  if(dateISO >= isoDate(TODAY)){
    const f = state.fxRates || {};
    return f.THB && f.USD ? { THB: f.THB, USD: f.USD, source: 'live' } : null;
  }
  const s = (state.fxHistory || {})[dateISO.slice(0,7)];
  return s && s.THB && s.USD ? s : null;
}

function nwUnitsWithCurrency(){
  const out = [];
  (state.accounts||[]).forEach(a=>{
    const subs = a.subCategories && a.subCategories.length ? a.subCategories : null;
    (subs || [a]).forEach(u=> out.push({ unit: u, cur: subs ? (u.currency || a.currency) : a.currency }));
  });
  return out;
}

function nwWaterfallData(p){
  const { start, end } = nwWaterfallRange(p);
  const r0 = fxRatesFor(start), r1 = fxRatesFor(end);
  const fxOk = !!(r0 && r1);
  const R1 = r1 || state.fxRates || {};
  const conv = (amt, cur, R)=> (!cur || cur==='AUD') ? amt : (R && R[cur] ? amt/R[cur] : amt);
  const t = { opening:0, added:0, withdrawn:0, market:0, fx:0, newAcc:0, closing:0 };
  nwUnitsWithCurrency().forEach(({ unit, cur })=>{
    const od = unit.openingDate || '';
    if(od && od > end) return;                       // not tracked yet at the end
    t.closing += conv(unitBalanceAsOf(unit, end), cur, R1);
    const b0 = unitBalanceAsOf(unit, start);
    if(od && od > start){
      t.newAcc += conv(b0, cur, R1);                 // opening balance (and anything dated before the period)
    } else {
      t.opening += conv(b0, cur, fxOk ? r0 : R1);
      if(fxOk) t.fx += conv(b0, cur, r1) - conv(b0, cur, r0);
    }
    (unit.history||[]).forEach(h=>{
      if(!(h.date > start && h.date <= end)) return;
      const d = conv(Number(h.delta)||0, cur, R1);
      if(h.kind==='revaluation' || h.kind==='dividend') t.market += d;
      else if(d > 0) t.added += d;
      else t.withdrawn += d;
    });
  });
  const monthLabel = iso=> `${MONTHS[Number(iso.slice(5,7))-1]} ${iso.slice(0,4)}`;
  const missing = [!r0 ? start : null, !r1 ? end : null].filter(Boolean).map(monthLabel);
  return { ...t, start, end, fxOk, missing, r0, r1 };
}

function nwWaterfallSVG(d){
  const steps = [
    { key:'opening', label:'Opening', v:d.opening, total:true },
    { key:'added', label:'Added', v:d.added },
    { key:'withdrawn', label:'Withdrawn', v:d.withdrawn },
    { key:'market', label:'Market & dividends', v:d.market },
    ...(d.fxOk ? [{ key:'fx', label:'FX', v:d.fx }] : []),
    ...(Math.abs(d.newAcc) > 0.5 ? [{ key:'newAcc', label:'New accounts', v:d.newAcc }] : []),
    { key:'closing', label:'Closing', v:d.closing, total:true }
  ];
  let run = 0;
  steps.forEach(s=>{
    if(s.total){ s.from = 0; s.to = s.v; run = s.v; }
    else { s.from = run; s.to = run + s.v; run = s.to; }
  });
  const levels = steps.flatMap(s=> s.total ? [s.to] : [s.from, s.to]);
  const lo = Math.min(...levels), hi = Math.max(...levels);
  // Changes are small next to the totals, so the axis starts near the lowest level
  // rather than at zero, and says so. It only goes to zero when that's close anyway.
  const span = (hi - lo) || Math.abs(hi)*0.1 || 1;
  let floor = lo - span*0.6;
  if(lo >= 0 && floor < 0) floor = 0;
  if(lo >= 0 && floor < hi*0.25) floor = 0;
  const step = niceCeil((hi - floor)/4);
  floor = Math.floor(floor/step)*step;
  const top = floor + step*Math.ceil((hi - floor)/step + 0.15);
  const W = 900, H = 190, pl = 46, pr = 8, pt = 18, pb = 30;
  const Y = v=> H-pb - ((v-floor)/(top-floor))*(H-pb-pt);
  const cw = (W-pl-pr)/steps.length, bw = Math.min(64, cw*0.56);
  let g = '';
  for(let v=floor; v<=top+1e-6; v+=step){
    g += `<line class="pace-grid" x1="${pl}" y1="${Y(v).toFixed(1)}" x2="${W-pr}" y2="${Y(v).toFixed(1)}" opacity="${v===floor?1:0.5}"></line><text class="pace-axis" x="${pl-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${formatAxisLabel(v)}</text>`;
  }
  steps.forEach((s,i)=>{
    const x = pl + i*cw + (cw-bw)/2;
    const a = s.total ? floor : s.from, b = s.to;
    const y1 = Y(Math.max(a,b)), y2 = Y(Math.min(a,b));
    const h = Math.max(1, y2-y1);
    const cls = s.total ? 'wf-total' : (s.v >= 0 ? 'wf-up' : 'wf-down');
    const val = s.total ? moneyWhole(s.v) : (s.v>=0?'+':'−') + moneyWhole(Math.abs(s.v));
    g += `<rect class="${cls}" x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" data-wf="${s.key}"><title>${s.label}: ${val}</title></rect>`;
    g += `<text class="wf-val ${s.total?'':(s.v>=0?'up':'down')}" x="${(x+bw/2).toFixed(1)}" y="${(y1-4).toFixed(1)}" text-anchor="middle">${val}</text>`;
    g += `<text class="pace-axis" x="${(x+bw/2).toFixed(1)}" y="${H-10}" text-anchor="middle">${s.label}</text>`;
    if(i < steps.length-1){
      const nx = pl + (i+1)*cw + (cw-bw)/2;
      g += `<line class="wf-link" x1="${(x+bw).toFixed(1)}" y1="${Y(s.to).toFixed(1)}" x2="${nx.toFixed(1)}" y2="${Y(s.to).toFixed(1)}"></line>`;
    }
  });
  return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth change, opening to closing">${g}</svg>`, floor };
}

function nwWaterfallHTML(){
  const p = NW_WF_PERIODS.some(x=> x[0]===state.ui.nwWaterfallPeriod) ? state.ui.nwWaterfallPeriod : 'month';
  const d = nwWaterfallData(p);
  const { svg, floor } = nwWaterfallSVG(d);
  const change = d.closing - d.opening;
  const pctChg = d.opening > 0 ? (change/d.opening)*100 : null;
  const exFx = change - d.fx - d.newAcc;
  const stat = (label, val, cls, sub, attr)=> `<div class="pace-stat" ${attr||''}><div class="k-label">${label}</div><div class="k-val ${cls||''}">${val}</div><div class="k-sub">${sub}</div></div>`;
  const signed = v=> (v>=0?'+':'−') + moneyWhole(Math.abs(v));
  const rateLine = r=> r ? `฿${Number(r.THB).toFixed(2)} · US$${Number(r.USD).toFixed(3)}` : 'not recorded';
  return `
    <div class="card dash-card nw-wf" id="nwWaterfall">
      <div class="dash-pace-main">
        <div class="dash-card-head wrap"><span class="dash-card-title">What changed</span><span class="muted">${shortIsoDate(d.start)} ${d.start.slice(0,4)} → ${d.end===isoDate(TODAY) ? 'today' : shortIsoDate(d.end)+' '+d.end.slice(0,4)}, in AUD</span><div class="spacer"></div>
          <div class="dash-seg sm" role="group" aria-label="Period">
            ${NW_WF_PERIODS.map(([k,lab])=> `<button type="button" data-wfperiod="${k}" class="${k===p?'on':''}" aria-pressed="${k===p}">${lab}</button>`).join('')}
          </div>
        </div>
        ${state.accounts.length===0 ? `<div class="empty-state"><div class="glyph">·</div>Add an account to see what changed.</div>` : svg}
        <div class="muted" style="font-size:11px; display:flex; gap:14px; flex-wrap:wrap;">
          ${floor > 0 ? `<span>Axis starts at ${moneyWhole(floor)}, so the changes are visible.</span>` : ''}
          ${d.fxOk ? `<span>Rates: ${rateLine(d.r0)} → ${rateLine(d.r1)} per AUD</span>` : `<span class="neg" id="nwWfFxMissing">No rates recorded for ${d.missing.join(' and ')}, so FX isn't separated: everything is valued at ${d.r1 ? 'the closing' : "today's"} rates.</span>`}
        </div>
      </div>
      <div class="dash-pace-side">
        ${stat('Net change', signed(change), change>=0?'pos':'neg', pctChg===null ? 'no opening balance' : `${pctChg>=0?'+':''}${pctChg.toFixed(1)}% on ${moneyWhole(d.opening)}`, 'data-wf-change')}
        ${stat('Excluding FX and new accounts', signed(exFx), exFx>=0?'pos':'neg', 'what you added and the market did', 'data-wf-exfx')}
        ${d.fxOk ? stat('FX effect', signed(d.fx), d.fx>=0?'pos':'neg', 'same balances, new rates', 'data-wf-fx') : ''}
      </div>
    </div>`;
}

function netWorthStackedSVG(toggle){
  const groupsPresent = [...new Set(state.accounts.map(a=>a.group||'Other'))];
  const active = groupsPresent.filter(g=> toggle[g]!==false);
  const groupColor = {};
  buildNetWorthDonutSegments().forEach(s=> groupColor[s.label]=s.color);
  groupsPresent.forEach((g,i)=>{ if(!groupColor[g]) groupColor[g]=NET_WORTH_PALETTE[i%NET_WORTH_PALETTE.length]; });

  // Only show months since the earliest account actually started being tracked —
  // never invent history before that, and cap at 12 months for chart readability.
  const earliestISO = earliestTrackingDateISO();
  const earliestDate = earliestISO ? new Date(earliestISO+'T00:00:00') : TODAY;
  const monthsSinceStart = (TODAY.getFullYear()-earliestDate.getFullYear())*12 + (TODAY.getMonth()-earliestDate.getMonth()) + 1;
  const numMonths = Math.max(1, Math.min(12, monthsSinceStart));

  const monthEnds = [];
  for(let i=numMonths-1;i>=0;i--){
    monthEnds.push(new Date(TODAY.getFullYear(), TODAY.getMonth()-i+1, 0));
  }
  const monthly = monthEnds.map(d=>{
    const dISO = isoDate(d);
    const row = {};
    active.forEach(g=>{
      row[g] = state.accounts.filter(a=>(a.group||'Other')===g).reduce((s,a)=> s+accountBalanceAUD(a,dISO), 0);
    });
    return row;
  });

  const rawMax = Math.max(1, ...monthly.map(mo=> active.reduce((s,g)=>s+Math.max(0,mo[g]),0)));
  const maxVal = niceCeil(rawMax);
  const width = 900, height = 178, padBottom = 22, padTop = 8, padLeft = 34;
  const plotH = height - padBottom - padTop;
  const plotW = width - padLeft;
  const groupWidth = plotW/numMonths;
  const barWidth = Math.max(6, Math.min(70, groupWidth - 8));

  let gridlines = '';
  for(let i=0;i<=4;i++){
    const val = maxVal*i/4;
    const y = height - padBottom - (val/maxVal)*plotH;
    gridlines += `<line x1="${padLeft}" y1="${y.toFixed(1)}" x2="${width}" y2="${y.toFixed(1)}" style="stroke:var(--border); stroke-width:1; opacity:${i===0?1:0.5};"></line>`;
    gridlines += `<text x="${(padLeft-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" style="fill:var(--text-faint); font-family:var(--sans);">${formatAxisLabel(val)}</text>`;
  }

  let bars = '';
  monthly.forEach((mo,gi)=>{
    const x = padLeft + gi*groupWidth + (groupWidth-barWidth)/2;
    let cursorY = height - padBottom;
    active.forEach(g=>{
      const val = Math.max(0, mo[g]);
      const h = (val/maxVal)*plotH;
      if(h>0.1){
        cursorY -= h;
        bars += `<rect x="${x.toFixed(1)}" y="${cursorY.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" style="fill:${groupColor[g]};"><title>${MONTHS[monthEnds[gi].getMonth()]} ${monthEnds[gi].getFullYear()} — ${g}: ${moneyWhole(val)}</title></rect>`;
      }
    });
  });

  let labels = '';
  monthEnds.forEach((d,i)=>{
    const x = padLeft + i*groupWidth + groupWidth/2;
    const isCurrent = i===numMonths-1;
    labels += `<text x="${x.toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="9" style="fill:${isCurrent?'var(--gold-bright)':'var(--text-faint)'}; font-family:var(--sans); font-weight:${isCurrent?'700':'400'};">${MONTHS[d.getMonth()]}</text>`;
  });

  return { svg: `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block; max-height:200px;">
    ${gridlines}
    ${bars}
    ${labels}
  </svg>`, groupsPresent, groupColor };
}

function renderNetWorth(c){
  const total = netWorthAUD();
  const prevMonthEnd = new Date(TODAY.getFullYear(), TODAY.getMonth(), 0);
  const prevTotal = netWorthAsOf(isoDate(prevMonthEnd));
  const growthPct = prevTotal>0 ? ((total-prevTotal)/prevTotal)*100 : null;
  const growthHTML = growthPct===null ? '' : ` <span class="${growthPct>=0?'pos':'neg'}" style="font-size:14px; font-weight:600;">(${growthPct>=0?'+':''}${growthPct.toFixed(1)}%)</span>`;

  const groups = {};
  state.accounts.forEach(a=>{
    const g = a.group || 'Other';
    (groups[g] = groups[g]||[]).push(a);
  });

  const stackToggle = state.ui.netWorthStack || {};
  const { svg: stackedSvg, groupsPresent } = netWorthStackedSVG(stackToggle);

  const fx = state.fxRates || {};
  const fxAgeHTML = fx.fetchedAt
    ? `
      <div>1 AUD = ฿${fx.THB?fx.THB.toFixed(2):'—'} THB</div>
      <div>1 AUD = $${fx.USD?fx.USD.toFixed(3):'—'} USD</div>
      <div>1 USD = ฿${(fx.THB && fx.USD) ? (fx.THB/fx.USD).toFixed(2) : '—'} THB</div>
      <div class="muted" style="margin-top:2px;">Updated ${formatDateShort(isoDate(new Date(fx.fetchedAt)))}</div>
    `
    : `Rates not loaded yet`;

  // V4.7.1 — one line per account and per split. Splits are their own rows so their
  // balances and buttons line up in the Native / AUD / action columns.
  const showTargets = !state.ui.nwHideTargets;
  const withTargets = showTargets || nwEditing();
  const cols = withTargets ? 5 : 4;
  const targetCell = (key, bal, target, cur, isSub)=> withTargets ? `<td class="nwt-tcell">${targetRowHTML(key, bal, target, cur, isSub)}</td>` : '';
  const targetUnits = []; // every account or split carrying a target, for the footer
  const accRowHTML = (a)=>{
    const hasSubs = a.subCategories && a.subCategories.length>0;
    const balAUD = accountBalanceAUD(a);
    const bal = hasSubs ? null : computeAccountBalance(a);
    const targetCur = hasSubs ? (a.targetCurrency||'AUD') : a.currency;
    const targetBal = hasSubs ? fromAUD(balAUD, targetCur) : bal;
    if(a.target>0) targetUnits.push(Math.max(0, Math.min(100, (targetBal/a.target)*100)));
    const native = hasSubs ? '<span class="muted" style="font-size:10.5px;">mixed</span>'
      : (a.currency!=='AUD' ? moneyCur(bal, a.currency) : '');
    const setup = nwEditing() ? `
          <span class="nwt-setup">
            <label class="nwt-inline">Cash speed
              <select class="nw-speed" data-speed="${a.id}" title="How quickly this money could actually be spent">
                <option value="" ${!accountSpeed(a)?'selected':''}>Not set</option>
                ${SPEED_ORDER.map(sp=>`<option value="${sp}" ${accountSpeed(a)===sp?'selected':''}>${SPEED_LABELS[sp]}</option>`).join('')}
              </select>
            </label>
            ${sleeveSelectHTML(a)}
          </span>` : nwTagsHTML(a);
    const parent = `
      <tr class="nwt-acc">
        <td class="nwt-ncell"><div class="nwt-name">
          <span class="nwt-label">${a.name}</span><span class="nwt-cur">${hasSubs?'AUD total':a.currency}</span>${nwEditing()?`<button class="icon-btn" data-renameacc="${a.id}" style="font-size:10px; padding:0 2px; color:var(--text-faint);" title="Rename">✎</button>`:''}
          ${setup}
          ${!hasSubs ? pricedInfoHTML(a, a.currency) : ''}
        </div></td>
        ${targetCell(a.id, targetBal, a.target, targetCur, false)}
        <td class="num muted">${native}</td>
        <td class="num">${moneyWhole(balAUD)}</td>
        <td><div class="nw-actions">
          ${!hasSubs ? `<button class="icon-btn" style="color:var(--gold);" data-adj="${a.id}" title="Manual adjustment">±</button>` : ''}
          ${!hasSubs ? `<button class="icon-btn" data-hist="${a.id}" title="View history" style="font-size:11px;">🕐</button>` : ''}
          ${nwEditing() ? `<button class="icon-btn" data-addsub="${a.id}" title="Add sub-category" style="font-size:11px;">+Split</button>` : ''}
          ${nwEditing() ? `<button class="icon-btn" data-delacc="${a.id}" title="Delete account">✕</button>` : ''}
        </div></td>
      </tr>`;
    const subs = !hasSubs ? '' : a.subCategories.map(sub=>{
      const subCur = sub.currency || a.currency;
      const subBal = unitBalanceAsOf(sub, isoDate(TODAY));
      if(sub.target>0) targetUnits.push(Math.max(0, Math.min(100, (subBal/sub.target)*100)));
      return `
      <tr class="nwt-subrow">
        <td class="nwt-ncell"><div class="nwt-name">
          <span class="nwt-label"><span class="muted">↳</span> ${sub.name}</span>${nwEditing()?`<button class="icon-btn" data-renamesub="${a.id}|||${sub.id}" style="font-size:9.5px; padding:0 2px; color:var(--text-faint);" title="Rename">✎</button>`:''}
          ${pricedInfoHTML(sub, subCur)}
        </div></td>
        ${targetCell(`${a.id}|||${sub.id}`, subBal, sub.target, subCur, true)}
        <td class="num muted">${subCur!=='AUD' ? moneyCur(subBal, subCur) : ''}</td>
        <td class="num">${moneyWhole(toAUD(subBal, subCur))}</td>
        <td><div class="nw-actions">
          <button class="icon-btn" style="color:var(--gold);" data-adjsub="${a.id}|||${sub.id}" title="Manual adjustment">±</button>
          <button class="icon-btn" data-histsub="${a.id}|||${sub.id}" title="View history" style="font-size:11px;">🕐</button>
          ${nwEditing() ? `<button class="icon-btn" data-delsub="${a.id}|||${sub.id}" title="Remove split">✕</button>` : ''}
        </div></td>
      </tr>`;}).join('');
    return parent + subs;
  };
  const accountsBody = Object.entries(groups).map(([g,accs])=>{
    const gt = accs.reduce((s,a)=> s + accountBalanceAUD(a), 0);
    return `
      <tr class="nwt-group"><td colspan="${cols}"><div class="nwt-group-line">
        <span class="nwt-group-name">${g}</span><span class="spacer"></span>
        <span class="num-font">${moneyWhole(gt)}</span>
        <span class="muted nwt-group-pct">${total>0 ? Math.round((gt/total)*100)+'%' : '—'}</span>
      </div></td></tr>
      ${accs.map(accRowHTML).join('')}`;
  }).join('');
  const avgTargetPct = targetUnits.length ? targetUnits.reduce((s,x)=> s+x, 0) / targetUnits.length : null;

  const pt = state.portfolioTarget || { amount: null, currency: 'AUD' };
  const totalInTargetCur = fromAUD(total, pt.currency);
  const ptPct = pt.amount ? (totalInTargetCur/pt.amount)*100 : null;
  const change = total - prevTotal;
  const fxCount = Object.keys(state.fxHistory||{}).length;
  const invDonut = investmentDonutHTML().replace('<div class="section-title">Investment breakdown</div>\n    <div class="card">',
    '<div class="card dash-card"><div class="dash-card-head"><span class="dash-card-title">Investment breakdown</span></div>');

  c.innerHTML = `
    <div class="dash-head">
      <h1 class="page-title">Net Worth</h1>
      <span class="muted dash-head-sub">savings and investment buckets in AUD, THB and USD</span>
      <div class="spacer"></div>
      <button class="btn secondary" id="nwEditBtn" aria-pressed="${nwEditing()}">${nwEditing()?'Done editing':'Edit setup'}</button>
      ${nwEditing() ? `<button class="btn" id="addAccBtn">+ Add account</button>` : ''}
    </div>

    <div class="dash-kpis nw-kpis">
      <div class="dash-kpi"><div class="k-label">Total net worth</div>
        <div class="k-val" style="color:var(--gold-bright)">${moneyWhole(total)}</div>
        <div class="k-sub">${growthPct===null ? 'across all accounts' : `<span class="${growthPct>=0?'pos':'neg'}">${growthPct>=0?'+':''}${growthPct.toFixed(1)}%</span> vs last month-end`}</div></div>
      <div class="dash-kpi"><div class="k-label">Change this month</div>
        <div class="k-val ${prevTotal>0 ? (change>=0?'pos':'neg') : ''}">${prevTotal>0 ? (change>=0?'+':'−')+moneyWhole(Math.abs(change)) : '—'}</div>
        <div class="k-sub">since ${formatDateShort(isoDate(prevMonthEnd))}</div></div>
      <div class="dash-kpi"><div class="k-label">Portfolio target</div>
        ${pt.amount ? `
          <div class="k-val" style="color:var(--gold-bright)">${ptPct.toFixed(0)}% <span class="nwt-kbar"><span style="width:${Math.max(0,Math.min(100,ptPct))}%; background:${ptPct>=100?'var(--green)':'var(--gold)'};"></span></span></div>
          <div class="k-sub">${moneyCur(totalInTargetCur, pt.currency)} of ${moneyCur(pt.amount, pt.currency)} · <button type="button" class="dash-link" id="editPortfolioTargetBtn">Edit</button></div>
        ` : `<div class="k-val muted">—</div><div class="k-sub">one overall target, any currency · <button type="button" class="dash-link" id="editPortfolioTargetBtn">Set target</button></div>`}
      </div>
      <div class="dash-kpi"><div class="k-label">Exchange rates</div>
        <div class="k-val nwt-fx">${fx.fetchedAt ? `฿${fx.THB?fx.THB.toFixed(2):'—'} <span class="muted">·</span> $${fx.USD?fx.USD.toFixed(3):'—'}` : '<span class="muted">not loaded</span>'}</div>
        <div class="k-sub">${fx.fetchedAt ? `per 1 AUD · 1 USD = ฿${(fx.THB && fx.USD) ? (fx.THB/fx.USD).toFixed(2) : '—'} · ${formatDateShort(isoDate(new Date(fx.fetchedAt)))}` : 'per 1 AUD'}</div>
        <div class="nwt-fx-actions">
          <button type="button" class="dash-link" id="refreshFxBtn">Refresh</button>
          <button type="button" class="dash-link" id="manualFxBtn">Enter manually</button>
          <button type="button" class="dash-link" id="fxHistBtn">History (${fxCount})</button>
        </div>
      </div>
    </div>

    <div class="nw-grid">
      <div class="dash-col">
        <div class="card dash-card">
          <div class="dash-card-head wrap"><span class="dash-card-title">Accounts</span>
            <span class="muted">${state.accounts.length} account${state.accounts.length===1?'':'s'} · ${Object.keys(groups).length} group${Object.keys(groups).length===1?'':'s'}</span>
            <div class="spacer"></div>
            <label class="dash-chip"><input type="checkbox" id="nwShowTargets" ${showTargets?'checked':''}><span class="dash-sw" style="background:var(--gold);"></span>Show targets</label>
          </div>
          ${state.accounts.length===0 ? `<div class="empty-state"><div class="glyph">·</div>No accounts yet — press Edit setup, then + Add account for your emergency fund, super, or investment buckets.</div>` : `
          <div class="plan-table-wrap">
            <table class="data nwt-table">
              <thead><tr><th>Account</th>${withTargets?'<th>Target</th>':''}<th class="num">Native</th><th class="num">AUD</th><th></th></tr></thead>
              <tbody>${accountsBody}</tbody>
            </table>
          </div>
          ${withTargets ? `<div class="nwt-foot muted">
            <span>${nwEditing() ? 'Set target or ✎ to set or change one.' : 'Hover or tap a bar for what is left to go. Targets are in each account’s own currency; change them in Edit setup.'}</span><span class="spacer"></span>
            <span>${targetUnits.length} target${targetUnits.length===1?'':'s'} set${avgTargetPct===null?'':` · avg ${Math.round(avgTargetPct)}%`}</span>
          </div>` : ''}`}
        </div>
      </div>
      <div class="dash-col">
        ${nwWaterfallHTML()}
        <div class="card dash-card">
          <div class="dash-card-head wrap"><span class="dash-card-title">Accumulation over time</span><span class="muted">up to 12 months, by group, AUD</span><div class="spacer"></div>
            ${groupsPresent.map(g=>`<label class="dash-chip"><input type="checkbox" data-stacktoggle="${g}" ${stackToggle[g]!==false?'checked':''}>${g}</label>`).join('')}
          </div>
          ${state.accounts.length===0 ? `<div class="empty-state"><div class="glyph">·</div>Add an account to see accumulation over time.</div>` : stackedSvg}
        </div>
        <div class="card dash-card">
          <div class="dash-card-head"><span class="dash-card-title">Allocation</span><span class="muted">by group</span></div>
          ${netWorthDonutHTML()}
        </div>
        ${invDonut}
      </div>
    </div>
  `;

  const showT = document.getElementById('nwShowTargets');
  if(showT) showT.onchange = ()=>{ state.ui.nwHideTargets = !showT.checked; saveState(); render(); };

  const addBtn = document.getElementById('addAccBtn');
  if(addBtn) addBtn.onclick = openAccountModal;   // absent outside edit mode
  document.getElementById('refreshFxBtn').onclick = ()=> refreshFxRates(true);
  document.getElementById('manualFxBtn').onclick = openManualFxModal;
  document.getElementById('fxHistBtn').onclick = openFxHistoryModal;
  c.querySelectorAll('[data-wfperiod]').forEach(b=>{
    b.onclick = ()=>{ state.ui.nwWaterfallPeriod = b.dataset.wfperiod; saveState(); render(); };
  });
  document.getElementById('editPortfolioTargetBtn').onclick = openPortfolioTargetModal;
  c.querySelectorAll('[data-stacktoggle]').forEach(cb=>{
    cb.onchange = ()=>{
      state.ui.netWorthStack = state.ui.netWorthStack || {};
      state.ui.netWorthStack[cb.dataset.stacktoggle] = cb.checked;
      saveState(); render();
    };
  });
  c.querySelectorAll('[data-invdonutfilter]').forEach(r=>{
    r.onchange = ()=>{
      state.ui.investmentDonutFilter = r.dataset.invdonutfilter;
      saveState(); render();
    };
  });
  c.querySelectorAll('[data-delacc]').forEach(b=> b.onclick = ()=>{
    const acc = state.accounts.find(a=> a.id === b.dataset.delacc);
    if(!acc) return;
    const subs = (acc.subCategories||[]).length;
    const entries = (acc.history||[]).length
      + (acc.subCategories||[]).reduce((n,s)=> n + (s.history||[]).length, 0);
    confirmDestructive({
      title: 'Delete account',
      what: acc.name,
      lines: [
        `Balance ${moneyWhole(accountBalanceAUD(acc))}`,
        subs ? `${subs} holding${subs>1?'s':''} inside it` : null,
        entries ? `${entries} history entr${entries>1?'ies':'y'}, including every price update and adjustment` : null
      ].filter(Boolean),
      confirmLabel: 'Delete account',
      onConfirm: ()=>{
        captureRestorePoint('Before deleting ' + acc.name, true);
        state.accounts = state.accounts.filter(a=>a.id!==acc.id);
        saveState(); render();
        toast(`${acc.name} deleted. Settings → Restore points has a copy from just before.`);
      }
    });
  });
  c.querySelectorAll('[data-adj]').forEach(b=> b.onclick = ()=> openAdjustModal(b.dataset.adj));
  const unitByKey = key=>{
    const [accId, subId] = key.split('|||');
    const acc = state.accounts.find(a=> a.id === accId);
    if(!acc) return null;
    return subId ? (acc.subCategories||[]).find(x=> x.id === subId) : acc;
  };
  c.querySelectorAll('[data-sleeve]').forEach(sel=>{
    sel.onchange = ()=>{
      const acc = state.accounts.find(a=> a.id === sel.dataset.sleeve); if(!acc) return;
      if(sel.value) acc.sleeve = sel.value; else delete acc.sleeve;
      saveState(); render();
    };
  });
  const editBtn = document.getElementById('nwEditBtn');
  if(editBtn) editBtn.onclick = ()=>{ state.ui.nwEdit = !state.ui.nwEdit; saveState(); render(); };
  c.querySelectorAll('[data-speed]').forEach(sel=>{
    sel.onchange = ()=>{
      const speeds = liqSettings().speeds || (liqSettings().speeds = {});
      if(sel.value) speeds[sel.dataset.speed] = sel.value;
      else delete speeds[sel.dataset.speed];
      saveState();
    };
  });
  c.querySelectorAll('[data-hist]').forEach(b=> b.onclick = ()=> openHistoryModal(b.dataset.hist));
  c.querySelectorAll('[data-addsub]').forEach(b=> b.onclick = ()=> openSubCategoryModal(b.dataset.addsub));
  c.querySelectorAll('[data-adjsub]').forEach(b=>{
    b.onclick = ()=>{ const [accId,subId] = b.dataset.adjsub.split('|||'); openAdjustModal(accId, subId); };
  });
  c.querySelectorAll('[data-histsub]').forEach(b=>{
    b.onclick = ()=>{ const [accId,subId] = b.dataset.histsub.split('|||'); openHistoryModal(accId, subId); };
  });
  c.querySelectorAll('[data-delsub]').forEach(b=>{
    b.onclick = ()=>{
      const [accId,subId] = b.dataset.delsub.split('|||');
      const acc = state.accounts.find(a=>a.id===accId);
      if(!acc) return;
      const sub = (acc.subCategories||[]).find(x=> x.id === subId);
      if(!sub) return;
      const subCur = sub.currency || acc.currency;
      confirmDestructive({
        title: 'Remove holding',
        what: sub.name,
        lines: [
          `Balance ${moneyCur(unitBalanceAsOf(sub, isoDate(TODAY)), subCur)}`,
          (sub.history||[]).length ? `${sub.history.length} history entr${sub.history.length>1?'ies':'y'}` : null,
          'Its balance stops counting towards ' + acc.name
        ].filter(Boolean),
        confirmLabel: 'Remove holding',
        onConfirm: ()=>{
          captureRestorePoint('Before removing ' + sub.name, true);
          acc.subCategories = acc.subCategories.filter(s=>s.id!==subId);
          saveState(); render();
          toast(`${sub.name} removed. Settings → Restore points has a copy from just before.`);
        }
      });
    };
  });
  c.querySelectorAll('[data-edittarget]').forEach(b=>{
    b.onclick = ()=>{
      const [accId, subId] = b.dataset.edittarget.split('|||');
      const acc = state.accounts.find(a=>a.id===accId);
      if(!acc) return;
      const hasSubs = acc.subCategories && acc.subCategories.length>0;
      if(!subId && hasSubs){
        openAccountTargetModal(accId); // mixed currencies — needs a currency picker, not a bare prompt
        return;
      }
      const unit = subId ? (acc.subCategories||[]).find(s=>s.id===subId) : acc;
      if(!unit) return;
      const cur = subId ? (unit.currency||acc.currency) : acc.currency;
      const input = prompt(`Long-term target for ${subId?unit.name:acc.name} (in ${cur}). Leave blank to remove.`, unit.target||'');
      if(input===null) return;
      const val = input.trim()==='' ? null : Number(input);
      unit.target = (val && val>0) ? val : null;
      saveState(); render();
    };
  });
  c.querySelectorAll('[data-renameacc]').forEach(b=>{
    b.onclick = ()=>{
      const acc = state.accounts.find(a=>a.id===b.dataset.renameacc);
      if(!acc) return;
      const input = prompt('Rename account:', acc.name);
      if(input===null) return;
      const name = input.trim();
      if(!name){ toast('Name cannot be empty.'); return; }
      acc.name = name;
      saveState(); render();
    };
  });
  c.querySelectorAll('[data-renamesub]').forEach(b=>{
    b.onclick = ()=>{
      const [accId, subId] = b.dataset.renamesub.split('|||');
      const acc = state.accounts.find(a=>a.id===accId);
      if(!acc) return;
      const sub = (acc.subCategories||[]).find(s=>s.id===subId);
      if(!sub) return;
      const input = prompt('Rename split:', sub.name);
      if(input===null) return;
      const name = input.trim();
      if(!name){ toast('Name cannot be empty.'); return; }
      sub.name = name;
      saveState(); render();
    };
  });
}

function openAccountModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="mb">
      <div class="modal">
        <h2>Add account</h2>
        <div class="form-grid">
          <label class="field">Name <input type="text" id="aName" placeholder="e.g. Emergency Fund"></label>
          <label class="field">Group
            <select id="aGroup">${NET_WORTH_GROUPS.map(g=>`<option>${g}</option>`).join('')}</select>
          </label>
          <label class="field">Currency
            <select id="aCurrency">${NET_WORTH_CURRENCIES.map(cur=>`<option ${cur==='AUD'?'selected':''}>${cur}</option>`).join('')}</select>
          </label>
          <label class="field">Opening balance <input type="number" id="aBal" step="0.01" inputmode="decimal" value="0"></label>
          <label class="field">As of date <input type="date" id="aDate" value="${isoDate(TODAY)}"></label>
          <label class="field">Long-term target (optional, in the currency above) <input type="number" id="aTarget" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 15000"></label>
        </div>
        <div class="form-actions">
          <button class="btn secondary" id="fCancel">Cancel</button>
          <button class="btn" id="fSave">Save</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('fCancel').onclick = ()=> root.innerHTML='';
  document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') root.innerHTML=''; });
  document.getElementById('fSave').onclick = ()=>{
    const name = document.getElementById('aName').value.trim();
    if(!name){ toast('Give the account a name.'); return; }
    state.accounts.push({
      id:uid(), name, group: document.getElementById('aGroup').value,
      currency: document.getElementById('aCurrency').value,
      openingBalance: Number(document.getElementById('aBal').value)||0,
      openingDate: document.getElementById('aDate').value || isoDate(TODAY),
      target: Number(document.getElementById('aTarget').value)||null,
      subCategories: [],
      history: []
    });
    saveState(); root.innerHTML=''; render(); toast('Account added.');
  };
}

function openSubCategoryModal(accId){
  const acc = state.accounts.find(a=>a.id===accId);
  if(!acc) return;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="mb">
      <div class="modal">
        <h2>Split ${acc.name}</h2>
        <div class="page-sub">Sub-categories are net-worth-only (e.g. Core / Satellite, or one per bank) — they don't connect to Transactions. Each can be in its own currency; the account's total converts everything to AUD automatically.</div>
        <div class="form-grid">
          <label class="field">Name <input type="text" id="subName" placeholder="e.g. Core, or KBank"></label>
          <label class="field">Currency
            <select id="subCurrency">${NET_WORTH_CURRENCIES.map(cur=>`<option ${cur===acc.currency?'selected':''}>${cur}</option>`).join('')}</select>
          </label>
          <label class="field">Opening balance <input type="number" id="subBal" step="0.01" inputmode="decimal" value="0"></label>
          <label class="field">As of date <input type="date" id="subDate" value="${isoDate(TODAY)}"></label>
          <label class="field">Long-term target (optional, in the currency above) <input type="number" id="subTarget" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 50000"></label>
        </div>
        <div class="form-actions">
          <button class="btn secondary" id="fCancel">Cancel</button>
          <button class="btn" id="fSave">Add split</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('fCancel').onclick = ()=> root.innerHTML='';
  document.getElementById('mb').addEventListener('click', e=>{ if(e.target.id==='mb') root.innerHTML=''; });
  document.getElementById('fSave').onclick = ()=>{
    const name = document.getElementById('subName').value.trim();
    if(!name){ toast('Give the split a name.'); return; }
    acc.subCategories = acc.subCategories||[];
    acc.subCategories.push({
      id: uid(), name,
      currency: document.getElementById('subCurrency').value,
      openingBalance: Number(document.getElementById('subBal').value)||0,
      openingDate: document.getElementById('subDate').value || isoDate(TODAY),
      target: Number(document.getElementById('subTarget').value)||null,
      history: []
    });
    saveState(); root.innerHTML=''; render(); toast(`"${name}" added under ${acc.name}.`);
  };
}

/* One screen, every holding, two boxes each. The point is that a monthly price
   update should take under a minute — otherwise it doesn't get done, and a stale
   price is worse than an obviously missing one. */
/* ---- Price fetching --------------------------------------------------------
   Two sources, tried in order, mirroring how FX rates already work. Stooq needs
   no key but is unofficial and sometimes blocks browser requests outright, so
   Finnhub is available as a fallback for anyone willing to hold a key.

   The key is kept in localStorage under a separate key, deliberately NOT in
   state: state syncs to Firestore and gets exported, and this repo is public.
   A token in the saved data is a token you've published. */
/* Most holdings are already named after their ticker — VT, SCHD, QQQM — so asking
   for it a second time is busywork. A name that looks like a symbol is used as one
   unless an explicit ticker overrides it. */
function looksLikeTicker(name){
  return /^[A-Za-z]{1,5}(\.[A-Za-z]{1,3})?$/.test(String(name||'').trim());
}
function effectiveTicker(unit, fallbackName){
  if(unit && unit.ticker) return unit.ticker;
  return looksLikeTicker(fallbackName) ? String(fallbackName).trim().toUpperCase() : '';
}

/* The key can live in one of two places.

   Device only  — localStorage, under its own key. Never leaves this browser, but
                  has to be entered again on every device.
   Synced       — inside state, so Firestore carries it to your other devices.
                  state is private to your Firebase account and is not part of the
                  public repository, so this is a reasonable trade for a read-only,
                  rate-limited market-data key. It is stripped out of exported
                  backups regardless, because those are files that get shared. */
const QUOTE_TOKEN_KEY = 'ledger_quote_token';

function quoteTokenSynced(){ return !!(state.settings && state.settings.quoteToken); }
function quoteToken(){
  if(state.settings && state.settings.quoteToken) return state.settings.quoteToken;
  try{ return localStorage.getItem(QUOTE_TOKEN_KEY) || ''; }catch(e){ return ''; }
}
function setQuoteToken(v, synced){
  const val = (v||'').trim();
  // Whichever mode is chosen, make sure the key isn't left behind in the other one.
  try{ localStorage.removeItem(QUOTE_TOKEN_KEY); }catch(e){}
  if(state.settings) delete state.settings.quoteToken;
  if(!val){ saveState(); return; }
  if(synced){ state.settings.quoteToken = val; saveState(); }
  else { try{ localStorage.setItem(QUOTE_TOKEN_KEY, val); }catch(e){} }
}

/* Returns a number, or throws with a reason worth showing the user. */
async function fetchQuote(ticker){
  const t = String(ticker||'').trim();
  if(!t) throw new Error('no ticker');

  // 1. Stooq — keyless CSV. US tickers need the .us suffix.
  try{
    const sym = t.includes('.') ? t.toLowerCase() : t.toLowerCase()+'.us';
    const res = await fetch(`https://stooq.com/q/l/?s=${encodeURIComponent(sym)}&f=sd2t2ohlcv&h&e=csv`);
    if(res.ok){
      const text = await res.text();
      const line = text.trim().split('\n')[1];
      if(line){
        const close = Number(line.split(',')[6]);
        if(isFinite(close) && close > 0) return { price: close, source: 'Stooq' };
      }
    }
  }catch(e){ /* blocked or offline — fall through */ }

  // 2. Finnhub — documented, but needs a key held on this device only.
  const key = quoteToken();
  if(key){
    const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(t.toUpperCase())}&token=${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error('Finnhub HTTP '+res.status);
    const data = await res.json();
    if(data && isFinite(data.c) && data.c > 0) return { price: data.c, source: 'Finnhub' };
    throw new Error('no price returned');
  }
  throw new Error('blocked, and no API key set');
}

/* ---- Projection -------------------------------------------------------------
   Semi-annual steps to the retirement year. Each step: every holding grows at its
   own assumed real rate for six months, six months of contributions go in split by
   target weight, then the whole thing is rebalanced back to target — which is what
   the rebalance engine would have you do anyway, and without it the fastest-growing
   holding quietly takes over an allocation you never chose. */
function targetWeights(){
  const inv = investedUnits();
  if(!inv.length) return [];
  const coreT = Math.max(0, Math.min(100, Number(investSettings().coreTarget)||0)) / 100;
  const out = [];
  [['core', coreT], ['satellite', 1-coreT]].forEach(([sleeve, sleeveShare])=>{
    const members = inv.filter(u=> u.sleeve === sleeve);
    if(!members.length) return;
    const wSum = members.reduce((t,u)=> t + (u.targetWeight||0), 0);
    members.forEach(u=>{
      const within = wSum > 0 ? (u.targetWeight||0)/wSum : 1/members.length;
      out.push({ unit:u, sleeve, weight: sleeveShare * within });
    });
  });
  return out;
}

/* The six-month average of savings that actually go into the portfolio. Only
   categories flagged as investing count — a car fund and a holiday fund are both
   Savings, and neither belongs in a projection of the invested sleeves. With
   nothing flagged it falls back to all Savings, and the UI says so. */
function isInvestingCategory(cat){
  return (state.settings.investingCategories||[]).includes('Savings|||' + cat);
}
function toggleInvestingCategory(cat){
  const key = 'Savings|||' + cat;
  const list = new Set(state.settings.investingCategories || []);
  list.has(key) ? list.delete(key) : list.add(key);
  state.settings.investingCategories = [...list];
  saveState(); render();
}

function averageMonthlySavings(){
  const flagged = (state.settings.investingCategories||[]).length > 0;
  const months = completeMonths(6).filter(({year,month})=>{
    const t = trackedTotals(year, month);
    return sumType(t.Expenses) !== 0 || sumType(t.Income) !== 0 || sumType(t.Savings) !== 0;
  });
  if(!months.length) return { value:0, flagged, months:0 };
  const total = months.reduce((sum,{year,month})=>{
    const sav = trackedTotals(year, month).Savings;
    if(!flagged) return sum + sumType(sav);
    return sum + Object.entries(sav).reduce((t,[cat,v])=> t + (isInvestingCategory(cat) ? v : 0), 0);
  }, 0);
  return { value: total/months.length, flagged, months: months.length };
}

/* You type a NOMINAL return — the figure quoted everywhere you'd look one up —
   and inflation is subtracted here to get the real rate the projection runs on.
   Everything else in the app is in today's money, so a nominal projection could
   not be compared against your essentials or your runway. */
function nominalReturn(unit){
  const IS = investSettings();
  if(unit && unit.nominalReturn !== undefined && unit.nominalReturn !== null && unit.nominalReturn !== ''){
    const v = Number(unit.nominalReturn);
    if(isFinite(v)) return v;
  }
  return (Number(IS.baselineReturn)||0) + (Number(IS.inflation)||0);
}

function realReturn(unit){
  return nominalReturn(unit) - (Number(investSettings().inflation)||0);
}

/* The rate actually used, after the ceiling. The cap applies to the real rate,
   since that's what compounds through the projection. */
function assumedReturn(unit){
  const IS = investSettings();
  const cap = Number(IS.returnCap);
  const real = realReturn(unit);
  if(!isFinite(real)) return Number(IS.baselineReturn)||0;
  return isFinite(cap) && cap > 0 ? Math.min(real, cap) : real;
}

/* Returns the path plus the same path with every holding earning the baseline,
   so the UI can show how much of the outcome rests on the per-asset assumptions. */
function projectPortfolio(opts){
  const IS = investSettings();
  const weights = targetWeights();
  if(!weights.length) return null;

  const endYear = Number(IS.retireYear) || 2060;
  const stepsPerYear = 2;
  // Counted in months to the end of the retirement year, so the horizon shortens
  // every month rather than jumping by a whole year each 1 January.
  const monthsLeft = Math.max(0, (endYear - TODAY.getFullYear())*12 + (11 - TODAY.getMonth()));
  const yearsLeft = monthsLeft/12;
  const totalSteps = Math.max(0, Math.round(monthsLeft/6));
  const savingsAvg = averageMonthlySavings();
  const usingAverage = IS.monthlyContribution === null || IS.monthlyContribution === undefined;
  const monthly = usingAverage ? savingsAvg.value : (Number(IS.monthlyContribution)||0);
  const perStep = monthly * (12/stepsPerYear);

  const run = (rateFor)=>{
    let holdings = weights.map(w=> ({ w, value: w.unit.valueAUD }));
    const path = [{ year: TODAY.getFullYear(), value: holdings.reduce((t,h)=>t+h.value,0) }];
    for(let i=1; i<=totalSteps; i++){
      holdings.forEach(h=>{
        const r = rateFor(h.w)/100;
        h.value *= Math.pow(1 + r, 1/stepsPerYear);
      });
      let total = holdings.reduce((t,h)=>t+h.value,0) + perStep;
      // Rebalance: put everything back on target weight, which is also how the
      // contribution gets allocated.
      holdings.forEach(h=>{ h.value = total * h.w.weight; });
      if(i % stepsPerYear === 0 || i === totalSteps){
        path.push({ year: TODAY.getFullYear() + i/stepsPerYear, value: total });
      }
    }
    return path;
  };

  const assumed  = run(w=> assumedReturn(w.unit.unit));
  const baseline = run(()=> Number(IS.baselineReturn)||0);
  const contributed = weights.reduce((t,w)=> t + w.unit.valueAUD, 0) + perStep * totalSteps;

  return {
    endYear, totalSteps, monthly, contributed, yearsLeft, monthsLeft,
    usingAverage, savingsFlagged: savingsAvg.flagged,
    assumed, baseline,
    finalAssumed: assumed[assumed.length-1].value,
    finalBaseline: baseline[baseline.length-1].value,
    weights
  };
}

/* What the invested sleeves were actually worth on a past date, from balance
   history. Only holdings currently tagged core or satellite are counted, so the
   line answers "how has this portfolio grown" rather than "what did I once own". */
function investedValueAsOf(dateISO){
  return investedUnits().reduce((t,u)=> t + toAUD(unitBalanceAsOf(u.unit, dateISO), u.currency), 0);
}

/* The earliest date any invested holding has a figure for. */
function investedHistoryStart(){
  let earliest = null;
  investedUnits().forEach(u=>{
    const dates = [u.unit.openingDate, ...(u.unit.history||[]).map(h=>h.date)].filter(Boolean);
    dates.forEach(d=>{ if(!earliest || d < earliest) earliest = d; });
  });
  return earliest;
}

/* A single chart carrying two different kinds of thing: what happened, and what
   is assumed. They're drawn differently on purpose — solid for recorded history,
   dashed for arithmetic — because the eye should not read them as equally solid. */
function projectionChartSVG(p, toDisplay, unitLabel){
  const W = 720, H = 260, padL = 62, padR = 14, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const startISO = investedHistoryStart();
  const actual = [];
  if(startISO){
    const start = new Date(startISO + 'T00:00:00');
    const months = Math.max(1, Math.round((TODAY - start)/(30.44*86400000)));
    const stepM = Math.max(1, Math.ceil(months/24));   // at most ~24 points
    for(let m=0; m<=months; m+=stepM){
      const d = new Date(start.getFullYear(), start.getMonth()+m, 1);
      if(d > TODAY) break;
      actual.push({ t: d.getFullYear() + d.getMonth()/12, v: toDisplay(investedValueAsOf(isoDate(d))) });
    }
  }
  const nowT = TODAY.getFullYear() + TODAY.getMonth()/12;
  actual.push({ t: nowT, v: toDisplay(p.assumed[0].value) });

  const proj = p.assumed.map(x=> ({ t:x.year, v: toDisplay(x.value) }));
  const base = p.baseline.map(x=> ({ t:x.year, v: toDisplay(x.value) }));

  const allT = [...actual, ...proj].map(x=>x.t);
  const allV = [...actual, ...proj, ...base].map(x=>x.v);
  const t0 = Math.min(...allT), t1 = Math.max(...allT);
  const vMax = Math.max(...allV, 1) * 1.05;
  const X = t=> padL + (t - t0)/((t1-t0)||1) * plotW;
  const Y = v=> padT + plotH - (v/vMax) * plotH;

  const path = pts=> pts.map((pt,i)=> (i?'L':'M') + X(pt.t).toFixed(1) + ' ' + Y(pt.v).toFixed(1)).join(' ');

  // y ticks
  const ticks = 4;
  const short = v=>{
    if(v >= 1e9) return (v/1e9).toFixed(1)+'b';
    if(v >= 1e6) return (v/1e6).toFixed(1)+'m';
    if(v >= 1e3) return Math.round(v/1e3)+'k';
    return Math.round(v);
  };
  let grid = '';
  for(let i=0; i<=ticks; i++){
    const v = vMax*i/ticks, y = Y(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>
      <text x="${padL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-faint)">${short(v)}</text>`;
  }
  let xlab = '';
  const span = t1 - t0;
  const stepY = span > 25 ? 10 : (span > 12 ? 5 : 2);
  for(let yr = Math.ceil(t0); yr <= t1; yr++){
    if(yr % stepY !== 0) continue;
    xlab += `<text x="${X(yr).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--text-faint)">${yr}</text>`;
  }

  const divider = X(nowT);
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" role="img"
       aria-label="Portfolio value: recorded history to now, then projected to ${p.endYear}">
    ${grid}${xlab}
    <line x1="${divider.toFixed(1)}" y1="${padT}" x2="${divider.toFixed(1)}" y2="${padT+plotH}"
          stroke="var(--text-faint)" stroke-width="0.5" stroke-dasharray="3 3"/>
    <text x="${(divider+5).toFixed(1)}" y="${padT+11}" font-size="10" fill="var(--text-faint)">today</text>
    <path d="${path(base)}" fill="none" stroke="var(--text-faint)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75"/>
    <path d="${path(proj)}" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-dasharray="5 4"/>
    ${actual.length>1 ? `<path d="${path(actual)}" fill="none" stroke="var(--green)" stroke-width="2"/>` : ''}
    <circle cx="${X(nowT).toFixed(1)}" cy="${Y(toDisplay(p.assumed[0].value)).toFixed(1)}" r="3" fill="var(--green)"/>
  </svg>
  <div class="chart-key">
    <span><i style="background:var(--green)"></i>Actual (recorded)</span>
    <span><i style="background:var(--gold)"></i>Projected — your assumptions</span>
    <span><i style="background:var(--text-faint)"></i>Projected — everything at baseline</span>
    <span class="muted">${unitLabel}</span>
  </div>`;
}

function projectionSectionHTML(){

      <div class="dash-card-head"><span class="dash-card-title">Assumed returns</span><span class="muted">per holding</span></div>
      <div class="plan-table-wrap"><table class="reb proj-returns">
        <thead><tr><th>Holding</th><th class="r">Value</th><th class="r">Nominal you enter</th><th class="r">Real (after ${Number(IS.inflation).toFixed(1)}% inflation)</th><th class="r">Used</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="liq-note">Enter the return you'd find quoted for each holding — that figure is nominal, before inflation. The real column is worked out for you by subtracting the inflation rate above, and that is what compounds through the projection. Leave a row blank to use the baseline. A real rate above your ceiling is reduced to the ceiling and marked ▲.</div>
    </section>`;
}

/* =========================================================
   INVESTMENT ANALYTICS
   Everything here reads the tagged history entries written by applyPriceUpdate:
   contribution (money you put in), dividend (income the holding produced),
   revaluation (price movement) and adjustment (reconciliation). Because those
   are separated at the point of entry, cost basis and profit fall out of the
   data instead of being estimated.
========================================================= */
const INVEST_COLOURS = ['#c9a227','#52a97d','#5b8bc9','#d98b3d','#a97dd9','#d9695f','#4fb3a5','#b8b04a'];

function investDisplayCurrency(){
  const c = state.ui.investCur;
  return ['USD','AUD','THB'].includes(c) ? c : 'USD';
}
/* Values are held in each holding's own currency; AUD is the common ground, so
   everything routes through it before being shown in whatever you've picked. */
function fromAUD(amountAUD, currency){
  if(!currency || currency === 'AUD') return amountAUD;
  const rate = state.fxRates && state.fxRates[currency];
  return rate ? amountAUD * rate : amountAUD;
}
function investMoney(amountAUD, decimals){
  const cur = investDisplayCurrency();
  return moneyCur(fromAUD(amountAUD, cur), cur, decimals === undefined ? 0 : decimals);
}

/* ---- Cost basis -------------------------------------------------------------
   Cost is now a stored figure built from recorded orders rather than inferred by
   comparing unit counts between stocktakes. It matters because what you PAY and
   what the stock is WORTH differ by the fee: buy $74.21 of IAU for $74.33 and the
   12c gap is a permanent drag that should show in the return, not vanish.

   unit.lots = [{date, units, price, total}]                    purchases
   unit.divs = [{date, amount, units}]                          dividends
   unit.openingCost                                             pre-order basis  */
function unitLots(unit){ return Array.isArray(unit.lots) ? unit.lots : []; }
function unitDivs(unit){ return Array.isArray(unit.divs) ? unit.divs : []; }

function lotTotal(lot){ return (Number(lot.units)||0) * (Number(lot.price)||0); }

/* Everything up to a date, in the holding's own currency. */
function costBasisAsOf(unit, uptoISO){
  let cost = Number(unit.openingCost) || 0;
  let units = Number(unit.openingUnits) || 0;
  let divCash = 0, divUnits = 0, divTotal = 0;
  unitLots(unit).forEach(l=>{
    if(uptoISO && l.date > uptoISO) return;
    cost += lotTotal(l);
    units += Number(l.units) || 0;
  });
  unitDivs(unit).forEach(d=>{
    if(uptoISO && d.date > uptoISO) return;
    const amt = Number(d.amount) || 0;
    divTotal += amt;
    // Units from a dividend cost you nothing — they must not raise the basis.
    if(Number(d.units) > 0) units += Number(d.units); else divCash += amt;
    if(Number(d.units) > 0) divUnits += Number(d.units);
  });
  return { cost, units, dividends: divTotal, dividendCash: divCash, dividendUnits: divUnits };
}

/* Wipes the investment record for every holding in a Core or Satellite account so
   it can be re-entered from the broker's confirmations. Deliberately narrow: this
   clears what a holding is WORTH and how it got there, and leaves everything that
   describes what it IS — name, currency, sleeve, target weight, target amount,
   assumed return, ticker. Cash accounts are untouched. */
function resetInvestmentRecords(){
  let holdings = 0, accounts = 0;
  (state.accounts||[]).forEach(a=>{
    if(!accountSleeve(a)) return;
    accounts++;
    const wipe = u=>{
      u.lots = []; u.divs = [];
      delete u.openingCost; delete u.openingUnits;
      delete u.units; delete u.price; delete u.pricedAt;
      u.history = [];
      u.openingBalance = 0;
      u.openingDate = isoDate(TODAY);
      holdings++;
    };
    if(a.subCategories && a.subCategories.length) a.subCategories.forEach(wipe);
    else wipe(a);
  });
  return { holdings, accounts };
}

/* What Net Worth shows for the sleeved accounts, against what the Investments
   table adds up to. They are computed differently — balance history versus units
   times price — so showing both is the only way to know they agree. */
function investmentTieOut(){
  // Net Worth reads the balance history; the holding itself knows its units and
  // price. Comparing the table against the balance would be circular — both come
  // from the same place — so the check is balance history against units x price.
  let balance = 0, marked = 0, unpriced = 0;
  allUnits().forEach(u=>{
    if(!accountSleeve(u.acc)) return;
    balance += toAUD(unitBalanceAsOf(u.unit, isoDate(TODAY)), u.currency);
    if(isPriced(u.unit)) marked += toAUD((Number(u.unit.units)||0) * (Number(u.unit.price)||0), u.currency);
    else unpriced++;
  });
  const diff = balance - marked;
  return { netWorth: balance, table: marked, diff, unpriced,
           matches: unpriced === 0 && Math.abs(diff) < 1 };
}

function hasOrderData(unit){ return unitLots(unit).length > 0 || unitDivs(unit).length > 0; }

function historyTotals(unit, uptoISO){
  let contributed = 0, dividends = 0, revaluation = 0;
  const opening = Number(unit.openingBalance) || 0;
  if(!uptoISO || (unit.openingDate || '0000-00-00') <= uptoISO) contributed += opening;
  (unit.history||[]).forEach(h=>{
    if(uptoISO && h.date > uptoISO) return;
    const d = Number(h.delta) || 0;
    if(h.kind === 'revaluation') revaluation += d;
    else if(h.kind === 'dividend') dividends += (h.amount !== undefined ? Number(h.amount) : d);
    else contributed += d;
  });
  return { contributed, dividends, revaluation };
}

/* One row per holding, all figures in AUD for the caller to convert. */
function investmentRows(){
  const today = isoDate(TODAY);
  const units = investedUnits();
  const rows = units.map((u,i)=>{
    // Recorded orders are exact; the inferred history is the fallback for holdings
    // that pre-date order recording.
    const useLots = hasOrderData(u.unit);
    const cb = costBasisAsOf(u.unit, today);
    const t = historyTotals(u.unit, today);
    const cost = toAUD(useLots ? cb.cost : t.contributed, u.currency);
    const value = u.valueAUD;
    const realised = toAUD(useLots ? cb.dividends : t.dividends, u.currency);
    const unrealised = useLots ? (value - cost) : toAUD(t.revaluation, u.currency);
    return {
      key: u.subId ? `${u.acc.id}|||${u.subId}` : u.acc.id,
      name: u.subId ? u.unit.name : u.acc.name,
      sleeve: u.sleeve, colour: INVEST_COLOURS[i % INVEST_COLOURS.length],
      cost, value, unrealised, realised, useLots,
      totalReturn: unrealised + realised,
      pnlPct: cost > 0 ? (unrealised + realised)/cost*100 : null
    };
  });
  const totalCost = rows.reduce((t,r)=>t+r.cost,0);
  const totalValue = rows.reduce((t,r)=>t+r.value,0);
  rows.forEach(r=>{
    r.allocPct = totalCost > 0 ? r.cost/totalCost*100 : 0;      // by money invested
    r.marketPct = totalValue > 0 ? r.value/totalValue*100 : 0;  // by what it's worth now
  });
  return { rows, totalCost, totalValue,
           totalUnrealised: rows.reduce((t,r)=>t+r.unrealised,0),
           totalRealised: rows.reduce((t,r)=>t+r.realised,0),
           anyLots: rows.some(r=>r.useLots) };
}

/* Month-end buckets from the first recorded history to now. */
function investMonthlySeries(){
  const units = investedUnits();
  if(!units.length) return { months: [], rows: [] };
  let earliest = null;
  units.forEach(u=>{
    const ds = [u.unit.openingDate, ...(u.unit.history||[]).map(h=>h.date)].filter(Boolean);
    ds.forEach(d=>{ if(!earliest || d < earliest) earliest = d; });
  });
  if(!earliest) return { months: [], rows: [] };

  const months = [];
  let y = Number(earliest.slice(0,4)), m = Number(earliest.slice(5,7)) - 1;
  while(y < TODAY.getFullYear() || (y === TODAY.getFullYear() && m <= TODAY.getMonth())){
    const end = new Date(y, m+1, 0);
    months.push({ key: `${y}-${String(m+1).padStart(2,'0')}`, endISO: isoDate(end), y, m });
    m++; if(m > 11){ m = 0; y++; }
    if(months.length > 600) break;
  }

  const rows = units.map((u,i)=>{
    let prev = { contributed:0, dividends:0, revaluation:0 };
    const useLots = hasOrderData(u.unit);
    const series = months.map(mo=>{
      const cum = useLots
        ? (()=>{ const cb = costBasisAsOf(u.unit, mo.endISO);
                 return { contributed: cb.cost, dividends: cb.dividends }; })()
        : historyTotals(u.unit, mo.endISO);
      const point = {
        monthContribution: toAUD(cum.contributed - prev.contributed, u.currency),
        monthDividend:     toAUD(cum.dividends   - prev.dividends,   u.currency),
        cumContribution:   toAUD(cum.contributed, u.currency),
        value:             toAUD(unitBalanceAsOf(u.unit, mo.endISO), u.currency)
      };
      point.unrealised = useLots
        ? point.value - point.cumContribution
        : point.value - point.cumContribution - toAUD(cum.dividends, u.currency);
      prev = cum;
      return point;
    });
    return { name: u.subId ? u.unit.name : u.acc.name,
             colour: INVEST_COLOURS[i % INVEST_COLOURS.length], series };
  });
  return { months, rows };
}

/* ---- Chart helpers ---------------------------------------------------------
   Deliberately plain SVG: no library, no interactivity beyond a title tooltip.
   Both helpers take values already converted to the display currency. */
function investBarChart(items, opts){
  const o = opts || {};
  const W = 700, H = 220, padL = 66, padR = 12, padT = 12, padB = 46;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  if(!items.length) return '<div class="muted" style="font-size:12.5px;">Nothing to show yet.</div>';
  const vals = items.map(i=>i.value);
  if(vals.every(v=> Math.abs(v) < 0.005))
    return '<div class="muted" style="font-size:12.5px; padding:12px 0;">Nothing to plot yet — every figure here is zero. This fills in once prices move or dividends arrive.</div>';
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  const span = (max - min) || 1;
  const Y = v=> padT + plotH - ((v-min)/span)*plotH;
  const zeroY = Y(0);
  const bw = plotW/items.length;
  // Rounding to whole numbers makes a chart of small values render as a stack of
  // identical "0" labels. Pick the precision from the range being drawn.
  const dp = span >= 100 ? 0 : span >= 10 ? 1 : span >= 1 ? 2 : 3;
  const short = v=> Math.abs(v)>=1e6 ? (v/1e6).toFixed(1)+'m'
                  : Math.abs(v)>=1e3 ? Math.round(v/1e3)+'k'
                  : v.toFixed(dp);

  let grid = '';
  for(let i=0;i<=4;i++){
    const v = min + span*i/4, y = Y(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>
      <text x="${padL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-faint)">${short(v)}</text>`;
  }
  const bars = items.map((it,i)=>{
    const x = padL + i*bw + bw*0.18, w = bw*0.64;
    const y = it.value >= 0 ? Y(it.value) : zeroY;
    const h = Math.max(1, Math.abs(Y(it.value) - zeroY));
    const fill = it.colour || (it.value >= 0 ? 'var(--green)' : 'var(--red)');
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" rx="2">
        <title>${it.label}: ${o.fmt ? o.fmt(it.value) : it.value}</title></rect>
      <text x="${(x+w/2).toFixed(1)}" y="${H-26}" text-anchor="middle" font-size="10" fill="var(--text-dim)">${it.label}</text>
      <text x="${(x+w/2).toFixed(1)}" y="${H-13}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${o.fmt ? o.fmt(it.value) : ''}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" role="img" aria-label="${o.aria||''}">
    ${grid}<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--text-faint)" stroke-width="0.8"/>${bars}</svg>`;
}

/* Stacked bars. Pass percent:true to normalise each column to 100%. */
function investStackedChart(labels, series, opts){
  const o = opts || {};
  const W = 700, H = 240, padL = 66, padR = 12, padT = 12, padB = 34;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  if(!labels.length || !series.length) return '<div class="muted" style="font-size:12.5px;">Nothing to show yet.</div>';

  const colTotals = labels.map((_,i)=> series.reduce((t,s)=> t + Math.max(0, s.values[i]||0), 0));
  const max = o.percent ? 100 : Math.max(1, ...colTotals);
  const Y = v=> padT + plotH - (v/max)*plotH;
  const bw = plotW/labels.length;
  const sdp = max >= 100 ? 0 : max >= 10 ? 1 : max >= 1 ? 2 : 3;
  const short = v=> o.percent ? v+'%'
                  : (Math.abs(v)>=1e6 ? (v/1e6).toFixed(1)+'m'
                  : Math.abs(v)>=1e3 ? Math.round(v/1e3)+'k'
                  : v.toFixed(sdp));

  let grid = '';
  for(let i=0;i<=4;i++){
    const v = max*i/4, y = Y(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>
      <text x="${padL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-faint)">${short(v)}</text>`;
  }

  let cols = '';
  labels.forEach((lab,i)=>{
    const total = colTotals[i];
    let acc = 0;
    const x = padL + i*bw + bw*0.15, w = bw*0.7;
    series.forEach(sr=>{
      const raw = Math.max(0, sr.values[i]||0);
      if(raw <= 0) return;
      const v = o.percent ? (total>0 ? raw/total*100 : 0) : raw;
      const y0 = Y(acc+v), y1 = Y(acc);
      acc += v;
      cols += `<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0.5,y1-y0).toFixed(1)}" fill="${sr.colour}">
        <title>${lab} · ${sr.name}: ${o.fmt ? o.fmt(raw) : raw}${o.percent&&total>0?` (${(raw/total*100).toFixed(1)}%)`:''}</title></rect>`;
    });
  });

  // Label every nth column so they stay legible on long histories
  const step = Math.ceil(labels.length/12);
  let xlab = '';
  labels.forEach((lab,i)=>{
    if(i % step !== 0) return;
    xlab += `<text x="${(padL + i*bw + bw/2).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${lab}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" role="img" aria-label="${o.aria||''}">
    ${grid}${cols}${xlab}</svg>`;
}

function investLegend(series){
  return `<div class="chart-key">${series.map(sr=>
    `<span><i style="background:${sr.colour}"></i>${sr.name}</span>`).join('')}</div>`;
}

    ${chart(2,'Monthly contributions','What went in each month, split by holding.',
      investStackedChart(labels, contribSeries, { fmt, aria:'Monthly contributions by holding' }), investLegend(contribSeries))}

    ${chart(4,'Total invested over time','Cumulative money in, split by holding. Dividends are excluded — this is your money only.',

    ${chart(6,'Unrealised profit and loss by month','The standing gap between what the portfolio was worth at each month end and what had been put in by then. Below zero means it was worth less than you had contributed.',
      investBarChart(labels.map((l,i)=>({ label: i % Math.ceil(labels.length/12) === 0 ? l : '', value: monthlyUnrealised[i] })),
        { fmt, aria:'Unrealised profit and loss by month' }))}
